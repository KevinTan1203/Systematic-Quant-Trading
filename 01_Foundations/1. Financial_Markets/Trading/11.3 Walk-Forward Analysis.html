<script>
const entries = [
  {
    era: "Split",
    icon: "✂️",
    title: "In-Sample vs. Out-of-Sample Split",
    desc: "The fundamental partition of data into periods used for model estimation or parameter search versus periods reserved for unbiased evaluation",
    badge: { label: "Foundation", style: "slate" },
    tags: [["IS / OOS","slate"], ["hold-out","teal"], ["data leakage","red"], ["temporal split","amber"]],
    data: [
      { label: "Purpose", value: "Unbiased estimate of future performance", color: "teal" },
      { label: "Risk", value: "Contamination of OOS by IS choices", color: "red" },
      { label: "Minimum", value: "Strict temporal separation", color: "amber" },
    ],
    body: [
      `An in-sample (IS) period is the subset of history used to estimate parameters, select features, tune hyperparameters, or otherwise fit a trading rule. An out-of-sample (OOS) period is data that were never consulted during that fitting process and therefore provide a less biased estimate of how the rule might behave in the future. In financial time series the split must respect temporal order: future information cannot leak into the past.`,
      `A single static split (e.g., train on 2000–2015, test on 2016–2020) is the simplest form of OOS evaluation. It is vulnerable to regime specificity—the chosen test window may be unusually favourable or harsh—and it discards the possibility of updating the model as new data arrive. Nevertheless it remains a necessary first filter: any strategy that fails a clean IS/OOS split is unlikely to survive more rigorous schemes.`,
      `The integrity of the split hinges on process discipline. Feature engineering, universe construction, and even the decision to investigate a particular hypothesis must be frozen before the OOS window is examined. Any iteration that peeks at OOS results and then revisits IS choices converts the OOS into another IS period and reintroduces selection bias.`
    ],
    keyPoint: "The IS/OOS distinction is meaningful only when the OOS data are truly unseen by every stage of model development. Once OOS performance influences design decisions, the label “out-of-sample” becomes ceremonial."
  },
  {
    era: "Process",
    icon: "🔄",
    title: "Walk-Forward Optimization",
    desc: "A sequential scheme that repeatedly optimizes on a trailing window and evaluates on the subsequent unseen period, advancing through time",
    badge: { label: "Core", style: "teal" },
    tags: [["WFO","teal"], ["rolling optimization","amber"], ["parameter stability","slate"], ["equity curve","red"]],
    data: [
      { label: "Cycle", value: "Optimize → trade OOS → roll forward", color: "teal" },
      { label: "Output", value: "Stitched OOS equity curve", color: "" },
      { label: "Advantage", value: "Adapts to changing markets", color: "amber" },
    ],
    body: [
      `Walk-forward optimization (WFO) formalizes the idea that a strategy’s parameters should be allowed to evolve, but only on the basis of information available up to the decision point. At each step a window of recent history is used to select or estimate parameters; those parameters are then held fixed and applied to a subsequent out-of-sample segment; the window advances and the process repeats. The concatenated OOS segments form an equity curve that has never been directly optimized.`,
      `WFO occupies a middle ground between a single static split and fully adaptive online learning. It respects causality, produces a realistic sequence of re-optimizations, and yields a single continuous performance path that can be subjected to the usual battery of risk and significance tests. It also surfaces parameter instability: if optimal parameters jump violently from window to window, the strategy is likely fragile.`,
      `Practical design choices include the length of the optimization window, the length of the OOS step, whether re-optimization occurs on a fixed calendar schedule or is triggered by performance degradation, and whether the objective inside each window is Sharpe, return, drawdown-adjusted return, or a custom utility. Each choice affects both statistical power and the risk of residual overfitting.`
    ],
    keyPoint: "Walk-forward optimization converts a single historical path into a sequence of genuine out-of-sample tests. The resulting equity curve is the closest practical analogue to live trading under periodic recalibration."
  },
  {
    era: "Windows",
    icon: "🪟",
    title: "Anchored vs. Rolling Window WFO",
    desc: "Two alternative schemes for expanding or sliding the in-sample window as the walk-forward process advances through time",
    badge: { label: "Design", style: "amber" },
    tags: [["anchored","amber"], ["rolling","teal"], ["expanding window","slate"], ["sample size",""]],
    data: [
      { label: "Anchored", value: "IS grows; start date fixed", color: "amber" },
      { label: "Rolling", value: "IS length fixed; window slides", color: "teal" },
      { label: "Trade-off", value: "Stability vs. adaptability", color: "slate" },
    ],
    body: [
      `In an <em>anchored</em> (or expanding-window) walk-forward the in-sample period always begins at the same fixed origin and lengthens with each step. Early data remain in the estimation sample indefinitely. This maximizes the number of observations available for parameter estimation and tends to produce more stable parameter paths, at the cost of giving equal weight to regimes that may no longer be relevant.`,
      `In a <em>rolling-window</em> walk-forward both the start and end of the in-sample period advance, so that only the most recent <em>N</em> periods are used for optimization. The scheme discards older data, allowing the model to adapt more rapidly to structural change, but estimation noise increases when <em>N</em> is short and the risk of fitting transient noise rises.`,
      `Hybrid designs exist: a rolling window with a floor on minimum sample size, or an expanding window that down-weights older observations exponentially. The choice should be driven by the expected half-life of the edge being harvested and by the statistical precision required inside each optimization step. Reporting results under both schemes is a useful robustness check.`
    ],
    keyPoint: "Anchored windows favour statistical stability and long-memory relationships; rolling windows favour adaptability to non-stationarity. Neither is universally superior—the appropriate choice is an empirical statement about the strategy’s economic horizon."
  },
  {
    era: "Leakage",
    icon: "🚫",
    title: "Purging and Embargo Techniques",
    desc: "Removal of observations near the train/test boundary that would otherwise allow information to leak across the temporal split through serial dependence or overlapping labels",
    badge: { label: "Critical", style: "red" },
    tags: [["purging","red"], ["embargo","amber"], ["label overlap","teal"], ["serial correlation","slate"]],
    data: [
      { label: "Purge", value: "Drop train observations overlapping test labels", color: "red" },
      { label: "Embargo", value: "Gap after test to block residual leakage", color: "amber" },
      { label: "Why", value: "Financial labels are rarely i.i.d.", color: "teal" },
    ],
    body: [
      `When labels are formed from forward returns (or any quantity that spans a future interval), an observation whose label interval overlaps the test set can leak information even if its feature timestamp lies inside the training window. <em>Purging</em> removes from the training set every observation whose label interval intersects the test period, restoring a clean separation.`,
      `<em>Embargoing</em> inserts an additional temporal buffer after the end of the test set (or between successive folds) during which neither training nor testing occurs. The embargo absorbs residual serial correlation, volatility clustering, and slow information diffusion that pure purging may miss. The required length depends on the horizon of the labels and on the autocorrelation structure of the series.`,
      `Both techniques reduce the effective sample size and therefore the precision of performance estimates. They are nonetheless indispensable: without them, cross-validation and walk-forward results systematically overstate predictive power whenever labels overlap or returns are serially dependent—the normal state of affairs in markets.`
    ],
    keyPoint: "Purging and embargoing are the price of honesty when labels have temporal extent. Omitting them converts an ostensibly causal validation scheme into a subtle form of lookahead."
  },
  {
    era: "Validation",
    icon: "🔀",
    title: "Combinatorial Purged Cross-Validation (CPCV)",
    desc: "A combinatorial extension of purged k-fold CV that generates many distinct train/test partitions while respecting temporal causality and purging requirements",
    badge: { label: "Advanced", style: "slate" },
    tags: [["CPCV","slate"], ["purged CV","teal"], ["combinatorial","amber"], ["Lopez de Prado","red"]],
    data: [
      { label: "Origin", value: "Advances in Financial Machine Learning", color: "slate" },
      { label: "Output", value: "Distribution of OOS performance", color: "teal" },
      { label: "Advantage", value: "More paths than classic WFO", color: "amber" },
    ],
    body: [
      `Combinatorial purged cross-validation (CPCV) addresses two limitations of ordinary walk-forward and of standard k-fold CV. First, it systematically enumerates (or samples) many different ways of assigning temporal blocks to training and test sets, subject to the constraint that test blocks are never used for training and that purging/embargo rules are obeyed. Second, it therefore produces a whole distribution of out-of-sample performance statistics rather than a single stitched equity curve.`,
      `The method yields a more complete picture of strategy fragility: one can observe not only the average OOS Sharpe but also its dispersion across alternative historical partitions. Strategies that perform well only on a narrow subset of partitions are revealed as brittle. CPCV also supplies a natural framework for assessing the probability that a given back-test result could have arisen by chance under multiple testing.`,
      `Computational cost scales with the number of combinations examined, and careful blocking is required to keep the scheme causal. When implemented correctly, CPCV is among the most rigorous validation protocols available for financial machine-learning and systematic strategies.`
    ],
    keyPoint: "CPCV replaces a single walk-forward path with an ensemble of purged, temporally valid partitions. The resulting distribution of outcomes is a far stricter test of robustness than any one equity curve."
  },
  {
    era: "Inference",
    icon: "📉",
    title: "Multiple Testing Correction in WFO",
    desc: "Adjusting significance claims for the fact that many parameter sets, features, or strategy variants were examined before the final walk-forward results were reported",
    badge: { label: "Statistical", style: "amber" },
    tags: [["multiple testing","amber"], ["Bailey & Lopez de Prado","teal"], ["deflated Sharpe","red"], ["family-wise error","slate"]],
    data: [
      { label: "Problem", value: "Selection inflates apparent significance", color: "red" },
      { label: "Tools", value: "DSR, PBO, White’s reality check", color: "teal" },
      { label: "Practice", value: "Count all trials, not only survivors", color: "amber" },
    ],
    body: [
      `Every walk-forward exercise is the end product of a larger search: many indicator configurations, hyper-parameter grids, feature subsets, and even alternative strategy families are typically explored before a “final” specification is chosen. The OOS performance of the winner is therefore a selected extreme, not a random draw, and conventional t-statistics or Sharpe ratios overstate its true significance.`,
      `Correction methods range from simple Bonferroni-style adjustments (often too conservative) to more powerful approaches tailored to finance: the deflated Sharpe ratio (DSR), the probability of back-test overfitting (PBO), White’s reality check, and Hansen’s superior predictive ability test. All require an estimate—or at least a credible upper bound—of the number of independent trials conducted during the research process.`,
      `In a walk-forward context the multiplicity problem appears twice: once inside each optimization window (many parameter combinations) and once across the meta-level of strategy design. Transparent research logs that record every trial are the only reliable foundation for honest multiple-testing adjustments.`
    ],
    keyPoint: "A walk-forward Sharpe is not a test statistic until it has been adjusted for the search that produced it. Without multiplicity correction, even carefully purged WFO results remain vulnerable to false discovery."

      `Quantitative diagnostics include the probability of back-test overfitting (PBO) derived from combinatorial symmetric cross-validation, the degree of performance degradation from IS to OOS, and the stability of the selected parameter vector across adjacent windows. Visual inspection of the distribution of OOS returns under CPCV often makes fragility obvious even before formal statistics are computed.`,
      `The most reliable protection remains economic discipline: prefer specifications that are simple, that rest on a coherent prior, and that survive under multiple reasonable validation schemes. When a strategy only “works” inside a narrowly optimized walk-forward and collapses under modest perturbations, the market is telling you the edge was never there.`

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
