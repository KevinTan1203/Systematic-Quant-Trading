  .data-strip {
    margin-top: 16px;

    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);

  .data-cell {
    padding: 9px 14px;

  .data-cell:last-child { border-right: none; }

  .data-cell-label {

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }

  .controls {

  .footer-note {

  @media (max-width: 640px) {

    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }

<script>
const entries = [
  {
    era: "Cash Flow",
    icon: "🏢",
    title: "Free Cash Flow to Firm (FCFF)",
    desc: "Unlevered free cash flow — the cash generated by operations available to all capital providers",
    badge: { label: "Core Concept", style: "teal" },
    tags: [["FCFF","teal"], ["unlevered",""], ["enterprise DCF","amber"], ["NOPAT",""]],
    data: [
      { label: "Starting point", value: "EBIT(1–t) or NOPAT", color: "teal" },
      { label: "Add back", value: "D&A", color: "" },
      { label: "Subtract", value: "Capex + ΔNWC", color: "amber" },
    ],
    body: [
      `Free Cash Flow to the Firm (FCFF) is the cash flow generated by the company’s operations after taxes and reinvestment needs, but before any payments to debt or equity holders. It is the central input in an enterprise (unlevered) DCF. Because it is independent of capital structure, it can be discounted at the weighted average cost of capital (WACC) to arrive directly at enterprise value.`,
      `The standard calculation begins with NOPAT (Net Operating Profit After Tax = EBIT × (1 – tax rate)), adds back non-cash charges (primarily depreciation & amortisation), subtracts capital expenditures, and subtracts the increase in non-cash working capital. An equivalent formulation starts from cash flow from operations and adjusts for after-tax interest and capital expenditures.`,
      `FCFF answers the question: how much cash could the business distribute to all its capital providers (debt + equity) while still maintaining its productive capacity? It is the cleanest measure of operating cash generation for valuation purposes when the capital structure is expected to change or when comparing firms with different leverage.`
    ],
    keyPoint: "FCFF is capital-structure neutral. It measures the cash-generating power of the assets themselves, which is why it is the foundation of enterprise DCF models."
  },
  {
    era: "Cash Flow",
    icon: "👤",
    title: "Free Cash Flow to Equity (FCFE)",
    desc: "Levered free cash flow — the cash available to equity holders after debt service",
    badge: { label: "Core Concept", style: "teal" },
    tags: [["FCFE","teal"], ["levered",""], ["equity DCF","amber"], ["net borrowing",""]],
    data: [
      { label: "Starting point", value: "Net Income or FCFF", color: "teal" },
      { label: "Adjust for", value: "Net borrowing – Debt repayments", color: "" },
      { label: "Discount rate", value: "Cost of Equity", color: "amber" },
    ],
    body: [
      `Free Cash Flow to Equity (FCFE) is the cash flow remaining after the firm has met its reinvestment needs and its obligations to debt holders. It represents the cash that could be paid out to equity investors without impairing the firm’s operations or capital structure trajectory. FCFE is discounted at the cost of equity to arrive directly at equity value.`,
      `One common calculation is: FCFE = FCFF – Interest Expense × (1 – t) + Net Borrowing. Alternatively it can be derived from net income by adding back non-cash charges, subtracting reinvestment (capex – depreciation + ΔNWC), and adding net debt issuance. The key difference from FCFF is the explicit inclusion of after-tax interest and changes in net debt.`,
      `FCFE is particularly useful when the capital structure is stable and when the analyst wants to focus on the residual cash available to shareholders. It is also the natural cash-flow concept for banks and financial institutions, where debt is more akin to raw material than to financing.`
    ],
    compare: {
      left: { label: "FCFF (Unlevered)", text: "Cash to all capital providers. Discounted at WACC. Produces Enterprise Value. Preferred when leverage is changing or for cross-firm comparison." },
      right: { label: "FCFE (Levered)", text: "Cash to equity holders only. Discounted at Cost of Equity. Produces Equity Value directly. Preferred when capital structure is stable." }
    },
    keyPoint: "FCFF and FCFE are two sides of the same economic reality. The choice between them is mainly about convenience and the stability of the capital structure, not about which is “more correct.”"
  },
  {
    era: "Discount Rate",
    icon: "⚖️",
    title: "WACC Calculation",
    desc: "The blended required return of all capital providers — the discount rate for FCFF",
    badge: { label: "Critical Input", style: "amber" },
    tags: [["WACC","amber"], ["cost of equity",""], ["cost of debt","teal"], ["target weights",""]],
    data: [
      { label: "Formula", value: "E/V × Re + D/V × Rd × (1–t)", color: "teal" },
      { label: "Re usually from", value: "CAPM", color: "" },
      { label: "Weights should be", value: "Target / Market", color: "amber" },
    ],
    body: [
      `The Weighted Average Cost of Capital (WACC) is the average rate of return required by all of the firm’s capital providers, weighted by their proportions in the target capital structure. It is the appropriate discount rate for FCFF because FCFF is the cash flow available to both debt and equity holders.`,
      `Cost of equity is typically estimated via the Capital Asset Pricing Model: Re = Rf + β × Equity Risk Premium. Cost of debt is the current yield the firm would pay on new borrowing, adjusted for the tax deductibility of interest (Rd × (1 – t)). Preferred stock, if material, is included with its own cost and weight. The weights should reflect the firm’s target capital structure on a market-value basis, not the current book-value weights.`,
      `Common practical issues include: choosing the right risk-free rate and equity risk premium, unlevering and relevering betas to the target capital structure, deciding whether to use a country risk premium, and ensuring consistency between the WACC and the currency and inflation assumptions in the cash-flow forecast.`
    ],
    keyPoint: "WACC is not a precise constant — it is an estimate that embeds assumptions about risk, capital structure and tax. Small changes in WACC have large effects on value, which is why sensitivity analysis around it is essential."
  },
  {
    era: "Terminal Value",
    icon: "♾️",
    title: "Terminal Value — Perpetuity Growth & Exit Multiple",
    desc: "The value of all cash flows beyond the explicit forecast horizon",
    badge: { label: "Largest Piece", style: "red" },
    tags: [["terminal value","red"], ["Gordon Growth",""], ["exit multiple","amber"], ["fade",""]],
    data: [
      { label: "Typical share of EV", value: "60–80%+", color: "red" },
      { label: "Perpetuity method", value: "FCFFₙ × (1+g) / (WACC–g)", color: "teal" },
      { label: "Exit multiple method", value: "EBITDAₙ × Exit Multiple", color: "amber" },
    ],
    body: [
      `In a typical DCF the explicit forecast covers only 5–10 years. Everything thereafter is captured in the terminal value. Because this residual often constitutes the majority of total enterprise value, the assumptions that drive it are among the most consequential in the entire model.`,
      `The two standard approaches are the perpetuity-growth (Gordon Growth) method and the exit-multiple method. In the perpetuity-growth approach, terminal value = FCFFₙ₊₁ / (WACC – g), where g is a long-term growth rate that should not exceed the long-run nominal growth rate of the economy. In the exit-multiple approach, a normalised terminal-year metric (usually EBITDA) is multiplied by a carefully chosen exit multiple that reflects expected mature-company valuations.`,
      `Best practice is to cross-check both methods. An implied exit multiple can be reverse-engineered from the perpetuity-growth terminal value (and vice versa) to test whether the assumptions are mutually consistent. Long-term growth, margins and reinvestment rates must also be internally coherent: high growth requires sufficient reinvestment, and returns on new capital should fade toward the cost of capital over time.`
    ],
    keyPoint: "Terminal value is not a residual afterthought — it is usually the dominant driver of DCF output. Treating it with the same rigour as the explicit forecast is non-negotiable."
  },
  {
    era: "Robustness",
    icon: "📉",
    title: "DCF Sensitivity Analysis",
    desc: "Mapping how value changes when key assumptions move",
    badge: { label: "Essential Practice", style: "amber" },
    tags: [["sensitivity","amber"], ["data tables",""], ["tornado","slate"], ["scenarios",""]],
    data: [
      { label: "Most sensitive variables", value: "WACC & Terminal Growth", color: "red" },
      { label: "Common tools", value: "2-way tables, Tornado charts", color: "" },
      { label: "Purpose", value: "Range, not point estimate", color: "teal" },
    ],
    body: [
      `A single-point DCF value creates a false sense of precision. Sensitivity analysis systematically varies the most important assumptions — typically WACC, terminal growth rate, long-term operating margin, and revenue growth — and shows the resulting range of values. Two-way data tables (WACC vs. terminal growth is the classic) and tornado charts are the most common tools.`,
      `The exercise reveals which assumptions dominate the valuation and how wide the plausible value range actually is. It also forces the analyst to confront the economic reasonableness of combinations of assumptions: a very low WACC paired with high terminal growth may produce an attractive value but be internally inconsistent or unrealistic.`,
      `Scenario analysis complements sensitivity analysis by defining coherent sets of assumptions (base, upside, downside) rather than varying one variable at a time. Together they transform the DCF from a single number into a structured view of value under different states of the world.`
    ],
    keyPoint: "The output of a good DCF is not a price target — it is a map of how value depends on the key drivers. Sensitivity analysis is how that map is drawn."
  },
  {
    era: "Implied",
    icon: "🔄",
    title: "Reverse DCF (Implied Growth Rates)",
    desc: "Working backwards from market price to the expectations embedded in it",
    badge: { label: "Market Lens", style: "slate" },
    tags: [["reverse DCF","slate"], ["implied growth",""], ["market expectations","amber"], ["debate",""]],
    data: [
      { label: "Starting point", value: "Current Enterprise Value", color: "teal" },
      { label: "Solved for", value: "Growth / Margins / WACC", color: "" },
      { label: "Key question", value: "Are implied assumptions reasonable?", color: "amber" },
    ],
    body: [
      `A conventional DCF starts with assumptions and produces a value. A reverse DCF starts with the current market price (or enterprise value) and solves for the assumptions that justify that price. Most commonly it solves for the implied long-term growth rate or the implied operating margin trajectory that makes the present value of cash flows equal the observed market value.`,
      `This approach is powerful because it shifts the debate from “what is my value?” to “what does the market already believe?” If the reverse DCF implies perpetual growth well above GDP growth, or margins that have never been achieved by any peer, the current price may embed aggressive expectations. Conversely, if the implied assumptions look conservative relative to history and industry dynamics, the stock may be undervalued.`,
      `Reverse DCF is especially useful in heated markets or for high-growth companies where traditional forward DCFs can feel arbitrary. It does not replace fundamental forecasting; it disciplines it by revealing the market’s embedded narrative.`
    ],
    keyPoint: "Reverse DCF turns valuation into a test of expectations rather than a hunt for a single “correct” price. The most useful question is often not “what is it worth?” but “what is the market already pricing in?”"

    data: [
      { label: "Core idea", value: "Sample input distributions", color: "teal" },
      { label: "Output", value: "Distribution of values", color: "" },
      { label: "Key benefit", value: "Full risk picture", color: "amber" },

      `Traditional sensitivity analysis varies one or two inputs at a time. Monte Carlo simulation goes further by assigning probability distributions to many uncertain inputs simultaneously (revenue growth, margins, WACC, terminal growth, etc.) and then running thousands of iterations. Each iteration draws a random set of inputs from the defined distributions and calculates a DCF value. The result is a full probability distribution of possible enterprise or equity values.`,
      `This approach surfaces the range and shape of outcomes — including the probability of severe downside or extreme upside — rather than a handful of discrete scenarios. It also naturally incorporates correlations between variables when they are specified. The method is particularly valuable for projects or companies with high uncertainty and for risk-management contexts where the left tail matters.`,
      `The quality of a Monte Carlo DCF depends entirely on the realism of the input distributions and the correlations among them. Garbage-in, garbage-out remains the governing principle; the simulation only organises uncertainty that the analyst has already quantified.`

      `WACC is sensitive to beta, the equity risk premium, the risk-free rate, and the target capital structure — all of which are estimates. Terminal growth is constrained by economics (it cannot forever exceed economy-wide growth) yet still requires a judgement that feels arbitrary. The combination means that two thoughtful analysts can produce very different values from the same set of cash-flow projections simply by making slightly different choices on these two parameters.`,

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
