    <style>

        width: 2px;

          var(--border2) 0 6px,
          transparent 6px 12px

        content: "";
        position: absolute;
        left: -29px;
        top: 20px;
        width: 10px;
        height: 10px;
        border-radius: 50%;

        border: 2px solid var(--border2);

      .badge-red {

      .badge-teal {

      .entry-toggle {
        font:
          13px "Space Mono",
          monospace;
        color: var(--faint);

          color 0.15s;
        padding: 0 14px;
        align-self: stretch;
        display: flex;

        display: block;
        animation: bodyIn 0.2s ease;
      }

          transform: translateY(0);

      .data-strip {

        flex-wrap: wrap;

      .data-cell-value {

        color: var(--red);
      }
      .data-cell-value.teal {

      }

      }

      .tag {

          9px "Space Mono",

        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 3px 8px;
        background: var(--bg2);
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .tag.red {
        background: var(--red-bg);
        border-color: var(--red-border);
        color: var(--red);
      }
      .tag.teal {
        background: var(--teal-bg);
        border-color: var(--teal-border);
        color: var(--teal);
      }
      .tag.amber {
        background: var(--amber-bg);
        border-color: var(--amber-border);
        color: var(--amber);
      }

        border-color: var(--slate-border);
        color: var(--slate);

      .foot-rule {

      }
      .footer-note {

          10px "Space Mono",

        .entry-badge {

        .entry-era {

    <script>
      const entries = [
        {
          era: "Voting",
          icon: "🗳️",
          title: "Token-Based Voting",
          desc: "A governance model where voting power is assigned to tokens, usually in proportion to holdings or delegated voting weight",
          badge: { label: "Foundation", style: "slate" },
          tags: [
            ["voting power", "slate"],
            ["token holders", "teal"],
            ["quorum", "amber"],
            ["governance", "teal"],
          ],
          data: [
            {
              label: "Weight",
              value: "Tokens, delegation, or reputation",
              color: "slate",
            },
            {
              label: "Requirement",
              value: "Quorum plus approval threshold",
              color: "amber",
            },
            {
              label: "Risk",
              value: "Concentration and passive holders",
              color: "red",
            },
          ],
          body: [
            "Token-based voting makes protocol parameters, upgrades, and treasury spending subject to an explicit decision process. The simplest design assigns one vote per token, while more nuanced systems use delegated votes, time-weighting, or separate voting and economic rights.",
            "Quorum prevents a tiny active minority from deciding for an absent community. Approval thresholds and voting periods matter just as much: a low threshold is responsive but easier to capture, while a high threshold is robust but can make a system unable to act.",
            "A token vote is a coordination mechanism, not automatically a representation of users. Large holders, exchanges, foundations, and inactive wallets can dominate the result.",
          ],
          keyPoint:
            "Token voting converts ownership into political power. Its security depends less on the ballot interface than on who can accumulate, delegate, and exercise that power.",
        },
        {
          era: "Delegation",
          icon: "🤝",
          title: "Delegated Governance",
          desc: "A liquid-democracy pattern where token holders assign voting authority to representatives without transferring economic ownership",
          badge: { label: "Participation", style: "teal" },
          tags: [
            ["delegation", "teal"],
            ["representatives", "slate"],
            ["liquid democracy", "amber"],
            ["accountability", "teal"],
          ],
          data: [
            {
              label: "Benefit",
              value: "Expertise without every holder voting",
              color: "teal",
            },
            {
              label: "Trade-off",
              value: "Delegates become power centres",
              color: "amber",
            },
            {
              label: "Control",
              value: "Re-delegation and transparent history",
              color: "slate",
            },
          ],
          body: [
            "Delegation addresses the participation problem: most token holders do not have the time or context to evaluate every parameter change. A holder can delegate voting power to a specialist, delegate, or aligned organisation while keeping the underlying tokens.",
            "Healthy systems make delegate positions visible, preserve the ability to re-delegate quickly, and expose conflicts of interest. Delegates can improve technical quality, but they also create durable political blocs that may become harder to challenge than dispersed holders.",
            "Delegation works best when representatives publish reasoning, vote consistently with a stated mandate, and face a credible exit option from the people who gave them power.",
          ],
          keyPoint:
            "Delegation increases governance competence, but it also concentrates agenda-setting power. The ability to withdraw delegated authority is the system’s practical accountability mechanism.",
        },
        {
          era: "Process",
          icon: "📜",
          title: "Proposal Lifecycle",
          desc: "The staged path from an idea to a binding protocol decision: discussion, drafting, voting, timelock, and execution",
          badge: { label: "Process", style: "amber" },
          tags: [
            ["proposal", "amber"],
            ["temperature check", "slate"],
            ["vote window", "teal"],
            ["timelock", "teal"],
          ],
          data: [
            {
              label: "Stages",
              value: "Forum → draft → vote → queue → execute",
              color: "amber",
            },
            {
              label: "Safety",
              value: "Notice period before irreversible action",
              color: "teal",
            },
            {
              label: "Failure",
              value: "Ambiguous scope or rushed voting",
              color: "red",
            },
          ],
          body: [
            "A robust proposal lifecycle separates social consensus from on-chain authorisation. Informal discussion and a temperature check surface objections; a formal proposal then specifies exact calldata, affected contracts, execution conditions, and the rationale for the change.",
            "Voting windows, quorum rules, and a timelock give participants time to inspect the decision and exit or respond. The timelock is especially important for upgrades and treasury transfers because it turns a successful vote into observable intent before it becomes state.",
            "Good process is precise enough to simulate before execution. “Approve the upgrade” is weaker than a proposal that identifies the implementation, parameters, recipient, and post-execution checks.",
          ],
          keyPoint:
            "Governance is a pipeline, not a button. Each stage should reduce ambiguity and give affected participants a meaningful chance to detect or resist a bad decision.",
        },
        {
          era: "Timelock",
          icon: "⏳",
          title: "Timelocks and Emergency Controls",
          desc: "Delayed execution and narrowly scoped pause powers that balance governance legitimacy against the need to respond to active threats",
          badge: { label: "Safety", style: "teal" },
          tags: [
            ["timelock", "teal"],
            ["guardian", "red"],
            ["pause", "amber"],
            ["liveness", "slate"],
          ],
          data: [
            {
              label: "Delay",
              value: "Time to review and coordinate response",
              color: "teal",
            },
            {
              label: "Guardian",
              value: "Fast, limited, and observable intervention",
              color: "red",
            },
            {
              label: "Trade-off",
              value: "Safety versus reaction speed",
              color: "amber",
            },
          ],
          body: [
            "A timelock prevents a passed proposal from changing the protocol immediately. Users can inspect queued actions, move funds, or coordinate a veto before execution. Delays should be long enough for the system’s risk and exit assumptions, not chosen only for convenience.",
            "Emergency guardians can pause a vulnerable module faster than ordinary governance, but this creates a powerful centralised key. Scope, expiry, multisignature control, and public monitoring keep the guardian from becoming an undocumented administrator.",
            "Emergency powers should reduce harm without silently changing economic rules. A pause that cannot be explained, audited, or eventually reviewed is a second governance system hiding inside the first.",
          ],
          keyPoint:
            "Timelocks create reaction time; guardians create reaction speed. A credible design constrains both powers and makes their use visible.",
        },
        {
          era: "Attack",
          icon: "🎯",
          title: "Governance Capture Attacks",
          desc: "Attempts to acquire or borrow enough voting power to pass a malicious proposal, seize a treasury, or alter protocol control",
          badge: { label: "Critical", style: "red" },
          tags: [
            ["capture", "red"],
            ["flash loan", "red"],
            ["quorum", "amber"],
            ["vote buying", "slate"],
          ],
          data: [
            {
              label: "Target",
              value: "Voting power or proposal threshold",
              color: "red",
            },
            {
              label: "Vector",
              value: "Borrowing, accumulation, bribery, apathy",
              color: "amber",
            },
            {
              label: "Defence",
              value: "Snapshot, delay, delegation, quorum",
              color: "teal",
            },
          ],
          body: [
            "Governance capture is an economic attack on the decision layer. An attacker may buy tokens, borrow them around a snapshot, bribe voters, exploit low turnout, or compromise a delegate. If the proposal can transfer the treasury or upgrade contracts, the payoff can exceed the cost of control.",
            "Snapshot-based voting limits some last-minute borrowing, but it moves the security question to the snapshot block and the liquidity of voting power before it. Vote-locking and conviction mechanisms increase the cost of temporary control at the expense of speed and flexibility.",
            "Defences include meaningful quorum, proposal deposits, timelocks, veto or exit paths, independent monitoring, and restricting what a single proposal can execute.",
          ],
          keyPoint:
            "Governance capture is a market for control. Security requires making temporary voting power expensive and making the consequences of a suspicious vote reversible.",
        },
        {
          era: "Sybil",
          icon: "🧩",
          title: "Sybil Resistance and Identity",
          desc: "Methods for preventing one actor from simulating many independent participants or disguising concentrated influence",
          badge: { label: "Coordination", style: "slate" },
          tags: [
            ["sybil", "red"],
            ["identity", "slate"],
            ["reputation", "teal"],
            ["plurality", "amber"],
          ],
          data: [
            {
              label: "On-chain",
              value: "Capital-weighted identity",
              color: "slate",
            },
            {
              label: "Off-chain",
              value: "Credentials or attestations",
              color: "teal",
            },
            {
              label: "Tension",
              value: "Open access versus representation",
              color: "amber",
            },
          ],
          body: [
            "A wallet is not necessarily a person, organisation, or independent opinion. Token voting resists simple wallet splitting because weight follows capital, but it does not distinguish one wealthy actor from a broad user base. Quadratic voting changes the cost curve but is only Sybil-resistant when identity assumptions hold.",
            "Reputation, attestations, proof of personhood, and delegated councils can represent users more directly. Each introduces privacy, onboarding, and capture questions of its own. Governance systems should state which identity assumption they rely on rather than treating addresses as neutral citizens.",
            "A practical design often combines open token signalling with a smaller, accountable body for high-impact execution. The split should be explicit and auditable.",
          ],
          keyPoint:
            "Sybil resistance is a choice about what counts as an independent voice. Capital, identity, and reputation each solve a different problem and introduce a different failure mode.",
        },
        {
          era: "Treasury",
          icon: "🏛️",
          title: "Treasury Governance",
          desc: "Rules for allocating protocol-owned assets across grants, liquidity, operations, incentives, and long-term reserves",
          badge: { label: "Capital", style: "amber" },
          tags: [
            ["treasury", "amber"],
            ["budget", "teal"],
            ["grants", "slate"],
            ["runway", "teal"],
          ],
          data: [
            {
              label: "Assets",
              value: "Tokens, stablecoins, LP positions",
              color: "amber",
            },
            {
              label: "Decision",
              value: "Mandate, budget, recipient, milestones",
              color: "teal",
            },
            {
              label: "Risk",
              value: "Idle capital and discretionary spend",
              color: "red",
            },
          ],
          body: [
            "A treasury is a balance sheet with governance attached. Proposals should specify the purpose, amount, asset, recipient, duration, and success measure for each allocation. Separating operating budgets from strategic reserves makes spending easier to monitor and reduces the temptation to treat every asset as immediately available.",
            "Diversification can reduce concentration risk, but treasury management also creates market, custody, and execution risk. A large token position may look valuable until the protocol attempts to sell it into its own thin market.",
            "Milestone-based grants, reporting requirements, and renewal decisions turn one-time votes into an accountable capital-allocation process.",
          ],
          keyPoint:
            "Treasury governance is portfolio management under political constraints. The important question is not only who may spend, but what evidence is required before spending continues.",
        },
        {
          era: "Upgrade",
          icon: "🔧",
          title: "Protocol Upgrades and Admin Keys",
          desc: "The control architecture for changing contracts, parameters, and permissions after deployment",
          badge: { label: "Architecture", style: "red" },
          tags: [
            ["upgradeability", "red"],
            ["multisig", "teal"],
            ["admin key", "amber"],
            ["immutability", "slate"],
          ],
          data: [
            {
              label: "Control",
              value: "DAO, multisig, guardian, or immutable code",
              color: "slate",
            },
            {
              label: "Risk",
              value: "Malicious or defective implementation",
              color: "red",
            },
            {
              label: "Practice",
              value: "Audit, simulation, timelock, rollback plan",
              color: "teal",
            },
          ],
          body: [
            "Upgradeability preserves the ability to fix bugs and adapt parameters, but it means deployed code is not the complete system. Proxy administrators, upgrade executors, and implementation contracts form a chain of authority that must be included in the threat model.",
            "Multisignatures reduce single-key compromise but do not remove collusion or social-engineering risk. Governance-controlled upgrades provide broader legitimacy, while immutable contracts trade adaptability for stronger assurances about what the system will do.",
            "Every upgrade proposal should be simulated against current state, reviewed for storage and permission changes, and queued through a visible delay. A rollback plan is part of the design, not an admission of failure.",
          ],
          keyPoint:
            "The real governance surface is the set of accounts and contracts that can change behaviour. Naming every administrator is more valuable than calling a system decentralised.",
        },
        {
          era: "Liveness",
          icon: "⚖️",
          title: "Governance Liveness and Participation",
          desc: "The ability of a governance system to make timely, informed decisions without becoming either inert or dangerously impulsive",
          badge: { label: "System Health", style: "teal" },
          tags: [
            ["liveness", "teal"],
            ["participation", "amber"],
            ["apathy", "red"],
            ["legitimacy", "slate"],
          ],
          data: [
            {
              label: "Healthy",
              value: "Informed participation with time to react",
              color: "teal",
            },
            {
              label: "Failure",
              value: "Apathy, deadlock, or rushed majorities",
              color: "red",
            },
            {
              label: "Measure",
              value: "Turnout, delegation, execution rate",
              color: "amber",
            },
          ],
          body: [
            "Governance liveness is the ability to decide when decisions are needed. Excessive quorum, fragmented delegation, or unclear proposal standards can leave a protocol unable to respond. Low participation can make a technically valid vote politically weak even when it passes the formal threshold.",
            "Participation metrics need context. A high turnout driven by one temporary incentive is not the same as durable engagement, and a large number of votes does not prove that voters understood the proposal. Delegation, clear summaries, and predictable calendars improve the quality of attention.",
            "The strongest systems match decision speed to consequence: routine parameters can use narrow mandates, while upgrades and treasury transfers deserve longer review, stronger thresholds, and more visible dissent channels.",
          ],
          keyPoint:
            "A governance system must be both hard to capture and capable of acting. Liveness is not maximum speed; it is reliable decision-making at the pace the risk allows.",
        },
      ];
      let counter = 0;
      function renderAll() {
        const root = document.getElementById("entries-root");
        entries.forEach((e, i) => {
          const idx = counter++;
          const tags = e.tags
            .map(
              ([label, style]) => `<span class="tag ${style}">${label}</span>`,
            )
            .join("");
          const data = e.data
            .map(
              (item) =>
                `<div class="data-cell"><div class="data-cell-label">${item.label}</div><div class="data-cell-value ${item.color}">${item.value}</div></div>`,
            )
            .join("");
          const body = e.body
            .map((paragraph) => `<p>${paragraph}</p>`)
            .join("");
          const div = document.createElement("div");
          div.className = "entry";
          div.id = `e-${idx}`;
          div.innerHTML = `<div class="entry-card"><div class="entry-header" onclick="toggle(${idx})"><div class="entry-era">${e.era}</div><div class="entry-icon">${e.icon}</div><div class="entry-title-block"><div class="entry-title">${e.title}</div><div class="entry-desc">${e.desc}</div></div><span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span><span class="entry-toggle">▶</span></div><div class="entry-body">${body}<div class="data-strip">${data}</div><div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div><div class="tags">${tags}</div></div></div>`;
          root.appendChild(div);
        });
      }
      function toggle(index) {
        document.getElementById(`e-${index}`).classList.toggle("open");
      }
      function toggleAll(open) {
        for (let index = 0; index < counter; index++) {
          const element = document.getElementById(`e-${index}`);
          if (element) element.classList.toggle("open", open);
        }
      }
      renderAll();
    </script>
  </body>
</html>
