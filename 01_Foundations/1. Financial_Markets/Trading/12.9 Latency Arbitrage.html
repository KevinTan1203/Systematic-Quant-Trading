<script>
const entries = [
  {
    era: "Core",
    icon: "⚡",
    title: "Speed Advantage Exploitation",
    desc: "The systematic use of a lower-latency information or order path to trade against slower participants before they can update quotes or cancel resting orders",
    badge: { label: "Foundation", style: "red" },
    tags: [["latency arb","red"], ["speed advantage","amber"], ["HFT","teal"], ["information race",""]],
    data: [
      { label: "Mechanism", value: "Act on news/price before others react", color: "red" },
      { label: "Edge source", value: "Faster data, faster path, faster code", color: "amber" },
      { label: "Victim", value: "Stale quotes & delayed cancels", color: "teal" },
    ],
    body: [
      `Latency arbitrage is the capture of economic value that exists only because some market participants learn of a price-relevant event or of a price change on another venue a few microseconds or milliseconds earlier than others. The faster agent can lift offers or hit bids that have not yet been revised, or can cancel its own quotes before they are picked off.`,
      `The advantage is purely temporal: once all participants have the same information and the same ability to act, the opportunity disappears. Consequently the activity is concentrated in the technological race for co-location, microwave and shortwave links, FPGA feed handlers, and deterministic software stacks.`,
      `From the perspective of slower liquidity providers the same activity appears as adverse selection; from the perspective of the fast trader it is the equilibrium return on an investment in speed. The social-welfare evaluation of that equilibrium remains contested.`
    ],
    keyPoint: "Latency arbitrage is the monetisation of a pure speed differential. It is not a view on value; it is a race to be the first to act on a fact that is already public to someone."
  },
  {
    era: "Tactic",
    icon: "🕰️",
    title: "Stale Quote Arbitrage",
    desc: "Trading against resting limit orders whose prices have become outdated relative to a newly observed reference price on a faster or primary venue",
    badge: { label: "Classic", style: "amber" },
    tags: [["stale quotes","amber"], ["pick-off","red"], ["cross-venue","teal"], ["quote fading",""]],
    data: [
      { label: "Trigger", value: "Reference price moves; quote lags", color: "amber" },
      { label: "Action", value: "Hit/lift the lagging quote", color: "red" },
      { label: "Defence", value: "Faster cancel, wider quotes, speed bump", color: "teal" },
    ],
    body: [
      `When a security trades on multiple venues, or when a correlated instrument (future, ETF, FX pair) moves first, the quotes on a slower venue can briefly become mis-priced. A latency-sensitive trader who observes the new reference price before the slower market maker has cancelled or revised can execute against the stale quote and, in expectation, profit when the quote is later updated.`,
      `The strategy requires (1) a reliable lead-lag or cross-venue signal, (2) the ability to reach the stale venue before the quote disappears, and (3) sufficient size at the stale price. It is one of the cleanest empirical manifestations of latency arbitrage and a primary reason market makers invest in co-location and in predictive cancel logic.`,
      `Stale-quote risk is a direct component of adverse selection. Liquidity providers who cannot keep their quotes fresh either widen spreads, reduce size, or withdraw—outcomes that raise the cost of trading for everyone else.`
    ],
    keyPoint: "Stale-quote arbitrage is the purest form of latency extraction: the slower quote is simply wrong for a few hundred microseconds, and the faster agent collects the difference."
  },
  {
    era: "FX",
    icon: "👁️",
    title: "Last Look in FX",
    desc: "The practice whereby an FX liquidity provider receives a trade request and is granted a short window to accept or reject it after observing intervening price moves — a latency-sensitive privilege unique to much of the FX market",
    badge: { label: "FX Practice", style: "slate" },
    tags: [["last look","slate"], ["FX","teal"], ["reject option","amber"], ["asymmetric latency",""]],
    data: [
      { label: "Window", value: "Typically a few to tens of milliseconds", color: "slate" },
      { label: "Right", value: "LP may accept or reject after the request", color: "amber" },
      { label: "Controversy", value: "Asymmetric information vs. risk control", color: "red" },
    ],
    body: [
      `In many FX electronic market-making systems the liquidity provider (LP) does not hard-commit to a quoted price. When a taker sends a trade request, the LP is shown the request and may, within a “last-look” window, either fill at the requested price or reject. During that window the LP can observe intervening market moves and reject trades that have become toxic.`,
      `Supporters argue that last look is a necessary risk-management tool in a market without a central limit order book and with continuous, high-frequency information flow; without it, LPs would widen spreads or withdraw. Critics argue that it creates a one-sided latency option: the LP can systematically avoid adverse selection while the taker cannot symmetrically cancel.`,
      `Regulatory and buy-side pressure has led to greater disclosure of last-look practices, shorter windows, and in some cases the elimination of last look on certain platforms. The debate remains a central fault line in FX market structure.`
    ],
    keyPoint: "Last look is latency asymmetry institutionalised as a market rule. It protects the liquidity provider’s option to decline toxic flow at the cost of a structural disadvantage for the taker."
  },
  {
    era: "Infrastructure",
    icon: "🏢",
    title: "Co-Location as Latency Moat",
    desc: "The placement of trading servers in the same data centre as the exchange matching engine, creating a durable, rent-based advantage in the latency race",
    badge: { label: "Infrastructure", style: "teal" },
    tags: [["co-location","teal"], ["data centre","amber"], ["equal access","slate"], ["latency floor",""]],
    data: [
      { label: "Advantage", value: "Minimal physical distance to engine", color: "teal" },
      { label: "Equalisation", value: "Cross-connects, equal cable lengths", color: "amber" },
      { label: "Economics", value: "Rent, power, cross-connect fees", color: "slate" },
    ],
    body: [
      `Once an exchange offers co-location, the physical lower bound on latency becomes the length of the cross-connect inside the data centre. Participants who co-locate obtain systematically lower one-way and round-trip times than those who remain outside. Exchanges typically equalise cable lengths and offer standardised cross-connects so that co-located firms compete on a level field among themselves, while still enjoying a large advantage over non-co-located firms.`,
      `Co-location is therefore both a technological necessity for latency-sensitive strategies and a recurring revenue source for venues. It also raises policy questions: does the sale of proximity create a two-tier market, and should the same speed be available to all at a regulated price?`,
      `In practice, any serious latency-arbitrage or market-making operation treats co-location as mandatory infrastructure; the residual race is then fought inside the data centre with better hardware, better code, and better microwave or fibre paths to other venues.`
    ],
    keyPoint: "Co-location is the primary latency moat. Once it exists, the relevant competition is no longer “near versus far” but “equally near, who is faster still.”"
  },
  {
    era: "Transmission",
    icon: "📡",
    title: "Microwave Links (Chicago–NJ)",
    desc: "Line-of-sight microwave (and related shortwave) networks that transmit market data and order signals between Chicago and New Jersey faster than the best fibre routes, forming a critical leg of the equity-index latency complex",
    badge: { label: "Physical Layer", style: "amber" },
    tags: [["microwave","amber"], ["Chicago-NJ","teal"], ["speed of light","red"], ["path optimisation",""]],
    data: [
      { label: "Path", value: "Chicago futures ↔ NJ equities/ETFs", color: "amber" },
      { label: "Advantage", value: "Lower latency than terrestrial fibre", color: "teal" },
      { label: "Limit", value: "Weather, licensing, path geometry", color: "slate" },

    body: [
      `The most famous latency corridor in U.S. equities is the path between Chicago (CME futures) and the New Jersey equity data centres (Nasdaq, NYSE, Cboe, etc.). Index futures in Chicago often lead the corresponding ETFs and stocks in New Jersey. A trader who receives the futures tick a few dozen microseconds earlier can act on the equity venues before slower participants update.`,
      `Microwave networks, by using line-of-sight radio instead of fibre that follows roads and rights-of-way, shave meaningful latency off the best optical routes. Successive generations of links have pushed closer to the theoretical speed-of-light minimum given the curvature of the Earth and the available tower sites. Shortwave and other experimental paths have been explored for still lower latency or for diversity.`,
      `The microwave race is expensive, capacity-constrained, and weather-sensitive, yet the economic value of being first on the Chicago–NJ leg has sustained continuous investment and is a canonical example of pure latency infrastructure competition.`
    ],
    keyPoint: "Microwave links turn geography into a tradable edge. On the Chicago–NJ corridor they are the physical manifestation of latency arbitrage between futures and equities."
  },
  {
    era: "Policy",
    icon: "⚖️",
    title: "Regulators’ View on Latency Arbitrage",
    desc: "The spectrum of official attitudes—from acceptance as legitimate competition to concern about fairness, adverse selection and the social value of pure speed races",
    badge: { label: "Regulatory", style: "slate" },
    tags: [["regulation","slate"], ["fairness","amber"], ["market quality","teal"], ["policy debate",""]],
    data: [
      { label: "Acceptance", value: "Speed as ordinary competition", color: "teal" },
      { label: "Concern", value: "Arms race, adverse selection, complexity", color: "red" },
      { label: "Tools", value: "Disclosure, speed bumps, batching, fees", color: "amber" },
    ],
    body: [
      `Regulators have never classified ordinary latency arbitrage as illegal insider trading; the information used is public, merely received earlier. The policy debate instead centres on whether the resulting arms race improves or degrades market quality, whether slower investors are unfairly disadvantaged, and whether the resources devoted to shaving microseconds produce commensurate social value.`,
      `Responses have ranged from disclosure and best-execution guidance, through the approval of intentional delay mechanisms (speed bumps), to proposals for frequent batch auctions or for changes in maker-taker pricing that might reduce the return to pure speed. No major jurisdiction has attempted an outright ban on co-location or on microwave transmission.`,
      `The prevailing stance is pragmatic: latency competition is permitted, but market-structure experiments that limit its most extractive forms are allowed to compete for order flow.`
    ],
    keyPoint: "Regulators treat latency arbitrage as a market-structure problem rather than a fraud problem. The live policy question is how to preserve the benefits of electronic competition while limiting pure speed races that mainly redistribute rather than create value."
  },
  {
    era: "Design",
    icon: "🐢",
    title: "IEX Speed Bump (350 µs Intentional Delay)",
    desc: "An intentional, symmetric delay applied to all inbound and outbound messages on the Investors Exchange, designed to neutralise certain forms of latency arbitrage against resting orders",
    badge: { label: "Structural", style: "teal" },
    tags: [["IEX","teal"], ["speed bump","amber"], ["350 µs","slate"], ["protective delay",""]],
    data: [
      { label: "Delay", value: "350 microseconds, point-to-point coil", color: "teal" },
      { label: "Purpose", value: "Allow quote updates to outrun the take", color: "amber" },
      { label: "Effect", value: "Reduces stale-quote pick-offs on IEX", color: "slate" },
    ],
    body: [
      `IEX imposes a fixed 350-microsecond delay on every order, cancel and market-data message that enters or leaves its system. The delay is implemented as a physical coil of fibre so that it is deterministic and identical for all participants. In the time it takes an incoming marketable order to traverse the coil, a market maker who has observed a price change on a faster venue can send a cancel that also traverses a coil and, under plausible geography, still reaches the IEX matching engine first.`,
      `The design does not eliminate latency advantages; it changes which race matters. The race to take a stale quote on IEX is deliberately handicapped so that the race to cancel that quote can be won by a co-located, well-connected maker. Empirical work and IEX’s own statistics suggest a reduction in certain mark-out metrics relative to unprotected venues.`,
      `The speed bump was controversial at approval and remains a living experiment in structural protection against latency arbitrage. Other venues have since introduced their own delay or discrete-time mechanisms.`
    ],
    keyPoint: "The IEX speed bump is a deliberate slowing of the take path so that the cancel path can win. It is the most prominent structural attempt to make stale-quote arbitrage unprofitable on a major equity exchange."
  },
  {
    era: "Alternative",
    icon: "🔄",
    title: "Frequent Batch Auctions as Solution",
    desc: "The proposal to replace continuous limit-order-book matching with discrete, frequent call auctions (e.g., every 100 ms or 1 s) so that speed advantages within the interval are eliminated",
    badge: { label: "Market Design", style: "amber" },
    tags: [["batch auctions","amber"], ["Budish et al.","teal"], ["discrete time","slate"], ["arms race",""]],
    data: [
      { label: "Idea", value: "Match in discrete intervals, not continuously", color: "amber" },
      { label: "Effect", value: "No value to being first inside the interval", color: "teal" },
      { label: "Status", value: "Theoretical & experimental; limited live adoption", color: "slate" },
    ],
    body: [
      `Frequent batch auctions (advocated most prominently by Budish, Cramton and Shim) would accumulate orders over a short, regular interval and clear them in a single uniform-price auction. Within each interval there is no advantage to being a microsecond faster; the only relevant information is the set of orders present at the batch deadline. The continuous latency race is thereby converted into a competition on price and on information that is genuinely longer-lived than the batch length.`,
      `Proponents argue that the design would reduce the arms race for speed, lower adverse selection on resting orders, and preserve most of the informational and allocative benefits of continuous trading. Critics worry about the loss of immediacy, the complexity of the transition, and the possibility that the race would simply migrate to the batch boundary.`,
      `While pure frequent batch auctions have not displaced continuous books on major equities venues, the idea has influenced the design of speed bumps, discrete-time crosses and academic evaluations of latency externalities.`

    keyPoint: "Frequent batch auctions attack latency arbitrage at its root by removing continuous time from the matching process. They remain the cleanest theoretical alternative to the pure speed race of the continuous limit order book."

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
