<script>
const entries = [
  {
    num: "01",
    icon: "🔍",
    title: "Price Discovery",
    subtitle: "How markets find the 'true' value of an asset",
    tags: [["core function","gold"], ["economics",""], ["efficiency","green"]],
    callouts: [
      { label: "Efficient Market Hypothesis: prices reflect all available info", style: "gold" },
      { label: "Three forms: weak, semi-strong, strong", style: "dim" },
    ],
    body: [
      `Price discovery is the most fundamental purpose of any exchange: the continuous process by which buyers and sellers interact to determine the fair market price of an asset. It is not a single transaction — it is an ongoing aggregation of millions of individual beliefs, forecasts, and valuations, expressed through orders. When a pension fund decides Apple is worth $200 and a hedge fund decides it's worth $180, their competing orders generate a transaction somewhere between — and that transaction becomes part of the public price record.`,
      `The mechanism works through the order book: a live register of all outstanding buy orders (bids) and sell orders (asks) at each price level. The exchange's matching engine continuously compares these and executes trades wherever bids and asks overlap. The resulting transaction price is the market's best current estimate of fair value. Critically, this price is public — it immediately becomes information available to every other participant, who can update their own views accordingly.`,
      `The <em>Efficient Market Hypothesis (EMH)</em>, developed by Eugene Fama in the 1960s, formalises this idea: in its strong form, prices at any moment reflect all available information, making it impossible to systematically outperform the market. In the semi-strong form, prices reflect all public information. In the weak form, prices already incorporate all historical price data. While the strong form is widely rejected (insiders clearly can and do trade on non-public information), the semi-strong form has significant empirical support — most active managers do not consistently beat passive benchmarks after fees, suggesting public information is rapidly incorporated into prices.`,
      `Exchanges improve price discovery versus bilateral (over-the-counter) trading because they centralise information: all bids and offers are visible in one place, competition among buyers drives prices up to fair value, and competition among sellers drives them down. Without this centralisation, prices in different locations or among different participants can diverge significantly — the "law of one price" only holds when markets are sufficiently connected and transparent.`
    ],
    keyPoint: "Price discovery is the economy's most important information-aggregation mechanism. Exchange prices coordinate the decisions of millions of participants — determining where capital flows, which projects get funded, and what risk costs. Get price discovery wrong, and misallocation of capital follows."
  },
  {
    num: "02",
    icon: "💧",
    title: "Liquidity Aggregation",
    subtitle: "Concentrating buyers and sellers to enable immediate trade",
    tags: [["market microstructure",""], ["bid-ask spread","gold"], ["depth","green"], ["immediacy",""]],
    callouts: [
      { label: "Liquidity = ability to transact quickly at a fair price", style: "gold" },
      { label: "Illiquidity premium: extra return demanded for holding illiquid assets", style: "dim" },
    ],
    body: [
      `Liquidity is the ability to buy or sell an asset quickly, in size, without meaningfully moving its price. Exchanges create liquidity by aggregating the order flow of thousands of participants into a single venue — rather than each investor having to find their own counterparty in a fragmented, bilateral market. The value of this network effect is enormous: the more participants are drawn to an exchange, the easier it is for any one participant to trade, which in turn attracts more participants.`,
      `Liquidity has three dimensions. <em>Tightness</em> is the bid-ask spread — the cost of an immediate round-trip trade. A liquid market has spreads of a few basis points; an illiquid one may have spreads of several percent. <em>Depth</em> is how much volume exists at prices close to the mid-price — a deep market can absorb large trades without significant price impact. <em>Resilience</em> is how quickly prices recover after a large trade disturbs them. A truly liquid market is tight, deep, and resilient simultaneously.`,
      `Without exchange-aggregated liquidity, transaction costs would be prohibitive for most investors. Consider a pre-exchange world: to buy shares in a company, you'd have to find a willing seller, negotiate a price (with no reference point), arrange settlement, and verify the seller's ownership — a process taking days or weeks with enormous uncertainty. An exchange reduces this to milliseconds with near-certain settlement. The cost reduction unlocks enormous economic activity: companies can raise capital more cheaply, investors can diversify easily, and prices more rapidly incorporate information.`,
      `Liquidity is not uniform. It varies by asset class (US Treasuries are vastly more liquid than small-cap stocks), by time of day (opening and closing are typically more liquid), and by market conditions (liquidity evaporates in crises — as demonstrated by the Flash Crash and March 2020 COVID sell-off). The <em>illiquidity premium</em> — extra expected return that investors demand for holding hard-to-sell assets — is one of the most persistent and exploitable risk premia in finance.`
    ],
    keyPoint: "Liquidity is not free — it is produced by market makers, competing orders, and exchange infrastructure. When the conditions that produce liquidity break down (stress, uncertainty, regulatory change), it can vanish suddenly, revealing how dependent the entire financial system is on this infrastructure."
  },
  {
    num: "03",
    icon: "📋",
    title: "Standardisation of Contracts",
    subtitle: "Creating fungible, interchangeable units that enable scale",
    tags: [["futures","gold"], ["options",""], ["equities",""], ["interoperability","green"]],
    callouts: [
      { label: "CBOT corn futures: 5,000 bushels, #2 yellow grade, specific delivery points", style: "gold" },
      { label: "Standardisation → fungibility → liquidity", style: "dim" },
    ],
    body: [
      `Before exchanges standardised contracts, every transaction was bespoke. A wheat deal in Chicago might specify 3,200 bushels of soft red winter wheat, delivered to a specific warehouse, of a privately-negotiated quality grade. Another deal might specify 4,100 bushels, different grade, different warehouse. These deals could not be offset against each other — if you wanted to exit your position, you had to find the exact original counterparty. The market was atomised and illiquid.`,
      `Exchanges solve this by defining standard contract specifications: a fixed quantity, a defined quality grade, a set of acceptable delivery locations, and a standard settlement mechanism. The CBOT corn futures contract specifies exactly 5,000 bushels of #2 yellow corn, deliverable at specific approved warehouses in Illinois and Ohio. Every contract is identical. This <em>fungibility</em> — the interchangeability of one contract for another — is what creates a liquid secondary market. You don't need to find your original counterparty to exit; you simply sell a standard contract to whoever will buy it.`,
      `Standardisation extends beyond commodities. Equity shares are the ultimate standardised instrument: one share of Apple common stock is identical to any other share. Options contracts specify standard strike prices and expiry dates. Interest rate swap futures standardise the notional amount, floating rate index, and settlement mechanism. Each standardisation decision involves trade-offs: too few specifications and contracts are illiquid (no critical mass of trading); too many and the contract doesn't fit anyone's specific hedging need.`,
      `Standardisation also facilitates regulatory oversight, risk management, and clearing. When a clearing house needs to calculate the margin requirement on a futures position, it can do so precisely because every contract in that market is identical. Bespoke OTC derivatives, by contrast, require individual valuation for each contract — an expensive, error-prone process that caused enormous confusion during the 2008 crisis when institutions held billions in structured products no one could reliably value.`
    ],
    keyPoint: "Standardisation is the infrastructure of scale. It transforms idiosyncratic, illiquid bilateral contracts into fungible, liquid instruments that can be traded by anyone, anywhere, any time. Every liquid market is built on a layer of carefully designed standards."
  },
  {
    num: "04",
    icon: "🔐",
    title: "Clearing and Settlement Infrastructure",
    subtitle: "Ensuring every trade completes — and defaults are contained",
    tags: [["CCP","gold"], ["T+2","dim"], ["margin","red"], ["systemic risk","red"]],
    callouts: [
      { label: "US equities: moving from T+2 → T+1 settlement (2024)", style: "gold" },
      { label: "CCPs: buyer to every seller, seller to every buyer", style: "dim" },
    ],
    body: [
      `Once a trade is executed on an exchange, two obligations arise: the buyer must pay, and the seller must deliver the security. <em>Clearing</em> is the process of confirming and reconciling these obligations; <em>settlement</em> is their actual discharge — cash changes hands, securities transfer. This sounds mechanical, but it is the lynchpin of market trust. Without reliable settlement, no rational participant would trade.`,
      `Modern exchanges operate with a <em>Central Counterparty Clearing House (CCP)</em> sitting between every trade. By novation — the legal substitution of the CCP for each original counterparty — the CCP becomes the buyer to every seller and the seller to every buyer. The bilateral credit risk between two strangers (will that hedge fund actually deliver those shares?) is replaced by credit risk on the CCP, which is managed through margin, default funds, and extensive loss-absorbing capacity. This novation is what makes it safe to trade with unknown counterparties at electronic speed.`,
      `CCPs manage risk through a layered waterfall. First, <em>initial margin</em>: collateral posted when opening a position, sized to cover potential losses over a typical close-out period. Second, <em>variation margin</em>: daily cash payments reflecting gains and losses (marking positions to market daily prevents small losses from compounding into catastrophic ones). Third, a <em>default fund</em>: pre-funded contributions from all clearing members that absorb losses if initial margin is exhausted. Fourth, CCP equity capital. This waterfall structure means that even the default of a large clearing member can be absorbed without systemic contagion.`,
      `Settlement cycles matter enormously. US equities moved from T+5 (five business days after trade) to T+3, then to T+2, and in 2024 to T+1. Each shortening reduces the window of counterparty risk (the chance one party fails between trade and settlement) but demands faster operational processes. The eventual goal — T+0 or real-time atomic settlement — is being actively piloted using blockchain technology, which could in principle settle trades instantaneously and irrevocably.`
    ],
    keyPoint: "Clearing and settlement are boring until they fail. The CCP infrastructure absorbs the counterparty risk that would otherwise prevent anonymous parties from trading with confidence. It is the immune system of financial markets — invisible when working, catastrophic when it doesn't."
  },
  {
    num: "05",
    icon: "⚖️",
    title: "Regulatory Oversight Role",
    subtitle: "Exchanges as the first layer of financial market supervision",
    tags: [["SRO","gold"], ["surveillance",""], ["listing rules","green"], ["enforcement","red"]],
    callouts: [
      { label: "NYSE, NASDAQ: FINRA-supervised Self-Regulatory Organisations", style: "gold" },
      { label: "Market surveillance: detecting manipulation, insider trading", style: "dim" },
    ],
    body: [
      `Exchanges are not merely trading venues — in most jurisdictions they function as <em>Self-Regulatory Organisations (SROs)</em>: private entities that perform regulatory functions delegated by government. In the US, NYSE and NASDAQ are SROs under FINRA oversight; they write and enforce their own rules about listing standards, trading conduct, and member behaviour, subject to SEC review. This public-private model leverages exchanges' deep market expertise while maintaining governmental accountability.`,
      `Market surveillance is one of the exchange's most critical regulatory functions. Every exchange operates a surveillance system that monitors trading in real time for signs of market manipulation, insider trading, spoofing (placing and rapidly cancelling orders to create false price signals), layering, and wash trading (self-dealing to create artificial volume). These systems generate alerts when trading patterns deviate statistically from normal — flagging, for example, unusual options activity in a stock before an unannounced merger, or sudden volume spikes that precede a price collapse.`,
      `When surveillance identifies potential violations, exchanges can conduct their own investigations, impose fines on member firms, and refer cases to the SEC, CFTC, or criminal authorities. This first-line enforcement role is essential: regulators have limited capacity to monitor every trade across every venue, so exchanges serve as the eyes and ears embedded in the market itself. The surveillance arms race has intensified as trading has become more electronic — today's manipulation is often algorithmic, requiring machine learning tools to detect patterns invisible in raw data.`,
      `Regulatory arbitrage between exchanges is a persistent tension. Exchanges compete for listings and order flow, creating pressure to offer favourable terms that may weaken oversight. The 2008 crisis partly reflected a race-to-the-bottom in OTC derivatives markets where no exchange-equivalent regulatory infrastructure existed. Post-crisis reforms (Dodd-Frank, EMIR) attempted to bring OTC markets under exchange-like oversight — but the fundamental tension between regulatory robustness and competitive attraction of listings remains unresolved.`
    ],
    keyPoint: "Exchanges are simultaneously commercial businesses competing for listings and order flow, and public-interest regulators enforcing market integrity. This dual role creates inherent tension: the same institution that profits from trading volume also has the power and duty to suspend trading or discipline members."
  },
  {
    num: "06",
    icon: "⚙️",
    title: "Order Matching Engines",
    subtitle: "The technological core of a modern exchange",
    tags: [["technology",""], ["latency","gold"], ["market microstructure",""], ["CLOB","gold"]],
    callouts: [
      { label: "Matching engine latency: <100 microseconds on major exchanges", style: "gold" },
      { label: "CLOB: Continuous Limit Order Book — the universal standard", style: "dim" },
    ],
    body: [
      `The order matching engine is the electronic heart of a modern exchange — the software system that receives orders from participants, maintains the order book, applies matching logic, and generates trade confirmations. It is the single most latency-sensitive and reliability-critical system in financial markets. A matching engine must process hundreds of thousands of orders per second, execute matching logic in microseconds, and maintain perfect consistency of the order book even as thousands of messages arrive simultaneously. Downtime is measured in millions of dollars per minute.`,
      `Most exchanges use a <em>Continuous Limit Order Book (CLOB)</em> with price-time priority: orders at the same price are executed in the order they arrived (time priority). A buy order at $100.05 executes before one at $100.00; among orders at the same price, the earliest-submitted executes first. This creates strong incentives for participants to submit competitive prices and to be fast — the basis of the HFT arms race. Alternative matching mechanisms include pro-rata allocation (distributing fills proportionally among all orders at the best price, used in some futures markets) and periodic batch auctions (collecting orders over a window and matching them at a single price, used at open and close).`,
      `The exchange's opening and closing auctions are particularly important. Rather than opening with continuous trading (where the first few trades could occur at extreme prices with low participation), exchanges collect orders before the open and execute them in a single price auction — the <em>opening cross</em>. The closing auction similarly determines the official closing price, which is critical because ETF NAVs, index rebalancing, and derivatives settlement all reference it. Billions of dollars in orders can participate in the closing auction, making it a significant source of both price discovery and potential manipulation.`,
      `Matching engine architecture has been a competitive battleground. Exchanges invested heavily in replacing legacy systems with ultra-low-latency engines — NASDAQ's INET (acquired from INET ECN), NYSE's Pillar, CME's Globex. Co-location services (renting rack space in the exchange's data centre) allow participants to reduce round-trip message times to sub-millisecond levels. The technological sophistication required to run a modern matching engine rivals that of any tech company — exchanges are, at their core, technology businesses.`
    ],
    keyPoint: "The matching engine is the exchange's value-creation mechanism. Its architecture — priority rules, latency, auction design — shapes who profits and who doesn't, how prices form, and whether markets are stable or prone to feedback loops. Every design choice has strategic and systemic consequences."

      `In the US, exchange market data flows through two channels. The <em>Securities Information Processor (SIP)</em> — operated by exchanges collectively — consolidates trade and quote data from all exchanges into a single, publicly available feed, sold at regulated fees. This is the "official" price. In parallel, exchanges sell <em>proprietary direct feeds</em> that carry the same data faster and with more detail — available to those willing to pay premium prices. The gap between SIP and direct feed latency is typically microseconds but is commercially significant for algorithmic traders. Critics argue this two-tier structure effectively lets exchanges sell speed advantages to well-resourced participants at the expense of others.`,
      `Market data has evolved from a secondary revenue stream into a major profit centre. Exchanges earn licensing fees from terminals, data vendors (Bloomberg, Refinitiv), algorithmic trading firms, and any firm that references exchange prices commercially. NYSE and NASDAQ each earn hundreds of millions annually from data. This creates a tension: exchanges have both a public interest obligation (prices should be widely available) and a commercial incentive (maximising data revenue). The SEC's 2020 attempt to reform market data fees — allowing new SIP operators and lower-latency public feeds — was challenged in court by exchanges protective of their data franchise.`,

      `Listing standards exist because exchange membership is an implicit quality signal. Investors in index funds that track NYSE or NASDAQ-listed companies are implicitly relying on the exchange's screening to exclude obviously fraudulent or unviable businesses. Standards evolve in response to scandals: Enron and WorldCom's collapses in 2001–2002 triggered Sarbanes-Oxley (SOX), which mandated personal CEO and CFO certification of financial statements (with criminal liability for false certification), independent audit committees, and stronger internal controls. The cost of SOX compliance was significant — it accelerated the trend of companies choosing to remain private rather than listing publicly.`,

      `Beginning in the late 1990s and accelerating through the 2000s, exchanges globally converted from mutual to for-profit corporate structures — <em>demutualization</em>. Stockholm's exchange was the first to go public (1993); NASDAQ demutualised in 2000; the NYSE in 2006 (merging with Archipelago Exchange to create NYSE Group and listing on its own exchange). Demutualization was driven by competitive pressure from ECNs (which were already for-profit and investing aggressively in technology) and the need to raise capital for technology upgrades and acquisitions.`,

function renderAll() {
  const root = document.getElementById('entries-root');
  document.getElementById('countLabel').textContent = `${entries.length} entries`;

  entries.forEach((e, i) => {
    const tagHtml = e.tags.map(([label, style]) =>
      `<span class="tag ${style}">${label}</span>`
    ).join('');
    const calloutHtml = (e.callouts || []).map(c =>
      `<span class="callout ${c.style}">${c.label}</span>`
    ).join('');
    const bodyHtml = e.body.map(p => `<p>${p}</p>`).join('') +
      `<div class="key-point">${e.keyPoint}</div>` +
      (calloutHtml ? `<div class="callout-row">${calloutHtml}</div>` : '') +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${i}`;
    div.innerHTML = `
      <div class="entry-header" onclick="toggle(${i})">
        <span class="entry-num">${e.num}</span>
        <span class="entry-icon">${e.icon}</span>
        <div class="entry-title-wrap">
          <div class="entry-title">${e.title}</div>
          <div class="entry-subtitle">${e.subtitle}</div>
        </div>
        <span class="entry-toggle">▶</span>
      </div>
      <div class="entry-body">${bodyHtml}</div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  entries.forEach((_, i) => {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  });
}

renderAll();
</script>
