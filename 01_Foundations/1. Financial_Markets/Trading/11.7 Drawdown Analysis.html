<script>
const entries = [
  {
    era: "Definition",
    icon: "📉",
    title: "Maximum Drawdown Calculation",
    desc: "The largest peak-to-trough percentage decline in the equity curve over a specified horizon",
    badge: { label: "Core", style: "red" },
    tags: [["max DD","red"], ["peak-to-trough","amber"], ["high-water mark","teal"], ["path risk",""]],
    data: [
      { label: "Formula", value: "max_t (peak_t − equity_t) / peak_t", color: "red" },
      { label: "Peak", value: "Running maximum of equity", color: "teal" },
      { label: "Unit", value: "Percentage of capital", color: "amber" },
    ],
    body: [
      `Maximum drawdown (MDD) is computed by tracking the running high-water mark of the portfolio equity curve and, at each point, recording the percentage decline from that peak to the current equity. The largest of these declines is the maximum drawdown. Formally, if \(E_t\) is equity at time \(t\) and \(M_t = \max_{s\le t} E_s\), then \(\text{DD}_t = (M_t - E_t)/M_t\) and \(\text{MDD} = \max_t \text{DD}_t\).`,
      `The calculation is path-dependent and non-linear: two return series with identical volatility and mean can produce very different MDDs depending on the order of gains and losses. It is also sample-dependent; extending the history can only increase (or leave unchanged) the observed MDD.`,
      `Practical implementations must decide whether to use end-of-day, intra-day or high-water-mark-within-bar equity, and whether external cash flows are included. For strategy comparison the same convention must be applied uniformly.`
    ],
    keyPoint: "Maximum drawdown is the single most visible scar on an equity curve. Its calculation is elementary, yet its economic and psychological importance routinely exceeds that of volatility."
  },
  {
    era: "Time",
    icon: "⏱️",
    title: "Drawdown Duration",
    desc: "The length of time the portfolio remains below a prior peak, from the onset of a decline until a new high-water mark is achieved",
    badge: { label: "Path", style: "amber" },
    tags: [["duration","amber"], ["time underwater","teal"], ["recovery time","slate"], ["patience",""]],
    data: [
      { label: "Start", value: "First breach of prior peak", color: "amber" },
      { label: "End", value: "Return to or above that peak", color: "teal" },
      { label: "Stats", value: "Max, average, median duration", color: "slate" },
    ],
    body: [
      `Drawdown duration measures the temporal extent of capital impairment. A deep but brief drawdown may be tolerable; a moderate drawdown that lasts years can be fatal to investor retention and to the manager’s own decision-making. Duration is therefore a first-class risk statistic alongside depth.`,
      `Commonly reported figures include the duration of the maximum-drawdown episode, the longest time spent underwater, and the average or median duration across all drawdown events. Some analysts also track “time to recovery” separately from “time to trough.”`,
      `In live risk management, strategies that historically required multi-year recoveries face higher capital haircuts or lower leverage limits, regardless of their asymptotic Sharpe ratio.`
    ],
    keyPoint: "Duration converts drawdown from a static percentage into a lived experience of time. Capital that is impaired for years is capital that may never be allowed to compound."
  },
  {
    era: "Visual",
    icon: "🌊",
    title: "Underwater Equity Curve",
    desc: "A time-series plot of the current percentage drawdown from the running high-water mark, visualising the continuous path of capital impairment",
    badge: { label: "Diagnostic", style: "teal" },
    tags: [["underwater curve","teal"], ["drawdown series","amber"], ["visualization","slate"], ["pain path",""]],
    data: [
      { label: "Y-axis", value: "Current DD % (≤ 0)", color: "teal" },
      { label: "X-axis", value: "Time", color: "" },
      { label: "Insight", value: "Depth, duration & clustering", color: "amber" },
    ],
    body: [
      `The underwater (or drawdown) equity curve plots \(\text{DD}_t = (M_t - E_t)/M_t\) (usually as a negative number) against time. Periods at zero indicate new highs; excursions below zero show the depth and persistence of losses relative to the peak. The chart makes clustering of drawdowns, slow recoveries and the relative severity of different episodes immediately visible.`,
      `It is one of the most informative single diagnostics a risk or allocation committee can examine. Two strategies with identical MDD can look completely different once their underwater paths are overlaid: one may suffer a single deep V-shaped event, the other a series of prolonged, moderate underwater periods.`,
      `Best practice is to display the underwater curve alongside the equity curve itself and to annotate the start, trough and recovery dates of the major episodes.`
    ],
    keyPoint: "The underwater equity curve turns an abstract maximum into a continuous narrative of pain. It is the visual language in which drawdown risk is most clearly communicated."
  },
  {
    era: "Stats",
    icon: "📊",
    title: "Drawdown Distribution",
    desc: "The empirical distribution of all peak-to-trough declines (and optionally their durations), moving beyond the single maximum observation",
    badge: { label: "Distribution", style: "slate" },
    tags: [["DD distribution","slate"], ["histogram","teal"], ["quantiles","amber"], ["tail risk",""]],
    data: [
      { label: "Objects", value: "Every completed drawdown episode", color: "slate" },
      { label: "Summaries", value: "Mean, median, 95th pct, max", color: "teal" },
      { label: "Value", value: "Stability vs. single MDD", color: "amber" },
    ],
    body: [
      `Instead of focusing solely on the worst drawdown, one can collect every distinct peak-to-trough episode and examine their distribution. Summary statistics (mean, median, inter-quartile range, selected quantiles) and a histogram or kernel density give a far richer picture of the strategy’s typical and extreme capital impairment.`,
      `The distribution approach reduces the sampling noise that plagues a single MDD figure and reveals whether large drawdowns are rare outliers or a recurring feature of the process. Joint distributions of depth and duration further illuminate the nature of the risk.`,
      `In research, strategies whose drawdown distribution is heavy-tailed or shows strong clustering warrant higher capital buffers even when the historical maximum appears moderate.`
    ],
    keyPoint: "The drawdown distribution replaces a single noisy extreme with a full probabilistic description. It is the natural next step once maximum drawdown has been computed."
  },
  {
    era: "Estimation",
    icon: "🔮",
    title: "VaR-Implied Max Drawdown Estimation",
    desc: "Analytical or semi-analytical approximations that translate a Value-at-Risk or volatility figure into an expected or quantile maximum drawdown over a horizon",
    badge: { label: "Model", style: "amber" },
    tags: [["VaR","amber"], ["implied MDD","teal"], ["analytical approx","slate"], ["Magdon-Ismail",""]],
    data: [
      { label: "Input", value: "σ, μ, horizon, confidence", color: "amber" },
      { label: "Output", value: "Expected or quantile MDD", color: "teal" },
      { label: "Use", value: "Forward-looking risk budgets", color: "slate" },
    ],
    body: [
      `When only volatility or VaR is known, or when the historical sample is too short to observe extreme drawdowns reliably, one can still form an estimate of expected or high-quantile maximum drawdown. For Brownian motion with drift there exist closed-form and series approximations (e.g., work descending from Magdon-Ismail et al.) that map \(\mu\), \(\sigma\) and horizon \(T\) into \(\mathbb{E}[\text{MDD}]\) or into quantiles of MDD.`,
      `Simpler heuristics relate MDD to VaR by scaling factors that depend on the horizon and on the assumed return process. These estimates are useful for setting forward-looking risk limits and for stress-testing strategies whose live history is still short.`,
      `All such mappings rest on distributional assumptions; fat tails, volatility clustering and serial correlation generally increase true MDD relative to the Gaussian benchmark. Conservative adjustments or Monte-Carlo methods under more realistic processes are therefore recommended.`
    ],
    keyPoint: "VaR-implied drawdown estimates convert a familiar risk number into a path-risk number. They are indispensable for forward-looking capital allocation when historical MDD is not yet informative."
  },
  {
    era: "Quantile",
    icon: "📐",
    title: "Drawdown at Different Confidence Levels",
    desc: "Quantiles of the drawdown distribution (or of simulated maximum drawdowns) expressed at conventional confidence levels such as 95 % or 99 %",
    badge: { label: "Quantile", style: "teal" },
    tags: [["DD quantile","teal"], ["95 % / 99 %","amber"], ["stress","red"], ["capital",""]],
    data: [
      { label: "Example", value: "95 % DD = depth exceeded only 5 %", color: "teal" },
      { label: "Method", value: "Historical or Monte-Carlo", color: "amber" },
      { label: "Use", value: "Risk limits & capital buffers", color: "slate" },
    ],
    body: [
      `Just as VaR reports a loss quantile, one can report drawdown quantiles: the depth that is exceeded in only 5 % or 1 % of historical (or simulated) paths. These figures answer the question “how bad can the drawdown be at a chosen confidence level?” rather than “what was the single worst episode in this particular sample?”`,
      `Estimation proceeds either by collecting all historical drawdown episodes and reading off empirical quantiles, or by Monte-Carlo simulation of the strategy’s return process (parametric or bootstrap) and extracting the distribution of maximum drawdowns over a fixed horizon.`,
      `Confidence-level drawdowns are particularly useful for setting institutional risk limits that must be expressed probabilistically rather than as hard historical maxima.`
    ],
    keyPoint: "Drawdown quantiles transform an ex-post extreme into an ex-ante probabilistic statement. They align path-risk measurement with the language of VaR and regulatory capital."
  },
  {
    era: "Tail",
    icon: "⚠️",
    title: "Conditional Drawdown at Risk (CDaR)",
    desc: "The expected value of drawdowns that exceed a given quantile threshold — the drawdown analogue of Conditional Value-at-Risk (CVaR)",
    badge: { label: "Advanced", style: "red" },
    tags: [["CDaR","red"], ["expected shortfall","teal"], ["drawdown CVaR","amber"], ["optimization",""]],
    data: [
      { label: "Definition", value: "E[DD | DD ≥ DD_α]", color: "red" },
      { label: "Property", value: "Coherent, tail-sensitive", color: "teal" },
      { label: "Use", value: "Portfolio optimisation constraints", color: "amber" },
    ],
    body: [
      `Conditional Drawdown at Risk (CDaR), introduced by Chekhlov, Uryasev and Zabarankin, is the average of all drawdowns that exceed a specified quantile of the drawdown distribution. It is the natural path-risk counterpart of Conditional VaR / Expected Shortfall: it answers “when drawdowns are already in the tail, how deep are they on average?”`,
      `CDaR is a coherent risk measure (under appropriate definitions) and can be optimised with linear or convex programming techniques, making it attractive as a constraint or objective inside portfolio construction. Because it averages the entire tail rather than looking at a single quantile, it is less brittle than pure maximum-drawdown constraints.`,
      `In practice CDaR is estimated either from the historical underwater path or from Monte-Carlo scenarios. It is especially valuable when the investor’s utility is dominated by the severity of the worst episodes rather than by average volatility.`
    ],
    keyPoint: "CDaR is Expected Shortfall applied to the drawdown process. It supplies a coherent, optimisable, tail-focused measure of path risk that pure maximum drawdown cannot provide."
  },
  {
    era: "Link",
    icon: "🔗",
    title: "Relationship between Sharpe and Max Drawdown",
    desc: "Theoretical and empirical links showing that higher Sharpe ratios tend to produce shallower expected drawdowns, yet the mapping is far from deterministic",
    badge: { label: "Theory", style: "slate" },
    tags: [["Sharpe vs MDD","slate"], ["theoretical bound","teal"], ["sample variation","amber"], ["leverage",""]],
    data: [
      { label: "Tendency", value: "Higher SR → lower E[MDD]", color: "teal" },
      { label: "Caveat", value: "Path dependence & fat tails", color: "red" },
      { label: "Practical", value: "SR alone does not control MDD", color: "amber" },
    ],
    body: [
      `For diffusion processes there exist analytic relationships between the Sharpe ratio, the investment horizon and the expected maximum drawdown. Intuitively, a higher drift-to-volatility ratio makes deep or prolonged drawdowns less probable, so expected MDD declines as Sharpe rises. Rough rules of thumb (e.g., expected MDD scaling with \(1/\text{SR}\) or \(1/\text{SR}^2\) under certain assumptions) appear in the literature.`,
      `In real markets the relationship is noisy. Serial correlation, volatility clustering, jumps and changing leverage can produce large drawdowns even for strategies that exhibit respectable full-sample Sharpes. Conversely, a modest-Sharpe strategy with very stable paths can show remarkably controlled drawdowns.`,
      `Consequently, risk management that relies solely on targeting a Sharpe ratio is incomplete. Explicit drawdown constraints, CDaR limits or leverage rules that respond to the underwater curve remain necessary even when the headline Sharpe is attractive.`
    ],
    keyPoint: "Sharpe and maximum drawdown are related but not interchangeable. A high Sharpe improves the odds of modest drawdowns; it does not guarantee them. Path-risk must still be measured and constrained directly."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
