<title>Quantitative Methods — 16.3 Reinforcement Learning</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {

    --surface:   #ffffff;

    --border:    #d8d2c4;
    --border2:   #c4bdb0;

    --faint:     #b0a898;
    --red:       #b03020;

    --slate-bg:  #f0f4f8;
    --slate-border:#b4c8dc;

  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    line-height: 1.75;
  }

  body::after {

    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 940px;
    margin: 0 auto;

  .book-header {
    margin-bottom: 44px;

    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;

  }

  .chapter-eyebrow {
    font-family: 'Space Mono', monospace;

    letter-spacing: 0.22em;

  }

  .book-title {
    font-family: 'DM Serif Display', serif;

    letter-spacing: -0.02em;
  }

  .book-title em {
    font-style: italic;
    color: var(--accent);
  }

  .header-right {
    text-align: right;
    padding-bottom: 4px;
  }

  .header-stat {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.8;
    letter-spacing: 0.05em;
  }

  .header-stat strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 68px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;
  }

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
  }

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
  }

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;
  }

  .key-insight-text {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Framework",
    icon: "🗺️",
    title: "MDP Framework",
    desc: "Markov Decision Process — the formal foundation of sequential decision-making under uncertainty",
    badge: { label: "Core", style: "teal" },
    tags: [["MDP","teal"], ["states","amber"], ["actions",""], ["rewards","slate"]],
    data: [
      { label: "Components", value: "State · Action · Transition · Reward · Discount", color: "teal" },
      { label: "Markov property", value: "Future depends only on current state", color: "" },
      { label: "Goal", value: "Maximise expected cumulative discounted reward", color: "amber" },
    ],
    body: [
      `A Markov Decision Process formalises the interaction between an agent and an environment. At each time step the agent observes a state, selects an action, receives a scalar reward, and transitions to a new state according to (possibly stochastic) dynamics. The Markov property asserts that the current state summarises all relevant history.`,
      `In trading the state might encode positions, inventory, market features and time-to-horizon; actions correspond to order placement or position adjustments; rewards are typically mark-to-market PnL adjusted for costs and risk. The discount factor balances immediate versus long-term outcomes.`,
      `Almost every modern RL algorithm is derived from the MDP framework. Understanding Bellman equations, value functions and the exploration–exploitation trade-off begins here.`
    ],
    keyPoint: "The MDP is the mathematical language of sequential decisions. Every RL trading system is an attempt to solve (or approximate) an MDP whose reward encodes economic objectives."
  },
  {
    era: "Value-Based",
    icon: "🎯",
    title: "Q-Learning and DQN",
    desc: "Learning action-value functions offline and with deep neural network function approximation",
    badge: { label: "Core", style: "teal" },
    tags: [["Q-learning","teal"], ["DQN","amber"], ["value-based",""], ["experience replay","slate"]],
    data: [
      { label: "Q-learning", value: "Tabular off-policy TD control", color: "teal" },
      { label: "DQN", value: "Neural Q-network + replay + target net", color: "amber" },
      { label: "Limitation", value: "Primarily discrete action spaces", color: "red" },
    ],
    body: [
      `Q-learning estimates the optimal action-value function Q*(s,a) — the expected return of taking action a in state s and thereafter following the optimal policy. The classic tabular update is off-policy and uses temporal-difference (TD) errors.`,
      `Deep Q-Networks (DQN) replace the table with a neural network, stabilised by experience replay (breaking temporal correlations) and a slowly updated target network. Extensions such as Double DQN, Dueling architectures and prioritised replay further improve sample efficiency and stability.`,
      `In finance, pure DQN is most natural when the action space is discrete (buy / hold / sell, or a small set of order types). Continuous position sizing usually requires policy-gradient or actor-critic methods.`
    ],
    keyPoint: "Q-learning and DQN learn the value of actions. They remain the simplest entry point into deep RL and work well when actions are discrete and the horizon is moderate."
  },
  {
    era: "Policy",
    icon: "📈",
    title: "Policy Gradient Methods",
    desc: "PPO, SAC and related algorithms that directly optimise a parameterised policy",
    badge: { label: "Core", style: "teal" },
    tags: [["PPO","teal"], ["SAC","amber"], ["policy gradient",""], ["actor-critic","slate"]],
    data: [
      { label: "PPO", value: "Clipped surrogate · stable on-policy updates", color: "teal" },
      { label: "SAC", value: "Maximum-entropy · off-policy · continuous actions", color: "amber" },
      { label: "Advantage", value: "Native support for continuous control", color: "" },
    ],
    body: [
      `Policy-gradient methods parameterise the policy π_θ(a|s) directly and ascend the gradient of expected return. Actor-critic variants learn a value function in parallel to reduce variance of the gradient estimate.`,
      `Proximal Policy Optimisation (PPO) constrains policy updates via a clipped surrogate objective, delivering reliable on-policy performance with relatively little tuning. Soft Actor-Critic (SAC) maximises both expected return and policy entropy, encouraging exploration and yielding strong sample efficiency in continuous action spaces.`,
      `These algorithms dominate modern continuous-control applications and are the usual choice when the agent must output position sizes, order quantities or continuous risk allocations.`
    ],
    keyPoint: "Policy-gradient methods (especially PPO and SAC) optimise the policy itself. They are the workhorses for continuous action spaces that arise in position sizing and execution."
  },
  {
    era: "Multi-Agent",
    icon: "👥",
    title: "Multi-Agent RL",
    desc: "Learning in environments that contain other adaptive agents — markets themselves",
    badge: { label: "Advanced", style: "amber" },
    tags: [["MARL","amber"], ["game theory","teal"], ["non-stationarity",""], ["equilibria","slate"]],
    data: [
      { label: "Setting", value: "Multiple agents with coupled rewards", color: "teal" },
      { label: "Challenge", value: "Non-stationarity from concurrent learning", color: "red" },
      { label: "Finance link", value: "Markets are multi-agent by definition", color: "amber" },
    ],
    body: [
      `In multi-agent reinforcement learning the environment contains other learning agents whose policies change over time. From any single agent’s perspective the transition and reward functions become non-stationary, violating a core MDP assumption.`,
      `Techniques range from independent learners (each treating others as part of the environment) to centralised training with decentralised execution, opponent modelling, and game-theoretic solution concepts (Nash, correlated equilibria). Mean-field approximations become useful when the number of agents is large.`,
      `Financial markets are the canonical multi-agent system: every participant’s actions alter the order book and therefore the environment faced by everyone else. Explicit multi-agent modelling is still rare in production but is an active research frontier.`
    ],
    keyPoint: "Markets are multi-agent environments. Treating other participants as static noise is a modelling convenience that can break when those participants adapt."
  },
  {
    era: "Design",
    icon: "🎁",
    title: "Reward Function Design",
    desc: "Crafting the scalar signal that tells the agent what “good trading” means",
    badge: { label: "Critical", style: "red" },
    tags: [["reward design","red"], ["PnL","teal"], ["risk penalty",""], ["shaping","slate"]],
    data: [
      { label: "Typical terms", value: "PnL − λ·risk − costs − inventory penalty", color: "teal" },
      { label: "Risk", value: "Sparse or misspecified rewards → unintended behaviour", color: "red" },
      { label: "Practice", value: "Dense shaping + terminal economic objective", color: "amber" },
    ],
    body: [
      `The reward function is the most consequential modelling choice in any RL trading system. A naïve mark-to-market PnL reward often produces excessive risk-taking or inventory accumulation. Practitioners therefore augment it with transaction-cost penalties, inventory or drawdown penalties, and sometimes differential Sharpe or Sortino terms.`,
      `Reward shaping can accelerate learning by providing denser feedback, but poorly designed shaping can create local optima that diverge from true economic value. Sparse terminal rewards (e.g. final portfolio value) are theoretically clean yet extremely hard to learn from.`,
      `Domain knowledge, careful scaling, and iterative validation against realised PnL and risk metrics are indispensable. The reward is effectively the loss function of the entire system.`
    ],
    keyPoint: "Reward design encodes the economic objective. A misspecified reward produces an agent that optimises the wrong thing with high efficiency."
  },
  {
    era: "Action",
    icon: "📏",
    title: "Continuous Action Spaces",
    desc: "Representing position size, order quantity or risk allocation as continuous controls",
    badge: { label: "Core", style: "teal" },
    tags: [["continuous actions","teal"], ["position sizing","amber"], ["actor-critic",""], ["SAC/PPO","slate"]],
    data: [
      { label: "Examples", value: "Target weight · order size · limit price offset", color: "teal" },
      { label: "Algorithms", value: "SAC · PPO · TD3 · DDPG", color: "" },
      { label: "Constraint", value: "Must respect position limits & risk budgets", color: "amber" },
    ],
    body: [
      `Many trading decisions are naturally continuous: how large a position to hold, how much to buy or sell in the next interval, or where to place a limit order relative to the mid-price. Discretising these quantities loses precision and can introduce artefacts.`,
      `Policy-gradient and actor-critic algorithms output parameters of a continuous distribution (usually Gaussian or Beta) from which actions are sampled. During deployment the mean (or a deterministic policy) is often used. Action bounds and smooth projections enforce risk limits.`,
      `Continuous control also interacts with market impact: the agent must learn that larger orders incur higher costs, which is automatically captured if the simulator or reward includes realistic impact models.`
    ],
    keyPoint: "Continuous action spaces let the agent express nuanced position and order decisions. They require policy-gradient methods and careful handling of constraints."
  },
  {
    era: "State",
    icon: "📡",
    title: "State Representation",
    desc: "Engineering the market features and internal variables that constitute the agent’s observation",
    badge: { label: "Critical", style: "amber" },
    tags: [["state design","amber"], ["features","teal"], ["inventory",""], ["normalisation","slate"]],
    data: [
      { label: "Market features", value: "Returns · volatility · imbalance · spreads · volume", color: "teal" },
      { label: "Internal state", value: "Position · unrealised PnL · time-to-horizon", color: "" },
      { label: "Key practice", value: "Normalisation · stationarity transforms", color: "amber" },
    ],
    body: [
      `The state must contain all information the agent needs to act optimally. Typical components include recent returns and volatility, order-book imbalance, spread and depth statistics, technical indicators, and the agent’s own inventory, cash and remaining horizon.`,
      `Because financial series are non-stationary, features are usually normalised (z-scoring, rank transforms, or rolling quantiles) and may be augmented with regime indicators. Including raw prices is almost always harmful; relative or differenced quantities are preferred.`,
      `Partial observability is the norm: the true latent state of the market is never fully observed. Recurrent architectures or explicit history windows can help the agent maintain an internal belief state.`
    ],
    keyPoint: "State representation is feature engineering under sequential dependence. A poorly chosen state makes even the best algorithm learn the wrong policy."
  },
  {
    era: "Application",
    icon: "⚡",
    title: "RL for Order Execution",
    desc: "Optimising the trajectory of child orders to minimise implementation shortfall",
    badge: { label: "Core", style: "teal" },
    tags: [["execution","teal"], ["TWAP/VWAP","amber"], ["market impact",""], ["Almgren-Chriss","slate"]],
    data: [
      { label: "Objective", value: "Minimise implementation shortfall + risk", color: "teal" },

    body: [
      `Optimal execution seeks to liquidate (or acquire) a large position while balancing market impact against timing risk. Classical solutions such as Almgren–Chriss yield deterministic schedules under stylised impact assumptions. RL can learn adaptive policies that react to live order-book state, short-term alpha signals and realised volume.`,
      `The state typically includes remaining inventory, time left, current spread and depth, and recent price dynamics. Actions are the size (and possibly limit price) of the next child order. Rewards combine immediate execution cost with a terminal penalty on leftover inventory.`,
      `Production systems often constrain the RL agent to deviate only modestly from a classical schedule, combining the robustness of analytic baselines with the adaptability of learned policies.`

    keyPoint: "Order execution is one of the cleanest industrial applications of RL in finance: the horizon is finite, the objective is well-defined, and realistic simulators are feasible."

      `Researchers and practitioners can quickly spin up experiments on equities, crypto or portfolio allocation tasks, compare multiple algorithms under identical data and transaction-cost assumptions, and visualise results. The modular design encourages swapping reward functions, state features and risk constraints.`,

      `Financial environments violate many assumptions that make RL successful in games or robotics. The data-generating process is non-stationary: regimes shift, participants adapt, and regulatory or technological changes alter the rules. Policies trained on historical data can silently degrade.`,

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataArray = e.data || e.dual || [];
    const dataHtml = dataArray.length ? `
      <div class="data-strip">
        ${dataArray.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color || ''}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
