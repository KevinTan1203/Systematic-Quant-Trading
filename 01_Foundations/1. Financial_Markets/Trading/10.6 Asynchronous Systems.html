<!DOCTYPE html>

<head>

<title>Market Microstructure — 10.6 Asynchronous Systems</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f4f1eb;
    --bg2:       #ede9e0;
    --surface:   #ffffff;
    --surface2:  #faf8f4;
    --border:    #d8d2c4;
    --border2:   #c4bdb0;
    --ink:       #1c1814;

    --muted:     #7a7268;
    --faint:     #b0a898;
    --red:       #b03020;

    --teal-border:#b4ddd6;

    --slate-bg:  #f0f4f8;
    --slate-border:#b4c8dc;
    --accent:    #c04828;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    line-height: 1.75;
  }

  body::after {

  }

  .page {

    z-index: 1;
    max-width: 940px;
    margin: 0 auto;
    padding: 52px 40px 100px;
  }

  .book-header {
    margin-bottom: 44px;

    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;

  }

  .chapter-eyebrow {
    font-family: 'Space Mono', monospace;

    letter-spacing: 0.22em;

    margin-bottom: 10px;
  }

  .book-title {
    font-family: 'DM Serif Display', serif;

    letter-spacing: -0.02em;
  }

  .book-title em {
    font-style: italic;
    color: var(--accent);
  }

  .header-right {
    text-align: right;
    padding-bottom: 4px;
  }

  .header-stat {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.8;
    letter-spacing: 0.05em;
  }

  .header-stat strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 68px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;
  }

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
  }

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
  }

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;
  }

  .key-insight-text {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>
</head>

<script>
const entries = [
  {
    era: "Foundation",
    icon: "🔄",
    title: "Async I/O (asyncio in Python)",
    desc: "Writing concurrent code that waits for I/O without blocking the entire thread, using native language constructs",
    badge: { label: "Core", style: "teal" },
    tags: [["asyncio","teal"], ["async/await","amber"], ["Python",""], ["concurrency","slate"]],
    data: [
      { label: "Model", value: "Single-threaded concurrency", color: "teal" },
      { label: "Syntax", value: "async def / await", color: "" },
      { label: "Best for", value: "High-concurrency I/O-bound work", color: "amber" },
    ],
    body: [
      `Asynchronous I/O lets a program initiate an I/O operation (network read, file access, timer) and continue executing other work until the operation completes. In Python the standard library module asyncio, together with the async/await syntax, provides a structured way to write such code without explicit callbacks.`,
      `An async function is defined with async def and can suspend itself at await points. While it is suspended, the event loop runs other ready tasks. This yields high concurrency with a single thread, avoiding the memory and context-switch costs of one-thread-per-connection models.`,
      `Asyncio is particularly well suited to market-data handlers, order-gateway clients, and any service that maintains large numbers of simultaneous network connections. CPU-bound work still needs to be off-loaded to processes or thread pools.`
    ],
    keyPoint: "Async I/O turns waiting time into useful work. In I/O-heavy trading systems it is usually the most efficient way to handle thousands of concurrent connections on modest hardware."
  },
  {
    era: "Scheduler",
    icon: "🔁",
    title: "Event Loops",
    desc: "The central scheduler that polls for ready I/O events and dispatches the corresponding callbacks or coroutines",
    badge: { label: "Engine", style: "amber" },
    tags: [["event loop","amber"], ["select/poll/epoll","teal"], ["dispatcher",""], ["single-threaded","slate"]],
    data: [
      { label: "Role", value: "Poll → dispatch → repeat", color: "amber" },
      { label: "Mechanisms", value: "epoll, kqueue, IOCP", color: "" },
      { label: "Constraint", value: "Must not block inside handlers", color: "red" },
    ],
    body: [
      `An event loop is the heart of an asynchronous runtime. It continuously waits for file descriptors to become readable or writable (via epoll on Linux, kqueue on BSD/macOS, IOCP on Windows), then invokes the registered callbacks or resumes the corresponding coroutines.`,
      `Because the loop runs on a single thread, any blocking call inside a handler stalls the entire application. All I/O must therefore be non-blocking, and long-running computation must be delegated elsewhere.`,
      `Most modern async frameworks (asyncio, Node.js, Tokio, etc.) hide the raw polling details behind higher-level abstractions, but understanding the loop’s behaviour is essential for diagnosing latency spikes and designing back-pressure strategies.`
    ],
    keyPoint: "The event loop is a cooperative scheduler. It delivers excellent concurrency only when every participant yields promptly and never blocks."
  },
  {
    era: "Primitives",
    icon: "📡",
    title: "Non-Blocking I/O",
    desc: "Operating-system interfaces that return immediately instead of waiting for data or buffer space",
    badge: { label: "OS Level", style: "slate" },
    tags: [["non-blocking","slate"], ["O_NONBLOCK","teal"], ["EAGAIN",""], ["readiness","amber"]],
    data: [
      { label: "Behaviour", value: "Return immediately with EAGAIN/EWOULDBLOCK", color: "slate" },
      { label: "Pairing", value: "Must be used with readiness notification", color: "" },
      { label: "Benefit", value: "No thread blocked on slow peers", color: "teal" },
    ],
    body: [
      `A socket or file descriptor marked non-blocking causes read and write operations to return immediately when they cannot complete at once. Instead of sleeping, the call fails with EAGAIN or EWOULDBLOCK, signalling that the application should try again later.`,
      `Non-blocking mode is useless without a readiness notification mechanism (the event loop). Together they form the foundation of scalable network servers: the process never commits a thread to waiting for a slow client or a congested network.`,
      `In trading systems every market-data feed, order session and drop-copy connection is typically placed in non-blocking mode so that a single thread (or a small set of threads) can multiplex thousands of sockets.`
    ],
    keyPoint: "Non-blocking I/O is the operating-system primitive that makes high-concurrency event-driven designs possible. Without it, every slow peer would consume a scarce thread."
  },
  {
    era: "Abstractions",
    icon: "🧩",
    title: "Coroutines and Tasks",
    desc: "Lightweight, suspendable functions that let developers write sequential-looking code on top of an event loop",
    badge: { label: "Language", style: "teal" },
    tags: [["coroutines","teal"], ["tasks","amber"], ["await",""], ["structured concurrency","slate"]],
    data: [
      { label: "Coroutine", value: "Function that can suspend & resume", color: "teal" },
      { label: "Task", value: "Scheduled coroutine with lifecycle", color: "" },
      { label: "Advantage", value: "Readable async code without callbacks", color: "amber" },
    ],
    body: [
      `Coroutines are functions that can pause at well-defined points (await expressions) and later resume with their local state intact. They allow asynchronous logic to be written in a linear, almost synchronous style instead of nested callbacks.`,
      `A task is a coroutine that has been scheduled on the event loop. Tasks can be cancelled, awaited, or composed with gather/as_completed primitives. Structured concurrency libraries further ensure that child tasks are properly scoped and cleaned up.`,
      `In a trading gateway one typically spawns a task per session or per instrument stream. The resulting code remains readable while still multiplexing thousands of concurrent operations on a modest number of threads.`
    ],
    keyPoint: "Coroutines and tasks give the clarity of sequential code with the efficiency of event-driven I/O. They are the primary abstraction that makes large asynchronous systems maintainable."
  },
  {
    era: "Messaging",
    icon: "📢",
    title: "Pub/Sub Messaging Patterns",
    desc: "Decoupling producers and consumers so that events can be broadcast to any number of interested parties",
    badge: { label: "Pattern", style: "amber" },
    tags: [["pub/sub","amber"], ["decoupling","teal"], ["topics",""], ["fan-out","slate"]],
    data: [
      { label: "Publisher", value: "Emits events to a topic/channel", color: "" },
      { label: "Subscriber", value: "Receives only what it has subscribed to", color: "teal" },
      { label: "Benefit", value: "Loose coupling + easy fan-out", color: "amber" },
    ],
    body: [
      `In the publish/subscribe pattern, producers publish messages to named topics or channels without knowing who will receive them. Consumers subscribe to the topics they care about and receive a copy of each matching message. The broker or in-process bus handles the fan-out.`,
      `Pub/sub is ideal for market-data distribution, order-state updates, risk alerts and any situation where multiple independent components need the same stream of events. Adding a new consumer requires no change to the producer.`,
      `Care must be taken with durability, ordering guarantees and back-pressure; pure in-memory pub/sub can drop messages under overload, while durable brokers introduce their own latency and operational complexity.`
    ],
    keyPoint: "Pub/sub turns point-to-point wiring into a flexible event bus. It is the natural pattern for distributing market data and state changes across an asynchronous trading architecture."
  },
  {
    era: "Brokers",
    icon: "📬",
    title: "ZeroMQ, RabbitMQ, Kafka for Messaging",
    desc: "Three widely used messaging technologies that occupy different points on the latency–durability–throughput spectrum",
    badge: { label: "Tools", style: "slate" },
    tags: [["ZeroMQ","slate"], ["RabbitMQ","amber"], ["Kafka","teal"], ["messaging",""]],
    data: [
      { label: "ZeroMQ", value: "Embeddable, ultra-low latency", color: "slate" },
      { label: "RabbitMQ", value: "Traditional broker, flexible routing", color: "" },
      { label: "Kafka", value: "Durable log, high throughput", color: "teal" },
    ],
    body: [
      `ZeroMQ is a lightweight, embeddable library that provides socket-style patterns (pub/sub, push/pull, request/reply) with minimal latency and no central broker. It is popular inside latency-sensitive processes.`,
      `RabbitMQ is a full-featured message broker supporting complex routing, acknowledgements and multiple protocols (AMQP, MQTT, etc.). It excels when reliable delivery and flexible topologies matter more than microsecond latency.`,
      `Apache Kafka is a distributed, durable commit log designed for high-throughput event streaming. Consumers track their own offsets, making it ideal for audit trails, replayable market-data histories and inter-service event sourcing.`,
      `Trading systems often combine them: ZeroMQ or shared memory for the ultra-critical path, Kafka for durable downstream distribution, and RabbitMQ for workflow-style task queues.`
    ],
    keyPoint: "Choose the messaging tool according to the dominant requirement — raw speed (ZeroMQ), flexible routing (RabbitMQ), or durable high-volume streaming (Kafka). Most large systems use more than one."
  },
  {
    era: "Concurrency",
    icon: "⚖️",
    title: "Thread Pools vs. Async",
    desc: "Comparing classic multi-threading with event-driven asynchronous designs for I/O-bound and CPU-bound workloads",
    badge: { label: "Trade-off", style: "red" },
    tags: [["threads","red"], ["async","teal"], ["CPU-bound","amber"], ["I/O-bound",""]],
    data: [
      { label: "Threads", value: "Simple mental model, higher overhead", color: "red" },
      { label: "Async", value: "High concurrency, cooperative", color: "teal" },
      { label: "Hybrid", value: "Async for I/O + threads/processes for CPU", color: "amber" },
    ],
    body: [
      `Thread pools give each concurrent activity its own stack and allow blocking calls. They are straightforward to reason about but consume more memory and suffer from context-switch costs and contention when the number of threads grows large.`,
      `Asynchronous event-driven designs multiplex many logical tasks onto a few threads, achieving far higher connection counts with lower resource usage. The cost is that all code must be non-blocking and that CPU-intensive work can starve the event loop.`,
      `In practice the highest-performing trading systems are hybrid: an async front-end handles network I/O and orchestration, while CPU-bound pricing, risk or analytics kernels run on dedicated thread or process pools. The art lies in cleanly separating the two worlds and moving data between them efficiently.`
    ],
    compare: {
      left: { label: "Thread Pool", text: "Blocking I/O is fine. Easy to integrate legacy code. Scales poorly beyond a few hundred threads. Context switches and memory become bottlenecks." },
      right: { label: "Async / Event-Driven", text: "Excellent for massive I/O concurrency. Requires non-blocking discipline. CPU-bound work must be off-loaded. Lower resource footprint." }
    },
    keyPoint: "Threads and async are complementary, not rivals. Use async to master I/O concurrency; use threads or processes for true parallelism on CPU-bound work."
  },
  {
    era: "Flow Control",
    icon: "🚦",
    title: "Backpressure Handling",
    desc: "Mechanisms that prevent fast producers from overwhelming slow consumers or finite buffers",
    badge: { label: "Stability", style: "amber" },
    tags: [["backpressure","amber"], ["flow control","teal"], ["buffers",""], ["overload","red"]],
    data: [
      { label: "Problem", value: "Producer faster than consumer", color: "red" },
      { label: "Solutions", value: "Buffer limits, credit, drop, block", color: "" },
      { label: "Goal", value: "Bounded memory + predictable latency", color: "teal" },
    ],
    body: [
      `In any asynchronous pipeline a fast upstream can generate data faster than a downstream stage can process it. Without backpressure the intermediate queues grow without bound, memory is exhausted, and latency becomes unpredictable.`,
      `Common strategies include bounded buffers (block or drop when full), credit-based flow control, explicit reactive-streams signals, and load-shedding of low-priority messages. The correct choice depends on whether data loss is acceptable and on the latency sensitivity of the path.`,
      `Market-data handlers and order gateways are classic sites where backpressure must be designed in from the start; a burst of ticks or a flood of execution reports can otherwise bring the entire process to its knees.`
    ],
    keyPoint: "Backpressure is how an asynchronous system stays alive under overload. Bounded buffers and explicit flow-control signals turn potential catastrophic failure into graceful degradation."
  },
  {
    era: "Model",
    icon: "🎭",
    title: "Actor Model (Erlang/Elixir Patterns)",
    desc: "Isolated concurrent entities that communicate solely by asynchronous message passing and own their private state",
    badge: { label: "Paradigm", style: "teal" },
    tags: [["actor","teal"], ["Erlang","amber"], ["Elixir",""], ["supervision","slate"]],
    data: [
      { label: "Unit", value: "Actor = state + behaviour + mailbox", color: "teal" },
      { label: "Communication", value: "Async messages only", color: "" },
      { label: "Resilience", value: "Supervision trees & “let it crash”", color: "amber" },
    ],
    body: [
      `The actor model structures a system as a collection of independent actors. Each actor holds private state, processes messages from its mailbox one at a time, and can send messages to other actors or create new ones. There is no shared memory, eliminating an entire class of concurrency bugs.`,
      `Erlang and Elixir make actors (processes) extremely lightweight and provide supervision trees that automatically restart failed actors according to declared strategies. The “let it crash” philosophy converts many error-handling problems into simple process isolation and restart.`,
      `In trading infrastructure the actor style is attractive for session management, order-state machines and any component that must remain responsive while handling failures. Libraries in other languages (Akka, Orleans, etc.) bring similar patterns to the JVM and .NET ecosystems.`
    ],
    keyPoint: "The actor model replaces shared-state concurrency with isolated entities and message passing. Combined with supervision, it yields systems that are both highly concurrent and naturally resilient to partial failure."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
