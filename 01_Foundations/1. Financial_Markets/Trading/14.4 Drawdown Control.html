<title>Market Microstructure — 14.4 Drawdown Control</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {

    --bg2:       #ede9e0;

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;

  .book-header {
    margin-bottom: 44px;

  }

  .chapter-eyebrow {
    font-family: 'Space Mono', monospace;

    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .book-title {
    font-family: 'DM Serif Display', serif;

  }

  .book-title em {
    font-style: italic;

  }

  .header-right {
    text-align: right;

  }

  .header-stat {
    font-family: 'Space Mono', monospace;

  }

  .header-stat strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 78px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;
  }

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
  }

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
  }

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;
  }

  .key-insight-text {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  .note-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--slate-bg);
    border: 1px solid var(--slate-border);
    border-left: 3px solid var(--slate);
  }

  .note-box .note-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .note-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.65 !important;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Daily",
    icon: "📆",
    title: "Daily Loss Limits",
    desc: "Hard or soft caps on the maximum loss permitted in a single trading day, enforced at desk, strategy or firm level",
    badge: { label: "Foundation", style: "slate" },
    tags: [["daily limit","slate"], ["intraday","teal"], ["hard stop","red"], ["soft warning","amber"]],
    data: [
      { label: "Typical range", value: "0.5–2 % of capital / risk budget", color: "amber" },
      { label: "Enforcement", value: "Auto-flatten or manual review", color: "teal" },
      { label: "Purpose", value: "Contain single-day tail events", color: "slate" },
    ],
    body: [
      `A daily loss limit is the simplest and most widely used drawdown control. It defines the maximum P&L deterioration allowed from the start-of-day mark (or from the previous close) before trading is curtailed or halted. Limits may be expressed in currency, as a percentage of capital, or as a multiple of expected daily volatility.`,
      `Hard limits trigger automatic position reduction or full flattening once the threshold is breached; soft limits generate alerts and require explicit senior approval to continue. In practice most professional desks combine both: a soft warning at 60–70 % of the limit and a hard stop at 100 %.`,
      `Because markets can gap or liquidity can evaporate, the limit must be monitored continuously rather than only at the close. Real-time P&L engines, including unrealised marks and estimated liquidation costs, are required for the control to be meaningful.`
    ],
    keyPoint: "The daily loss limit is the first line of defence against a single catastrophic session. Its value lies less in the precise percentage chosen than in the discipline of pre-commitment and automatic enforcement."
  },
  {
    era: "Horizon",
    icon: "📅",
    title: "Weekly & Monthly Drawdown Limits",
    desc: "Multi-day and calendar-period loss ceilings that prevent a sequence of adverse days from compounding into an unacceptable cumulative drawdown",
    badge: { label: "Core", style: "amber" },
    tags: [["weekly limit","amber"], ["monthly limit","slate"], ["cumulative","teal"], ["period risk","red"]],
    data: [
      { label: "Weekly", value: "Often 1.5–3× daily limit", color: "amber" },
      { label: "Monthly", value: "Typically 3–6 % of capital", color: "slate" },
      { label: "Logic", value: "Cap path risk, not just single-day", color: "teal" },
    ],
    body: [
      `Daily limits alone cannot stop a strategy that loses a moderate amount every day for two weeks. Weekly and monthly drawdown limits address path risk by imposing ceilings on cumulative P&L over rolling or calendar windows. Breach of a weekly limit may reduce risk for the remainder of the week; breach of a monthly limit may suspend the strategy until the next period or until a formal review.`,
      `The limits are usually set relative to the strategy’s expected volatility and to the firm’s overall risk appetite. A high-Sharpe market-making book may be granted tighter percentage limits than a lower-Sharpe directional book, reflecting different return distributions.`,
      `Implementation requires clear rules for the reference high-water mark (start-of-week, start-of-month, or trailing peak) and for the treatment of intra-period recoveries. Ambiguity in these definitions is a common source of disputes between traders and risk managers.`
    ],
    keyPoint: "Weekly and monthly limits convert a sequence of individually tolerable daily losses into a hard cumulative constraint. They exist because ruin is more often the product of many medium losses than of one spectacular day."
  },
  {
    era: "Maximum",
    icon: "🛑",
    title: "Maximum Drawdown Stop",
    desc: "A hard ceiling on the peak-to-trough decline from the strategy’s or account’s historical high-water mark, beyond which trading is terminated or radically curtailed",
    badge: { label: "Critical", style: "red" },
    tags: [["max dd","red"], ["high-water mark","slate"], ["termination","red"], ["capital preservation","teal"]],
    data: [
      { label: "Typical level", value: "10–25 % from peak, strategy-dependent", color: "red" },
      { label: "Trigger", value: "Peak-to-trough ≥ limit", color: "amber" },
      { label: "Action", value: "Full or partial shutdown", color: "teal" },
    ],
    body: [
      `Maximum drawdown (MDD) is measured from the highest equity peak previously attained to the subsequent trough. An MDD stop declares that once this peak-to-trough loss reaches a pre-defined percentage, the strategy must stop, reduce risk to a minimal level, or enter a formal recovery protocol.`,
      `Unlike daily or monthly limits, the MDD stop is path-dependent and looks back across the entire life of the strategy (or from a reset date). It is therefore the ultimate capital-preservation brake. Many allocators and proprietary desks treat a breach of the MDD limit as an automatic termination event rather than a temporary pause.`,
      `Setting the level requires balancing the statistical likelihood of normal adverse excursions against the point at which further losses would threaten the franchise or the investor’s willingness to continue. Too tight a stop produces premature shutdowns; too loose a stop fails to protect capital when the edge has genuinely disappeared.`
    ],
    keyPoint: "The maximum-drawdown stop is the last line of defence. It acknowledges that beyond a certain peak-to-trough loss the priority shifts from ‘extract remaining edge’ to ‘preserve what capital is left’."
  },
  {
    era: "Scaling",
    icon: "📉",
    title: "Risk Scaling After Drawdown",
    desc: "Systematic reduction of position size or risk budget as a function of current drawdown depth, rather than an all-or-nothing stop",
    badge: { label: "Adaptive", style: "teal" },
    tags: [["risk scaling","teal"], ["de-levering","amber"], ["drawdown function","slate"], ["gradual","teal"]],
    data: [
      { label: "Method", value: "Size ∝ f(current DD / max DD)", color: "teal" },
      { label: "Benefit", value: "Smooth reduction, avoids cliff effects", color: "amber" },
      { label: "Recovery", value: "Scale back up only after sustained recovery", color: "slate" },
    ],
    body: [
      `Instead of waiting for a hard limit and then shutting down completely, many systems continuously scale risk as a decreasing function of current drawdown. A simple linear rule might run full size until a 5 % drawdown and then reduce size proportionally until a 15 % drawdown forces zero risk. Non-linear or step-function schedules are also common.`,
      `The rationale is both psychological and statistical. Gradual de-levering reduces the probability of hitting the ultimate MDD stop, keeps the strategy alive to recover, and prevents the “all-in then all-out” behaviour that amplifies losses near the limit. It also aligns the risk taken with the capital that remains.`,
      `Re-levering rules are equally important. Scaling back to full size only after the equity curve has recovered a defined fraction of the drawdown (or after a time-based cooling-off period) prevents the classic error of increasing size precisely when the strategy is still under stress.`
    ],
    keyPoint: "Risk scaling turns drawdown from a binary event into a continuous control variable. It is the practical compromise between ‘run at full risk until the stop’ and ‘never take meaningful risk again’."
  },
  {
    era: "Shutdown",
    icon: "🔌",
    title: "Drawdown-Triggered Strategy Shutdown",
    desc: "Pre-defined rules that suspend or permanently retire a strategy once cumulative losses breach a threshold, independent of daily or monthly limits",
    badge: { label: "Terminal", style: "red" },
    tags: [["shutdown","red"], ["strategy retirement","amber"], ["edge decay","slate"], ["governance","teal"]],
    data: [
      { label: "Trigger", value: "MDD or cumulative loss limit", color: "red" },
      { label: "Scope", value: "Single strategy or entire book", color: "amber" },
      { label: "Governance", value: "Requires formal re-approval to restart", color: "teal" },
    ],
    body: [
      `A drawdown-triggered shutdown is a governance mechanism, not merely a risk limit. When the pre-agreed loss threshold is reached, the strategy is automatically disabled, positions are flattened or hedged, and any restart requires explicit review by risk, research and senior management. The intent is to force a sober reassessment of whether the original edge still exists.`,
      `Shutdown rules protect against the well-documented behavioural bias of “averaging down” or “trading harder to recover.” They also protect the firm from the possibility that a previously profitable signal has undergone structural decay and is now a source of systematic losses.`,
      `Best practice records the exact conditions for shutdown in the strategy’s mandate document before live trading begins. Retroactive negotiation of limits after a large loss is a common failure mode of poorly governed trading operations.`
    ],
    keyPoint: "Automatic shutdown converts a painful loss into a forced diagnostic moment. It is the institutional answer to the question ‘at what point do we stop assuming the edge is still there?’"
  },
  {
    era: "Kelly",
    icon: "📐",
    title: "Kelly Fraction Reduction with Drawdown",
    desc: "Dynamically lowering the fraction of the theoretical Kelly stake as current drawdown increases, thereby reducing both leverage and path volatility",
    badge: { label: "Sizing", style: "amber" },
    tags: [["fractional kelly","amber"], ["drawdown-adjusted","teal"], ["leverage control","slate"], ["growth vs safety","red"]],
    data: [
      { label: "Base", value: "f = κ · f*_Kelly", color: "amber" },
      { label: "Adjustment", value: "κ decreases with current DD", color: "teal" },
      { label: "Effect", value: "Lower size when capital is impaired", color: "slate" },
    ],
    body: [
      `Even if a strategy is run at a fixed fractional Kelly (e.g., half-Kelly) under normal conditions, many practitioners further reduce the fraction once a material drawdown has occurred. The rationale is twofold: the remaining capital is more valuable (higher marginal utility of wealth), and parameter uncertainty is usually higher after a large adverse move.`,
      `A simple implementation multiplies the base Kelly fraction by a coefficient that declines linearly or convexly with drawdown depth. More sophisticated versions treat the reduction as the optimal policy under a utility function that penalises drawdowns or under a Bayesian update that lowers the estimated edge after losses.`,
      `The policy automatically de-leverages when the account is under stress and re-leverages only as equity recovers, providing a coherent link between the growth-optimal framework and practical capital preservation.`
    ],
    keyPoint: "Reducing the Kelly fraction in drawdown is the natural marriage of growth-optimal sizing with path-dependent risk aversion. It keeps the strategy in the market at a lower, safer stake rather than forcing a binary exit."
  },
  {
    era: "Volatility",
    icon: "📊",
    title: "Volatility-Adjusted Position Sizing",
    desc: "Scaling position size inversely with recent or forecast volatility so that each trade or the overall book targets a roughly constant risk contribution",
    badge: { label: "Standard", style: "teal" },
    tags: [["vol targeting","teal"], ["inverse vol","amber"], ["risk parity","slate"], ["normalisation","teal"]],
    data: [
      { label: "Rule", value: "Size ∝ 1 / σ̂", color: "teal" },
      { label: "Target", value: "Constant volatility or risk budget", color: "amber" },
      { label: "Benefit", value: "Stabilises P&L volatility across regimes", color: "slate" },
    ],
    body: [
      `Volatility-adjusted sizing is the workhorse of modern risk control. By making position size inversely proportional to an estimate of current volatility (historical, EWMA, GARCH, or implied), the strategy maintains a more stable risk profile across quiet and turbulent regimes. A market that has doubled in volatility automatically receives half the notional, keeping expected dollar risk roughly constant.`,
      `The same principle can be applied at the portfolio level (volatility targeting) or at the individual-asset level (risk-parity style weighting). In both cases the goal is to prevent the accidental concentration of risk that occurs when fixed-notional positions are held through a volatility spike.`,
      `Drawdown control and volatility adjustment reinforce each other: lower volatility estimates increase size only when markets are calm, while drawdown-based scaling further reduces size when cumulative losses have already mounted. Together they form a dual filter on risk-taking.`
    ],
    keyPoint: "Volatility-adjusted sizing is the simplest robust way to keep risk roughly constant when market conditions change. Without it, every fixed-size strategy is accidentally leveraged in high-volatility regimes—the precise moments when drawdowns accelerate."
  },
  {
    era: "Stops",
    icon: "🎯",
    title: "Stop-Loss Design",
    desc: "Rules that close or reduce a position once a pre-defined loss threshold is reached — fixed, trailing, or time-based variants",
    badge: { label: "Tactical", style: "amber" },
    tags: [["fixed stop","amber"], ["trailing stop","teal"], ["time stop","slate"], ["execution","red"]],
    data: [
      { label: "Fixed", value: "Absolute or % loss from entry", color: "amber" },
      { label: "Trailing", value: "Follows favourable excursion", color: "teal" },
      { label: "Time-based", value: "Exit after N days regardless of P&L", color: "slate" },
    ],
    body: [
      `A fixed stop-loss closes the position when the unrealised loss from the entry price reaches a pre-set amount or percentage. It is simple, transparent and easy to back-test, but it is vulnerable to noise and to being “picked off” in volatile markets. Placement must reflect both the strategy’s edge horizon and the typical noise range of the instrument.`,
      `A trailing stop moves the exit threshold in the direction of favourable price movement, locking in a portion of open profit while still capping the maximum give-back. It is particularly useful for trend-following systems. The trail distance can be a fixed percentage, a multiple of ATR, or a volatility-scaled quantity.`,
      `Time-based stops exit after a fixed holding period irrespective of P&L. They are appropriate when the informational edge is known to decay (e.g., event-driven or earnings-related trades) or when capital must be recycled. In practice the three types are often combined: a hard fixed stop for catastrophe protection, a trailing stop for profit retention, and a time stop for edge decay.`
    ],
    keyPoint: "Stop-loss design is the micro-level counterpart of portfolio drawdown control. The choice among fixed, trailing and time-based rules should be driven by the source and duration of the strategy’s edge, not by a generic ‘always use a stop’ heuristic."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
