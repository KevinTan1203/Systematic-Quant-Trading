<script>
const entries = [

    title: "Variance Swap Payoff",
    desc: "A direct exposure to realized variance, with payoff proportional to variance realized minus strike variance",

    body: [
      `A variance swap is a derivative whose payoff is driven by realized variance rather than the level of the asset. The basic cash payoff is:
      <div class="formula">(Realized Var − Strike Var) × Notional</div>
      where realized variance is the annualized variance of log returns over the contract period, and the strike variance is the fixed variance level agreed at inception. If realized variance exceeds the strike, the long variance swap receives a positive cash flow; if realized variance is below strike, the long position loses money.`,
      `This payoff is different from a plain vanilla option. A call or put is nonlinear in the underlying and has convexity with respect to the asset level. A variance swap is instead linear in realized variance, which makes it a more direct instrument for exposure to volatility as a state variable. The instrument effectively trades volatility, not directional market moves.`,
      `In practice, the realized variance is often computed from daily or intraday log returns using a specified convention, and the contract may include a model for the realized variance estimate, the sampling frequency, and settlement conventions. The notional determines the sensitivity of the cash settlement to each point of variance difference.`,
      `The striking feature is that variance swaps are especially useful for investors who want pure exposure to volatility without taking a strong view on direction. A long variance swap does not care whether the market goes up or down; it simply profits when volatility is higher than expected.`

      `The fair strike of a variance swap is the strike level for which the expected payoff is zero at inception. In a risk-neutral pricing framework, this is approximately the expected realized variance under the pricing measure:
      <div class="formula">K_var ≈ E^Q[RV]</div>

      `The reason this works is that the variance swap can be replicated, at least approximately, using a strip of options. The fair strike is therefore the value of variance that is consistent with option prices in the market. If the variance swap is quoted at a level above fair strike, the long side is rich; if below, it is cheap.`,
      `In practice, the fair strike is often computed using a log-contract or option replication approach. This relation implies that the variance swap’s strike is tightly linked to the implied variance surface and to the market’s distributional view of future volatility. Hence the fair strike is not arbitrary; it is the market-implied variance level consistent with option prices.`,

    body: [
      `The cornerstone of variance swap theory is the log contract. A log contract pays the log of the underlying relative to a fixed reference at maturity, and under continuous monitoring it is closely related to realized variance through the quadratic variation identity. More broadly, the variance swap can be seen as arising from a continuum of options across strikes, making the instrument a weighted integral of option prices.

      `The log-contract interpretation also explains how variance swaps are replicated in practice. A static portfolio of options across strikes can approximate the log contract and hence the variance swap payoff. This makes variance swap pricing highly linked to strike-by-strike option prices and to the shape of the implied-volatility curve.`,

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
