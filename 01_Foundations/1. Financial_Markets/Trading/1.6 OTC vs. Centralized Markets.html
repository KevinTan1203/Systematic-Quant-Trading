<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Markets — 1.6 OTC vs. Centralized Markets</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Fira+Code:wght@300;400;500&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #13161a;
    --bg2:          #191d22;
    --surface:      #1f2530;
    --surface2:     #252c38;
    --surface3:     #2a3342;
    --border:       #2e3848;
    --border2:      #3a4860;
    --ink:          #e8ecf2;
    --ink2:         #c0c8d8;
    --muted:        #6a7a92;
    --faint:        #3a4858;

    /* two-side colour language */
    --ex:           #3a9fd8;   /* exchange / centralised — blue */
    --ex-dim:       #1a4a6a;
    --ex-bg:        #0e1e2e;
    --ex-border:    #1e4060;

    --otc:          #e0a040;   /* OTC — amber */
    --otc-dim:      #7a5820;
    --otc-bg:       #1e1808;
    --otc-border:   #4a3010;

    --warn:         #d04040;
    --warn-bg:      #200e0e;
    --warn-border:  #5a1a1a;

    --ok:           #40a870;
    --ok-dim:       #1a4a30;
    --ok-bg:        #0a1e14;
    --ok-border:    #1a4830;

    --purple:       #9070d0;
    --purple-bg:    #16102a;
    --purple-border:#3a2a6a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    line-height: 1.7;
    min-height: 100vh;
  }

  /* subtle dot grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, var(--border) 1px, transparent 1px);
    background-size: 28px 28px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 980px;
    margin: 0 auto;
    padding: 52px 36px 100px;
  }

  /* ─── HEADER ─── */
  .book-header {
    margin-bottom: 44px;
  }

  .eyebrow {
    font-family: 'Fira Code', monospace;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .book-title {
    font-family: 'Spectral', serif;
    font-size: clamp(28px, 5vw, 50px);
    font-weight: 700;
    color: var(--ink);
    line-height: 1.08;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }

  /* the two-world pill banner */
  .world-banner {
    display: grid;
    grid-template-columns: 1fr 40px 1fr;
    gap: 0;
    border: 1px solid var(--border2);
    overflow: hidden;
    margin-bottom: 32px;
  }

  .world-pill {
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .world-pill.ex  { background: var(--ex-bg);  border-right: 1px solid var(--border2); }
  .world-pill.otc { background: var(--otc-bg); border-left:  1px solid var(--border2); }

  .world-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .world-dot.ex  { background: var(--ex); }
  .world-dot.otc { background: var(--otc); }

  .world-label {
    font-family: 'Fira Code', monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .world-pill.ex  .world-label { color: var(--ex); }
  .world-pill.otc .world-label { color: var(--otc); }

  .world-pill-desc {
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 1px;
  }

  .world-vs {
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 13px;
    color: var(--muted);
  }

  /* ─── CONTROLS ─── */
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Fira Code', monospace;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 6px 14px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.18s;
  }

  .ctrl-btn:hover {
    border-color: var(--ex);
    color: var(--ex);
    background: var(--ex-bg);
  }

  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    margin-left: auto;
  }

  .filter-chip {
    font-family: 'Fira Code', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-chip.all   { border-color: var(--border2); color: var(--muted); }
  .filter-chip.ex    { border-color: var(--ex-dim);  color: var(--ex); }
  .filter-chip.otc   { border-color: var(--otc-dim); color: var(--otc); }
  .filter-chip.both  { border-color: var(--faint);   color: var(--muted); }
  .filter-chip.active { opacity: 1; }
  .filter-chip:not(.active) { opacity: 0.45; }

  /* ─── ENTRY ─── */
  .entry {
    margin-bottom: 5px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }

  /* left accent stripe */
  .entry::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    transition: background 0.2s;
  }

  .entry[data-side="ex"]::before   { background: var(--ex-dim); }
  .entry[data-side="otc"]::before  { background: var(--otc-dim); }
  .entry[data-side="both"]::before { background: linear-gradient(to bottom, var(--ex-dim), var(--otc-dim)); }

  .entry.open[data-side="ex"]::before   { background: var(--ex); }
  .entry.open[data-side="otc"]::before  { background: var(--otc); }
  .entry.open[data-side="both"]::before { background: linear-gradient(to bottom, var(--ex), var(--otc)); }

  /* header */
  .entry-header {
    display: flex;
    align-items: center;
    gap: 0;
    padding: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 56px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-num {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    font-weight: 300;
    color: var(--faint);
    width: 42px;
    text-align: center;
    flex-shrink: 0;
    letter-spacing: 0.05em;
  }

  .entry-side-tag {
    width: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: stretch;
    align-self: stretch;
    border-right: 1px solid var(--border);
    margin-right: 16px;
  }

  .side-inner {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 8px 0;
  }

  .side-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }

  .entry[data-side="ex"]   .side-dot { background: var(--ex); }
  .entry[data-side="otc"]  .side-dot { background: var(--otc); }
  .entry[data-side="both"] .side-dot:first-child { background: var(--ex); }
  .entry[data-side="both"] .side-dot:last-child  { background: var(--otc); }

  .entry-titles {
    flex: 1;
    padding: 12px 0;
  }

  .entry-title {
    font-family: 'Spectral', serif;
    font-size: 16.5px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-subtitle {
    font-family: 'Fira Code', monospace;
    font-size: 9.5px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
  }

  .entry-meta-chips {
    display: flex;
    gap: 6px;
    padding-right: 12px;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 220px;
  }

  .meta-chip {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid;
    white-space: nowrap;
  }

  .chip-ex     { color: var(--ex);    border-color: var(--ex-dim);     background: var(--ex-bg); }
  .chip-otc    { color: var(--otc);   border-color: var(--otc-dim);    background: var(--otc-bg); }
  .chip-warn   { color: var(--warn);  border-color: var(--warn-border); background: var(--warn-bg); }
  .chip-ok     { color: var(--ok);    border-color: var(--ok-dim);     background: var(--ok-bg); }
  .chip-purple { color: var(--purple);border-color: var(--purple-border);background: var(--purple-bg); }
  .chip-dim    { color: var(--muted); border-color: var(--border2);    background: var(--bg2); }

  .entry-toggle {
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    color: var(--faint);
    width: 46px;
    text-align: center;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    border-left: 1px solid var(--border);
    flex-shrink: 0;
    transition: transform 0.25s, color 0.15s;
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--ex);
  }

  .entry[data-side="otc"].open .entry-toggle { color: var(--otc); }
  .entry[data-side="both"].open .entry-toggle { color: var(--ok); }

  /* ─── BODY ─── */
  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--bg2);
    padding: 22px 24px 26px 58px;
    animation: bIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bIn {
    from { opacity:0; transform:translateY(-4px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .entry-body p {
    font-family: 'Barlow', sans-serif;
    font-size: 13.5px;
    font-weight: 300;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 14px;
  }

  .entry-body p:last-of-type { margin-bottom: 0; }
  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  /* versus grid */
  .vs-grid {
    display: grid;
    grid-template-columns: 1fr 28px 1fr;
    gap: 0;
    margin-top: 18px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .vs-col {
    padding: 14px 16px;
  }

  .vs-col.ex  { background: var(--ex-bg); }
  .vs-col.otc { background: var(--otc-bg); }

  .vs-col-label {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .vs-col.ex  .vs-col-label { color: var(--ex); }
  .vs-col.otc .vs-col-label { color: var(--otc); }

  .vs-col p {
    font-size: 12.5px !important;
    line-height: 1.65 !important;
    margin-bottom: 0 !important;
  }

  .vs-divider {
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--muted);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* stat boxes */
  .stat-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .stat-box {
    flex: 1;
    min-width: 120px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 13px;
  }

  .stat-label {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .stat-value {
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.2;
  }

  .stat-value.ex     { color: var(--ex); }
  .stat-value.otc    { color: var(--otc); }
  .stat-value.warn   { color: var(--warn); }
  .stat-value.ok     { color: var(--ok); }
  .stat-value.purple { color: var(--purple); }

  /* key insight */
  .key-insight {
    margin-top: 20px;
    padding: 14px 18px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    position: relative;
    overflow: hidden;
  }

  .key-insight::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, var(--ex), var(--otc));
  }

  .key-insight-label {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .key-insight-text {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 14.5px;
    color: var(--ink);
    line-height: 1.62;
  }

  /* flow diagram */
  .flow {
    display: flex;
    align-items: center;
    gap: 0;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .flow-node {
    padding: 8px 13px;
    border: 1px solid var(--border2);
    background: var(--surface);
    font-family: 'Fira Code', monospace;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--ink2);
    white-space: nowrap;
  }

  .flow-node.ex     { border-color: var(--ex-dim);     background: var(--ex-bg);     color: var(--ex); }
  .flow-node.otc    { border-color: var(--otc-dim);    background: var(--otc-bg);    color: var(--otc); }
  .flow-node.warn   { border-color: var(--warn-border);background: var(--warn-bg);   color: var(--warn); }
  .flow-node.ok     { border-color: var(--ok-dim);     background: var(--ok-bg);     color: var(--ok); }
  .flow-node.purple { border-color: var(--purple-border);background: var(--purple-bg);color: var(--purple); }

  .flow-arrow {
    font-family: 'Fira Code', monospace;
    font-size: 12px;
    color: var(--faint);
    padding: 0 6px;
  }

  /* tags */
  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Fira Code', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: transparent;
  }

  .tag.ex     { border-color: var(--ex-dim);      color: var(--ex); }
  .tag.otc    { border-color: var(--otc-dim);     color: var(--otc); }
  .tag.warn   { border-color: var(--warn-border); color: var(--warn); }
  .tag.ok     { border-color: var(--ok-dim);      color: var(--ok); }
  .tag.purple { border-color: var(--purple-border);color: var(--purple); }

  /* footer */
  .foot-divider {
    height: 1px;
    background: var(--border);
    margin: 60px 0 18px;
    position: relative;
  }

  .foot-divider::before,
  .foot-divider::after {
    content: '';
    position: absolute;
    top: -3px;
    width: 7px;
    height: 7px;
    background: var(--border2);
    transform: rotate(45deg);
  }

  .foot-divider::before { left: 0; }
  .foot-divider::after  { right: 0; }

  .footer-note {
    font-family: 'Fira Code', monospace;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 28px 16px 60px; }
    .entry-body { padding-left: 16px; }
    .world-banner { grid-template-columns: 1fr; }
    .world-vs { display: none; }
    .vs-grid { grid-template-columns: 1fr; }
    .vs-divider { display: none; }
    .entry-meta-chips { display: none; }
    .filter-row { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="book-header">
    <div class="eyebrow">Chapter 1 · Section 1.6</div>
    <h1 class="book-title">OTC vs. Centralized<br>Markets</h1>

    <div class="world-banner">
      <div class="world-pill ex">
        <div class="world-dot ex"></div>
        <div>
          <div class="world-label">Exchange / Centralized</div>
          <div class="world-pill-desc">Standardized · Public · CCP-cleared · Regulated venue</div>
        </div>
      </div>
      <div class="world-vs">vs</div>
      <div class="world-pill otc">
        <div class="world-dot otc"></div>
        <div>
          <div class="world-label">Over-the-Counter (OTC)</div>
          <div class="world-pill-desc">Bespoke · Bilateral · Private · Counterparty credit risk</div>
        </div>
      </div>
    </div>
  </header>

  <div class="controls">
    <button class="ctrl-btn" onclick="toggleAll(true)">Expand All</button>
    <button class="ctrl-btn" onclick="toggleAll(false)">Collapse All</button>
    <div class="filter-row">
      <span style="font-family:'Fira Code',monospace;font-size:9px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;">filter:</span>
      <button class="filter-chip all active" onclick="filterEntries('all',this)">All</button>
      <button class="filter-chip ex" onclick="filterEntries('ex',this)">Exchange</button>
      <button class="filter-chip otc" onclick="filterEntries('otc',this)">OTC</button>
      <button class="filter-chip both" onclick="filterEntries('both',this)">Both</button>
    </div>
  </div>

  <div id="entries-root"></div>

  <div class="foot-divider"></div>
  <div class="footer-note">
    <span>Financial Markets · Revision Notes</span>
    <span>1.6 OTC vs. Centralized Markets</span>
  </div>
</div>

<script>
const entries = [
  {
    side: "both",
    title: "Centralized Exchanges vs. OTC Markets",
    subtitle: "The fundamental structural divide in financial markets",
    chips: [{ label: "Foundational", style: "dim" }, { label: "Core concept", style: "ok" }],
    tags: [["exchanges","ex"], ["OTC","otc"], ["structure",""], ["counterparty risk","warn"]],
    stats: [
      { label: "Global exchange equity mkt cap", value: "$100T+", color: "ex" },
      { label: "OTC derivatives notional", value: "~$700T gross", color: "otc" },
      { label: "OTC FX daily volume", value: "$7.5T/day", color: "otc" },
    ],
    vs: {
      left:  { label: "Centralized Exchange", text: "Standardized contracts. Central order book. Anonymous counterparties. CCP guarantees settlement. Regulated venue with mandatory disclosure. Price is public and continuous. Margin requirements enforced by CCP." },
      right: { label: "OTC Market", text: "Bespoke terms negotiated directly. Bilateral relationship. Counterparty credit risk is real — you are exposed to your counterparty's default. Terms are private. Price discovery is fragmented across dealers. Collateral negotiated in ISDA/CSA." }
    },
    body: [
      `Financial markets split fundamentally into two structural models. <em>Centralized exchanges</em> are organized venues — NYSE, NASDAQ, CME — where standardized instruments trade via a central order book, with a Central Counterparty Clearing House (CCP) guaranteeing settlement and eliminating bilateral credit risk. Prices are public; every participant sees the same quotes; trading is anonymous. The exchange is the trusted third party that makes anonymous transactions safe.`,
      `<em>Over-the-counter (OTC) markets</em> operate without a central venue. Two parties — typically a bank and a client, or two banks — negotiate directly, agreeing on bespoke terms: notional amount, maturity, coupon structure, collateral arrangements. There is no central order book. "Price discovery" happens through dealer quotes, broker screens, and negotiation rather than open auction. Critically, each party faces the credit risk of the other — if your counterparty defaults before settlement, you may be left with an uncovered exposure. OTC markets are vast: the global OTC derivatives market has a gross notional value exceeding $700 trillion, dwarfing exchange-listed markets.`,
      `The trade-off between models is not purely one of risk. OTC markets exist because standardization has limits. A corporation wanting an interest rate swap with a precise notional amount, exact start and end date, and a bespoke floating rate reference cannot find an exchange-listed futures contract that matches its exposure perfectly. The flexibility of bilateral negotiation — the ability to customize every parameter — is precisely why OTC markets handle the majority of derivatives, FX, and fixed income volume globally. The costs are counterparty risk, opacity, and the systemic fragility revealed catastrophically in 2008.`
    ],
    keyPoint: "The exchange vs. OTC distinction is not about which is 'better' — it is about the trade-off between standardization and flexibility. Exchanges eliminate counterparty risk through standardization; OTC markets accept that risk to preserve the ability to tailor financial instruments precisely to user needs."
  },
  {
    side: "otc",
    title: "OTC Derivatives — Interest Rate Swaps & CDS",
    subtitle: "The instruments at the heart of the 2008 crisis — and post-crisis reform",
    chips: [{ label: "Derivatives", style: "otc" }, { label: "Systemic risk", style: "warn" }],
    tags: [["IRS","otc"], ["CDS","warn"], ["notional",""], ["2008","warn"], ["bilateral","otc"]],
    stats: [
      { label: "IRS gross notional outstanding", value: "~$500T", color: "otc" },

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');

  entries.forEach((e, i) => {
    const idx = counter++;
    const side = e.side;

    // side dots
    const dotsHtml = side === 'both'
      ? `<div class="side-inner"><div class="side-dot"></div><div class="side-dot"></div></div>`
      : `<div class="side-inner"><div class="side-dot"></div></div>`;

    // chips
    const chipsHtml = (e.chips || []).map(c =>
      `<span class="meta-chip chip-${c.style}">${c.label}</span>`
    ).join('');

    // tags
    const tagsHtml = (e.tags || []).map(([l, s]) =>
      `<span class="tag ${s}">${l}</span>`
    ).join('');

    // stats
    const statsHtml = e.stats ? `
      <div class="stat-row">
        ${e.stats.map(s => `
          <div class="stat-box">
            <div class="stat-label">${s.label}</div>
            <div class="stat-value ${s.color}">${s.value || ''}</div>
          </div>
        `).join('')}
      </div>` : '';

    // flow
    const flowHtml = e.flow ? `
      <div class="flow">
        ${e.flow.map(f => f.label === '→' || f.label.includes('←') || f.label.includes('→')
          ? `<span class="flow-arrow">${f.label}</span>`
          : `<span class="flow-node ${f.style}">${f.label}</span>`
        ).join('')}
      </div>` : '';

    // vs grid
    const vsHtml = e.vs ? `
      <div class="vs-grid">
        <div class="vs-col ex">
          <div class="vs-col-label">${e.vs.left.label}</div>
          <p>${e.vs.left.text}</p>
        </div>
        <div class="vs-divider">vs</div>
        <div class="vs-col otc">
          <div class="vs-col-label">${e.vs.right.label}</div>
          <p>${e.vs.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      vsHtml + flowHtml + statsHtml +
      `<div class="key-insight">
        <div class="key-insight-label">Key insight</div>
        <div class="key-insight-text">${e.keyPoint}</div>
      </div>` +
      `<div class="tags">${tagsHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.setAttribute('data-side', side);
    div.innerHTML = `
      <div class="entry-header" onclick="toggle(${idx})">
        <span class="entry-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="entry-side-tag">${dotsHtml}</div>
        <div class="entry-titles">
          <div class="entry-title">${e.title}</div>
          <div class="entry-subtitle">${e.subtitle}</div>
        </div>
        <div class="entry-meta-chips">${chipsHtml}</div>
        <span class="entry-toggle">▶</span>
      </div>
      <div class="entry-body">${bodyHtml}</div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

function filterEntries(side, btn) {
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (!el) continue;
    const es = el.getAttribute('data-side');
    el.style.display = (side === 'all' || es === side) ? '' : 'none';
  }
}

renderAll();
</script>
</body>
</html>
