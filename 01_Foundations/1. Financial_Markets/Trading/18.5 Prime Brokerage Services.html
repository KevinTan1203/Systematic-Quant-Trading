<head>

<title>Market Microstructure — 18.5 Prime Brokerage Services</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #f4f1eb;
    --bg2:       #ede9e0;
    --surface:   #ffffff;
    --surface2:  #faf8f4;
    --border:    #d8d2c4;
    --border2:   #c4bdb0;
    --ink:       #1c1814;
    --ink2:      #3a342c;
    --muted:     #7a7268;
    --faint:     #b0a898;
    --red:       #b03020;
    --red-bg:    #fdf2f0;
    --red-border:#e8c4be;
    --teal:      #1a6b5a;
    --teal-bg:   #f0f8f6;
    --teal-border:#b4ddd6;
    --amber:     #9a6010;
    --amber-bg:  #fdf6e8;
    --amber-border:#e8d4a4;
    --slate:     #2a4a6a;
    --slate-bg:  #f0f4f8;
    --slate-border:#b4c8dc;
    --accent:    #c04828;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    font-size: 15px;

  body::after {
    content: '';
    position: fixed;

    pointer-events: none;
    z-index: 0;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 940px;
    margin: 0 auto;

  }

  .book-header {
    margin-bottom: 44px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 22px;
  }

  .chapter-eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .book-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(30px, 5vw, 52px);
    color: var(--ink);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }

  .book-title em {
    font-style: italic;
    color: var(--accent);
  }

  .header-right {
    text-align: right;
    padding-bottom: 4px;
  }

  .header-stat {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    line-height: 1.8;
    letter-spacing: 0.05em;
  }

  .header-stat strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 78px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;
  }

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
  }

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
  }

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;
  }

  .key-insight-text {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  .note-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--slate-bg);
    border: 1px solid var(--slate-border);
    border-left: 3px solid var(--slate);
  }

  .note-box .note-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .note-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.65 !important;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

    <div>

<script>
const entries = [
  {
    era: "Margin",
    icon: "💳",
    title: "Margin Financing and Leverage",
    desc: "The core PB product: extending credit against eligible long and short positions so the fund can run gross exposure well above its equity",
    badge: { label: "Foundation", style: "slate" },
    tags: [["margin","slate"], ["leverage","amber"], ["financing","teal"], ["haircut","red"]],
    data: [
      { label: "Mechanism", value: "Borrow vs. pledged portfolio collateral", color: "slate" },
      { label: "Limits", value: "Haircuts, concentration, stress scenarios", color: "amber" },
      { label: "Cost", value: "Spread over benchmark + utilisation fees", color: "teal" },
    ],
    body: [
      `Prime brokers finance long positions and the margin requirement on shorts by taking a security interest in the fund’s portfolio. Regulatory and house margin models assign haircuts by asset class, liquidity, and concentration; the residual equity is the fund’s true loss-absorbing capital.`,
      `Leverage is therefore not a single number the PM chooses freely — it is the outcome of PB methodology, cross-margining, and lock-up or term-funding agreements. In stress, haircuts gap wider and financing can be cut, forcing deleveraging at the worst time.`,
      `Negotiating margin schedules, portfolio margining, and committed facilities is a first-order P&L and survival issue for leveraged strategies.`
    ],
    keyPoint: "PB margin financing is the balance sheet behind hedge-fund leverage. Strategy capacity lives and dies inside the broker’s haircut model."
  },
  {
    era: "Stock Loan",
    icon: "📉",
    title: "Securities Lending for Shorts",
    desc: "Locating and borrowing shares (or other securities) so the fund can sell short, maintain the short, and manage recalls and specials",
    badge: { label: "Core Product", style: "teal" },
    tags: [["securities lending","teal"], ["locate","amber"], ["hard to borrow","red"], ["recall","slate"]],
    data: [
      { label: "Flow", value: "Locate → borrow → sell short → maintain", color: "teal" },
      { label: "Pricing", value: "General collateral vs. specials rates", color: "amber" },
      { label: "Risk", value: "Recall, buy-in, rate spikes", color: "red" },
    ],
    body: [
      `Short selling requires a borrow. The PB’s securities-lending desk sources stock from custodians, beneficial owners, and internal inventory, provides locates pre-trade, and bills a borrow fee that soars when the name is “special.”`,
      `Operational risk is material: recalls force covers; failed locates block entry; corporate actions complicate life cycle. Multi-PB setups improve locate coverage but fragment inventory and reporting.`,
      `For quant and fundamental short books, stable access to borrow and transparent rate forecasts are as important as the alpha model itself.`
    ],
    keyPoint: "Securities lending is the permission structure for short alpha. Without reliable locate and fair specials pricing, the short book is optional in theory and constrained in practice."
  },
  {
    era: "Cap Intro",
    icon: "🤝",
    title: "Capital Introduction",
    desc: "The PB’s franchise of connecting emerging and established managers with allocators — a non-balance-sheet service that deepens the client relationship",
    badge: { label: "Franchise", style: "amber" },
    tags: [["capital introduction","amber"], ["fundraising","teal"], ["allocator network","slate"], ["relationship","teal"]],
    data: [
      { label: "Service", value: "Intros to pensions, FOFs, family offices, consultants", color: "amber" },
      { label: "Value", value: "Accelerates raise for approved managers", color: "teal" },
      { label: "Limit", value: "Not a placement agent; no guaranteed capital", color: "slate" },
    ],
    body: [
      `Capital introduction teams host conferences, run one-to-one meetings, and share manager profiles with institutional LPs. For start-ups and mid-sized funds, PB cap intro can be a decisive distribution channel; for the broker, it anchors custody and financing wallets.`,
      `The service is relationship-driven and selective — brokers prioritise clients who clear compliance and fit allocator demand. It is not underwriting and typically does not include formal fundraising mandates.`,
      `Managers should treat cap intro as a complement to their own IR process, not a substitute for a coherent product and track record.`
    ],
    keyPoint: "Capital introduction monetises the PB’s allocator network for the manager’s growth. It is soft power in the prime relationship — valuable, optional, and never a promise of AUM."
  },
  {
    era: "Analytics",
    icon: "📊",
    title: "Risk Analytics Platform",
    desc: "PB-provided tools for portfolio risk, margin estimation, stress tests, and exposure reporting — often the daily cockpit alongside internal systems",
    badge: { label: "Tools", style: "teal" },
    tags: [["risk analytics","teal"], ["margin estimate","amber"], ["stress","slate"], ["reporting","teal"]],
    data: [
      { label: "Features", value: "VaR, Greeks, what-if margin, scenario P&L", color: "teal" },
      { label: "Audience", value: "PMs, risk, COO, operations", color: "amber" },
      { label: "Caveat", value: "House model ≠ your internal risk view", color: "red" },
    ],
    body: [
      `Modern primes offer web and API platforms that show positions, financing, stock-loan status, estimated margin, and stress outcomes under the broker’s rules. What-if tools let managers test trades before sending them into a margin breach.`,
      `These systems are essential for multi-strategy and multi-PB firms that need a consolidated operational view. They do not replace independent risk management: PB analytics optimise for the broker’s credit lens, not necessarily for the fund’s economic risk.`,
      `Integration quality — data latency, export, reconciliation to the administrator — separates usable platforms from glossy portals.`
    ],
    keyPoint: "PB risk analytics are the broker’s window into your book and your window into the broker’s constraints. Use them daily; never confuse them with full risk truth."
  },
  {
    era: "Synthetic",
    icon: "🔄",
    title: "Synthetic Prime Brokerage (TRS)",
    desc: "Gaining long or short economic exposure via total-return swaps instead of cash securities — financing and shorting packaged as OTC derivatives",
    badge: { label: "Structure", style: "amber" },
    tags: [["synthetic pb","amber"], ["total return swap","teal"], ["otc","slate"], ["efficiency","teal"]],
    data: [
      { label: "Instrument", value: "TRS / CFD-style exposure vs. equity or index", color: "teal" },
      { label: "Why use", value: "Balance-sheet, tax, operational, hard-to-borrow", color: "amber" },
      { label: "Risks", value: "Counterparty, CSA margin, corporate actions", color: "red" },
    ],
    body: [
      `Under synthetic prime, the fund does not hold the cash equity. It enters a total return swap with the dealer: receive performance of the long (or pay performance of the short), pay or receive a financing leg, and post collateral under a CSA. Economically similar to a financed cash book; legally a derivatives credit relationship.`,
      `Synthetics can improve access to restricted names, simplify operations across regions, or optimise regulatory capital. They concentrate counterparty risk on the swap dealer and require robust ISDA documentation and operational booking.`,
      `Pricing of the financing leg and dividend treatment determines whether synthetic is cheaper or dearer than cash PB for a given name.`
    ],
    keyPoint: "Synthetic PB is leverage and shorting delivered through TRS. Same economic ambition as classic prime — different credit, margin, and operational pipes."
  },
  {
    era: "PoA",
    icon: "🔒",
    title: "Persistence of Assets (PoA) Agreements",
    desc: "Arrangements that improve the fund’s claim on assets held at the prime — addressing rehypothecation, segregation, and what remains available if the broker fails",
    badge: { label: "Legal", style: "red" },
    tags: [["poa","red"], ["segregation","teal"], ["rehypothecation","amber"], ["custody risk","red"]],
    data: [
      { label: "Concern", value: "PB failure / rehypothecation of client assets", color: "red" },
      { label: "Tools", value: "Segregation, limits on repledge, contractual PoA", color: "teal" },
      { label: "Trade-off", value: "Safer custody vs. cheaper financing", color: "amber" },
    ],
    body: [
      `In classic prime brokerage, customer securities may be rehypothecated to fund the broker’s business, subject to law and agreement. Persistence-of-assets and enhanced segregation terms aim to keep more of the fund’s property clearly identified and recoverable in insolvency — a lesson reinforced by historical prime failures.`,
      `Stronger protection can mean higher financing costs or reduced leverage, because the broker’s balance-sheet use of the assets is constrained. Legal form varies by jurisdiction (e.g. US customer-protection rules vs. English-law structures).`,
      `Institutional LPs and operational DD teams increasingly ask how assets are held, what is rehypothecated, and what the recovery waterfall looks like.`
    ],
    keyPoint: "PoA and segregation terms answer: if the prime breaks, what do we still own? Financing cheapness that ignores that question is incomplete analysis."
  },
  {
    era: "Portability",
    icon: "📦",
    title: "Portability of Positions",
    desc: "The ability to move positions, collateral, and financing from one prime to another without liquidating the portfolio — critical in multi-PB and stress transfers",
    badge: { label: "Operations", style: "slate" },
    tags: [["portability","slate"], ["multi-pb","teal"], ["transfer","amber"], ["continuity","teal"]],
    data: [
      { label: "Goal", value: "Bulk transfer of book without full unwind", color: "teal" },
      { label: "Enablers", value: "Data standards, dual booking, legal pre-work", color: "amber" },
      { label: "When it matters", value: "PB stress, renegotiation, diversification", color: "red" },
    ],
    body: [
      `Portability is the operational opposite of lock-in. Funds that can migrate longs, shorts, and swaps between primes preserve strategy continuity when terms worsen, when a broker retrenches, or when risk wants diversification.`,
      `True portability requires clean position data, compatible legal docs, coordinated stock-loan transfers, and often temporary dual running. Synthetic books need parallel ISDAs and careful novation or unwind-and-recast processes.`,
      `Managers discover too late that “we can always move” was theoretical. Testing transfer playbooks in peacetime is part of resilience.`
    ],
    keyPoint: "Portability is an option on survival. A book that can only live at one prime is financed capacity with a single point of failure."
  },
  {
    era: "Credit",
    icon: "📏",
    title: "Prime Brokerage Credit Lines",
    desc: "The size, tenor, and conditions of the credit the PB extends — uncommitted call facilities versus term locks, covenants, and dynamic limits",
    badge: { label: "Credit", style: "red" },
    tags: [["credit line","red"], ["committed facility","teal"], ["margin call","amber"], ["covenant","slate"]],
    data: [
      { label: "Uncommitted", value: "Broker may reduce financing on short notice", color: "amber" },
      { label: "Committed / term", value: "More certainty; higher cost / covenants", color: "teal" },
      { label: "Dynamics", value: "Limits move with NAV, volatility, ratings", color: "red" },
    ],
    body: [
      `A PB credit line is not a static loan amount. It is a framework of maximum leverage, eligible collateral, and rights to make margin calls or cut advance rates. Many facilities are uncommitted: convenient in calm markets, fragile when the broker’s own risk appetite collapses.`,
      `Term lock-ups and committed lines buy time through stress at a price — fees, tighter covenants, or exclusivity. Large funds negotiate grids that scale with NAV and explicit notice periods for adverse changes.`,
      `Credit-line management sits with the COO/CFO and risk: utilisation buffers, multi-PB headroom, and scenario planning for simultaneous haircut increases across brokers.`
    ],
    keyPoint: "PB credit lines define how much market risk the fund is allowed to warehouse. Uncommitted leverage is rented confidence — review the recall terms before you need them."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
