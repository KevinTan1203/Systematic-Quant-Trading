<style>

  .timeline::before {

    bottom: 8px;

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;

    border: 2px solid var(--border2);

  .entry.open::before {

    border-color: var(--accent);

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);

  .entry-header {

  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);

  .data-strip {
    margin-top: 16px;

    flex-wrap: wrap;

  .data-cell:last-child { border-right: none; }

  .data-cell-label {

  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;

  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }

  .tags {

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }

  .controls {

  .ctrl-btn:hover {

  .foot-rule {

  }

  .footer-note {

  .note-box {
    margin-top: 16px;

  .note-box .note-label {
    font-family: 'Space Mono', monospace;

  }

  .note-box p {
    font-size: 12.5px !important;

  @media (max-width: 640px) {

    .timeline { padding-left: 24px; }

    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }

</style>

<script>
const entries = [
  {
    era: "Gross",
    icon: "📐",
    title: "Gross Exposure Limits",
    desc: "Caps on the sum of absolute long and short positions, measuring total footprint irrespective of directional netting",
    badge: { label: "Foundation", style: "slate" },
    tags: [["gross exposure","slate"], ["long + short","amber"], ["footprint","teal"], ["leverage proxy","red"]],
    data: [
      { label: "Definition", value: "Σ |notional| or Σ |market value|", color: "slate" },
      { label: "Ignores", value: "Offsetting long/short positions", color: "amber" },
      { label: "Use", value: "Control total market footprint & leverage", color: "teal" },
    ],
    body: [
      `Gross exposure is the sum of the absolute values of all long and short positions. A book that is $100 m long and $80 m short has a gross exposure of $180 m even though its net exposure is only $20 m. The measure therefore captures the total size of the footprint the portfolio places on the market.`,
      `Gross limits are the primary defence against excessive leverage and against the accumulation of large offsetting positions that may appear low-risk in normal markets but become dangerous when correlations break or when both sides must be liquidated simultaneously. They also constrain the operational and prime-brokerage capacity the firm consumes.`,
      `In practice gross limits are set relative to capital or to risk capital and are monitored in real time. Breach typically forces immediate reduction of the larger side or of both sides until the sum of absolutes falls back inside the ceiling.`
    ],
    keyPoint: "Gross exposure answers ‘how much total position does the firm have in the market?’ It deliberately ignores netting so that the true scale of activity and the associated operational and liquidity risk remain visible."
  },
  {
    era: "Net",
    icon: "⚖️",
    title: "Net Exposure Limits",
    desc: "Caps on the difference between long and short positions, measuring residual directional or factor bias after netting",
    badge: { label: "Core", style: "teal" },
    tags: [["net exposure","teal"], ["directional","amber"], ["beta","slate"], ["residual risk","red"]],
    data: [
      { label: "Definition", value: "Long − Short (signed)", color: "teal" },
      { label: "Captures", value: "Residual market or factor tilt", color: "amber" },
      { label: "Complement", value: "Always paired with gross limits", color: "slate" },
    ],
    body: [
      `Net exposure is the algebraic sum of long and short positions. It quantifies the portfolio’s residual directional bet after offsets. A market-neutral book targets net exposure near zero; a long-biased book deliberately maintains a positive net. Limits on net exposure therefore constrain how far the portfolio may deviate from its intended neutrality or bias.`,
      `Net limits are usually expressed in currency, as a percentage of capital, or as a beta-adjusted or factor-adjusted equivalent. In multi-factor books separate net limits may be applied to each major risk factor (equity beta, duration, credit spread, etc.).`,
      `Because netting can mask large gross positions, net limits alone are never sufficient. They must operate alongside gross limits; otherwise a book can accumulate enormous offsetting risks while remaining inside a modest net ceiling.`
    ],
    keyPoint: "Net exposure measures the residual directional or factor bet that survives after longs and shorts offset. It is meaningful only when gross exposure is simultaneously controlled; otherwise netting creates an illusion of low risk."
  },
  {
    era: "Sector",
    icon: "🏢",
    title: "Sector / Country / Factor Limits",
    desc: "Concentration ceilings applied to industry groups, geographic regions or systematic risk factors to prevent over-allocation to any single theme",
    badge: { label: "Diversification", style: "amber" },
    tags: [["sector limits","amber"], ["country","slate"], ["factor limits","teal"], ["concentration","red"]],
    data: [
      { label: "Sector", value: "Max % of portfolio in one industry", color: "amber" },
      { label: "Country", value: "Max exposure to single jurisdiction", color: "slate" },
      { label: "Factor", value: "Max risk contribution from one factor", color: "teal" },
    ],
    body: [
      `Sector, country and factor limits exist to enforce diversification at the level where correlations are highest. A portfolio that is within overall gross and net limits can still be catastrophically concentrated in a single industry, a single emerging-market country, or a single systematic factor such as momentum or credit spread.`,
      `Limits may be defined on absolute exposure, on risk-weighted exposure, or on the marginal contribution to portfolio volatility or CVaR. Factor limits are especially important in quantitative and multi-strategy books where seemingly unrelated positions can load heavily on the same underlying driver.`,
      `Breach handling usually requires reducing the offending bucket rather than the entire book. The limits themselves should be reviewed periodically; a static sector map can become obsolete as industries converge or as new countries enter the investable universe.`
    ],
    keyPoint: "Sector, country and factor limits are the practical expression of ‘do not put too many eggs in one correlated basket.’ They catch concentrations that aggregate gross and net limits systematically miss."
  },
  {
    era: "Single-Name",
    icon: "👤",
    title: "Single-Name Concentration Limits",
    desc: "Hard caps on the maximum exposure to any individual security or issuer, protecting against idiosyncratic blow-ups",
    badge: { label: "Critical", style: "red" },
    tags: [["single-name","red"], ["idiosyncratic","amber"], ["name limit","slate"], ["blow-up protection","teal"]],
    data: [
      { label: "Typical level", value: "1–5 % of portfolio or capital", color: "red" },
      { label: "Applies to", value: "Each distinct security / ticker", color: "amber" },
      { label: "Rationale", value: "Bound the damage from one name failing", color: "teal" },
    ],
    body: [
      `Single-name limits restrict the size of any one position relative to the portfolio or to capital. They are the most granular form of concentration control and exist because even a well-diversified book can be crippled by the sudden collapse of a single large holding.`,
      `The limit is usually expressed as a percentage of net asset value, of risk capital, or of a volatility- or liquidity-adjusted capacity measure. For less liquid names the effective limit is often tighter than for highly liquid large-caps, reflecting both price-impact and exit-time considerations.`,
      `Enforcement must be real-time and must survive corporate actions (spin-offs, mergers, ticker changes) that can cause an existing position to exceed the limit overnight. Automatic blocking of further buys once the limit is reached is standard practice.`
    ],
    keyPoint: "A single-name limit is the admission that no amount of fundamental research eliminates the possibility of an idiosyncratic disaster. It converts that residual uncertainty into a hard, pre-committed size constraint."
  },
  {
    era: "Issuer",
    icon: "🏛️",
    title: "Issuer Concentration Limits",
    desc: "Caps on aggregate exposure to all instruments issued by the same legal entity or by entities within the same corporate group",
    badge: { label: "Credit", style: "amber" },
    tags: [["issuer limit","amber"], ["group exposure","slate"], ["cross-instrument","teal"], ["default risk","red"]],
    data: [
      { label: "Scope", value: "All debt, equity, derivatives of one issuer", color: "amber" },
      { label: "Includes", value: "Parent + subsidiaries under common control", color: "slate" },
      { label: "Key risk", value: "Simultaneous default across instruments", color: "red" },
    ],
    body: [
      `Issuer limits recognise that a single legal entity or corporate group can appear in the portfolio through multiple instruments — senior bonds, subordinated debt, equity, CDS, equity options, convertible bonds, etc. A limit applied only at the individual security level would miss the true economic exposure to that issuer’s credit and equity risk.`,
      `The aggregation must therefore look through instrument type and, where relevant, through corporate structure. Look-through rules for holding companies, special-purpose vehicles and guaranteed subsidiaries are a frequent source of both complexity and regulatory scrutiny.`,
      `In credit portfolios issuer limits are often further differentiated by rating or by seniority. The same name may be allowed a larger limit in senior secured debt than in subordinated or equity form, reflecting recovery-rate differences.`
    ],
    keyPoint: "Issuer concentration limits close the loophole that single-name security limits leave open: the ability to accumulate economically equivalent exposure to one credit through many different instruments."
  },
  {
    era: "Quality",
    icon: "⭐",
    title: "Credit Quality Limits",
    desc: "Restrictions on the maximum exposure allowed in each credit-rating bucket or in non-investment-grade and unrated paper",
    badge: { label: "Credit", style: "teal" },
    tags: [["rating limits","teal"], ["ig vs hy","amber"], ["credit bucket","slate"], ["downgrade risk","red"]],
    data: [
      { label: "Buckets", value: "AAA–AA, A, BBB, BB, B, CCC & below", color: "teal" },
      { label: "Typical rule", value: "Tighter limits for lower ratings", color: "amber" },
      { label: "Dynamic", value: "Must react to rating migrations", color: "red" },
    ],
    body: [
      `Credit-quality limits allocate the portfolio’s total credit risk appetite across rating categories. Investment-grade buckets are usually granted larger aggregate limits than high-yield or distressed buckets, reflecting both lower default probability and higher recovery expectations.`,
      `The limits must be dynamic: a downgrade can move a position from an unconstrained bucket into a constrained one overnight, forcing a reduction even if the position size itself has not changed. Systems therefore need reliable, timely rating feeds and clear policies for split ratings and unrated names.`,
      `Some frameworks replace or supplement agency ratings with internal credit scores or with market-implied measures (CDS spreads, bond spreads). The principle remains the same: exposure to lower-quality credits is deliberately rationed.`
    ],
    keyPoint: "Credit-quality limits translate the firm’s credit-risk appetite into concrete, rating-bucket ceilings. They ensure that the search for yield cannot silently migrate the entire book into the lowest-quality segment of the market."
  },
  {
    era: "Leverage",
    icon: "📊",
    title: "Leverage Limits",
    desc: "Explicit ceilings on the ratio of gross or risk-weighted exposure to capital, controlling the amplification of both gains and losses",
    badge: { label: "Structural", style: "red" },
    tags: [["leverage","red"], ["gross / capital","amber"], ["risk-weighted","slate"], ["amplification","teal"]],
    data: [
      { label: "Simple", value: "Gross exposure / equity capital", color: "amber" },
      { label: "Risk-based", value: "Risk-weighted assets / capital", color: "slate" },
      { label: "Effect", value: "Bounds maximum loss amplification", color: "red" },
    ],
    body: [
      `Leverage limits directly constrain how many times capital may be multiplied into market exposure. A simple gross-leverage ratio (gross exposure divided by equity) is transparent and hard to game; risk-weighted or volatility-adjusted leverage measures are more risk-sensitive but depend on the quality of the risk model.`,
      `Because leverage amplifies every percentage loss into a larger percentage loss of capital, leverage limits are among the most effective structural controls on drawdown severity. They also interact with financing: prime brokers and derivatives counterparties impose their own leverage or margin constraints that may bind before the firm’s internal limits.`,
      `In practice both an internal leverage ceiling and the external financing constraints must be monitored. A strategy that is inside its internal limit but close to a margin call is still one adverse move away from forced deleveraging.`
    ],
    keyPoint: "Leverage limits are the quantitative expression of ‘how many times can we lose our capital in a single bad move?’ They set the maximum amplification factor that the rest of the risk framework is allowed to operate under."
  },
  {
    era: "Liquidity",
    icon: "💧",
    title: "Liquidity Constraints",
    desc: "Limits that restrict position size according to the expected time or cost required to exit without material market impact",
    badge: { label: "Practical", style: "amber" },
    tags: [["liquidity","amber"], ["exit time","slate"], ["market impact","red"], ["capacity","teal"]],
    data: [
      { label: "Metric", value: "Days-to-liquidate or % of ADV", color: "amber" },
      { label: "Constraint", value: "Size ≤ f(ADV, participation rate)", color: "teal" },
      { label: "Purpose", value: "Ensure exits remain feasible under stress", color: "red" },
    ],
    body: [
      `Liquidity constraints recognise that a position is only as large as the market’s ability to absorb its exit. A common rule limits any single name to a fixed percentage of average daily volume (ADV) or to a maximum expected liquidation horizon (e.g., ‘must be exit-able within three trading days at 20 % of ADV’).`,
      `More sophisticated versions incorporate volatility, bid–ask spreads and historical depth to estimate market-impact cost, then cap positions so that the expected cost of exit under stress remains inside a tolerance. Illiquid names therefore receive automatically tighter size limits than liquid large-caps.`,
      `These constraints bind most tightly precisely when they are most needed — during market stress when ADV collapses and spreads widen. Embedding them in the pre-trade compliance engine prevents the accumulation of positions that can only be exited at fire-sale prices.`
    ],
    keyPoint: "A liquidity constraint converts the abstract notion of ‘capacity’ into a hard, pre-trade size limit. It ensures that every position taken is, by construction, one that the firm can still exit when liquidity is no longer abundant."
  },
  {
    era: "Capital",
    icon: "🏦",
    title: "Regulatory Capital Constraints (Basel)",
    desc: "Hard limits arising from Basel risk-weighted capital ratios, leverage ratios and large-exposure rules that ultimately bound the size and composition of the book",
    badge: { label: "Regulatory", style: "slate" },
    tags: [["basel","slate"], ["rwa","amber"], ["leverage ratio","teal"], ["large exposures","red"]],
    data: [
      { label: "CET1 ratio", value: "Capital / risk-weighted assets", color: "slate" },
      { label: "Leverage ratio", value: "Capital / total exposure measure", color: "teal" },
      { label: "Large exposure", value: "Max to single counterparty / capital", color: "red" },
    ],
    body: [
      `Under the Basel framework a bank’s ability to take risk is ultimately constrained by its Common Equity Tier 1 (CET1) ratio, its leverage ratio, and the large-exposure framework. Every position consumes risk-weighted assets (RWA) or leverage-ratio exposure; once the resulting capital ratios approach regulatory or internal management buffers, further risk-taking is curtailed.`,
      `The large-exposure rule typically limits the sum of all exposures to a single counterparty (or group of connected counterparties) to 25 % of Tier 1 capital, with tighter limits for exposures to other banks. These rules operate as hard regulatory single-name and issuer limits that cannot be waived by internal risk appetite.`,
      `Because regulatory capital is both a binding constraint and a scarce resource, sophisticated firms allocate internal capital charges to desks and strategies so that the shadow price of regulatory capital is visible in every trading decision. Limits expressed purely in notional or risk terms that ignore capital consumption are incomplete.`
    ],
    keyPoint: "Regulatory capital constraints are the final outer wall. No internal limit framework is complete until it recognises that Basel RWA, leverage-ratio and large-exposure rules can, and often do, become the binding constraint on the size and shape of the book."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
