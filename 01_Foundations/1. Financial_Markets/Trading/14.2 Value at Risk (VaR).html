<script>
const entries = [
  {
    era: "Definition",
    icon: "📉",
    title: "VaR Definition",
    desc: "The maximum loss that is not expected to be exceeded with a stated confidence level over a fixed time horizon",
    badge: { label: "Foundation", style: "slate" },
    tags: [["definition","slate"], ["confidence level","teal"], ["horizon","amber"], ["quantile","teal"]],
    data: [
      { label: "Statement", value: "Loss ≤ VaR with probability X%", color: "teal" },
      { label: "Typical X", value: "95 % or 99 %", color: "amber" },
      { label: "Horizon T", value: "1-day, 10-day (regulatory)", color: "slate" },
    ],
    body: [
      `Value at Risk answers a single, operationally useful question: “How much can I lose, with probability no greater than α, over the next T days?” Formally, VaR<sub>α,T</sub> is the α-quantile of the loss distribution (or the negative of the (1−α)-quantile of the P&L distribution). A 99 % one-day VaR of $10 m means that, under the model’s assumptions, losses larger than $10 m are expected to occur only one day in a hundred.`,
      `VaR is a threshold, not an expectation. It says nothing about the size of losses beyond that threshold. It is therefore silent on the very outcomes that matter most in a crisis. This distinction is the root of almost every subsequent criticism of the measure.`,
      `Because VaR is a pure quantile, its numerical value depends critically on the choice of confidence level and horizon. Changing either parameter can alter the reported number by a factor of two or more, even when the underlying risk is unchanged.`
    ],
    keyPoint: "VaR is the loss threshold that is breached only with probability α. It is deliberately simple, deliberately silent on tail severity, and deliberately sensitive to the two parameters that define it: confidence level and horizon."
  },
  {
    era: "Historical",
    icon: "📜",
    title: "Historical Simulation VaR",
    desc: "Non-parametric estimation that re-values the current portfolio under the actual returns observed in a rolling window of past days",
    badge: { label: "Core", style: "teal" },
    tags: [["historical sim","teal"], ["non-parametric","slate"], ["window length","amber"], ["empirical quantile","teal"]],
    data: [
      { label: "Method", value: "Re-price under past return vectors", color: "teal" },
      { label: "Window", value: "Typically 1–5 years of daily data", color: "amber" },
      { label: "Strength", value: "No distributional assumption", color: "slate" },
    ],
    body: [
      `Historical simulation takes the current portfolio weights, applies each of the last N daily (or multi-day) return vectors observed in the market, and constructs an empirical distribution of hypothetical P&L. The VaR is simply the appropriate empirical quantile of that distribution. No parametric form is imposed; the data themselves define the loss distribution.`,
      `The method automatically incorporates whatever fat tails, skewness and correlation patterns existed in the sample window. Its principal weakness is that the window must be long enough to contain relevant stress episodes yet short enough to remain representative of current market conditions. A five-year window that ends just before a crisis will systematically understate risk; a window that begins inside a crisis may overstate it for years.`,
      `Variants include volatility-weighted historical simulation (more weight to recent high-vol days) and filtered historical simulation (standardise residuals, then re-scale by current volatility). Both attempt to mitigate the “stale-window” problem while preserving the non-parametric character of the approach.`
    ],
    keyPoint: "Historical simulation is the simplest and most transparent VaR method: it asks only “what would this portfolio have lost on each of the last N days?” Its accuracy is entirely hostage to the representativeness of that historical window."
  },
  {
    era: "Parametric",
    icon: "🔔",
    title: "Parametric VaR (Normal Assumption)",
    desc: "Closed-form VaR obtained by assuming portfolio returns are Gaussian and scaling the standard deviation by the appropriate normal quantile",
    badge: { label: "Analytic", style: "amber" },
    tags: [["parametric","amber"], ["normal","red"], ["δ-normal","slate"], ["closed form","teal"]],
    data: [
      { label: "Formula", value: "VaR ≈ μ − z<sub>α</sub> · σ · √T", color: "amber" },
      { label: "z<sub>95%</sub>", value: "1.645", color: "teal" },
      { label: "z<sub>99%</sub>", value: "2.326", color: "teal" },
    ],
    body: [
      `Under the assumption that portfolio P&L is normally distributed with mean μ and volatility σ, VaR collapses to a simple multiple of σ. For a one-day horizon the 95 % and 99 % VaRs are approximately 1.65σ and 2.33σ below the mean. Multi-day VaR is obtained by scaling volatility by √T (the square-root-of-time rule).`,
      `The method is computationally trivial and analytically tractable, which made it the industry standard in the 1990s. Its fatal flaw is the normality assumption itself: real returns exhibit excess kurtosis, so the normal distribution systematically understates the probability of extreme losses. The higher the confidence level, the larger the understatement.`,
      `In practice the parametric approach is often implemented as “delta-normal” VaR: linearise all instruments with respect to risk factors, map the portfolio onto a covariance matrix of those factors, and compute the resulting portfolio variance. Non-linear instruments (options, mortgages) are poorly handled unless higher-order (delta-gamma) approximations are introduced.`
    ],
    keyPoint: "Parametric VaR is elegant precisely because it assumes away the fat tails that dominate real risk. It remains useful for rough sizing and for instruments that are nearly linear, but it is structurally optimistic at high confidence levels."
  },
  {
    era: "Monte Carlo",
    icon: "🎲",
    title: "Monte Carlo VaR",
    desc: "Simulation-based VaR that generates thousands of synthetic market scenarios from a chosen stochastic model and re-values the full portfolio under each",
    badge: { label: "Flexible", style: "teal" },
    tags: [["monte carlo","teal"], ["full revaluation","slate"], ["scenario generation","amber"], ["computational","red"]],
    data: [
      { label: "Strength", value: "Handles non-linearity & path dependence", color: "teal" },
      { label: "Cost", value: "Computationally intensive", color: "amber" },
      { label: "Key risk", value: "Model risk in the scenario engine", color: "red" },
    ],
    body: [
      `Monte Carlo VaR draws a large number of possible future states of the risk-factor vector from a specified joint distribution (or from a more elaborate stochastic process), re-values every position under each draw, and reads the desired quantile from the resulting simulated P&L histogram. Because the valuation can be exact (or arbitrarily accurate), non-linear and path-dependent instruments are handled without approximation.`,
      `The method’s flexibility is also its vulnerability. Every modelling choice—marginal distributions, dependence structure, volatility dynamics, jump processes—embeds assumptions that may or may not hold on the day a large loss materialises. Model risk is therefore first-order; the quality of the VaR number is only as good as the quality of the scenario generator.`,
      `Computational cost scales with the number of simulations, the size of the book, and the complexity of the pricing functions. Variance-reduction techniques, GPU acceleration and intelligent scenario selection are routinely employed to keep run-times acceptable for overnight risk reports.`
    ],
    keyPoint: "Monte Carlo VaR is the most general of the three classical methods, but it shifts the burden from statistical estimation onto model specification. The number it produces is only as trustworthy as the stochastic engine that generated the scenarios."
  },
  {
    era: "Confidence",
    icon: "📊",
    title: "95 % VaR vs. 99 % VaR",
    desc: "How the choice of confidence level changes both the magnitude of the reported number and the frequency with which it is expected to be breached",
    badge: { label: "Parameter", style: "amber" },
    tags: [["95%","amber"], ["99%","red"], ["exception frequency","teal"], ["tail sensitivity","slate"]],
    data: [
      { label: "95 % VaR", value: "Breached ~1 day in 20", color: "amber" },
      { label: "99 % VaR", value: "Breached ~1 day in 100", color: "red" },
      { label: "Ratio", value: "Often 1.3–1.6× under normality", color: "slate" },
    ],
    body: [
      `A 95 % VaR is expected to be exceeded on roughly five days out of every hundred; a 99 % VaR on only one day out of a hundred. The higher confidence level therefore probes deeper into the left tail and produces a larger absolute number. Under normality the ratio of 99 % to 95 % VaR is approximately 2.33 / 1.65 ≈ 1.41; under fat-tailed distributions the ratio is typically larger.`,
      `From a risk-management perspective the two measures serve different purposes. 95 % VaR is more frequently observable and therefore easier to back-test, yet it still ignores the most extreme outcomes. 99 % VaR is closer to the regulatory standard and more conservative, but exceptions are rare enough that statistical validation becomes noisy.`,
      `Many desks compute both. The spread between them is itself informative: a large gap signals that the loss distribution is heavy-tailed or that the model is sensitive to the extreme quantile.`
    ],
    keyPoint: "Moving from 95 % to 99 % is not a cosmetic change; it is a deliberate decision to look further into the tail. The numerical increase and the reduction in expected exception frequency must both be understood before the number is used for limit-setting."
  },
  {
    era: "Horizon",
    icon: "📅",
    title: "1-Day vs. 10-Day VaR & Basel Scaling",
    desc: "The regulatory convention of scaling one-day VaR by √10 to obtain a ten-day horizon measure, and the assumptions that underlie it",
    badge: { label: "Regulatory", style: "slate" },
    tags: [["1-day","teal"], ["10-day","amber"], ["√10 scaling","slate"], ["basel","red"]],
    data: [
      { label: "Basel rule", value: "10-day VaR ≈ 1-day VaR × √10", color: "slate" },
      { label: "√10 ≈", value: "3.16", color: "amber" },
      { label: "Assumption", value: "i.i.d. returns, no serial correlation", color: "red" },
    ],
    body: [

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
