<script>
const entries = [
  {
    era: "Foundation",
    icon: "📐",
    title: "State-Space Representation",
    desc: "Casting the estimation problem as a latent state evolving with noisy observations",
    badge: { label: "Foundation", style: "teal" },
    tags: [["state-space","teal"], ["latent state","amber"], ["observation","slate"], ["linear Gaussian",""]],
    data: [
      { label: "State equation", value: "xₜ = F xₜ₋₁ + wₜ  (process noise)", color: "teal" },
      { label: "Observation", value: "yₜ = H xₜ + vₜ  (measurement noise)", color: "" },
      { label: "Assumption", value: "Linear dynamics · Gaussian noise", color: "amber" },
    ],
    body: [
      `The Kalman filter operates on a state-space model. An unobserved state vector evolves according to a linear transition equation driven by process noise. At each time step an observation is received that is a linear function of the current state plus measurement noise.`,
      `In trading applications the state might be a hedge ratio, a latent fair value, a local trend, or a set of time-varying factor loadings. The observation is typically a traded price, a spread, or a vector of asset returns.`,
      `Once the problem is written in state-space form, the Kalman filter supplies the optimal recursive estimator of the state under the linear-Gaussian assumptions. Model design — choosing what belongs in the state, the transition matrix F, and the observation matrix H — is therefore the decisive modelling step.`
    ],
    keyPoint: "Everything begins with a clear state-space representation. The filter can only estimate what the modeller has declared to be the latent state."
  },
  {
    era: "Algorithm",
    icon: "🔄",
    title: "Prediction and Update Steps",
    desc: "The two alternating operations that propagate the state estimate through time",
    badge: { label: "Core", style: "teal" },
    tags: [["predict","teal"], ["update","amber"], ["recursive",""], ["Bayesian","slate"]],
    data: [
      { label: "Predict", value: "Propagate state & covariance with transition model", color: "teal" },
      { label: "Update", value: "Correct estimate with new observation", color: "amber" },
      { label: "Cycle", value: "Predict → Update → Predict → …", color: "" },
    ],
    body: [
      `Each time step consists of two operations. In the prediction (time-update) step the current state estimate and its covariance are projected forward using the transition model; uncertainty grows by the process-noise covariance. In the update (measurement-update) step the new observation is incorporated: the prediction is corrected by a weighted fraction of the innovation (observation minus predicted observation).`,
      `The relative weighting of prediction versus observation is controlled by the Kalman gain, which itself depends on the current uncertainty and the measurement-noise covariance. When measurement noise is low the filter trusts the observation more; when process noise is high the filter allows the state to move more freely.`,
      `The recursion is computationally efficient: only the previous estimate and covariance need to be stored. This makes the filter ideal for real-time trading systems that must process every tick or bar.`
    ],
    keyPoint: "Predict then update is the entire algorithm. All of the filter’s power and all of its subtleties reside in how those two steps are parameterised."
  },
  {
    era: "Core",
    icon: "⚖️",
    title: "Kalman Gain",
    desc: "The optimal weighting factor that blends prediction with new information",
    badge: { label: "Core", style: "teal" },
    tags: [["Kalman gain","teal"], ["weighting","amber"], ["uncertainty",""], ["optimal","slate"]],
    data: [
      { label: "Role", value: "Determines how much to trust the new observation", color: "teal" },
      { label: "High gain", value: "Observation dominates (low measurement noise)", color: "" },
      { label: "Low gain", value: "Prediction dominates (high measurement noise)", color: "amber" },
    ],
    body: [
      `The Kalman gain is the matrix (or scalar) that multiplies the innovation before it is added to the predicted state. It is computed from the predicted state covariance and the measurement-noise covariance so that the posterior state covariance is minimised.`,
      `Intuitively the gain rises when the filter is uncertain about its prediction or when the observation is precise, and falls when the opposite is true. In steady state the gain converges to a constant that reflects the permanent balance between process and measurement noise.`,
      `In trading implementations the gain (or the noise variances that determine it) is often the main tuning knob. Too high a gain produces a jittery estimate that chases noise; too low a gain produces an estimate that lags genuine changes in the latent state.`
    ],
    keyPoint: "The Kalman gain is the quantitative expression of “how much should I believe this new tick?” Getting the noise variances right is therefore the practical heart of filter design."
  },
  {
    era: "Application",
    icon: "🔗",
    title: "Application: Dynamic Hedge Ratio",
    desc: "Tracking a time-varying cointegrating coefficient for pairs or residual strategies",
    badge: { label: "Trading", style: "amber" },
    tags: [["hedge ratio","amber"], ["pairs trading","teal"], ["cointegration",""], ["adaptive","slate"]],
    data: [
      { label: "State", value: "Hedge ratio (and optionally intercept)", color: "teal" },
      { label: "Observation", value: "Price of one leg (or the spread)", color: "" },
      { label: "Benefit", value: "Adapts to structural drift without full re-estimation", color: "amber" },
    ],
    body: [
      `A classic use of the Kalman filter in statistical arbitrage is to let the hedge ratio between two cointegrated assets evolve as a random walk. The state is the hedge ratio (sometimes together with an intercept); the observation is the price of the dependent leg. The filter produces a smooth, causal estimate of the current ratio and a measure of its uncertainty.`,
      `Compared with rolling-window OLS, the Kalman approach uses all past data with exponentially decaying influence, supplies a natural confidence band, and updates with every new tick or bar. The residual formed with the filtered hedge ratio is typically cleaner and more stationary when the true relationship drifts slowly.`,
      `Careful tuning of process-noise variance is essential: too little and the ratio is almost static; too much and the residual is over-fitted to noise.`
    ],
    keyPoint: "The Kalman filter turns a static cointegrating vector into a living, adaptive hedge ratio — one of the most direct and valuable applications in pairs trading."
  },
  {
    era: "Application",
    icon: "📡",
    title: "Application: Price Signal Extraction",
    desc: "Separating a latent “fair” or efficient price from microstructure noise",
    badge: { label: "Trading", style: "amber" },
    tags: [["fair price","amber"], ["microstructure noise","teal"], ["signal extraction",""], ["efficient price","slate"]],
    data: [
      { label: "State", value: "Latent efficient / fair price", color: "teal" },
      { label: "Observation", value: "Noisy traded price or mid-quote", color: "" },
      { label: "Use", value: "Cleaner signals · better execution benchmarks", color: "amber" },
    ],
    body: [
      `Traded prices and even mid-quotes contain microstructure noise — bid–ask bounce, temporary liquidity shocks, and reporting artefacts. A simple state-space model treats the efficient price as a random walk (or random walk with drift) and the observed price as that efficient price plus i.i.d. or autocorrelated noise.`,
      `The Kalman filter then extracts a real-time estimate of the latent efficient price. The cleaned series can be used as a more stable input to alpha signals, as a benchmark for measuring execution quality, or as the reference level for market-making reservation prices.`,
      `Extensions allow the noise variance itself to be state-dependent (higher in volatile or illiquid regimes) or incorporate additional observations such as the micro-price or order-book imbalance.`
    ],
    keyPoint: "Price signal extraction is the microstructure application of the classic “signal-plus-noise” problem. The filter recovers a usable efficient-price estimate from the noisy tape."
  },
  {
    era: "Application",
    icon: "📈",
    title: "Application: Trend Estimation",
    desc: "Recursively estimating a local level or local linear trend for timing and positioning",
    badge: { label: "Trading", style: "amber" },
    tags: [["trend","amber"], ["local level","teal"], ["local linear trend",""], ["smoothing","slate"]],
    data: [
      { label: "Models", value: "Local level · local linear trend · higher-order", color: "teal" },
      { label: "Output", value: "Filtered level / slope at each time", color: "" },
      { label: "Trading use", value: "Position sizing · regime detection · overlays", color: "amber" },
    ],
    body: [
      `A local-level model treats the underlying price level as a random walk; a local-linear-trend model adds a stochastic slope that itself follows a random walk. Both are linear-Gaussian state-space models and are therefore ideal candidates for the Kalman filter.`,
      `The filtered level and slope provide a causal, low-lag estimate of the current trend. These estimates can drive position sizing in trend-following systems, serve as dynamic support/resistance levels, or act as features in broader alpha models.`,
      `Because the filter is recursive and computationally light, multi-asset, multi-horizon trend estimation can be performed in real time across an entire futures or equity universe.`
    ],
    keyPoint: "Kalman trend estimation replaces ad-hoc moving averages with a statistically principled, uncertainty-aware extraction of level and slope."
  },
  {
    era: "Extension",
    icon: "🌀",
    title: "Extended Kalman Filter (EKF) for Nonlinear Systems",
    desc: "Linearising nonlinear dynamics and observation functions around the current estimate",
    badge: { label: "Advanced", style: "amber" },
    tags: [["EKF","amber"], ["nonlinear","teal"], ["linearisation",""], ["Jacobian","slate"]],
    data: [
      { label: "Approach", value: "First-order Taylor expansion of f and h", color: "teal" },
      { label: "Requirement", value: "Analytic or numeric Jacobians", color: "" },
      { label: "Limitation", value: "Can diverge if nonlinearity is severe", color: "red" },
    ],
    body: [
      `Many trading-relevant processes are nonlinear: stochastic volatility, nonlinear mean-reversion, option-implied quantities, or observation functions that involve ratios or logarithms. The Extended Kalman Filter linearises the state-transition and observation functions by computing their Jacobians at the current estimate, then applies the ordinary Kalman update to the linearised system.`,
      `The EKF is relatively easy to implement once the Jacobians are available and remains computationally cheap. It works well when the nonlinearities are mild and the sampling interval is short enough that the linear approximation stays accurate.`,
      `When the true dynamics are strongly nonlinear or multi-modal, the EKF can produce biased estimates or even diverge. In those regimes the Unscented Kalman Filter or particle filters become preferable.`
    ],
    keyPoint: "The EKF extends the Kalman idea to nonlinear models by local linearisation. It is the first practical tool to reach for when the state-space equations cease to be linear."
  },
  {
    era: "Extension",
    icon: "🌐",

      `Because the nonlinear functions are applied exactly, the UKF captures higher-order moments more accurately than the EKF and does not require Jacobians. It is therefore more robust for many financial nonlinearities (stochastic volatility, nonlinear observation models, etc.).`,
      `The extra accuracy comes at the cost of additional function evaluations. For the low-dimensional state vectors typical in trading applications the overhead is usually acceptable.`

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataArray = e.data || e.dual || [];
    const dataHtml = dataArray.length ? `
      <div class="data-strip">
        ${dataArray.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color || ''}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
