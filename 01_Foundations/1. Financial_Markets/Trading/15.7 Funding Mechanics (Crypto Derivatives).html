<script>
const entries = [
  {
    era: "Formula",
    icon: "📐",
    title: "Funding Rate Formula",
    desc: "The exchange-specific rule that sets the periodic payment between longs and shorts so that the perpetual’s price is anchored to the underlying index",
    badge: { label: "Foundation", style: "slate" },
    tags: [["funding rate","slate"], ["perpetual","teal"], ["exchange rules","amber"], ["anchor","teal"]],
    data: [
      { label: "Purpose", value: "Keep perp price near spot / index", color: "teal" },
      { label: "Direction", value: "Longs pay shorts if rate &gt; 0 (typical)", color: "amber" },
      { label: "Variation", value: "Formula differs by venue", color: "slate" },
    ],
    body: [
      `Crypto perpetual futures have no expiry. Without a funding mechanism they could drift arbitrarily from spot. The funding rate is a periodic transfer between long and short holders designed to pull the contract price back toward an index (usually a composite of major spot markets). When the perp trades rich, funding is positive and longs pay shorts; when it trades cheap, the reverse occurs.`,
      `Each exchange publishes its own formula. Common building blocks are a premium term (perp vs. index) and sometimes a small interest-rate term. Clamps, moving averages, and sample windows differ, so the same market state can produce different rates on Binance, Bybit, OKX, or dYdX.`,
      `Funding is paid continuously or at discrete intervals on the notional of open positions. It is not a fee to the exchange; it is a peer-to-peer transfer among traders that makes holding a biased position expensive when the market is one-sided.`
    ],
    keyPoint: "The funding rate is the perpetual’s substitute for expiry. It is a transfer between traders, not an exchange fee, and its exact formula is a first-class parameter of each venue’s market design."
  },
  {
    era: "Components",
    icon: "🧩",
    title: "Premium Index & Interest Rate",
    desc: "The two ingredients most venues combine: a measure of how far the contract trades from the index, and a baseline funding related to the quote–base interest differential",
    badge: { label: "Core", style: "teal" },
    tags: [["premium index","teal"], ["interest rate","amber"], ["twap","slate"], ["clamp","red"]],
    data: [
      { label: "Premium", value: "f(perp price − index) over a window", color: "teal" },
      { label: "Interest", value: "Often a small fixed or rate-based term", color: "amber" },
      { label: "Result", value: "Funding ≈ premium + interest (clamped)", color: "slate" },
    ],
    body: [
      `The premium index measures the gap between the perpetual’s mark or last price and the underlying index, typically averaged over a window (e.g., the eight hours leading into a funding timestamp) so that momentary spikes do not dominate. A positive average premium pushes funding up; a discount pushes it down.`,
      `Many exchanges add an interest-rate component that reflects the cost of holding the quote versus the base asset (historically a simple constant such as 0.01% per interval). In practice the premium term usually dominates when the market is excited; the interest term sets a soft floor in quiet markets.`,
      `Clamps and dampening prevent extreme single-interval rates, but they do not eliminate the cumulative cost of holding a crowded side through a long period of elevated funding.`
    ],
    keyPoint: "Premium drives funding when the market is skewed; the interest term is a quiet baseline. Together they define the price of staying on the popular side of the contract."
  },
  {
    era: "Interval",
    icon: "⏱️",
    title: "Funding Intervals",
    desc: "How often funding is assessed and paid — classically every 8 hours, increasingly every 1 hour or continuously — and why the schedule matters for strategy",
    badge: { label: "Timing", style: "amber" },
    tags: [["8h funding","amber"], ["1h funding","teal"], ["continuous","slate"], ["settlement","teal"]],
    data: [
      { label: "Classic", value: "Every 8 hours (00:00, 08:00, 16:00 UTC)", color: "amber" },
      { label: "Faster", value: "1-hour or continuous accrual", color: "teal" },
      { label: "Implication", value: "Path of rate + holding through timestamps", color: "slate" },
    ],
    body: [
      `Traditional crypto perps settle funding three times per day. Positions open across a funding timestamp pay or receive the prevailing rate on their notional. Some venues have moved to hourly funding or to continuous accrual to reduce gaming around discrete timestamps and to make the cost of holding smoother.`,
      `Discrete intervals create predictable moments of flow: traders who do not want to pay funding may flatten before the timestamp; arbitrageurs may lean into positions that collect funding. Continuous or hourly schedules weaken those discontinuities but do not remove the economic pressure of a persistently positive or negative rate.`,
      `Comparing annualised funding across venues requires normalising for interval length. An 0.01% eight-hour rate is not the same animal as an 0.01% hourly rate.`
    ],
    keyPoint: "Funding interval is part of the product design. It changes how costs accrue, how strategies time entries and exits, and how comparable headline rates really are across exchanges."
  },
  {
    era: "Arb",
    icon: "⚖️",
    title: "Funding Arbitrage (Cash-and-Carry)",
    desc: "The classic trade: long spot (or equivalent) and short the perpetual to collect positive funding while remaining roughly delta-neutral",
    badge: { label: "Strategy", style: "teal" },
    tags: [["funding arb","teal"], ["cash and carry","amber"], ["delta neutral","slate"], ["basis","teal"]],
    data: [
      { label: "Structure", value: "Long spot + short perp (when funding &gt; 0)", color: "teal" },
      { label: "Edge", value: "Collect funding; hedge price risk", color: "amber" },
      { label: "Risks", value: "Basis moves, fees, liquidation, borrow", color: "red" },
    ],
    body: [
      `When funding is structurally positive, shorts receive payments from longs. A trader who buys the underlying (or a close substitute) and shorts an equal notional of the perpetual earns that funding while offsetting directional price risk. The reverse trade applies when funding is deeply negative.`,
      `The strategy is the crypto analogue of cash-and-carry. Its expected return is the funding received minus trading costs, borrow costs (if spot is financed), and any adverse move in the basis between perp and spot. Liquidation risk on the short leg remains if margin is thin or volatility spikes.`,
      `Capacity is limited by available spot inventory, exchange margin, and the tendency of large arb flows to compress the very premium that generates funding. Crowded funding arb is one reason extreme rates often mean-revert.`
    ],
    keyPoint: "Funding arbitrage harvests the premium that crowded speculation creates. It is delta-neutral only to a first approximation — basis, margin, and operational risk still bind."
  },
  {
    era: "Sentiment",
    icon: "📊",
    title: "Funding as Sentiment Indicator",
    desc: "Reading the level and persistence of funding as a real-time measure of how one-sided leveraged positioning has become",
    badge: { label: "Signal", style: "slate" },
    tags: [["sentiment","slate"], ["positioning","amber"], ["crowding","red"], ["contrarian","teal"]],
    data: [
      { label: "High positive", value: "Longs crowded; expensive to stay long", color: "amber" },
      { label: "Deep negative", value: "Shorts crowded; expensive to stay short", color: "teal" },
      { label: "Use", value: "Context for squeeze risk & mean reversion", color: "slate" },
    ],
    body: [
      `Elevated positive funding means leveraged longs are paying a continuous toll to hold exposure. That state often coincides with frothy price action and raises the cost of adding further long leverage. Deeply negative funding signals the opposite: shorts are paying to stay short, a setup that can precede short squeezes.`,
      `Funding is not a timing oracle. Rates can stay “extreme” for longer than a naïve mean-reversion trader can stay solvent. Combined with open interest, liquidation maps, and spot flows, however, funding is one of the cleanest public windows into derivatives positioning.`,
      `Cross-sectional comparison (funding on BTC vs. alts, or one exchange vs. another) can highlight where leverage is most concentrated and where arb capital is already working hardest to flatten the premium.`
    ],
    keyPoint: "Funding is a price of positioning. Persistently high or low rates do not guarantee a reversal, but they do reveal which side is paying rent to the other."
  },
  {
    era: "Extremes",
    icon: "💥",
    title: "Extreme Funding & Liquidation Cascades",
    desc: "Episodes when funding spikes or collapses alongside forced deleveraging — amplifying volatility and creating feedback between rate, price, and margin",
    badge: { label: "Critical", style: "red" },
    tags: [["liquidation cascade","red"], ["extreme funding","amber"], ["deleveraging","slate"], ["feedback","red"]],
    data: [
      { label: "Setup", value: "Crowded side + shock move against it", color: "red" },
      { label: "Feedback", value: "Liquidations → price → more liquidations", color: "amber" },
      { label: "Funding role", value: "Cost of holding through the event", color: "slate" },
    ],
    body: [
      `When a large cohort of leveraged positions sits on one side of the book, an adverse price move triggers liquidations. Liquidations push price further, triggering more liquidations. Funding interacts with this process in two ways: it may have already weakened the crowded side by draining margin over time, and during the chaos rates can print at clamps as the premium swings violently.`,
      `Cascades are more severe when open interest is high relative to spot depth, when many positions share similar liquidation prices, and when cross-margin and insurance funds are stressed. Cross-exchange simultaneous liquidations can transmit the shock globally within minutes.`,
      `For risk managers, extreme funding is a warning light that the market’s leverage distribution is fragile. For opportunistic traders, the aftermath — emptied crowded positions and normalised basis — is often when funding arb and mean-reversion setups reset.`
    ],
    keyPoint: "Extreme funding and liquidation cascades are the same story told in two variables: overcrowded leverage meets a price shock, and both the rate and the order book record the damage."
  },
  {
    era: "Cross-Venue",
    icon: "🔀",
    title: "Cross-Exchange Funding Disparities",
    desc: "Persistent or temporary gaps between funding rates on different venues for the same underlying — opportunities for relative-value trades and signals of fragmented leverage",
    badge: { label: "Relative", style: "amber" },
    tags: [["cross-exchange","amber"], ["rate gap","teal"], ["fragmentation","slate"], ["transfer risk","red"]],
    data: [
      { label: "Cause", value: "Local OI, fees, index, user base", color: "amber" },
      { label: "Trade", value: "Long low-funding venue / short high-funding", color: "teal" },
      { label: "Friction", value: "Capital lockup, withdraw delays, basis risk", color: "red" },
    ],
    body: [
      `The same BTC perpetual can print different funding on Binance, OKX, Bybit, and smaller venues because open interest, retail mix, fee tiers, index composition, and formula details differ. Those gaps are the raw material for cross-exchange funding relative-value trades.`,
      `In principle, long the cheap-funding contract and short the rich-funding contract (or combine with spot) harvests the differential while cancelling much of the directional risk. In practice, capital must sit on multiple exchanges, withdrawal latency and freezes are real, and the two contracts’ marks can diverge under stress.`,
      `Large, persistent gaps often mark venues where leverage is more one-sided or where arb capital is constrained. Monitoring the cross-section of funding is therefore both a trading input and a market-structure diagnostic.`
    ],
    keyPoint: "Funding is local. Cross-venue gaps measure how segmented crypto derivatives leverage still is — and how much friction prevents the gaps from closing instantly."
  },
  {
    era: "Harvest",
    icon: "🌾",
    title: "Delta-Neutral Funding Harvesting",
    desc: "Systematic strategies that collect funding (or pay the cheaper side) while holding a tightly hedged book across spot, perps, and sometimes dated futures",
    badge: { label: "Advanced", style: "teal" },
    tags: [["harvesting","teal"], ["delta neutral","amber"], ["systematic","slate"], ["capacity","red"]],
    data: [
      { label: "Objective", value: "Earn funding with near-zero net delta", color: "teal" },
      { label: "Tools", value: "Spot, perp, dated futures, multi-venue", color: "amber" },
      { label: "Limits", value: "Margin, IL-like basis, ops, capacity", color: "red" },
    ],
    body: [
      `Funding harvesting programmes treat the rate as a yield source. They build structures whose net delta is close to zero and whose net funding receipt is positive after costs. Implementations range from simple spot-versus-perp carry to multi-legged books that also trade the calendar basis and cross-exchange differentials.`,
      `The hard parts are operational: continuous delta hedging as prices move, managing margin so that neither leg is liquidated, accounting for fees and borrow, and sizing so that the strategy’s own flow does not erase the premium. Risk systems must stress basis blowouts and venue failures, not only underlying price moves.`,
      `As more capital pursues the same harvest, average positive funding compresses and opportunities shift to shorter windows, smaller venues, or more complex relative-value structures. Edge becomes process and balance-sheet quality rather than a free carry coupon.`
    ],
    keyPoint: "Delta-neutral funding harvesting is the institutional form of cash-and-carry. The yield is real only after hedge costs, margin risk, and capacity limits are honestly deducted."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
