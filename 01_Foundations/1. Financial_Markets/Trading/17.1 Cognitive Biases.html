  .page {

  }

  .header-right {

  }

  .header-stat strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 68px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;
  }

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;
  }

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
  }

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;
  }

  .key-insight-text {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Judgment",
    icon: "🎯",
    title: "Overconfidence Bias",
    desc: "Overestimating the precision of one’s knowledge, forecasts and predictive ability",
    badge: { label: "Core", style: "teal" },
    tags: [["overconfidence","teal"], ["calibration","amber"], ["forecasting",""], ["trading volume","slate"]],
    data: [
      { label: "Manifestation", value: "Too-narrow confidence intervals · excess trading", color: "teal" },
      { label: "Market effect", value: "Higher volume · under-diversification", color: "" },
      { label: "Antidote", value: "Track record · base rates · pre-mortems", color: "amber" },
    ],
    body: [
      `Overconfidence is the systematic tendency to overestimate the accuracy of one’s beliefs and forecasts. Traders assign overly narrow confidence intervals to price targets, overestimate the probability that their thesis is correct, and consequently trade more frequently and with larger size than is justified.`,
      `Empirical work links overconfidence to excess trading volume, under-diversification and lower net returns after costs. It is especially pronounced after a string of wins, when the illusion of control and self-attribution bias reinforce each other.`,
      `Mitigation starts with honest calibration: recording forecasts, scoring them, and confronting the gap between felt certainty and realised accuracy. Pre-mortems and explicit base-rate thinking further reduce the bias.`
    ],
    keyPoint: "Overconfidence makes traders believe they know more than they do. It is one of the most robust and costly biases in financial markets."
  },
  {
    era: "Information",
    icon: "🔍",
    title: "Confirmation Bias",
    desc: "Seeking, interpreting and remembering information that confirms existing beliefs while discounting disconfirming evidence",
    badge: { label: "Core", style: "teal" },
    tags: [["confirmation","teal"], ["selective exposure","amber"], ["belief persistence",""], ["echo chamber","slate"]],
    data: [
      { label: "Behaviour", value: "Search for supporting data · ignore contradictions", color: "teal" },
      { label: "Danger", value: "Thesis becomes unfalsifiable", color: "red" },
      { label: "Counter", value: "Devil’s advocate · pre-commit to kill criteria", color: "amber" },
    ],
    body: [
      `Once a trader has formed a view, confirmation bias steers attention toward news, charts and opinions that support it and away from those that challenge it. Disconfirming data are scrutinised more harshly or re-interpreted until they fit.`,
      `In markets this prolongs losing positions, delays recognition of regime change, and creates echo chambers inside research teams. The bias is automatic; awareness alone does not eliminate it.`,
      `Structured remedies include assigning a formal devil’s advocate, writing down falsification criteria before entering a trade, and reviewing both supporting and opposing evidence with equal weight in post-mortems.`
    ],
    keyPoint: "Confirmation bias protects the ego at the expense of the portfolio. Actively seeking disconfirmation is a professional discipline, not a natural instinct."
  },
  {
    era: "Anchoring",
    icon: "⚓",
    title: "Anchoring",
    desc: "Fixating on an initial price, target or number and insufficiently adjusting away from it",
    badge: { label: "Core", style: "teal" },
    tags: [["anchoring","teal"], ["adjustment","amber"], ["reference point",""], ["price target","slate"]],
    data: [
      { label: "Common anchors", value: "Purchase price · 52-week high · analyst target", color: "teal" },
      { label: "Effect", value: "Insufficient adjustment · sticky valuations", color: "" },
      { label: "Defence", value: "Re-value from first principles · ignore entry", color: "amber" },
    ],
    body: [
      `Anchoring occurs when an arbitrary or historical number exerts disproportionate influence on subsequent judgments. Traders anchor on their entry price, on a round-number target, or on a previously published estimate and then adjust too little when new information arrives.`,
      `The result is reluctance to sell below cost, reluctance to revise targets, and systematic mis-pricing relative to current fundamentals. Even sophisticated professionals remain susceptible when under time pressure.`,
      `The practical counter is to re-estimate value from scratch whenever material information changes, treating the original anchor as irrelevant to the forward-looking decision.`
    ],
    keyPoint: "Anchors pull estimates toward irrelevant starting points. The only reliable defence is to rebuild the valuation without looking at the old number."
  },
  {
    era: "Memory",
    icon: "📰",
    title: "Availability Bias",
    desc: "Overweighting events that are easy to recall — recent, vivid or emotionally charged — relative to base rates",
    badge: { label: "Core", style: "teal" },
    tags: [["availability","teal"], ["recency","amber"], ["vividness",""], ["base rates","slate"]],
    data: [
      { label: "Triggers", value: "Recent crashes · media coverage · personal experience", color: "teal" },
      { label: "Distortion", value: "Perceived probability ≠ objective frequency", color: "red" },
      { label: "Remedy", value: "Force base-rate statistics into the process", color: "amber" },
    ],
    body: [
      `Judgments of probability are heavily influenced by the ease with which examples come to mind. A recent market crash, a vivid corporate fraud, or a friend’s big win becomes mentally available and is treated as more representative than it is.`,
      `Availability bias leads to overestimation of tail risks after crises, underestimation of risks that have been quiet, and herding into themes that dominate the news cycle. It interacts strongly with recency and media amplification.`,
      `Disciplined use of long-run frequencies, stress-test libraries and written probability assessments that must cite base rates reduces the distortion.`
    ],
    keyPoint: "What is easy to remember feels more probable. Availability bias replaces statistical thinking with storytelling driven by the last vivid event."
  },
  {
    era: "Prospect",
    icon: "💔",
    title: "Loss Aversion",
    desc: "Losses hurt roughly twice as much as equivalent gains feel good — the core of prospect theory",
    badge: { label: "Core", style: "teal" },
    tags: [["loss aversion","teal"], ["prospect theory","amber"], ["2×","",""], ["risk behaviour","slate"]],
    data: [
      { label: "Ratio", value: "Typical λ ≈ 2 (losses vs gains)", color: "teal" },
      { label: "Consequence", value: "Asymmetric risk-taking around reference point", color: "" },
      { label: "Trading impact", value: "Premature profit-taking · delayed loss realisation", color: "red" },
    ],
    body: [
      `Prospect theory established that the pain of a loss is approximately twice the pleasure of a gain of the same magnitude. Utility is defined over gains and losses relative to a reference point, not over final wealth, and the value function is steeper in the domain of losses.`,
      `Loss aversion produces the disposition effect, reluctance to cut losers, and a preference for sure small gains over probabilistic larger ones. It also drives risk-seeking behaviour when a position is already underwater in a desperate attempt to break even.`,
      `Process rules — pre-defined stops, systematic rebalancing, evaluation at low frequency — help separate the emotional experience of mark-to-market from the economic decision.`
    ],
    keyPoint: "Losses hurt about twice as much as gains please. This asymmetry is the single most important behavioural force shaping how traders manage open positions."
  },
  {
    era: "Prospect",
    icon: "📉",
    title: "Disposition Effect",
    desc: "The tendency to sell winners too early and hold losers too long",
    badge: { label: "Core", style: "teal" },
    tags: [["disposition","teal"], ["winners","amber"], ["losers",""], ["realisation","slate"]],
    data: [
      { label: "Pattern", value: "Realise gains quickly · defer losses", color: "teal" },
      { label: "Driver", value: "Loss aversion + mental accounting + pride", color: "" },
      { label: "Cost", value: "Tax inefficiency · under-performance vs momentum", color: "red" },
    ],
    body: [
      `Investors disproportionately sell stocks that have risen since purchase and hold stocks that have fallen. The behaviour is predicted by prospect theory (locking in a sure gain feels good; realising a loss feels painful) and is reinforced by mental accounting and the desire to maintain a positive self-image.`,
      `The disposition effect is among the most replicated findings in behavioural finance. It reduces after-tax returns, causes under-weighting of momentum, and leaves portfolios concentrated in impaired names.`,
      `Mandatory review rules, automatic rebalancing, and evaluating performance on a mark-to-market rather than realised-gain basis weaken the effect.`
    ],
    keyPoint: "The disposition effect is loss aversion applied to the sell decision. Selling winners and nursing losers systematically transfers money from the impatient to the patient."
  },
  {
    era: "Social",
    icon: "🐑",
    title: "Herding Bias",
    desc: "Following the crowd’s positions, narratives or risk appetite instead of independent analysis",
    badge: { label: "Core", style: "teal" },
    tags: [["herding","teal"], ["crowd","amber"], ["social proof",""], ["cascades","slate"]],
    data: [
      { label: "Mechanism", value: "Informational cascades · reputational motives", color: "teal" },
      { label: "Market form", value: "Crowded trades · bubbles · liquidity spirals", color: "" },
      { label: "Danger", value: "Exit is crowded when the narrative breaks", color: "red" },
    ],
    body: [
      `Herding arises when agents infer information from the actions of others or when career and reputational incentives reward conformity. In markets it appears as correlated positioning, rapid adoption of fashionable factors or themes, and sudden collective exits.`,
      `Informational cascades can form even among rational agents; reputational herding is stronger when evaluation is relative. The result is crowded trades that amplify both the rise and the subsequent unwind.`,
      `Independent process, explicit tracking of crowding metrics, and a willingness to look wrong in the short run are the primary defences.`
    ],
    keyPoint: "Herding turns private information into public correlation. When everyone is in the same trade, the exit door is only as wide as the narrative is durable."
  },
  {
    era: "Time",
    icon: "⏪",
    title: "Recency Bias",
    desc: "Extrapolating the most recent trend or regime as if it will persist indefinitely",
    badge: { label: "Core", style: "teal" },
    tags: [["recency","teal"], ["extrapolation","amber"], ["regime",""], ["mean reversion","slate"]],
    data: [
      { label: "Behaviour", value: "Overweight last N observations", color: "teal" },
      { label: "Market effect", value: "Trend chasing · underestimation of mean reversion", color: "" },
      { label: "Counter", value: "Longer look-backs · regime-aware models", color: "amber" },
    ],
    body: [
      `Recency bias is the overweighting of recent experience relative to the full historical distribution. After a prolonged bull market, crash probabilities feel lower; after a drawdown, recovery feels less likely. Volatility, correlations and factor returns are all subject to the same distortion.`,

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataArray = e.data || e.dual || [];
    const dataHtml = dataArray.length ? `
      <div class="data-strip">
        ${dataArray.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color || ''}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
