<title>Market Microstructure — 15.4 MEV (Maximal Extractable Value)</title>

<style>
  :root {

  * { box-sizing: border-box; margin: 0; padding: 0; }

  }

  .page {

  .book-header {
    margin-bottom: 44px;

  .chapter-eyebrow {
    font-family: 'Space Mono', monospace;

  .book-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(30px, 5vw, 52px);

    line-height: 1.05;
    letter-spacing: -0.02em;

  .book-title em {
    font-style: italic;
    color: var(--accent);
  }

  .header-right {
    text-align: right;

  }

  .header-stat {

  }

  .header-stat strong {

    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 78px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;

  .key-insight-bar {
    background: var(--accent);

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;

    text-transform: uppercase;

  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);

    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  .note-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--slate-bg);
    border: 1px solid var(--slate-border);
    border-left: 3px solid var(--slate);
  }

  .note-box .note-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .note-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.65 !important;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Definition",
    icon: "💎",
    title: "What Is MEV?",
    desc: "The maximum value that can be extracted from block production by including, excluding, or reordering transactions beyond the standard block reward and gas fees",
    badge: { label: "Foundation", style: "slate" },
    tags: [["mev","slate"], ["extractable value","amber"], ["block producer","teal"], ["ordering","red"]],
    data: [
      { label: "Who extracts", value: "Validators, builders, searchers", color: "slate" },
      { label: "Source", value: "Transaction ordering, inclusion, exclusion", color: "amber" },
      { label: "Effect on users", value: "Worse execution, invisible tax", color: "red" },
    ],
    body: [
      `Maximal extractable value (originally “miner extractable value”) is the profit a block producer — or anyone who can influence transaction order — can earn by choosing which transactions to include and in what sequence. It arises because pending transactions are visible and because the state of on-chain markets (AMMs, lending protocols, liquidations) depends on order.`,
      `MEV is not a bug in a particular protocol; it is a structural consequence of transparent mempools and deterministic state transitions. Every DEX swap, every liquidation, and every cross-venue arbitrage creates a potential MEV opportunity.`,
      `The scale is material: on Ethereum alone, cumulative extracted MEV is measured in hundreds of millions to billions of dollars. That value is paid, ultimately, by ordinary users through worse prices, failed transactions, or diluted protocol incentives.`
    ],
    keyPoint: "MEV is the profit available from controlling transaction order. It is an invisible tax on users and a first-class revenue stream for the block-production supply chain."
  },
  {
    era: "Frontrun",
    icon: "🏃",
    title: "Frontrunning",
    desc: "Observing a pending profitable transaction and submitting a copy or competing transaction with higher priority so that it executes first",
    badge: { label: "Attack", style: "red" },
    tags: [["frontrun","red"], ["mempool","amber"], ["priority gas","slate"], ["copy trade","red"]],
    data: [
      { label: "Signal", value: "Pending tx in public mempool", color: "amber" },
      { label: "Action", value: "Submit same or better tx with higher fee", color: "red" },
      { label: "Victim", value: "Original sender loses the opportunity", color: "slate" },
    ],
    body: [
      `Frontrunning exploits the latency between broadcast and inclusion. A searcher sees a pending arbitrage, liquidation, or NFT mint in the mempool, copies the opportunity, and pays a higher priority fee (or bids in an auction) so that the searcher’s transaction is ordered first. The original transaction then fails or executes at a worse price.`,
      `Classic targets include obvious arbitrages, underpriced NFT listings, and large swaps that move an AMM price. The economic limit is the value of the opportunity itself: searchers will bid up to that value in fees or builder payments, transferring most of the profit to the block producer.`,
      `Frontrunning is the purest expression of “information advantage plus ordering control.” Private order flow and encrypted mempools exist largely to deny searchers that information advantage.`
    ],
    keyPoint: "Frontrunning is priority theft: the searcher uses visibility and fee bidding to seize an opportunity that another user had already identified and paid to execute."
  },
  {
    era: "Backrun",
    icon: "↩️",
    title: "Backrunning",
    desc: "Placing a transaction immediately after a large trade to capture the arbitrage or state change that the trade creates",
    badge: { label: "Capture", style: "amber" },
    tags: [["backrun","amber"], ["arbitrage","teal"], ["post-trade","slate"], ["atomic","teal"]],
    data: [
      { label: "Trigger", value: "Large swap or state-changing tx", color: "amber" },
      { label: "Action", value: "Arbitrage or liquidate in the same block after it", color: "teal" },
      { label: "Character", value: "Often “good” MEV — restores price efficiency", color: "slate" },
    ],
    body: [
      `Backrunning does not steal the user’s trade; it reacts to it. After a large swap moves an AMM price away from external markets, a searcher inserts an arbitrage transaction immediately afterward, trading the pool back toward fair value and pocketing the difference. Similar logic applies to liquidations that become available only after an oracle update or a large position change.`,
      `Because backrunning typically improves price efficiency, it is often classified as “beneficial” or “good” MEV. The profit still comes from someone — usually LPs via the price impact of the original trade, or the protocol via liquidation penalties — but the alternative is a prolonged mispricing.`,
      `Atomic backrunning inside the same block is only possible when the searcher can guarantee ordering, which is why the searcher–builder–validator pipeline exists.`
    ],
    keyPoint: "Backrunning is reactive extraction: it harvests the inefficiency that a large trade leaves behind. It is the on-chain analogue of index arbitrage after a blockbuster print."
  },
  {
    era: "Sandwich",
    icon: "🥪",
    title: "Sandwich Attacks",
    desc: "The combination of a frontrun and a backrun around a victim’s swap: buy before the user, let the user push the price, then sell into the user’s impact",
    badge: { label: "Critical", style: "red" },
    tags: [["sandwich","red"], ["frontrun+backrun","amber"], ["user harm","red"], ["slippage","slate"]],
    data: [
      { label: "Sequence", value: "Searcher’s buy → victim’s swap → searcher’s sell", color: "red" },
      { label: "Profit source", value: "Victim’s price impact / slippage tolerance", color: "amber" },
      { label: "Defence", value: "Tight slippage, private submission, batch auctions", color: "teal" },
    ],
    body: [
      `In a sandwich, the searcher detects a pending swap that will move the pool price, inserts a buy (or sell) immediately before it, allows the victim’s trade to execute at a worse price, and then closes the position immediately after. The victim’s slippage tolerance is the budget the searcher can extract; any unused tolerance is potential sandwich profit.`,
      `Sandwiches are unambiguously harmful to the victim: they receive a worse execution price than the pool would have given them in isolation. The aggregate cost across DeFi has been large enough to drive the adoption of private RPCs, MEV Blocker, and intent-based systems.`,
      `The attack is only possible when the victim’s transaction is visible in a public mempool and when the searcher can guarantee the surrounding order. Remove either condition and the sandwich collapses.`
    ],
    keyPoint: "A sandwich is the purest user-hostile MEV: it turns the victim’s own slippage tolerance into the searcher’s revenue. Protecting against it is the primary goal of most retail MEV defences."
  },
  {
    era: "Liquidation",
    icon: "💥",
    title: "Liquidation MEV",
    desc: "Profits earned by being the first to liquidate an undercollateralised position and collecting the liquidation bonus or discount",
    badge: { label: "Protocol", style: "amber" },
    tags: [["liquidation","amber"], ["bonus","teal"], ["lending","slate"], ["race","red"]],
    data: [
      { label: "Trigger", value: "Position health factor &lt; 1 after price move", color: "amber" },
      { label: "Reward", value: "Liquidation bonus / collateral discount", color: "teal" },
      { label: "Competition", value: "Priority gas auctions or builder bundles", color: "red" },
    ],
    body: [
      `Lending protocols allow (and incentivise) third parties to repay debt on behalf of undercollateralised borrowers in exchange for a bonus paid in collateral. When an oracle update or a large market move pushes many positions under water, a race begins to submit the liquidating transactions first.`,
      `The value of that race is MEV. Searchers monitor oracle feeds and mempools, assemble liquidation transactions (often funded by flash loans), and bid aggressively for inclusion at the top of the next block. The bonus is the prize; gas and builder payments are the cost.`,
      `From the protocol’s perspective, rapid liquidations are desirable — they protect solvency. From the borrower’s perspective, the bonus is a penalty. From the searcher’s perspective, it is a competitive, latency-sensitive business.`
    ],
    keyPoint: "Liquidation MEV is the market’s payment for enforcing protocol solvency. It is extracted in a priority race whose prize is the liquidation bonus the distressed borrower pays."
  },
  {
    era: "Arb",
    icon: "🔄",
    title: "Cross-DEX Arbitrage",
    desc: "Capturing price differences between AMMs or between AMMs and external venues by trading both sides in a single atomic transaction",
    badge: { label: "Efficiency", style: "teal" },
    tags: [["dex arb","teal"], ["cross-pool","amber"], ["atomic","slate"], ["price discovery","teal"]],
    data: [
      { label: "Condition", value: "Same pair priced differently on two pools", color: "teal" },
      { label: "Execution", value: "Buy low, sell high in one tx (often via flash loan)", color: "amber" },
      { label: "Role", value: "Keeps pools aligned; profit is the fee for that service", color: "slate" },
    ],
    body: [
      `When two pools price the same asset differently, an arbitrageur can buy on the cheap pool and sell on the expensive one in a single transaction, locking in the difference net of fees and gas. Flash loans allow this to be done with no upfront capital. The activity is the primary mechanism that keeps AMM prices consistent with each other and with external markets.`,
      `Competition among searchers is intense. Opportunities are often visible in the mempool or predictable from large pending swaps (backrunning). The residual profit after gas and builder payments is typically thin, which is why searchers invest heavily in infrastructure and in preferential order-flow arrangements.`,
      `Cross-DEX arb is the textbook example of “good” MEV: it improves price efficiency and is paid for by the temporary inefficiency itself rather than by directly harming a specific user transaction.`
    ],
    keyPoint: "Cross-DEX arbitrage is the invisible market maker that stitches fragmented AMM liquidity into a single coherent price. The MEV is the wage for that service."
  },
  {
    era: "Flashbots",
    icon: "🤖",
    title: "Flashbots & MEV Relays",

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
