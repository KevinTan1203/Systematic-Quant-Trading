  .compare-box p {

    margin-bottom: 0 !important;

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;

  .data-cell-value {
    font-family: 'Space Mono', monospace;

  .data-cell-value.red   { color: var(--red); }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }

  .footer-note {

    .entry-header { grid-template-columns: 52px 36px 1fr auto; }

<script>
const entries = [
  {
    era: "Definition",
    icon: "📐",
    title: "Capturing Statistical Price Discrepancies",
    desc: "Exploiting temporary deviations from statistically estimated equilibrium relationships",
    badge: { label: "Foundation", style: "teal" },
    tags: [["stat arb","teal"], ["mean reversion","amber"], ["relative value",""], ["market neutral","slate"]],
    data: [
      { label: "Core idea", value: "Prices deviate then revert to a statistical relationship", color: "teal" },
      { label: "Horizon", value: "Typically days to weeks", color: "" },
      { label: "Edge source", value: "Temporary mispricings + convergence", color: "amber" },
    ],
    body: [
      `Statistical arbitrage (stat arb) seeks to profit from temporary deviations of prices from relationships that have been estimated statistically and are expected to reassert themselves. Unlike pure riskless arbitrage, the edge is probabilistic: the relationship holds on average, but there is no guarantee of convergence on any single trade.`,
      `The approach is typically market-neutral or beta-neutral, focusing on relative rather than absolute price movements. Classic implementations include pairs trading, basket trading, and more complex multi-asset mean-reversion strategies. Success depends on the stability of the underlying statistical relationship, accurate estimation of mean-reversion dynamics, and disciplined risk management when the relationship breaks.`,
      `Modern stat arb sits at the intersection of econometrics, market microstructure, and portfolio construction. It is capacity-constrained, sensitive to transaction costs, and vulnerable to regime changes that invalidate historical relationships.`
    ],
    keyPoint: "Statistical arbitrage is not risk-free arbitrage. It is the systematic harvesting of mean-reverting residual risk under the assumption that estimated relationships remain sufficiently stable."
  },
  {
    era: "Classic",
    icon: "🔗",
    title: "Pairs Trading: Cointegrated Pairs",
    desc: "Trading the spread between two assets that share a long-run equilibrium",
    badge: { label: "Core", style: "teal" },
    tags: [["pairs trading","teal"], ["cointegration","amber"], ["spread",""], ["Engle-Granger","slate"]],
    data: [
      { label: "Key test", value: "Cointegration (not just correlation)", color: "teal" },
      { label: "Spread", value: "Residual of cointegrating regression", color: "" },
      { label: "Trade", value: "Long undervalued / short overvalued leg", color: "amber" },
    ],
    body: [
      `Pairs trading is the prototypical statistical arbitrage strategy. Two assets are selected because they are cointegrated: a linear combination of their prices is stationary. When the spread (the residual from the cointegrating relationship) deviates significantly from its mean, the trader takes a long position in the relatively cheap leg and a short position in the relatively expensive leg, expecting the spread to revert.`,
      `Cointegration is stronger than simple correlation. Correlated assets can drift apart indefinitely; cointegrated assets are tethered by an equilibrium relationship. Formal tests (Engle–Granger, Johansen) are used to identify candidate pairs, after which the spread’s mean-reversion properties are examined.`,
      `Practical pairs trading requires careful attention to hedge ratios, transaction costs, corporate actions, and the risk that the cointegrating relationship itself breaks down — the single largest source of pairs-trading losses.`
    ],
    keyPoint: "Correlation is not enough. Cointegration supplies the economic and statistical foundation that makes the spread a meaningful, mean-reverting object rather than a random walk."
  },
  {
    era: "Extension",
    icon: "🧺",
    title: "Basket Trading",
    desc: "Generalising pairs trading to a portfolio of assets versus another portfolio or factor",
    badge: { label: "Core", style: "teal" },
    tags: [["basket","teal"], ["multi-asset","amber"], ["residual",""], ["PCA","slate"]],
    data: [
      { label: "Structure", value: "Long basket vs short basket / factor", color: "teal" },
      { label: "Construction", value: "Regression, PCA, or optimisation", color: "" },
      { label: "Advantage", value: "Diversification of idiosyncratic risk", color: "amber" },
    ],
    body: [
      `Basket trading extends the pairs concept to richer sets of assets. A long basket is formed against a short basket (or against a factor portfolio) so that the residual spread is stationary and mean-reverting. Construction methods include multivariate cointegration, principal-component analysis, or constrained optimisation that minimises residual variance subject to dollar or beta neutrality.`,
      `Baskets reduce the impact of any single name’s idiosyncratic shock and can capture more complex relative-value relationships (sector vs sector, industry vs industry, or a custom long-short portfolio versus its residual). The cost is greater complexity in estimation, higher turnover potential, and more demanding risk management.`,
      `As with pairs, the critical assumption remains that the estimated relationship continues to hold. Basket strategies are particularly exposed to structural breaks, regime shifts, and sudden changes in factor loadings.`
    ],
    keyPoint: "Baskets increase breadth and diversification but also multiply estimation risk. The quality of the residual process, not the number of names, determines the strategy’s viability."
  },
  {
    era: "Relative Value",
    icon: "⚖️",
    title: "ETF vs. Basket Arbitrage",
    desc: "Exploiting temporary discrepancies between an ETF and its underlying or a synthetic basket",
    badge: { label: "Practical", style: "amber" },
    tags: [["ETF arb","amber"], ["creation/redemption","teal"], ["NAV",""], ["liquidity","slate"]],
    data: [
      { label: "Classic form", value: "ETF price vs NAV / underlying basket", color: "teal" },
      { label: "Mechanism", value: "Creation / redemption or cash-and-carry", color: "" },
      { label: "Friction", value: "Fees, timing, liquidity, borrow", color: "red" },
    ],
    body: [
      `ETF arbitrage exploits deviations between an ETF’s market price and the value of its underlying basket (or NAV). Authorised participants can create or redeem shares to enforce convergence, but temporary dislocations still appear because of liquidity differences, stale pricing, or order-flow imbalances.`,
      `A related strategy trades an ETF against a custom basket that replicates or approximates its exposures when the official creation basket is expensive or constrained. Lead-lag effects between the ETF and its constituents, or between related ETFs, also create short-horizon opportunities.`,
      `True arbitrage is limited by creation/redemption fees, timing risk, borrow availability, and the fact that many modern ETFs are far more liquid than their underlying holdings. What remains is typically a statistical, not riskless, edge.`
    ],
    keyPoint: "ETF–basket relationships are among the most tightly enforced in markets, yet residual statistical opportunities persist around liquidity events, stale NAVs, and microstructure frictions."
  },
  {
    era: "Dynamics",
    icon: "⏱️",
    title: "Lead-Lag Relationships",
    desc: "Exploiting delayed price discovery between related assets or markets",
    badge: { label: "Advanced", style: "amber" },
    tags: [["lead-lag","amber"], ["price discovery","teal"], ["cross-asset",""], ["high-frequency","slate"]],
    data: [
      { label: "Classic examples", value: "Index futures vs cash · large vs small caps", color: "teal" },
      { label: "Horizon", value: "Seconds to days depending on friction", color: "" },
      { label: "Edge decay", value: "Rapid as information efficiency rises", color: "red" },
    ],
    body: [
      `Lead-lag relationships arise when one asset or market incorporates information faster than another. Index futures often lead the cash equity market; large-capitalisation stocks can lead smaller peers; liquid ETFs can lead less-liquid single names or related products.`,
      `Statistical arbitrageurs estimate the lag structure (via cross-correlations, transfer entropy, or more sophisticated causality measures) and trade the lagging leg in the direction implied by the leading leg. The edge is inherently short-lived and highly sensitive to latency, transaction costs, and competition.`,
      `As markets become more efficient and participants faster, many traditional lead-lag edges compress or migrate to higher frequencies. Persistent lead-lag opportunities usually reflect structural frictions — differing trading hours, liquidity tiers, or information-access asymmetries — rather than pure inefficiency.`
    ],
    keyPoint: "Lead-lag is a pure expression of differential information incorporation. It rewards speed and precise estimation, but the half-life of the edge is typically short and shrinking."
  },
  {
    era: "Estimation",
    icon: "📉",
    title: "Mean-Reversion Speed Estimation",
    desc: "Quantifying how quickly a spread is expected to return to equilibrium",
    badge: { label: "Core", style: "teal" },
    tags: [["half-life","teal"], ["mean reversion","amber"], ["OU process",""], ["speed","slate"]],
    data: [
      { label: "Key parameter", value: "Mean-reversion speed (κ) or half-life", color: "teal" },
      { label: "Implication", value: "Holding period & expected return per trade", color: "" },
      { label: "Risk", value: "Over-estimating speed inflates expected IR", color: "red" },
    ],
    body: [
      `The economic value of a mean-reverting spread depends critically on how fast it reverts. Speed is commonly summarised by the half-life — the expected time for the spread to move halfway back to its mean — or by the mean-reversion parameter κ in an Ornstein–Uhlenbeck process.`,
      `Estimation is performed on historical residuals after the cointegrating (or hedge) relationship has been fitted. Faster mean reversion supports higher turnover and, all else equal, higher information ratios; slower mean reversion requires greater patience and larger deviation thresholds to overcome costs.`,
      `Speed estimates are noisy and regime-dependent. A spread that mean-reverted quickly in a calm market may become sticky or even trending when volatility rises or the underlying relationship weakens. Continuous re-estimation and conservative haircuts on historical speed are prudent.`
    ],
    keyPoint: "Mean-reversion speed turns a statistical relationship into a trading horizon and an expected return. Mis-estimating it is one of the most common sources of disappointing live performance."
  },
  {
    era: "Modeling",
    icon: "📊",
    title: "OU vs. GBM Spread Modeling",
    desc: "Choosing the right stochastic process for the residual spread",
    badge: { label: "Technical", style: "slate" },
    tags: [["Ornstein-Uhlenbeck","teal"], ["GBM","amber"], ["stationary",""], ["model risk","red"]],
    data: [
      { label: "OU process", value: "Mean-reverting · stationary", color: "teal" },
      { label: "GBM", value: "Geometric Brownian motion · non-stationary", color: "amber" },
      { label: "Choice", value: "Driven by statistical properties of residual", color: "" },
    ],
    body: [
      `The Ornstein–Uhlenbeck (OU) process is the workhorse model for mean-reverting spreads: it is Gaussian, stationary, and possesses an explicit mean-reversion speed and long-run mean. Most pairs and residual strategies are designed under an OU assumption.`,
      `Geometric Brownian motion (GBM) is appropriate when the residual itself behaves like a non-stationary price process — for example, when the relationship is multiplicative or when log-spreads are used. Treating a non-stationary residual as OU produces over-optimistic convergence probabilities and understated risk.`,
      `Model selection should be data-driven: formal stationarity tests, residual diagnostics, and out-of-sample forecast performance. Many live blow-ups in statistical arbitrage trace back to forcing an OU model onto a process that had become closer to a random walk.`
    ],
    keyPoint: "The choice between OU and GBM is not aesthetic — it determines the entire risk and return profile of the strategy. Fit the process to the residual, not the residual to the process."
  },
  {
    era: "Dynamic",
    icon: "📡",
    title: "Kalman Filter for Dynamic Hedges",
    desc: "Continuously updating the hedge ratio as the relationship evolves",
    badge: { label: "Advanced", style: "amber" },
    tags: [["Kalman filter","amber"], ["dynamic hedge","teal"], ["state space",""], ["adaptive","slate"]],
    data: [
      { label: "Purpose", value: "Time-varying hedge ratio estimation", color: "teal" },
      { label: "Advantage", value: "Adapts to structural drift", color: "" },
      { label: "Cost", value: "More parameters · potential overfitting", color: "red" },
    ],
    body: [
      `Static hedge ratios estimated over a fixed window become stale when the relative behaviour of the legs changes. The Kalman filter provides a principled, recursive way to update the hedge ratio (and optionally the mean and variance of the residual) as new price observations arrive.`,
      `In state-space form, the unobservable true hedge ratio is treated as a latent state that evolves slowly, while the observed spread supplies noisy measurements. The filter optimally balances prior beliefs against new information, producing a smooth, adaptive hedge.`,
      `Kalman-based approaches improve performance when relationships drift gradually, but they introduce additional degrees of freedom and can overfit noise if process and measurement variances are poorly calibrated. Robustness checks and conservative parameterisation are essential.`
    ],
    keyPoint: "A dynamic hedge keeps the residual cleaner for longer, but only if the filter itself is well-specified. Bad Kalman tuning can manufacture apparent mean reversion that does not exist."
  },
  {
    era: "Execution",
    icon: "🎯",
    title: "Entry / Exit Z-Score Thresholds",
    desc: "Rule-based triggers for opening and closing mean-reversion trades",
    badge: { label: "Practical", style: "teal" },
    tags: [["z-score","teal"], ["thresholds","amber"], ["entry/exit",""], ["discipline","slate"]],
    data: [
      { label: "Entry", value: "Typically |z| > 1.5 – 2.5", color: "teal" },
      { label: "Exit", value: "z ≈ 0 or smaller opposite threshold", color: "" },
      { label: "Stop", value: "Hard |z| or time-based stop", color: "red" },
    ],
    body: [
      `Once a residual series is obtained, trades are commonly triggered by z-score thresholds: the current deviation of the spread from its rolling mean, scaled by its rolling standard deviation. Entry occurs when the absolute z-score exceeds a chosen level; exit occurs when the z-score reverts toward zero or crosses a tighter opposite threshold.`,
      `Threshold choice balances frequency against expected edge per trade. Tighter thresholds generate more trades but smaller average moves and higher relative costs; wider thresholds produce fewer, larger moves but greater risk of non-reversion. Many practitioners also impose time stops or maximum adverse excursion limits.`,
      `Z-score rules are simple, transparent, and robust, yet they inherit all the weaknesses of the underlying residual estimate. Changing volatility regimes can make a fixed threshold too aggressive or too conservative; adaptive or volatility-scaled thresholds are sometimes used in response.`
    ],
    keyPoint: "Z-score thresholds translate a continuous residual process into discrete trading decisions. Their effectiveness is only as good as the quality and stability of the residual itself."
  },
  {
    era: "Risk",
    icon: "⚠️",
    title: "Cointegration Breakdown",
    desc: "The fundamental risk that the estimated equilibrium relationship ceases to hold",
    badge: { label: "Critical", style: "red" },
    tags: [["breakdown","red"], ["regime shift","amber"], ["structural break","teal"], ["tail risk","slate"]],
    data: [
      { label: "Cause", value: "Structural change · regime shift · news", color: "red" },
      { label: "Symptom", value: "Spread trends instead of reverts", color: "amber" },
      { label: "Defence", value: "Stops · monitoring · diversification", color: "teal" },
    ],
    body: [
      `The single largest risk in statistical arbitrage is that the cointegrating (or other statistical) relationship that justified the trade ceases to exist. Mergers, regulatory changes, shifts in business models, index reconstitutions, or macroeconomic regime changes can turn a previously stationary spread into a trending residual.`,
      `When breakdown occurs, the mean-reversion assumption fails and losses can accumulate rapidly, especially if the position is leveraged or if multiple correlated pairs break simultaneously. Historical cointegration tests offer no protection against future structural breaks.`,
      `Mitigation includes strict position sizing, hard stop-losses on the spread or on calendar time, continuous monitoring of residual diagnostics, rapid reduction of exposure when mean-reversion speed deteriorates, and diversification across many weakly correlated relationships rather than concentration in a few “best” pairs.`
    ],
    keyPoint: "Cointegration is a historical statement, not a guarantee. Every statistical arbitrage position carries the tail risk that the relationship on which it is predicated simply ends."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataArray = e.data || e.dual || [];
    const dataHtml = dataArray.length ? `
      <div class="data-strip">
        ${dataArray.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color || ''}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
