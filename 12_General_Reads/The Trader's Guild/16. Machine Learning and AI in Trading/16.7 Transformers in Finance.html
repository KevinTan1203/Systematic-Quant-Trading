    letter-spacing: -0.02em;
    line-height: 1;

  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px

  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 68px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;

  .entry-header:hover { background: var(--surface2); }

    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);

    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;
  }

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;
  }

  .key-insight-text {
    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;
  }

  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.left  { background: var(--red-bg);  border-color: var(--red-border); }
  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Core",
    icon: "🔗",
    title: "Self-Attention for Time Series",
    desc: "Content-based weighting of past observations that captures long-range dependencies without recurrence",
    badge: { label: "Core", style: "teal" },
    tags: [["self-attention","teal"], ["time series","amber"], ["long-range",""], ["parallel","slate"]],
    data: [
      { label: "Mechanism", value: "Query-Key-Value dot-product attention", color: "teal" },
      { label: "Advantage", value: "Direct access to any past step · full parallelisation", color: "" },
      { label: "Finance use", value: "Returns · order flow · multi-asset sequences", color: "amber" },
    ],
    body: [
      `Self-attention lets every time step compute a weighted average of all other steps (or a causal subset) based on learned similarity. Unlike RNNs, information can flow directly across arbitrary distances in a single layer, and the computation is fully parallelisable across the sequence.`,
      `Positional encodings (sinusoidal, learned, or relative) inject order information that pure attention would otherwise lack. Multi-head attention runs several independent attention operations in parallel, allowing the model to capture different types of temporal relationships simultaneously.`,
      `In financial time series the ability to attend selectively to distant but relevant events — regime changes, scheduled releases, or analogous past market states — is particularly valuable. Quadratic complexity with sequence length remains a practical constraint that specialised architectures later address.`
    ],
    keyPoint: "Self-attention replaces sequential memory with content-based global access. It is the architectural primitive that makes Transformers effective on long financial sequences."
  },
  {
    era: "Text",
    icon: "📄",
    title: "BERT-Based Financial Text Models",
    desc: "Bidirectional encoder representations pre-trained on text and adapted to financial language understanding",
    badge: { label: "Core", style: "teal" },
    tags: [["BERT","teal"], ["bidirectional","amber"], ["pre-training",""], ["fine-tuning","slate"]],
    data: [
      { label: "Pre-training", value: "Masked language modelling + next-sentence prediction", color: "teal" },
      { label: "Adaptation", value: "Continued pre-training or fine-tuning on finance corpora", color: "" },
      { label: "Tasks", value: "Sentiment · NER · classification · similarity", color: "amber" },
    ],
    body: [
      `BERT learns deep bidirectional representations by predicting masked tokens and sentence relationships on large text corpora. The resulting contextual embeddings capture nuance, negation and domain-specific usage far better than static word vectors.`,
      `When applied to finance, a general BERT is usually further pre-trained or fine-tuned on earnings transcripts, filings, news and research reports. The adapted model then serves as a strong backbone for sentiment classification, named-entity recognition, document ranking and semantic similarity.`,
      `Because financial language is specialised (accounting terms, forward-looking statements, legal boilerplate), domain adaptation consistently improves downstream metrics relative to off-the-shelf BERT.`
    ],
    keyPoint: "BERT supplies rich bidirectional context. Domain-adapted versions form the backbone of most modern financial text-understanding pipelines."
  },
  {
    era: "Text",
    icon: "🏦",
    title: "FinBERT",
    desc: "A finance-domain BERT variant trained on financial communication for superior sentiment and classification performance",
    badge: { label: "Core", style: "teal" },
    tags: [["FinBERT","teal"], ["domain-adapted","amber"], ["sentiment",""], ["filings","slate"]],
    data: [
      { label: "Training data", value: "Financial news · analyst reports · filings", color: "teal" },
      { label: "Primary use", value: "Sentiment · tone · ESG · credit classification", color: "" },
      { label: "Edge", value: "Outperforms generic BERT on finance benchmarks", color: "amber" },
    ],
    body: [
      `FinBERT is a family of BERT models continued-pre-trained or fine-tuned specifically on financial text. By exposing the network to the vocabulary, syntax and pragmatic conventions of markets, it produces embeddings and classifiers that better reflect professional financial language.`,
      `Typical applications include sentence-level or document-level sentiment of news and earnings releases, detection of forward-looking statements, and specialised classification tasks such as ESG relevance or credit-risk language. Publicly released checkpoints have become standard baselines in academic and industry work.`,
      `As with any pre-trained model, careful fine-tuning on the target task and rigorous temporal validation remain essential; domain adaptation reduces but does not eliminate overfitting risk on small labelled sets.`
    ],
    keyPoint: "FinBERT is the de-facto domain-adapted BERT for finance. It converts general language understanding into finance-specific sentiment and classification performance."
  },
  {
    era: "Generative",
    icon: "✍️",
    title: "GPT Models for Market Commentary",
    desc: "Autoregressive large language models used to generate, summarise and interrogate market narratives",
    badge: { label: "Advanced", style: "amber" },
    tags: [["GPT","amber"], ["generative","teal"], ["commentary",""], ["summarisation","slate"]],
    data: [
      { label: "Capabilities", value: "Summarisation · Q&A · report drafting · idea generation", color: "teal" },
      { label: "Risks", value: "Hallucination · stale knowledge · prompt sensitivity", color: "red" },
      { label: "Practical use", value: "Research assistants · compliance drafts · client notes", color: "amber" },
    ],
    body: [
      `Generative pre-trained transformers (GPT-style models) excel at producing coherent text conditioned on a prompt. In finance they are used to summarise earnings calls, draft market commentary, answer natural-language queries over internal research, and generate first-pass reports that analysts then edit.`,
      `Because they are optimised for next-token prediction rather than factual grounding, they can hallucinate numbers, misattribute statements or invent non-existent events. Retrieval-augmented generation, tool use, and human review are therefore standard safeguards.`,
      `Their value is currently greatest as productivity tools for research and communication rather than as direct generators of trading signals. Fine-tuning or heavy prompting on proprietary data can improve relevance but does not remove the need for verification.`
    ],
    keyPoint: "GPT models accelerate the production and interrogation of market narrative. They are powerful assistants whose outputs still require human or algorithmic fact-checking before any decision is taken."
  },
  {
    era: "Time Series",
    icon: "📈",
    title: "Time-Series Transformers",
    desc: "Architectures such as PatchTST and Informer that adapt the Transformer to long numerical sequences",
    badge: { label: "Advanced", style: "amber" },
    tags: [["PatchTST","amber"], ["Informer","teal"], ["long sequence",""], ["forecasting","slate"]],
    data: [
      { label: "PatchTST", value: "Patching + channel independence · strong benchmark results", color: "teal" },
      { label: "Informer", value: "ProbSparse attention · distillation · long-horizon focus", color: "" },
      { label: "Goal", value: "Scalable attention for long financial histories", color: "amber" },
    ],
    body: [
      `Standard Transformers scale quadratically with sequence length, which becomes prohibitive for high-frequency or multi-year daily series. Specialised variants address this. Informer introduces ProbSparse attention and a distillation mechanism to focus on the most relevant queries and compress the sequence. PatchTST segments the series into patches, treats each patch as a token, and often processes channels independently, achieving strong results with a simpler design.`,
      `Other members of the family (Autoformer, FEDformer, etc.) incorporate decomposition, frequency-domain operations or seasonal-trend biases tailored to forecasting. In finance they are applied to multi-horizon return, volatility and volume prediction, frequently outperforming classical and recurrent baselines when data volume is sufficient.`,
      `Hyperparameter sensitivity and the persistent low signal-to-noise ratio of market data still demand rigorous walk-forward evaluation and regularisation.`
    ],
    keyPoint: "PatchTST, Informer and related models make Transformer-style attention practical for long financial time series. They currently rank among the strongest pure deep-learning forecasting architectures."
  },
  {
    era: "Interpretability",
    icon: "🗺️",
    title: "Attention Maps for Interpretability",
    desc: "Visualising and analysing attention weights to understand which inputs the model relies on",
    badge: { label: "Conceptual", style: "slate" },
    tags: [["attention maps","slate"], ["interpretability","teal"], ["explanation",""], ["trust","amber"]],
    data: [
      { label: "What they show", value: "Which time steps or tokens receive high weight", color: "teal" },
      { label: "Usefulness", value: "Debugging · hypothesis generation · trust building", color: "" },
      { label: "Caveat", value: "Attention is not a complete causal explanation", color: "red" },
    ],
    body: [
      `Attention weights provide a built-in, differentiable view of which past observations or tokens the model emphasises when forming a prediction. Heat-maps over time, across assets, or over words in a filing can reveal whether the network is focusing on economically plausible signals or on artefacts.`,
      `In practice, attention maps help diagnose look-ahead leakage, identify regime-dependent behaviour, and communicate model logic to risk committees. Aggregating weights across heads and layers, or combining them with gradient-based methods, yields richer attributions.`,
      `Attention is only one lens: high weight does not guarantee causal importance, and models can achieve low loss while attending to spurious correlations. Complementary techniques (SHAP, integrated gradients, ablation) remain necessary for robust interpretability.`
    ],
    keyPoint: "Attention maps turn the model’s internal focus into a visible diagnostic. They improve debugging and trust but should not be mistaken for a full causal account of predictions."
  },
  {
    era: "Frontier",
    icon: "🌐",
    title: "Foundation Models for Finance",
    desc: "Large, general-purpose models pre-trained on broad financial data and adaptable to many downstream tasks",
    badge: { label: "Emerging", style: "amber" },
    tags: [["foundation models","amber"], ["pre-training","teal"], ["multi-task",""], ["adaptation","slate"]],
    data: [
      { label: "Ambition", value: "One model · many financial tasks · minimal fine-tuning", color: "teal" },
      { label: "Modalities", value: "Text · time series · tables · alternative data", color: "" },
      { label: "Status", value: "Active research · early production pilots", color: "amber" },
    ],
    body: [
      `Foundation models aim to learn general financial representations from massive, heterogeneous corpora — news, filings, prices, fundamentals, transcripts — so that a single backbone can be adapted quickly to sentiment, forecasting, risk, retrieval or generation tasks. They extend the BERT/GPT paradigm to multi-modal, multi-task financial settings.`,
      `Challenges include the proprietary and non-stationary nature of market data, the difficulty of defining universal self-supervised objectives for numerical series, and the extreme cost of training at scale. Early efforts combine continued pre-training of language models with time-series or tabular objectives and parameter-efficient adaptation methods.`,
      `If successful, foundation models could shift quant research from building specialised architectures for each problem toward prompting, light fine-tuning and retrieval over a shared financial representation. Rigorous out-of-sample and economic evaluation will determine whether the shift delivers lasting edge.`
    ],
    keyPoint: "Foundation models seek a universal financial representation that transfers across tasks and modalities. They are the current research frontier, still constrained by data access, non-stationarity and evaluation standards."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataArray = e.data || e.dual || [];
    const dataHtml = dataArray.length ? `
      <div class="data-strip">
        ${dataArray.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color || ''}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
