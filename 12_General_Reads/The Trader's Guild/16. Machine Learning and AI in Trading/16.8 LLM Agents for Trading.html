  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(

      transparent 6px,
      transparent 12px

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);

  }

  .entry-header {
    display: grid;
    grid-template-columns: 68px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;

    font-size: 9.5px;

    color: var(--accent);

    padding: 12px 16px;

  .entry-title {
    font-family: 'DM Serif Display', serif;

  .entry-desc {
    font-family: 'Space Mono', monospace;

    margin-right: 14px;

  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }

    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);

    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);

    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;

    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;

    margin-top: 18px;

    padding: 13px 15px;
    border: 1px solid var(--border);

  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Architecture",
    icon: "🤖",
    title: "Agentic Architectures",
    desc: "ReAct, Plan-and-Execute and related loops that let LLMs reason, act and observe iteratively",
    badge: { label: "Core", style: "teal" },
    tags: [["ReAct","teal"], ["Plan-and-Execute","amber"], ["agent loop",""], ["tool use","slate"]],
    data: [
      { label: "ReAct", value: "Interleave Reasoning + Acting in a single loop", color: "teal" },
      { label: "Plan-and-Execute", value: "High-level plan then step-by-step execution", color: "amber" },
      { label: "Common pattern", value: "Think → Act (tool) → Observe → Repeat", color: "" },
    ],
    body: [
      `Agentic architectures turn a static LLM into a closed-loop system that can decompose goals, call tools, inspect results and revise its approach. ReAct interleaves free-form reasoning traces with explicit actions; Plan-and-Execute first drafts a multi-step plan and then carries it out, often with a separate executor and reflector.`,
      `In trading research an agent may decide which filings to retrieve, which price series to pull, which statistical test to run, and how to synthesise the findings into a thesis. The quality of the loop depends on reliable tool interfaces, clear observation formats, and safeguards against infinite or harmful action sequences.`,
      `Production systems add memory, escalation to humans, and hard constraints on what actions (especially order placement) are permitted without approval.`
    ],
    keyPoint: "Agentic architectures give LLMs the ability to plan, use tools and iterate. They transform language models from passive generators into active research and decision-support systems."
  },
  {
    era: "Signal",
    icon: "📰",
    title: "LLM for News Interpretation & Signal",
    desc: "Using large language models to read, contextualise and convert news into structured trading signals",
    badge: { label: "Core", style: "teal" },
    tags: [["news","teal"], ["interpretation","amber"], ["signal",""], ["context","slate"]],
    data: [
      { label: "Tasks", value: "Relevance · polarity · novelty · materiality", color: "teal" },
      { label: "Advantage", value: "Context, negation, implicit meaning", color: "" },
      { label: "Limitation", value: "Latency · cost · residual hallucination", color: "red" },
    ],
    body: [
      `LLMs can interpret news stories with richer context than dictionary or smaller transformer classifiers. They handle negation, irony, comparative statements and multi-entity narratives, and can be prompted to output structured fields (affected tickers, directional implication, confidence, time horizon).`,
      `The resulting scores or categorical labels become features in systematic strategies or alerts for discretionary desks. Chain-of-thought or few-shot exemplars improve consistency; retrieval of related prior articles reduces repeated or stale reactions.`,
      `Because inference is relatively expensive and slower than specialised classifiers, many pipelines reserve LLMs for high-value or ambiguous stories while routing routine flow through lighter models.`
    ],
    keyPoint: "LLMs elevate news interpretation from keyword polarity to contextual understanding. They produce higher-quality signals at the cost of latency, compute and the need for verification."
  },
  {
    era: "Tools",
    icon: "🔌",
    title: "Tool Use: Calling APIs & Data Sources",
    desc: "Equipping LLMs with external functions so they can fetch prices, filings, fundamentals and execute analysis",
    badge: { label: "Core", style: "teal" },
    tags: [["tool use","teal"], ["function calling","amber"], ["APIs",""], ["data access","slate"]],
    data: [
      { label: "Typical tools", value: "Price API · filing DB · calculator · code sandbox", color: "teal" },
      { label: "Interface", value: "JSON schemas · function-calling APIs", color: "" },
      { label: "Risk", value: "Incorrect arguments · stale data · unbounded calls", color: "red" },
    ],
    body: [
      `Tool use (function calling) lets the model emit structured requests that the host system executes and returns as observations. In a trading context the toolset commonly includes market-data endpoints, fundamental and estimate databases, news and filing retrieval, statistical or back-test engines, and sometimes a sandboxed code interpreter.`,
      `Well-designed tools have clear schemas, deterministic behaviour and sensible rate limits. The agent must be prompted or fine-tuned to choose the right tool, supply valid arguments, and incorporate the returned data into subsequent reasoning.`,
      `Security and cost controls are essential: an unconstrained agent can generate large API bills or attempt actions outside its mandate. Human-in-the-loop gates remain standard for any tool that can move capital.`
    ],
    keyPoint: "Tool use grounds the LLM in live data and computation. It is the bridge between language reasoning and the concrete numbers that trading decisions require."
  },
  {
    era: "Multi-Agent",
    icon: "👥",
    title: "Multi-Agent Systems for Research",
    desc: "Specialised LLM agents that collaborate — analyst, sceptic, quant, risk — to produce more robust research",
    badge: { label: "Advanced", style: "amber" },
    tags: [["multi-agent","amber"], ["collaboration","teal"], ["debate",""], ["specialisation","slate"]],
    data: [
      { label: "Roles", value: "Bull · bear · quant · risk · editor", color: "teal" },
      { label: "Patterns", value: "Debate · sequential hand-off · hierarchical review", color: "" },
      { label: "Benefit", value: "Reduced bias · broader coverage · audit trail", color: "amber" },
    ],
    body: [
      `A single LLM can be prompted into multiple personas that interact. Typical research setups include a bullish analyst, a sceptical short-seller, a quantitative validator, and a risk officer. They exchange arguments, request data via tools, and converge on a structured recommendation or agree to disagree.`,
      `Orchestration frameworks manage turn-taking, shared memory and termination conditions. The resulting transcript provides an audit trail of how conclusions were reached — valuable for compliance and for improving the system.`,
      `Multi-agent designs mitigate some single-model failure modes (one-sided narratives, overlooked risks) but introduce coordination overhead and can amplify shared blind spots if all agents rely on the same underlying model and data.`
    ],
    keyPoint: "Multi-agent research systems simulate a team of specialists. They improve robustness and transparency at the price of complexity and the need for careful orchestration."
  },
  {
    era: "Code",
    icon: "💻",
    title: "LLM for Code Generation in Algo Trading",
    desc: "Generating, explaining and debugging trading strategy code, feature pipelines and back-test scripts",
    badge: { label: "Practical", style: "slate" },
    tags: [["code generation","slate"], ["algo trading","teal"], ["back-test",""], ["debugging","amber"]],
    data: [
      { label: "Use cases", value: "Strategy stubs · feature engineering · test harnesses", color: "teal" },
      { label: "Workflow", value: "Prompt → generate → review → execute in sandbox", color: "" },
      { label: "Risk", value: "Subtle logic errors · look-ahead · unsafe imports", color: "red" },
    ],
    body: [
      `LLMs trained on large code corpora can produce Python (or other) implementations of indicators, signal rules, portfolio construction logic and evaluation metrics from natural-language descriptions. They also explain existing codebases and suggest fixes for failing tests.`,
      `In quant workflows the generated code is almost always reviewed, unit-tested and run inside restricted sandboxes before it touches production data or capital. The productivity gain is largest for boilerplate, visualisation and exploratory analysis rather than for novel alpha logic.`,
      `Look-ahead bias, incorrect handling of corporate actions, and naïve transaction-cost assumptions are common failure modes that human review must catch.`
    ],
    keyPoint: "LLMs accelerate the coding layer of systematic trading. They are powerful junior developers whose output still requires senior review and rigorous testing."
  },
  {
    era: "Risk",
    icon: "⚠️",
    title: "Hallucination Risks in Financial LLMs",
    desc: "Fabricated facts, numbers and citations that can mislead research and trading decisions",
    badge: { label: "Critical", style: "red" },
    tags: [["hallucination","red"], ["fabrication","amber"], ["verification",""], ["grounding","slate"]],
    data: [
      { label: "Manifestations", value: "False numbers · invented events · wrong citations", color: "red" },
      { label: "Causes", value: "Next-token training · knowledge cut-off · ambiguity", color: "" },
      { label: "Mitigations", value: "RAG · tool verification · human review · confidence gates", color: "teal" },
    ],
    body: [
      `Large language models optimise for plausible continuations, not for factual truth. In finance this produces dangerous hallucinations: non-existent earnings figures, incorrect dates of Fed decisions, fabricated analyst names, or confident misstatements of risk metrics.`,
      `The problem is acute when the model is asked about recent events beyond its training cut-off, about obscure instruments, or about precise quantitative claims. Even domain-adapted models are not immune.`,
      `Defences include retrieval-augmented generation that forces the model to ground answers in retrieved documents, mandatory tool calls for any numeric claim, explicit uncertainty language, and a policy that no LLM output may move risk without independent verification.`
    ],
    keyPoint: "Hallucination is the central reliability risk of financial LLMs. Treat every factual claim as untrusted until it is checked against a primary source or a verified tool."
  },
  {
    era: "Retrieval",
    icon: "📚",
    title: "RAG for Filings",
    desc: "Retrieval-Augmented Generation that grounds LLM answers in the actual text of 10-Ks, 10-Qs and other documents",
    badge: { label: "Core", style: "teal" },
    tags: [["RAG","teal"], ["filings","amber"], ["retrieval",""], ["grounding","slate"]],
    data: [
      { label: "Pipeline", value: "Index → retrieve chunks → condition generation", color: "teal" },
      { label: "Benefit", value: "Reduced hallucination · citeable answers · up-to-date", color: "" },
      { label: "Design keys", value: "Chunking · embedding quality · re-ranking · citation", color: "amber" },
    ],
    body: [
      `Retrieval-Augmented Generation first retrieves relevant passages from a corpus of filings, transcripts or research, then conditions the LLM on those passages when producing an answer. The model is thereby anchored in real document text rather than in parametric memory alone.`,
      `Effective financial RAG requires careful document parsing (tables, sections, exhibits), sensible chunk sizes, high-quality embeddings, and often a re-ranker. Answers should cite the exact filing and page or section so that users can verify claims instantly.`,
      `RAG is now the default pattern for any application that must answer questions about corporate disclosures, contracts or internal research memos with high factual fidelity.`
    ],
    keyPoint: "RAG turns filings into a queryable knowledge base that the LLM can cite. It is the most practical defence against hallucination when the required knowledge lives in documents."
  },
  {
    era: "Summarisation",
    icon: "📝",
    title: "LLM for Earnings Call Summarisation",
    desc: "Automatic extraction of key points, tone shifts and Q&A highlights from lengthy earnings transcripts",
    badge: { label: "Practical", style: "slate" },
    tags: [["summarisation","slate"], ["earnings calls","teal"], ["Q&A",""], ["highlights","amber"]],
    data: [
      { label: "Outputs", value: "Bullet summary · tone delta · key Q&A · risks", color: "teal" },
      { label: "Structure", value: "Prepared remarks vs. Q&A separation", color: "" },
      { label: "Value", value: "Speed · consistency · coverage of the long tail", color: "amber" },
    ],
    body: [
      `Earnings calls often run for an hour or more. LLMs can produce structured summaries that separate management prepared remarks from the analyst Q&A, flag changes in tone or guidance relative to prior quarters, and extract the most material questions and answers.`,
      `Prompt engineering or light fine-tuning steers the model toward the fields a desk actually needs: revenue drivers, margin commentary, forward guidance, capital-allocation remarks and any unusual language. Pairing summarisation with RAG against the prior transcript enables explicit “what changed” analysis.`,
      `Human review remains advisable for high-stakes names, but even imperfect automated summaries dramatically increase the number of calls a team can monitor.`
    ],
    keyPoint: "LLM summarisation compresses earnings calls into actionable structured briefs. It scales coverage while still requiring selective human oversight for critical decisions."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataArray = e.data || e.dual || [];
    const dataHtml = dataArray.length ? `
      <div class="data-strip">
        ${dataArray.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color || ''}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
