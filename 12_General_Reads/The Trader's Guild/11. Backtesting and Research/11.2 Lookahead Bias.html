<script>
const entries = [
  {
    era: "Definition",
    icon: "🔮",
    title: "Definition: Using Future Information in Past Signals",
    desc: "The contamination of historical decision rules by information that was not available at the time the decision would have been made",
    badge: { label: "Critical", style: "red" },
    tags: [["lookahead","red"], ["information set","slate"], ["causality","teal"], ["backtest integrity","amber"]],
    data: [
      { label: "Core error", value: "Signal at t uses data known only after t", color: "red" },
      { label: "Consequence", value: "Inflated Sharpe, false discovery", color: "amber" },
      { label: "Detection", value: "Strict as-of audit of every feature", color: "teal" },
    ],
    body: [
      `Lookahead bias occurs whenever a simulated trading or investment decision at time <em>t</em> incorporates any piece of information whose true availability timestamp is strictly later than <em>t</em>. The resulting strategy appears to possess foresight that no real-world agent could have had, producing performance statistics that are systematically optimistic and non-replicable.`,
      `The bias is rarely intentional. It arises from convenient data joins, from using restated rather than original filings, from applying future index membership, from reading the close when only the open was tradeable, or from subtle off-by-one errors in lagging operations. Because the contamination is usually small on any single day yet persistent across thousands of decisions, even modest lookahead can generate economically large and statistically significant phantom alpha.`,
      `The conceptual remedy is an explicit information-set discipline: every feature, label, filter, and universe membership used at decision time <em>t</em> must be demonstrably measurable with respect to the sigma-algebra available at <em>t</em>. Anything that fails this test is lookahead.`
    ],
    keyPoint: "Lookahead bias is not a minor data-hygiene issue; it is a fundamental violation of causality. A back-test that contains it is measuring a different economic object from the strategy that can actually be traded."
  },
  {
    era: "Operations",
    icon: "↔️",
    title: "Shift Operations to Prevent Lookahead",
    desc: "Correct use of lag and lead operators so that features are aligned with the information actually known when the signal is generated",
    badge: { label: "Technique", style: "teal" },
    tags: [["shift","teal"], ["lag","amber"], ["pandas / polars","slate"], ["alignment",""]],
    data: [
      { label: "Safe pattern", value: "feature.shift(1) before using at t", color: "teal" },
      { label: "Dangerous", value: "Using contemporaneous close for same-bar signal", color: "red" },
      { label: "Rule", value: "Decision at t may use only data ≤ t−Δ", color: "amber" },
    ],
    body: [
      `In almost every time-series framework the natural way to enforce causality is an explicit shift (lag) of the feature relative to the decision timestamp. If a signal is to be formed at the close of day <em>t</em> and traded at the open of day <em>t+1</em>, every input must be known by the close of <em>t</em>; using the close return of <em>t</em> itself already embeds lookahead relative to an open-to-open or open-to-close implementation.`,
      `Common implementation pitfalls include: forgetting to shift after a rolling calculation, applying a shift only to some columns in a wide DataFrame, using <code>shift(-1)</code> when constructing labels and then accidentally reusing the same frame for features, and mixing daily and intraday bars without adjusting the lag horizon. Vectorized code makes these errors easy to introduce and hard to spot.`,
      `Best practice is to adopt a single, documented convention—e.g., “all features are lagged by one decision period relative to the label”—and to enforce it with unit tests that assert the maximum timestamp of any feature used at <em>t</em> is strictly earlier than <em>t</em>. Automated as-of checks are far more reliable than manual inspection.`
    ],
    keyPoint: "A correctly placed shift is the simplest and most powerful defence against lookahead. Any feature pipeline that cannot show an explicit, tested lag between information arrival and decision is suspect by default."
  },
  {
    era: "Features",
    icon: "🏗️",
    title: "Feature Construction Timing (t vs. t+1)",
    desc: "The precise mapping between the calendar time of a raw observation, the time it becomes known, and the time it is allowed to enter a trading signal",
    badge: { label: "Core", style: "amber" },
    tags: [["feature timing","amber"], ["t vs t+1","teal"], ["decision lag","slate"], ["execution model","red"]],
    data: [
      { label: "Safe", value: "Features known by t → signal at t → trade t+1", color: "teal" },
      { label: "Unsafe", value: "Same-bar close used for same-bar decision", color: "red" },
      { label: "Grey zone", value: "Intraday signals with partial information", color: "amber" },
    ],
    body: [
      `Every feature has three distinct timestamps: the economic time of the underlying event, the time the data become available to a realistic agent, and the time the feature is permitted to influence a portfolio decision. Conflating any two of these produces lookahead. The classic daily example is constructing a signal from the closing price of day <em>t</em> and assuming it could have been traded at that same close; in reality the close is known only after the market has finished trading.`,
      `A clean architecture therefore separates the feature as-of time from the decision time and from the intended execution time. Typical production patterns are: (a) end-of-day features known after the close are used for next-day open or next-day close execution; (b) features known by 15:45 are allowed to trade the closing auction; (c) true real-time features may act inside the same bar only if the execution model accounts for latency and market impact.`,
      `Researchers must also decide whether labels (future returns) are allowed to overlap with feature windows. Overlapping windows are statistically valid for prediction but require careful interpretation when converting forecasts into positions; non-overlapping designs simplify causality arguments at the cost of fewer observations.`
    ],
    keyPoint: "Feature timing is not a preprocessing detail; it is part of the economic definition of the strategy. The question “when could an agent first have known this number?” must have a documented answer for every column in the feature matrix."
  },
  {
    era: "Earnings",
    icon: "📢",
    title: "Earnings Data Release Timing",
    desc: "Aligning fundamental surprises, actuals, and estimates with the exact moment they entered the public information set",
    badge: { label: "Critical", style: "red" },
    tags: [["earnings","red"], ["announcement time","teal"], ["SUE","amber"], ["after-hours",""]],
    data: [
      { label: "Key field", value: "Announcement timestamp, not period end", color: "teal" },
      { label: "Risk", value: "Using actuals before the print", color: "red" },
      { label: "Nuance", value: "Pre-announcements & quiet periods", color: "amber" },
    ],
    body: [
      `Earnings-related signals are among the most frequent sources of lookahead. The fiscal-period end date is not the information date; the relevant timestamp is the moment the company releases the numbers (or the moment a reliable newswire disseminates them). Using the eventual reported EPS, revenue, or guidance in a signal dated before that release is pure lookahead.`,
      `Even after the release, practical issues remain. Many announcements occur after the close or before the open; some are corrected within minutes or hours; analyst estimate databases are themselves revised with lags. A point-in-time earnings surprise therefore requires both the original consensus snapshot that existed just prior to the announcement and the precise announcement clock time.`,
      `Strategies that trade the post-earnings-announcement drift or that condition on earnings quality must further respect the distinction between the first print and subsequent restatements. Any research design that cannot reconstruct the exact information set of a trader standing immediately before the announcement is exposed to lookahead bias of potentially large magnitude.`
    ],
    keyPoint: "For earnings signals the only safe timestamp is the public release clock time. Period-end dates, filing dates, and vendor “as-of” dates that do not match the actual dissemination moment are insufficient."
  },
  {
    era: "Fundamentals",
    icon: "📋",
    title: "Point-in-Time Fundamental Data",
    desc: "Using only the values of accounting and other fundamental items that were actually knowable on each historical date, including original filings and excluding later restatements",

    tags: [["PIT fundamentals","slate"], ["restatements","red"], ["10-K / 10-Q","teal"], ["knowledge date","amber"]],
    data: [
      { label: "Requirement", value: "Original filing values + knowledge dates", color: "teal" },
      { label: "Trap", value: "Current database view of history", color: "red" },
      { label: "Vendors", value: "True PIT vs. “point-in-time-like”", color: "amber" },
    ],
    body: [
      `Fundamental databases that simply store the latest available number for each fiscal period embed massive lookahead: restatements, revisions, and late filings are written back into history as if they had always been known. A genuine point-in-time (PIT) fundamental dataset records, for every field, both the economic period it refers to and the exact date on which that value first became public.`,
      `The difference is material. Many well-known accounting anomalies weaken or disappear once original, unrestated figures are used. Likewise, any ranking, screening, or factor construction that relies on book equity, earnings, or cash-flow items must be performed on the values that an investor could have observed at the ranking date, not on the values that appear in today’s Compustat or Worldscope extract.`,
      `Implementation requires either a vendor that supplies true PIT history or an internal engine that applies 10-K/10-Q filing dates (and amendment dates) as knowledge timestamps. Even then, researchers must decide how to treat preliminary earnings releases versus full filings and how to handle companies that never file restatements versus those that restate repeatedly.`
    ],
    keyPoint: "A fundamental factor is only as honest as its knowledge dates. Using the current “best” number for a past period is one of the most common and most severe forms of lookahead in quant equity research."
  },
  {
    era: "Index",
    icon: "📊",
    title: "Index Membership Point-in-Time",
    desc: "Constructing historical universes and benchmarks from the constituents that were actually announced and effective on each date, never from today’s membership list",
    badge: { label: "Critical", style: "red" },
    tags: [["index membership","red"], ["rebalancing","teal"], ["survivorship","amber"], ["announcement lag","slate"]],
    data: [
      { label: "Error", value: "Using current S&P 500 for past years", color: "red" },
      { label: "Correct", value: "Historical effective + announcement dates", color: "teal" },
      { label: "Lag", value: "Announcement vs. effective membership", color: "amber" },
    ],
    body: [
      `Index membership is a classic lookahead and survivorship hybrid. Taking the present-day list of S&P 500 (or any other) constituents and pretending those names were the investable universe in 2005 both excludes names that later left the index and includes names that had not yet been added. The resulting back-tests overstate the performance of almost any strategy that benefits from the characteristics of surviving large-cap stocks.`,
      `Proper point-in-time membership requires two dates for every addition or deletion: the announcement date (when the market first learned of the change) and the effective date (when the name actually entered or left the official index). Some strategies can legitimately act on the announcement; others may only use effective membership. Using future effective membership before the announcement is pure lookahead.`,
      `The same discipline applies to sector classifications, style indices, ESG ratings that feed index rules, and any proprietary universe definition. A research database that cannot reconstruct the exact membership set that existed on an arbitrary historical date cannot support unbiased index-related or universe-constrained back-tests.`
    ],
    keyPoint: "An index is not a static list; it is a time series of sets. Any historical analysis that substitutes the terminal set for the true intermediate sets is measuring a fictional, foresight-endowed portfolio."
  },
  {
    era: "Execution",
    icon: "⏱️",
    title: "Close Price vs. Open Price in Signal Construction",
    desc: "Matching the price used to form a signal with the price at which the resulting trade could realistically have been executed",
    badge: { label: "Execution", style: "amber" },
    tags: [["close vs open","amber"], ["same-bar trading","red"], ["next-open","teal"], ["liquidity timing","slate"]],
    data: [
      { label: "Unsafe", value: "Signal from close → trade at same close", color: "red" },
      { label: "Common safe", value: "Close signal → next open execution", color: "teal" },
      { label: "Alternative", value: "MOC signal with auction participation", color: "amber" },
    ],
    body: [
      `A pervasive form of lookahead (and of overly optimistic execution assumptions) is the use of the closing price both to compute a signal and to assume fills at that same price. In continuous trading the close is known only after trading has ceased; in auction markets the closing price is the result of the very orders one is trying to simulate. Treating the close as simultaneously observable and tradeable without friction is therefore internally inconsistent for most strategies.`,
      `Two clean alternatives dominate practice. The first forms the signal after the close and assumes execution at the next open (or at a volume-weighted price over the first few minutes). The second deliberately targets the closing auction, using only information available before the auction imbalance deadline and modelling the probability and cost of obtaining a fill at the official close. Both approaches require explicit latency and market-impact assumptions.`,
      `Intraday research faces analogous choices: a signal computed from the last trade of a bar cannot be assumed to trade at that same last price unless the execution model accounts for the fact that the price was itself the result of order flow that has already occurred. Aligning information time with executable price time is a first-order requirement for any claim of realism.`
    ],
    keyPoint: "The price that generates a signal and the price at which the signal is assumed to trade must belong to consistent information sets. Using the close for both, without an auction model, is one of the oldest and most persistent forms of lookahead in daily back-tests."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
