  .timeline {
    position: relative;

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(

      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px

  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);

  .entry.open .entry-card {
    border-color: var(--border2);

  }

  .entry-header {
    display: grid;
    grid-template-columns: 78px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;

  .entry-title-block {
    padding: 12px 16px;

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;

    font-family: 'Space Mono', monospace;
    font-size: 9.5px;

    font-weight: 400;

    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);

    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;

    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }

    font-size: 13.5px;

    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;

    margin-top: 18px;

    font-size: 9px;

    text-transform: uppercase;

  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
  }

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  .note-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--slate-bg);
    border: 1px solid var(--slate-border);
    border-left: 3px solid var(--slate);
  }

  .note-box .note-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
    margin-bottom: 6px;
  }

  .note-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.65 !important;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Decay",
    icon: "📉",
    title: "Market Impact and Alpha Decay with Size",
    desc: "The erosion of net expected return as position size increases, caused by rising market impact and the gradual consumption of the underlying signal",
    badge: { label: "Core", style: "red" },
    tags: [["alpha decay","red"], ["market impact","amber"], ["size dependence","teal"], ["net edge",""]],
    data: [
      { label: "Mechanism", value: "Impact rises with size; alpha is finite", color: "red" },
      { label: "Result", value: "Net alpha declines with AUM", color: "amber" },
      { label: "Implication", value: "Every edge has a capacity limit", color: "teal" },
    ],
    body: [
      `Gross alpha is not independent of the capital deployed against it. As the dollar size of a trade or portfolio grows, market impact rises (often with the square root of participation) while the informational edge itself may be partially arbitraged away or simply diluted across more shares. The result is a declining net-of-cost expected return curve.`,
      `Alpha decay with size appears in two forms. First, immediate implementation shortfall reduces the realised capture of any given signal. Second, repeated large trading in the same names can change the behaviour of other market participants, shortening the half-life of the signal. Both effects tighten the feasible capacity of the strategy.`,
      `A rigorous capacity analysis therefore maps expected net alpha (or Sharpe) as a function of deployed capital, using an explicit impact model and, where possible, empirical observations of how fill quality and subsequent returns deteriorate with size.`
    ],
    keyPoint: "Alpha is a limited resource. Market impact and signal decay convert what looks like a scalable edge at small size into a capacity-constrained opportunity once real capital is applied."
  },
  {
    era: "Liquidity",
    icon: "📊",
    title: "ADV (Average Daily Volume) Constraints",
    desc: "Limits on position size or daily trading rate expressed as a fraction of a security’s average daily volume, the most common practical liquidity bound",
    badge: { label: "Constraint", style: "teal" },
    tags: [["ADV","teal"], ["participation rate","amber"], ["liquidity","slate"], ["volume limit",""]],
    data: [
      { label: "Typical cap", value: "1–10 % of ADV per day", color: "teal" },
      { label: "Purpose", value: "Keep impact & footprint acceptable", color: "amber" },
      { label: "Horizon", value: "Must match holding period", color: "slate" },
    ],
    body: [
      `Average daily volume (ADV) is the workhorse liquidity metric. Portfolio and execution rules commonly restrict a position to a maximum percentage of ADV (e.g., no more than 5 % of 20-day ADV) or limit daily trading to a participation-rate ceiling (e.g., 10 % of that day’s volume). These constraints keep the strategy’s footprint inside the range where impact models remain calibrated and where the manager does not become the market.`,
      `The relevant ADV horizon must match the strategy’s holding period and trading style. A high-frequency strategy cares about intraday or very short-term volume; a quarterly rebalancing factor portfolio may safely use multi-month ADV. Using an overly long ADV window for a short-horizon strategy systematically overstates capacity.`,
      `ADV itself is stochastic and can collapse in stress; conservative capacity estimates therefore stress-test volume assumptions or use lower quantiles of the volume distribution rather than the simple mean.`
    ],
    keyPoint: "ADV constraints translate abstract liquidity into an enforceable position or trading limit. They are the first and most widely used quantitative expression of capacity."
  },
  {
    era: "Position",
    icon: "🧱",
    title: "Maximum Position Size per Name",
    desc: "Hard or soft ceilings on the absolute or percentage weight of any single security, driven by liquidity, risk and operational considerations",
    badge: { label: "Limit", style: "amber" },
    tags: [["max weight","amber"], ["name limit","teal"], ["concentration","red"], ["risk budget",""]],
    data: [
      { label: "Drivers", value: "Liquidity, risk, regulation, ops", color: "amber" },
      { label: "Form", value: "% of NAV or % of ADV × price", color: "teal" },
      { label: "Effect", value: "Caps contribution of any one idea", color: "slate" },
    ],
    body: [
      `Even when aggregate ADV participation looks acceptable, a single name may still be constrained by concentration risk, borrow availability, regulatory limits, or simply the desire not to own a material fraction of the free float. Maximum position-size rules therefore appear as percentage-of-NAV caps, percentage-of-float caps, or dollar limits derived from ADV and a maximum holding-period participation.`,
      `These limits interact with the signal strength: a very strong forecast may still be truncated, reducing the strategy’s ability to express conviction and thereby lowering expected return. The capacity of the overall portfolio is then the sum of the capacities of the individual names under their respective ceilings.`,
      `In optimisation the limits are imposed as hard constraints or as escalating penalty terms. Live monitoring must also detect when a rising price or falling volume pushes an existing position through its limit, triggering forced reductions.`
    ],
    keyPoint: "Per-name position limits convert liquidity and risk preferences into portfolio construction constraints. They are often the binding determinant of total strategy capacity."
  },
  {
    era: "Estimate",
    icon: "🧮",
    title: "Capacity Estimation: Signal × ADV × Price Impact",
    desc: "A practical framework that combines forecast strength, available volume and an impact function to produce a dollar capacity estimate for a strategy or individual idea",
    badge: { label: "Method", style: "slate" },
    tags: [["capacity estimate","slate"], ["signal strength","teal"], ["impact function","amber"], ["bottom-up",""]],
    data: [
      { label: "Inputs", value: "α forecast, ADV, impact model", color: "slate" },
      { label: "Logic", value: "Size until net α = hurdle", color: "teal" },
      { label: "Output", value: "Max $ that keeps edge alive", color: "amber" },
    ],
    body: [
      `A bottom-up capacity estimate asks, for each name or for the portfolio as a whole, how large a position can be taken before the expected net alpha after impact falls to a required hurdle (zero, the risk-free rate, or a minimum Sharpe contribution). The calculation multiplies a signal-strength or expected-return forecast by the available ADV, then applies a price-impact function to determine the largest participation rate that still leaves positive net edge.`,
      `Typical implementations solve for the size \(Q^*\) that maximises \(Q \times (\alpha - c(Q))\), where \(c(Q)\) is the expected impact-and-fee cost of trading and holding \(Q\). Summing or optimising across the universe yields a total strategy capacity under the chosen hurdle and risk constraints.`,
      `The quality of the estimate hinges on the realism of the impact model and on whether the alpha forecast itself remains valid at the larger size. Sensitivity analysis around both inputs is essential.`
    ],
    keyPoint: "Capacity is the capital level at which net alpha is driven to the acceptable floor. Estimating it requires an explicit marriage of signal, volume and impact — not a pure ADV percentage."
  },
  {
    era: "Scale",
    icon: "📈",
    title: "Slippage Growth with AUM",
    desc: "The empirical and modelled rise in average implementation shortfall as assets under management increase, often the first observable sign that capacity is being approached",
    badge: { label: "Empirical", style: "red" },
    tags: [["slippage vs AUM","red"], ["implementation shortfall","amber"], ["scaling curve","teal"], ["live TCA",""]],
    data: [
      { label: "Pattern", value: "Slippage rises with √AUM or faster", color: "red" },
      { label: "Diagnostic", value: "TCA by size bucket", color: "teal" },
      { label: "Action", value: "Throttle growth or improve execution", color: "amber" },
    ],
    body: [
      `As AUM grows, the same percentage turnover moves more dollars and therefore consumes a larger fraction of available liquidity. Average slippage and implementation shortfall consequently rise. Plotting realised shortfall against deployed capital (or against average daily participation) produces an empirical capacity curve that can be compared with the model-based estimate.`,
      `The growth is rarely linear; square-root or more severe scaling is common once participation rates leave the low-single-digit range. Abrupt jumps can also appear when the strategy begins to hit borrowing limits, venue capacity, or the attention of other large players.`,
      `Live transaction-cost analysis segmented by size is therefore a critical early-warning system. When slippage begins to climb faster than the impact model predicted, capacity is being reached and either growth must slow or the execution process must improve.`
    ],
    keyPoint: "Slippage that rises with AUM is the market’s verdict on capacity. Model estimates are necessary; the live cost curve is decisive."
  },
  {
    era: "Breadth",
    icon: "🌐",
    title: "Universe Size and Capacity",
    desc: "The dependence of total deployable capital on the number of independent, liquid names available to the strategy",
    badge: { label: "Structure", style: "teal" },
    tags: [["universe size","teal"], ["breadth","amber"], ["diversification","slate"], ["capacity scaling",""]],
    data: [
      { label: "Relation", value: "More liquid names → higher capacity", color: "teal" },
      { label: "Limit", value: "Signal quality often falls with breadth", color: "amber" },
      { label: "Trade-off", value: "Depth vs. width of the opportunity set", color: "slate" },
    ],
    body: [
      `Holding per-name capacity fixed, total strategy capacity scales roughly with the number of independent positions that can be taken. A strategy that can trade 500 liquid names has, all else equal, far higher capacity than one confined to 50. Expanding the universe is therefore a primary lever for increasing deployable capital.`,
      `The expansion is constrained by signal quality and by correlation. Adding names with weaker forecasts or with high residual correlation to the existing book increases capital but may dilute Sharpe or raise risk. In addition, many “extra” names sit further down the liquidity spectrum, so their individual capacities are smaller and their impact functions steeper.`,
      `Optimal universe design balances the marginal capacity contribution of each additional name against the marginal deterioration in expected net alpha and the marginal increase in complexity and risk.`
    ],
    keyPoint: "Capacity is the product of breadth and depth. A wider liquid universe raises the ceiling; only names that still carry positive net alpha after impact actually lift it."
  },
  {
    era: "Leverage",
    icon: "⚖️",
    title: "Optimal Leverage for Capacity-Constrained Strategies",
    desc: "The choice of gross or net exposure that maximises risk-adjusted return once market-impact and ADV limits are recognised as binding constraints",
    badge: { label: "Optimization", style: "amber" },
    tags: [["optimal leverage","amber"], ["capacity constraint","red"], ["Kelly-like","teal"], ["risk scaling",""]],
    data: [
      { label: "Problem", value: "Leverage ↑ raises both return & impact", color: "amber" },
      { label: "Solution", value: "Max net SR or utility under impact", color: "teal" },
      { label: "Result", value: "Often lower leverage than unconstrained", color: "slate" },
    ],
    body: [
      `In an unconstrained Markowitz or Kelly setting, optimal leverage is determined by expected return, volatility and risk aversion. Once market impact is introduced, additional leverage increases not only risk but also the fraction of ADV consumed and therefore the expected cost. The optimal leverage is the point at which the marginal increase in gross expected return is exactly offset by the marginal increase in impact cost and risk penalty.`,
      `Practically this is solved by embedding the impact function inside the portfolio optimiser or by evaluating a grid of leverage levels and selecting the one that maximises net-of-cost Sharpe or a chosen utility. The resulting leverage is almost always lower than the frictionless optimum, and it declines further as AUM grows.`,
      `Capacity-aware leverage also interacts with drawdown control: because impact is convex in size, forced deleveraging in a drawdown can be especially costly, reinforcing the case for starting at a more conservative exposure.`
    ],
    keyPoint: "When capacity binds, leverage is no longer a free risk dial. The optimal exposure internalises impact and is typically more conservative than classical formulas suggest."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
