      `Reg NMS also contributed to market fragmentation: today, trading in any single US stock occurs across approximately 13 public exchanges and dozens of dark pools and internalizers. While competition reduced commissions, the complexity of routing and the opacity of execution quality raised concerns about whether retail investors truly benefited. Critics call the resulting market structure a "rigged game" — a view popularised by Michael Lewis in "Flash Boys" (2014).`

function renderEntries() {
  const container = document.getElementById('entries');
  document.getElementById('countLabel').textContent = `${entries.length} entries`;
  entries.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `entry-${i}`;

    const tagsHtml = e.tags.map((t, ti) => {
      const style = e.tagStyle && e.tagStyle[ti] ? e.tagStyle[ti] : '';
      return `<span class="tag ${style}">${t}</span>`;
    }).join('');

    const bodyHtml = e.body.map(p => `<p>${p}</p>`).join('') +
      (e.keyPoint ? `<div class="key-point">⚑ ${e.keyPoint}</div>` : '') +
      `<div class="tags">${tagsHtml}</div>`;

    div.innerHTML = `
      <div class="entry-header" onclick="toggle(${i})">
        <span class="entry-year">${e.year}</span>
        <span class="entry-title">${e.title}</span>
        <span class="entry-toggle">▶</span>
      </div>
      <div class="entry-body">${bodyHtml}</div>
    `;
    container.appendChild(div);
  });
}

function toggle(i) {
  const el = document.getElementById(`entry-${i}`);
  el.classList.toggle('open');
}

function toggleAll(open) {
  entries.forEach((_, i) => {
    const el = document.getElementById(`entry-${i}`);
    if (open) el.classList.add('open');
    else el.classList.remove('open');
  });
}

renderEntries();
</script>
