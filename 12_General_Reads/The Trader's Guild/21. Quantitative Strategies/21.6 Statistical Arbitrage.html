 residual mean reversion · factor neutrality · pair z-score · basket spread · cointegration risk · low latency

 <script>
 const entries = [
 {
 era: "Core Idea",
 icon: "📐",
 title: "Exploiting Mean-Reverting Residuals",
 desc: "Construct factor-neutral portfolios and trade the residual series that are expected to revert to zero",
 badge: { label: "Framework", style: "teal" },
 tags: [
 ["stat arb", "teal"],
 ["residuals", "amber"],
 ["factor neutral", ""],
 ["mean reversion", "slate"],
 ],
 data: [
 {
 label: "Approach",
 value: "Trade residuals of factor-neutral books",
 color: "teal",
 },
 {
 label: "Neutrality",
 value: "Remove systematic factor exposures",
 color: "amber",
 },
 {
 label: "Edge",
 value: "Idiosyncratic residual mean reversion",
 color: "slate",
 },
 ],
 body: [
 "Statistical arbitrage seeks to profit from the temporary deviations of prices or spreads from the values implied by a statistical model, while remaining approximately neutral to broad market and common-factor moves. The central object of trade is the residual—the component of return left after a factor model has explained the systematic portion of price variation.",
 "By constructing portfolios that are long and short in such a way that net exposure to the chosen factors is near zero, the strategy isolates idiosyncratic, mean-reverting fluctuations. When a residual becomes unusually large (positive or negative), the portfolio is positioned for its expected return toward zero. When the residual normalises, the position is exited.",
 "The approach sits between pure pairs trading and multi-factor equity market-neutral investing. It relies on the twin assumptions that a well-specified factor model captures most of the correlated movement among assets and that the remaining idiosyncratic residuals exhibit economically exploitable mean reversion over horizons of days to weeks.",
 ],
 keyPoint:
 "Statistical arbitrage is the systematic harvesting of mean reversion in the residual space that remains after common factors have been removed.",
 },
 {
 era: "Signals",
 icon: "📡",
 title: "Signal Inputs and Residual Construction",
 desc: "Residual returns after a factor model, pair z-scores, and basket-spread z-scores",
 badge: { label: "Mechanism", style: "amber" },
 tags: [
 ["residual return", "teal"],
 ["pair z-score", "amber"],
 ["basket spread", ""],
 ["factor model", "slate"],
 ],
 data: [
 {
 label: "Primary signal",
 value: "Standardised residual after factor model",
 color: "teal",
 },
 {
 label: "Pairs",
 value: "Z-score of cointegrated or residual spread",
 color: "amber",
 },
 {
 label: "Baskets",
 value: "Z-score of multi-asset residual portfolio",
 color: "slate",
 },
 ],
 body: [
 "The foundational signal is the residual return obtained by regressing an asset’s return on a set of factors (market, size, value, industry, or statistical principal components) and retaining the intercept-plus-error term. This residual is then standardised—often as a z-score relative to its recent volatility—to produce a trading signal. Extreme positive residuals are shorted; extreme negative residuals are bought.",
 "Classic pairs trading is the two-asset special case. A cointegration relationship or a simple residual spread is estimated; the z-score of that spread generates entry and exit thresholds. When the z-score exceeds a chosen level the pair is traded for reversion; when it returns toward zero the trade is closed.",
 "Basket or multi-asset versions generalise the same logic. A portfolio of several securities is formed so that it is factor-neutral by construction; the residual value of the basket is monitored and traded when its z-score becomes extreme. The richer residual series can improve diversification and reduce the impact of any single cointegration failure.",
 ],
 keyPoint:
 "All statistical-arbitrage signals ultimately measure how far a residual or spread has travelled from its statistical equilibrium and bet on its return.",
 },
 {
 era: "Assumptions",
 icon: "🧠",
 title: "Market Assumptions and Model Foundations",
 desc: "Factor exposures explain most correlated movement; idiosyncratic residuals mean-revert",
 badge: { label: "Theory", style: "slate" },
 tags: [
 ["factor model", "teal"],
 ["idiosyncratic", "amber"],
 ["mean reversion", ""],
 ["neutrality", "slate"],
 ],
 data: [
 {
 label: "Factor role",
 value: "Explain majority of co-movement",
 color: "teal",
 },
 {
 label: "Residual behaviour",
 value: "Idiosyncratic residuals mean-revert",
 color: "amber",
 },
 {
 label: "Implication",
 value: "Neutral books isolate tradable noise",
 color: "slate",
 },
 ],
 body: [
 "Statistical arbitrage rests on two linked assumptions. First, a suitably chosen factor model accounts for the bulk of the contemporaneous correlation among the assets in the universe. Once those factor exposures are hedged, the remaining residuals are largely idiosyncratic. Second, those idiosyncratic residuals exhibit mean reversion over intermediate horizons—driven by temporary liquidity imbalances, slow diffusion of stock-specific information, or inventory effects among market makers.",
 "If the factor model is well specified, the residual portfolio has low net exposure to market direction, sector moves, and other systematic risks. Performance then depends primarily on the strength and stability of residual mean reversion rather than on the correctness of a directional market view.",
 "The assumptions fail when the factor model is incomplete (omitted factors appear), when residuals become permanently displaced by corporate events or structural change, or when mean reversion weakens because the residual series itself begins to trend. Continuous monitoring of residual diagnostics and factor exposures is therefore essential.",
 ],
 keyPoint:
 "The edge exists only in the residual space; any leakage of systematic factor exposure converts statistical arbitrage into an unintended directional or style bet.",
 },
 {
 era: "Horizon",
 icon: "⏱️",
 title: "Typical Holding Period and Turnover",
 desc: "Days to weeks—longer than pure high-frequency market making, shorter than classic medium-term momentum",
 badge: { label: "Design", style: "teal" },
 tags: [
 ["days to weeks", "teal"],
 ["intermediate", "amber"],
 ["turnover", ""],
 ["reversion half-life", "slate"],
 ],
 data: [
 {
 label: "Holding period",
 value: "Typically days to a few weeks",
 color: "teal",
 },
 {
 label: "Driver",
 value: "Half-life of residual mean reversion",
 color: "amber",
 },
 {
 label: "Turnover",
 value: "Material but lower than pure HFT",
 color: "slate",
 },
 ],
 body: [
 "Statistical-arbitrage holding periods are characteristically intermediate. Residuals that arise from liquidity shocks or slow information diffusion tend to revert over a few days to a few weeks. Positions are therefore opened when residual z-scores become extreme and closed when they normalise or when a time-based or stop-loss rule is triggered.",
 "The optimal horizon is governed by the estimated half-life of the residual process. Faster residual processes support shorter holding periods and higher turnover; slower processes allow multi-week holds. In practice most equity statistical-arbitrage books operate with average holding periods measured in days to low tens of days.",
 "Because turnover remains material, transaction costs and market impact are first-order considerations. Capacity is constrained both by the liquidity of the underlying names and by the speed at which competing residual traders detect and arbitrage the same dislocations.",
 ],
 keyPoint:
 "The holding period is matched to the statistical half-life of the residual; too short and costs dominate, too long and the mean-reversion edge decays.",
 },
 {
 era: "Risk",
 icon: "⚖️",
 title: "Risk Profile and Performance Characteristics",
 desc: "Attractive Sharpe ratios in normal regimes, but material blow-up risk when residual relationships break",
 badge: { label: "Profile", style: "amber" },
 tags: [
 ["Sharpe 1.5–3.0", "teal"],
 ["blow-up risk", "red"],
 ["cointegration", "amber"],
 ["residual variance", "slate"],
 ],
 data: [
 {
 label: "Typical Sharpe",
 value: "1.5 – 3.0 in favourable regimes",
 color: "teal",
 },
 {
 label: "Primary risk",
 value: "Cointegration or residual-model failure",
 color: "red",
 },
 {
 label: "Character",
 value: "Moderate returns · left-tail events",
 color: "amber",
 },
 ],
 body: [
 "Well-executed statistical-arbitrage strategies have historically delivered Sharpe ratios in the 1.5–3.0 range after costs, reflecting the relatively high information content of residual mean-reversion signals and the benefit of factor neutrality. Returns are generated by a large number of small, positively expected trades rather than by a few large directional bets.",
 "The dominant risk is model or relationship failure. A residual series that has mean-reverted reliably for months can suddenly stop doing so after a corporate event, a change in business fundamentals, an accounting restatement, or a structural shift in the market. Positions that assume continued reversion then become outright directional exposures and can generate large losses.",
 "Because many residual trades can be correlated through common liquidity or sector effects, portfolio-level drawdowns can exceed what single-name residual volatility would suggest. Continuous residual diagnostics, hard position limits, and rapid reduction of exposure when residual variance or half-life estimates deteriorate are essential risk-management practices.",
 ],
 keyPoint:
 "Statistical arbitrage offers attractive risk-adjusted returns precisely while residual mean reversion remains intact; the largest losses occur when that statistical relationship breaks.",
 },
 {
 era: "Infrastructure",
 icon: "🖥️",
 title: "Infrastructure and Operational Requirements",
 desc: "Real-time factor-model computation, low-latency execution, and a robust portfolio-management system",
 badge: { label: "Ops", style: "slate" },
 tags: [
 ["factor engine", "teal"],
 ["low latency", "amber"],
 ["portfolio system", ""],
 ["real-time", "slate"],
 ],
 data: [
 {
 label: "Computation",
 value: "Real-time or high-frequency factor residuals",
 color: "teal",
 },
 {
 label: "Execution",
 value: "Low-latency order routing and smart sizing",
 color: "amber",
 },
 {
 label: "Management",
 value: "Integrated portfolio and risk system",
 color: "slate",
 },
 ],
 body: [
 "Statistical arbitrage places heavier demands on infrastructure than classic medium-term factor investing. Factor exposures and residuals must be recomputed frequently—often intraday—so that signals remain current and unintended factor drift is detected promptly. This requires a robust, low-latency factor-model engine fed by clean, point-in-time market and fundamental data.",
 "Execution infrastructure must support rapid, cost-aware trading of potentially hundreds of names. Low-latency connectivity, smart-order routing, and careful management of market impact are necessary because the residual edge is typically measured in tens of basis points and can be eroded quickly by slippage.",
 "A comprehensive portfolio-management system integrates signal generation, position sizing, factor-exposure monitoring, residual diagnostics, and real-time risk limits. Corporate actions, dividends, and borrow availability for short positions must be handled accurately. Operational failures—stale factor loadings, missed corporate events, or execution glitches—can convert a market-neutral residual book into a source of large, unexpected losses.",
 ],
 keyPoint:
 "Statistical arbitrage is as much a technology and data problem as a statistical one; the quality of the real-time residual engine and execution stack determines whether the theoretical edge is captured.",
 },
 {
 era: "Failures",
 icon: "⚠️",
 title: "Common Failure Modes",
 desc: "Cointegration or residual-model breakdown, omitted-factor leakage, and crowded residual trades",
 badge: { label: "Risk", style: "red" },
 tags: [
 ["model break", "red"],
 ["omitted factors", "amber"],
 ["crowding", ""],
 ["liquidity", "slate"],
 ],
 data: [
 {
 label: "Structural",
 value: "Residual mean-reversion relationship fails",
 color: "red",
 },
 {
 label: "Specification",
 value: "Omitted factors create residual leakage",
 color: "amber",
 },
 {
 label: "Competitive",
 value: "Crowding compresses residual opportunities",
 color: "slate",
 },
 ],
 body: [
 "The most fundamental failure is the breakdown of the residual mean-reversion relationship itself. A pair or residual series that has been stationary for an extended period can become non-stationary after a merger, a major earnings surprise, a regulatory change, or a shift in the competitive landscape. Continuing to trade the old residual produces systematic losses.",
 "A second failure mode arises from incomplete factor models. If an important common factor is omitted, residual portfolios retain unintended systematic exposure. When that omitted factor moves sharply, the supposedly market-neutral book experiences correlated losses across many positions simultaneously.",
 "Crowding constitutes a third risk. As more capital pursues the same residual signals, the size and duration of residual dislocations shrink, and the available alpha after costs declines. In extreme cases the residual strategies themselves become a source of liquidity demand, amplifying adverse moves when many participants attempt to exit at once.",
 ],
 keyPoint:
 "Statistical arbitrage fails when the residual ceases to mean-revert, when hidden factor exposures reappear, or when too many competitors compete for the same residual opportunities.",
 },
 ];
 function render() {
 document.getElementById("entries-root").innerHTML = entries
 .map(
 (e, i) =>
 `<article class="entry ${i === 0 ? "open" : ""}"><div class="entry-card"><div class="entry-header" onclick="toggleEntry(this.parentElement.parentElement)"><div class="entry-era">${e.era}</div><div class="entry-icon">${e.icon}</div><div class="entry-title-block"><div class="entry-title">${e.title}</div><div class="entry-desc">${e.desc}</div></div><div class="entry-badge badge-${e.badge.style}">${e.badge.label}</div><div class="entry-toggle">›</div></div><div class="entry-body">${e.body.map((p) => `<p>${p}</p>`).join("")}<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div><div class="data-strip">${e.data.map((d) => `<div class="data-cell"><div class="data-cell-label">${d.label}</div><div class="data-cell-value ${d.color}">${d.value}</div></div>`).join("")}</div><div class="tags">${e.tags.map((t) => `<span class="tag ${t[1] || ""}">${t[0]}</span>`).join("")}</div></div></div></article>`,
 )
 .join("");
 }
 function toggleEntry(entry) {
 entry.classList.toggle("open");
 }
 function toggleAll(open) {
 document
 .querySelectorAll(".entry")
 .forEach((entry) => entry.classList.toggle("open", open));
 }
 render();
 </script>
