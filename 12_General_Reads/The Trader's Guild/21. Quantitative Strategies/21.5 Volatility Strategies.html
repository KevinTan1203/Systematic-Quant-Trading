 <script>
 const entries = [
 {
 era: "Overview",
 icon: "📊",
 title: "Trading Volatility as an Asset Class",
 desc: "Strategies that take explicit long or short positions in implied or realized volatility rather than in directional price moves",
 badge: { label: "Framework", style: "teal" },
 tags: [
 ["volatility", "teal"],
 ["implied", "amber"],
 ["realized", ""],
 ["options", "slate"],
 ],
 data: [
 {
 label: "Core exposure",
 value: "Implied or realized volatility",
 color: "teal",
 },
 {
 label: "Instruments",
 value: "Options · variance swaps · VIX products",
 color: "amber",
 },
 {
 label: "Key distinction",
 value: "Long vol vs short vol profiles",
 color: "slate",
 },
 ],
 body: [
 "Volatility strategies treat the magnitude of price fluctuations—rather than their direction—as the primary source of risk and return. Traders can be long volatility (profiting when realized or implied volatility rises) or short volatility (profiting when volatility falls or remains subdued). The building blocks are options, variance swaps, volatility futures, and dynamic hedging of option portfolios.",
 "Because volatility is mean-reverting yet subject to sudden spikes, the risk profiles of long-vol and short-vol strategies are almost mirror images of each other. Short-volatility approaches collect steady premium but carry left-tail risk; long-volatility approaches pay a steady premium for the right to benefit from rare large moves.",
 "Four canonical implementations dominate practical trading: outright short volatility (selling premium), outright long volatility (buying premium or tail hedges), gamma scalping (dynamically hedging a long-gamma book), and systematic harvesting of the volatility risk premium (the average excess of implied over realized volatility).",
 ],
 keyPoint:
 "Volatility is an asset class with its own risk premia, term structure, and skew; strategies succeed or fail according to how they position relative to implied versus realized volatility.",
 },
 {
 era: "Short Vol",
 icon: "📉",
 title: "Short Volatility Strategies",
 desc: "Sell options premium—covered calls, short strangles, iron condors—and collect theta decay",
 badge: { label: "Income", style: "amber" },
 tags: [
 ["short premium", "amber"],
 ["theta", "teal"],
 ["strangle", ""],
 ["iron condor", "slate"],
 ],
 data: [
 {
 label: "Structures",
 value: "Covered call · short strangle · iron condor",
 color: "teal",
 },
 {
 label: "Income source",
 value: "Theta decay of sold options",
 color: "amber",
 },
 {
 label: "Primary risk",
 value: "Sudden vol spike and gamma losses",
 color: "red",
 },
 ],
 body: [
 "Short-volatility strategies generate income by selling options and collecting the premium. Common structures include covered-call overlays on equity holdings, short strangles (short put and short call at out-of-the-money strikes), and iron condors (a short strangle protected by further out-of-the-money long options). In each case the dominant positive Greek is theta: time decay works in the seller’s favour as long as the underlying remains inside the profit range.",
 "The economic rationale is that implied volatility systematically exceeds subsequent realized volatility on average—the volatility risk premium. By selling implied volatility the trader earns that premium in calm or moderately volatile markets. Position sizing, strike selection, and portfolio-level risk limits determine how much of the premium is retained after costs and occasional large losses.",
 "The defining risk is a sudden spike in realized volatility or a large directional move that drives the short options deep in-the-money. Gamma becomes large and negative, delta hedges (if used) cannot keep pace, and losses can exceed many months of collected premium in a single episode. Short-volatility books therefore require strict risk controls, dynamic hedging or stop rules, and an explicit recognition of left-tail exposure.",
 ],
 keyPoint:
 "Short volatility is a strategy of collecting a steady premium in exchange for bearing the risk of infrequent but potentially severe losses when volatility explodes.",
 },
 {
 era: "Long Vol",
 icon: "📈",
 title: "Long Volatility Strategies",
 desc: "Buy straddles or strangles around catalysts and use VIX call spreads as portfolio tail hedges",
 badge: { label: "Protection", style: "teal" },
 tags: [
 ["long premium", "teal"],
 ["straddle", "amber"],
 ["VIX", ""],
 ["tail hedge", "slate"],
 ],
 data: [
 {
 label: "Catalyst trades",
 value: "Straddles / strangles into earnings or FOMC",
 color: "teal",
 },
 {
 label: "Portfolio hedge",
 value: "VIX call spreads or longer-dated puts",
 color: "amber",
 },
 {
 label: "Primary risk",
 value: "Theta burn in prolonged low-vol regimes",
 color: "red",
 },
 ],
 body: [
 "Long-volatility strategies profit when realized or implied volatility rises. Event-driven implementations buy straddles or strangles ahead of known catalysts—earnings announcements, central-bank decisions, geopolitical events—expecting the subsequent realized move to exceed the implied volatility priced into the options. If the catalyst delivers a large enough move, the long options expand in value by more than the premium paid.",
 "A second, portfolio-level use is explicit tail hedging. VIX call spreads, longer-dated index puts, or variance-swap longs are held as insurance against equity-market crashes or volatility spikes. These positions typically lose money in quiet markets (theta decay and roll-down of the VIX term structure) but can produce large positive returns precisely when other portfolio holdings suffer.",
 "The central cost of being long volatility is continuous theta burn. In extended low-volatility environments the premium paid for options or volatility futures erodes steadily, producing a negative drag on performance. Successful long-vol programs therefore size positions modestly, time entries around elevated uncertainty, or combine them with short-vol income strategies to offset the carry cost.",
 ],
 keyPoint:
 "Long volatility pays a steady premium for the right to benefit from rare, large volatility expansions; the challenge is surviving the quiet periods without excessive decay.",
 },
 {
 era: "Gamma",
 icon: "🔄",
 title: "Gamma Scalping",
 desc: "Hold a long-gamma options book and continuously delta-hedge to monetize realized volatility",
 badge: { label: "Dynamic", style: "slate" },
 tags: [
 ["long gamma", "teal"],
 ["delta hedge", "amber"],
 ["scalping", ""],
 ["realized vol", "slate"],
 ],
 data: [
 {
 label: "Position",
 value: "Long options · continuously delta-hedged",
 color: "teal",
 },
 {
 label: "Profit condition",
 value: "Realized vol > implied vol paid",
 color: "amber",
 },
 {
 label: "P&L approximation",
 value: "0.5 × Γ × (ΔS)² − Θ × Δt",
 color: "slate",
 },
 ],
 body: [
 "Gamma scalping begins with a long-gamma options position—typically a long straddle or strangle—whose delta is kept near zero by continuous or frequent hedging in the underlying. Each time the underlying moves, the hedge is adjusted: the trader buys after price declines and sells after price rises, thereby “scalping” small profits from the convexity of the options.",
 "The approximate instantaneous profit-and-loss of a delta-hedged long-gamma book is given by ½ × Gamma × (dS)² − Theta × dt. The first term is the gain from realized variance; the second is the cost of time decay. When realized volatility exceeds the implied volatility that was paid for the options, the gamma term dominates and the strategy is profitable on average.",
 "Successful gamma scalping therefore requires two conditions: an entry price (implied volatility) that is not excessively high, and a subsequent realized volatility path that is large enough to overcome theta. Transaction costs, discrete hedging error, and overnight gaps are practical frictions that reduce the theoretical edge. The strategy is most attractive when implied volatility is low relative to expected future realized volatility.",
 ],
 keyPoint:
 "Gamma scalping converts a view that realized volatility will exceed implied volatility into a dynamically hedged, market-neutral P&L stream.",
 },
 {
 era: "VRP",
 icon: "⚖️",
 title: "Volatility Risk Premium (VRP)",
 desc: "Systematically short implied volatility and long realized volatility to harvest the average premium",
 badge: { label: "Premium", style: "amber" },
 tags: [
 ["VRP", "teal"],
 ["IV > RV", "amber"],
 ["variance swap", ""],
 ["delta-hedged", "slate"],
 ],
 data: [
 {
 label: "Empirical fact",
 value: "IV exceeds RV by ~2–3 vol points on average",
 color: "teal",
 },
 {
 label: "Harvest method",
 value: "Variance swaps or delta-hedged short options",
 color: "amber",
 },
 {
 label: "Nature",
 value: "Compensation for bearing vol-of-vol and crash risk",
 color: "slate",
 },
 ],
 body: [
 "The volatility risk premium is the well-documented tendency for implied volatility to exceed subsequent realized volatility on average. Across equity indices the difference is typically two to three volatility points; similar premia appear in other asset classes. Investors who are short implied volatility and effectively long realized volatility therefore earn a positive expected return in normal times.",
 "The premium can be harvested through variance swaps (which pay realized variance minus a fixed strike) or through portfolios of delta-hedged short straddles and strangles. In both cases the trader is compensated for bearing volatility risk—especially the risk that realized volatility will spike far above the level that was implied at inception.",
 "Because the VRP is itself a risk premium, it is not an arbitrage. Periods of market stress produce large negative realizations precisely when marginal utility is high. Systematic VRP strategies therefore exhibit negative skew and material drawdowns during volatility spikes, even while delivering attractive long-run average returns and Sharpe ratios.",
 ],
 keyPoint:
 "The volatility risk premium is the average excess of implied over realized volatility; harvesting it is economically equivalent to selling insurance against volatility shocks.",
 },
 {
 era: "Risk",
 icon: "⚠️",
 title: "Risk Profiles and Failure Modes",
 desc: "Short-vol left tails versus long-vol theta drag; the common danger of mis-estimating future realized volatility",
 badge: { label: "Risk", style: "red" },
 tags: [
 ["left tail", "red"],
 ["theta drag", "amber"],
 ["vol spike", ""],
 ["model risk", "slate"],
 ],
 data: [
 {
 label: "Short vol risk",
 value: "Sudden spikes and gamma blow-ups",
 color: "red",
 },
 {
 label: "Long vol risk",
 value: "Persistent theta burn in calm markets",
 color: "amber",
 },
 {
 label: "Shared risk",
 value: "Incorrect forecast of realized vs implied",
 color: "slate",
 },
 ],
 body: [
 "Short-volatility strategies fail most spectacularly when realized volatility explodes. A single large move or a sustained rise in volatility can generate gamma losses that overwhelm months of collected theta. Crowded short-vol positioning, dealer hedging flows, and liquidity evaporation can amplify these episodes, producing losses far larger than simple option-pricing models suggest.",
 "Long-volatility strategies fail more slowly but more persistently: in extended low-volatility regimes the continuous payment of theta (and the roll-down of volatility term structures) erodes capital. Many pure long-vol or tail-hedge programs underperform for years before delivering their protective payoff, testing investor patience and capital commitment.",
 "Both sides of the volatility market share a deeper risk : the difficulty of forecasting the difference between implied and realized volatility. Model error, regime shifts, and the impact of the strategy’s own hedging on realized volatility can turn an apparently positive expected edge into a negative one. Robust risk management, position limits, and continuous monitoring of implied-versus-realized relationships are therefore essential.",
 ],
 keyPoint:
 "Every volatility strategy is ultimately a view on the gap between implied and realized volatility; the largest losses occur when that gap moves violently against the position.",
 },
 {
 era: "Implementation",
 icon: "🛠️",
 title: "Practical Implementation Notes",
 desc: "Instrument choice, hedging frequency, transaction costs, and portfolio-level integration of long- and short-vol exposures",
 badge: { label: "Practice", style: "slate" },
 tags: [
 ["instruments", "teal"],
 ["hedging", "amber"],
 ["costs", ""],
 ["integration", "slate"],
 ],
 data: [
 {
 label: "Vehicles",
 value: "Listed options · variance swaps · VIX futures",
 color: "teal",
 },
 {
 label: "Hedging",
 value: "Frequency versus transaction-cost trade-off",
 color: "amber",
 },
 {
 label: "Portfolio",
 value: "Combine short-vol income with long-vol protection",
 color: "slate",
 },
 ],
 body: [
 "Implementation choices begin with the instrument. Listed options offer flexibility of strike and maturity but require careful management of discrete strikes and early-exercise features. Variance swaps provide clean exposure to realized variance yet are primarily OTC. VIX futures and options give direct access to equity-index implied volatility and are useful for both directional vol trades and tail hedges.",
 "For gamma-scalping and delta-hedged books the frequency of hedging is a critical design parameter. Continuous hedging is theoretically ideal but impossible; practical schedules (every few minutes, hourly, or at fixed delta thresholds) balance slippage and gamma capture. Transaction costs, bid–ask spreads, and market impact must be modelled explicitly; otherwise back-tests overstate the attainable edge.",
 "At the portfolio level many sophisticated programmes run both short-volatility income strategies and modest long-volatility or tail-hedge overlays. The short-vol book harvests the average VRP; the long-vol book reduces the severity of the left tail. The net result is a more stable risk-adjusted return profile than either approach in isolation, provided the relative sizing and rebalancing rules are carefully calibrated.",
 ],
 keyPoint:
 "Successful volatility trading is as much about execution, hedging discipline, and portfolio construction as it is about the initial view on implied versus realized volatility.",
 },
 ];

 )
 .join("");
 }
