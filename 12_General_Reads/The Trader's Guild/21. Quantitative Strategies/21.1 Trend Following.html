            "At its core, trend following is a bet on market inefficiency arising from gradual information diffusion and well-documented behavioral biases. It does not require a fundamental view of intrinsic value; it only requires that prices, once set in motion, tend to continue in the same direction long enough to cover transaction costs and generate positive expectancy.",
