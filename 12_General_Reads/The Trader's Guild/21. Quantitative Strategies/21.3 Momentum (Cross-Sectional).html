 body: [

 "Unlike time-series trend following, which examines each asset’s own past returns in isolation, cross-sectional momentum is inherently relative. An asset can be a “winner” even if its absolute return is negative, provided it has outperformed its peers. The strategy therefore extracts a pure relative-strength premium rather than a directional market bet.",

 body: [
 "The dominant explanation for cross-sectional momentum is behavioural underreaction. Investors are slow to fully incorporate new public information—earnings surprises, macroeconomic releases, or industry shifts—into prices. As a result, assets that have already begun to reflect positive (negative) news continue to outperform (underperform) as the remaining information is gradually absorbed.",

 .map(
 (e, i) =>
 `<article class="entry ${i === 0 ? "open" : ""}"><div class="entry-card"><div class="entry-header" onclick="toggleEntry(this.parentElement.parentElement)"><div class="entry-era">${e.era}</div><div class="entry-icon">${e.icon}</div><div class="entry-title-block"><div class="entry-title">${e.title}</div><div class="entry-desc">${e.desc}</div></div><div class="entry-badge badge-${e.badge.style}">${e.badge.label}</div><div class="entry-toggle">›</div></div><div class="entry-body">${e.body.map((p) => `<p>${p}</p>`).join("")}<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div><div class="data-strip">${e.data.map((d) => `<div class="data-cell"><div class="data-cell-label">${d.label}</div><div class="data-cell-value ${d.color}">${d.value}</div></div>`).join("")}</div><div class="tags">${e.tags.map((t) => `<span class="tag ${t[1] || ""}">${t[0]}</span>`).join("")}</div></div></div></article>`,
 )
 .join("");
 }
 function toggleEntry(entry) {
 entry.classList.toggle("open");
 }
 function toggleAll(open) {
 document
 .querySelectorAll(".entry")
 .forEach((entry) => entry.classList.toggle("open", open));
 }
 render();
 </script>
 </body>
</html>
