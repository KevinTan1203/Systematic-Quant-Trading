 {

 ],
 body: [
 "Mean reversion is the systematic attempt to profit from the tendency of prices, spreads, or residual series to return toward a long-run equilibrium after temporary deviations. The strategy treats large, rapid moves away from a statistical or economic centre as opportunities rather than as the start of new trends.",
 "Unlike trend following, which participates in persistence, mean reversion bets on the opposite force: the restoring mechanism of liquidity provision, inventory control, and partial market efficiency. When a security or a relative-value relationship is pushed too far by transient order flow, the expectation is that subsequent flow or arbitrage pressure will pull it back.",
 "The core intellectual claim is modest but powerful: markets are not perfectly efficient at every instant, yet they are sufficiently efficient that extreme deviations are more likely to shrink than to expand indefinitely. The edge therefore lives in the speed and accuracy with which those deviations can be measured and the discipline with which positions are sized and exited.",
 ],
 keyPoint:

 },
 {

 icon: "📡",

 tags: [

 ["RSI", "amber"],
 ["Bollinger", ""],
 ["VWAP", "slate"],
 ],
 data: [
 {

 {

 value: "RSI extremes · Bollinger touches",

 },
 {

 value: "Statistical distance from VWAP",

 },
 ],
 body: [
 "The most rigorous mean-reversion signals are built on the z-score of a residual or spread. For pairs or baskets, a cointegrated relationship is first estimated; the residual is then standardised so that entries occur when the spread reaches historically extreme positive or negative levels and exits occur near zero or upon crossing a less extreme threshold.",
 "Classic technical oscillators remain widely used. RSI extremes (typically above 70 or below 30) and Bollinger Band touches or penetrations supply simple, robust indicators of short-term over-extension. These signals are often combined with volume or volatility filters to avoid acting on moves driven by genuine information rather than transient imbalance.",
 "Intraday implementations frequently measure statistical distance from volume-weighted average price (VWAP) or from a short-horizon moving average. Because liquidity providers and many institutional algorithms themselves reference VWAP, deviations from it tend to attract correcting flow, creating a natural mean-reverting dynamic at the minute-to-hour scale.",
 ],
 keyPoint:
 "The highest-quality signals quantify how unusual a current dislocation is relative to its own recent history, not merely whether an oscillator has crossed an arbitrary line.",
 },
 {
 era: "Assumptions",
 icon: "🧠",
 title: "Market Assumptions and Microstructure Foundations",
 desc: "Partial efficiency, temporary overshoots, and the role of liquidity providers in absorbing imbalances",
 badge: { label: "Theory", style: "slate" },
 tags: [
 ["partial efficiency", "teal"],
 ["overshoot", "amber"],
 ["liquidity provision", ""],
 ["inventory", "slate"],
 ],
 data: [
 {
 label: "Efficiency",
 value: "Markets correct but not instantly",
 color: "teal",
 },
 {
 label: "Mechanism",
 value: "Liquidity providers absorb imbalances",
 color: "amber",
 },
 {
 label: "Implication",
 value: "Extreme moves tend to reverse",
 color: "slate",
 },
 ],
 body: [
 "Mean reversion rests on the assumption that market efficiency holds only partially and with a lag. Prices can and do overshoot in response to order-flow imbalances, news that is incompletely digested, or temporary shortages of liquidity. The subsequent correction is the source of the strategy’s expected return.",
 "A central microstructure claim is that liquidity providers—market makers, high-frequency firms, and institutional algorithms—actively manage inventory risk. When they accumulate large long or short positions, they adjust quotes to encourage offsetting flow, thereby pushing prices back toward equilibrium. Mean-reversion strategies can be viewed as participating in, or anticipating, this inventory-driven correction.",
 "The assumption fails when the initial move is driven by permanent information rather than by transient imbalance, or when liquidity providers themselves withdraw. In those regimes the “dislocation” continues or accelerates, converting a mean-reversion trade into a loss.",
 ],
 keyPoint:
 "The strategy’s edge is the difference between temporary liquidity shocks and permanent information shocks—and the ability to distinguish them in real time.",
 },
 {
 era: "Horizon",
 icon: "⏱️",
 title: "Typical Holding Period and Time Scale",
 desc: "Minutes to days— materially shorter than classic medium-term trend following",
 badge: { label: "Design", style: "teal" },
 tags: [
 ["short-term", "teal"],
 ["minutes to days", "amber"],
 ["intraday", ""],
 ["fast exit", "slate"],
 ],
 data: [
 {
 label: "Holding period",
 value: "Minutes to a few days",
 color: "teal",
 },
 {
 label: "Signal speed",
 value: "Real-time or high-frequency updates",
 color: "amber",
 },
 {
 label: "Contrast",
 value: "Much faster than trend systems",
 color: "slate",
 },
 ],
 body: [
 "Mean-reversion holding periods are characteristically short. Intraday statistical-arbitrage and market-making variants may hold positions for minutes or even seconds. Overnight or multi-day pairs and residual strategies typically target horizons of one to several days. Positions that have not reverted within the expected window are often forcibly exited to limit tail risk.",
 "The short horizon is both a feature and a constraint. It allows the strategy to harvest many small, high-probability corrections, but it also demands continuous monitoring and low-latency execution. Capital is recycled rapidly; turnover is high; and transaction-cost control becomes a first-order determinant of net performance.",
 "Because the economic rationale—inventory correction and temporary imbalance—operates most cleanly at short horizons, lengthening the holding period tends to increase exposure to genuine trends and information shocks, eroding the mean-reverting edge.",
 ],
 keyPoint:
 "Mean reversion is a short-horizon harvest of temporary dislocations; extending the horizon transforms it into a different, usually weaker, strategy.",
 },
 {
 era: "Risk",
 icon: "⚖️",
 title: "Risk Profile and Return Distribution",
 desc: "Many small wins, rare large losses; negatively skewed with material blow-up risk in strong trends",
 badge: { label: "Profile", style: "amber" },
 tags: [
 ["negative skew", "red"],
 ["small wins", "teal"],
 ["large losses", "amber"],
 ["blow-up", ""],
 ],
 data: [
 {

 {
 label: "Skewness",
 value: "Negative (left-tailed)",

 },
 {
 label: "Danger regime",
 value: "Strong, persistent trends",
 color: "amber",
 },
 ],
 body: [
 "The canonical mean-reversion return distribution is the mirror image of trend following: a high win rate composed of many small profits, punctuated by infrequent but potentially severe losses. The strategy collects a steady stream of positive expectancy trades while remaining exposed to the left tail when a dislocation continues rather than reverses.",
 "This negative skewness is structural. Each trade is effectively short a form of volatility or gap risk. In quiet, range-bound markets the profile looks attractive; in markets that begin to trend strongly in one direction the accumulated inventory or spread positions can generate outsized losses before stops or risk limits are reached.",
 "Risk management therefore emphasises hard position limits, time-based exits, volatility-adjusted sizing, and strict loss thresholds. Because the left tail can be sudden, many practitioners also employ portfolio-level kill switches that reduce or flatten exposure when aggregate drawdown or correlation metrics breach predefined levels.",
 ],
 keyPoint:
 "Mean reversion earns a premium for providing liquidity and absorbing temporary imbalances; the cost of that premium is occasional large losses when the imbalance proves permanent.",
 },
 {
 era: "Capacity",
 icon: "📉",
 title: "Capacity Constraints and Market Impact",
 desc: "Materially lower capacity than trend following; impact costs rapidly erode alpha",
 badge: { label: "Scale", style: "red" },
 tags: [
 ["low capacity", "red"],
 ["market impact", "amber"],
 ["alpha decay", ""],
 ["crowding", "slate"],
 ],
 data: [
 {
 label: "Capacity",
 value: "Low to moderate",

 },
 {
 label: "Cost driver",
 value: "Impact and bid–ask spread",

 },
 {
 label: "Implication",
 value: "Size quickly reduces net edge",
 color: "slate",
 },
 ],
 body: [
 "Mean-reversion strategies generally exhibit lower capacity than medium-term trend following. Because they trade more frequently and often in the same securities or spreads that other short-horizon players also target, market impact and bid–ask costs become binding constraints at relatively modest capital levels.",
 "As position size increases, the act of establishing the mean-reversion trade itself moves the price, reducing the residual dislocation that was the source of expected profit. In crowded names or pairs the available alpha can be arbitraged to near zero once aggregate capital exceeds a modest threshold.",
 "Practical implementations therefore concentrate on the most liquid instruments, carefully measure capacity through careful paper-trading and gradual scaling, and accept that a successful signal set may support only limited absolute dollars of risk before net returns after costs become unattractive.",
 ],
 keyPoint:
 "Unlike trend following, mean reversion’s capacity is limited by the very liquidity it seeks to provide; scaling up quickly consumes the edge.",
 },
 {
 era: "Infrastructure",
 icon: "🖥️",
 title: "Infrastructure and Operational Requirements",

 badge: { label: "Ops", style: "slate" },
 tags: [
 ["low latency", "teal"],
 ["real-time", "amber"],
 ["pairs monitoring", ""],
 ["execution", "slate"],

 {
 label: "Monitoring",

 },
 {

 color: "slate",
 },
 ],
 body: [
 "Because holding periods are short and the edge is often measured in basis points, infrastructure demands are higher than for classic trend systems. Low-latency market-data feeds, co-located or proximate execution, and efficient order-management systems are necessary to capture dislocations before they are arbitraged away by faster participants.",
 "Real-time monitoring of pairs, baskets, and residual series is essential. Cointegration or residual models must be kept current; structural breaks must be detected promptly; and position-level and portfolio-level risk metrics must update continuously so that runaway losses can be halted.",
 "Supporting systems include high-quality tick or bar data, robust handling of corporate actions and contract rolls, and automated processes for recalibrating statistical relationships. Operational risk—stale models, missed ticks, or execution glitches—can convert an otherwise sound mean-reversion process into a source of large, unexpected losses.",
 ],
 keyPoint:
 "Mean reversion is as much an engineering and data problem as a statistical one; latency and monitoring quality directly determine whether the theoretical edge is realised.",
 },
 {
 era: "Failures",
 icon: "⚠️",
 title: "Common Failure Modes",
 desc: "Cointegration breakdown, one-sided trending markets, and crowded trades that arbitrage the edge away",
 badge: { label: "Risk", style: "red" },

 ["cointegration break", "red"],
 ["trending markets", "amber"],
 ["crowding", ""],
 ["alpha decay", "slate"],

 {

 {

 },
 ],
 body: [
 "The most fundamental statistical failure is the breakdown of the assumed equilibrium relationship. Pairs or baskets that were cointegrated can cease to be so after a corporate event, a change in business model, a regulatory shift, or a simple regime change. Continuing to trade the old residual after the relationship has broken produces systematic losses.",
 "One-sided trending markets constitute a second major failure mode. When a security or sector enters a strong, information-driven trend, mean-reversion entries repeatedly buy weakness or sell strength that does not correct. The negatively skewed payoff profile then realises its left tail, sometimes violently.",
 "Finally, crowding itself can eliminate the edge. As more capital pursues the same residual or oscillator signals, the dislocations become smaller, the reversion faster, and the residual profit after costs approaches zero. In the extreme, the strategy can become a source of liquidity for faster or better-informed players, turning expected positive returns into expected negative ones.",
 ],
 keyPoint:
 "Mean reversion fails when the equilibrium disappears, when the market trends instead of reverts, or when too many participants compete for the same temporary dislocations.",
 },
 ];

 .map(
 (e, i) =>
 `<article class="entry ${i === 0 ? "open" : ""}"><div class="entry-card"><div class="entry-header" onclick="toggleEntry(this.parentElement.parentElement)"><div class="entry-era">${e.era}</div><div class="entry-icon">${e.icon}</div><div class="entry-title-block"><div class="entry-title">${e.title}</div><div class="entry-desc">${e.desc}</div></div><div class="entry-badge badge-${e.badge.style}">${e.badge.label}</div><div class="entry-toggle">›</div></div><div class="entry-body">${e.body.map((p) => `<p>${p}</p>`).join("")}<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div><div class="data-strip">${e.data.map((d) => `<div class="data-cell"><div class="data-cell-label">${d.label}</div><div class="data-cell-value ${d.color}">${d.value}</div></div>`).join("")}</div><div class="tags">${e.tags.map((t) => `<span class="tag ${t[1] || ""}">${t[0]}</span>`).join("")}</div></div></div></article>`,
 )
 .join("");
 }
 function toggleEntry(entry) {
 entry.classList.toggle("open");
 }
 function toggleAll(open) {
 document
 .querySelectorAll(".entry")
 .forEach((entry) => entry.classList.toggle("open", open));
 }
 render();
 </script>
 </body>
</html>
