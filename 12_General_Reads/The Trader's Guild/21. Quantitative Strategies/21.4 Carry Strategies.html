 <script>
 const entries = [
 {
 era: "Core Idea",
 icon: "💰",
 title: "Earn the Yield Differential",
 desc: "Hold high-carry assets funded by low-carry assets and collect the spread as long as prices do not move adversely",
 badge: { label: "Framework", style: "teal" },
 tags: [
 ["carry", "teal"],
 ["yield differential", "amber"],
 ["long high-carry", ""],
 ["short low-carry", "slate"],
 ],
 data: [
 {
 label: "Action",
 value: "Long high-carry · short low-carry",
 color: "teal",
 },
 {
 label: "Income",
 value: "Collect the yield or roll differential",
 color: "amber",
 },
 {
 label: "Risk",
 value: "Adverse price moves can erase income",
 color: "red",
 },
 ],
 body: [
 "Carry strategies seek to earn the yield, dividend, roll, or funding differential that arises from holding high-carry assets while funding them with low-carry assets. In its purest form the strategy is indifferent to directional price forecasts; it simply harvests the positive expected income that exists when markets do not fully equalise returns across assets.",
 "The classic implementation is FX carry: borrow in low-interest-rate currencies and invest in high-interest-rate currencies. Equivalent constructions appear in equities (long high-dividend-yield stocks, short low-yield stocks), commodities (long contracts with positive roll yield, short those with negative roll yield), and crypto (long assets with attractive funding rates versus those with expensive funding).",
 "The economic premise is that the observed carry differential is, on average, compensation for bearing risk—particularly the risk of sudden, sharp reversals. When that risk does not materialise, the strategy records steady positive income; when it does, the accumulated carry can be more than wiped out in a short period.",
 ],
 keyPoint:
 "Carry is the expected return from holding an asset assuming its price does not change; the strategy profits when that assumption holds more often than it fails.",
 },
 {
 era: "Signals",
 icon: "📡",
 title: "Signal Inputs Across Asset Classes",
 desc: "Interest-rate differentials, dividend yields, commodity roll yields, and crypto funding rates",
 badge: { label: "Mechanism", style: "amber" },
 tags: [
 ["FX carry", "teal"],
 ["dividend yield", "amber"],
 ["roll yield", ""],
 ["funding rate", "slate"],
 ],
 data: [
 {
 label: "FX",
 value: "Interest-rate differentials",
 color: "teal",
 },
 {
 label: "Equity",
 value: "Dividend yield differentials",
 color: "amber",
 },
 {
 label: "Commodity / Crypto",
 value: "Roll yield · perpetual funding rates",
 color: "slate",
 },
 ],
 body: [
 "In foreign exchange the primary signal is the interest-rate differential between two currencies, typically measured by short-term money-market rates or by the forward premium/discount. Currencies with higher interest rates are held long; those with lower rates are held short (or used as funding currencies).",
 "Equity carry ranks stocks or equity indices by expected dividend yield (or by the difference between dividend yield and the local risk-free rate). High-yield names are favoured; low-yield or non-dividend-paying names are underweighted or shorted. The signal is often combined with quality or volatility screens to avoid pure value traps.",
 "Commodity carry is driven by the term-structure of futures prices—specifically the roll yield earned (or paid) when a position is rolled from a near contract into a farther contract. Markets in backwardation offer positive roll yield; markets in contango offer negative roll yield. In crypto markets the analogous signal is the funding rate paid by long (or short) holders of perpetual futures; positive funding is collected by being long the high-funding asset or short the low-funding asset.",
 ],
 keyPoint:
 "Although the economic source of carry differs by asset class, the portfolio construction principle remains the same: rank by expected income and hold a long-short or long-only tilt toward the highest-carry names.",
 },
 {
 era: "Assumptions",
 icon: "🧠",
 title: "Market Assumptions and Risk Premia",
 desc: "Uncovered interest-rate parity fails; the carry differential is compensation for crash risk",
 badge: { label: "Theory", style: "slate" },
 tags: [
 ["UIP failure", "teal"],
 ["risk premium", "amber"],
 ["crash risk", ""],
 ["peso problem", "slate"],
 ],
 data: [
 {
 label: "Parity",
 value: "Uncovered interest-rate parity does not hold",
 color: "teal",
 },
 {
 label: "Interpretation",
 value: "Carry is a risk premium, not free lunch",
 color: "amber",
 },
 {
 label: "Nature of risk",
 value: "Infrequent but severe crash risk",
 color: "red",
 },
 ],
 body: [
 "Standard theory (uncovered interest-rate parity) predicts that interest-rate differentials should be exactly offset by expected exchange-rate changes, leaving no excess return to FX carry. Empirically the parity fails: high-interest-rate currencies do not depreciate enough, on average, to eliminate the carry. The same logic applies, with appropriate modifications, to equity, commodity, and crypto carry.",
 "The dominant explanation is that the observed carry is compensation for bearing crash risk or “peso-problem” risk—the risk of infrequent but large adverse moves. Investors who collect the steady yield are effectively writing insurance against global risk-off events, sudden volatility spikes, or disorderly unwinds of leveraged positions.",
 "Because the risk is skewed and infrequent, long-run average returns to carry can be positive even though the strategy occasionally suffers large losses. The premium exists precisely because many investors are unwilling or unable to tolerate that left-tail exposure.",
 ],
 keyPoint:
 "Carry is not an arbitrage; it is a risk premium paid to those willing to hold assets that perform poorly in bad states of the world.",
 },
 {
 era: "Horizon",
 icon: "⏱️",
 title: "Typical Holding Period and Rebalancing",
 desc: "Days to months; carry signals are relatively slow-moving compared with pure price-based signals",
 badge: { label: "Design", style: "teal" },
 tags: [
 ["days to months", "teal"],
 ["slow signal", "amber"],
 ["rebalance", ""],
 ["income accrual", "slate"],
 ],
 data: [
 {
 label: "Holding period",
 value: "Days to several months",
 color: "teal",
 },
 {
 label: "Signal speed",
 value: "Relatively persistent differentials",
 color: "amber",
 },
 {
 label: "Income",
 value: "Accrues continuously while held",
 color: "slate",
 },
 ],
 body: [
 "Carry positions are typically held from a few days to several months. Interest-rate differentials, dividend yields, and futures term structures change far more slowly than daily price returns, so the ranking of assets by carry is relatively stable. Frequent rebalancing is therefore unnecessary and often counterproductive once transaction costs are considered.",
 "In FX and rates the natural horizon is often measured in weeks to months, matching the tenor of the underlying money-market instruments. Equity carry may be rebalanced monthly or quarterly. Commodity roll-yield strategies are frequently adjusted around contract roll dates. Crypto funding-rate carry can be faster because funding rates themselves reset more frequently, yet even there multi-day to multi-week holds are common.",
 "Because income accrues continuously (or at discrete funding intervals), the strategy does not require large price moves to generate positive expected returns. The holding period is chosen primarily to balance income capture against the risk of an adverse unwind.",
 ],
 keyPoint:
 "Carry is a slow-moving, income-oriented signal; the optimal horizon is long enough to collect the differential and short enough to exit before a major risk-off event.",
 },
 {
 era: "Risk",
 icon: "⚖️",
 title: "Risk Profile and Negative Skew",
 desc: "Steady positive income interrupted by infrequent but severe losses—“picking up pennies in front of a steamroller”",
 badge: { label: "Profile", style: "amber" },
 tags: [
 ["negative skew", "red"],
 ["steady income", "teal"],
 ["crash risk", "amber"],
 ["steamroller", ""],
 ],
 data: [
 {
 label: "Payoff shape",
 value: "Many small gains · rare large losses",
 color: "teal",
 },
 {
 label: "Skewness",
 value: "Negative (left-tailed)",
 color: "red",
 },
 {
 label: "Metaphor",
 value: "Pennies in front of a steamroller",
 color: "amber",
 },
 ],
 body: [
 "The canonical risk profile of carry is negatively skewed. In normal times the strategy collects a steady stream of positive income from the yield differential. These gains are relatively small and frequent. On rare occasions—global risk-off episodes, sudden volatility spikes, or coordinated deleveraging—the same positions suffer large, rapid losses that can erase many months or years of accumulated carry.",
 "This profile has earned the strategy its famous description: “picking up pennies in front of a steamroller.” The pennies are the daily or monthly carry accruals; the steamroller is the infrequent but violent unwind. Investors who focus only on the high Sharpe ratio of quiet periods systematically understate the true risk.",
 "Because the left tail is driven by common risk factors (equity market stress, rising correlations, liquidity evaporation), diversification across carry markets helps but does not eliminate the problem. Portfolio-level risk management, volatility targeting, and explicit crash hedges are therefore central to institutional implementations.",
 ],
 keyPoint:
 "Carry offers attractive average returns precisely because it embeds the risk of occasional large losses; the premium is compensation for that left-tail exposure.",
 },
 {
 era: "Failures",
 icon: "⚠️",
 title: "Common Failure Modes",
 desc: "Global risk-off events that trigger simultaneous carry unwinds and sudden spikes in volatility",
 badge: { label: "Risk", style: "red" },
 tags: [
 ["risk-off", "red"],
 ["carry unwind", "amber"],
 ["vol spike", ""],
 ["liquidity", "slate"],
 ],
 data: [
 {
 label: "Primary trigger",
 value: "Global risk-off episodes",
 color: "red",
 },
 {
 label: "Mechanism",
 value: "Simultaneous unwind of leveraged carry",
 color: "amber",
 },
 {
 label: "Amplifier",
 value: "Sudden volatility and liquidity shocks",
 color: "slate",
 },
 ],
 body: [
 "The dominant failure mode is the global risk-off event. In periods of acute market stress—financial crises, geopolitical shocks, or abrupt changes in monetary-policy expectations—investors simultaneously reduce risk. High-carry assets, which are often the most leveraged or the most dependent on continuous funding, are sold aggressively while low-carry funding currencies or assets are bought. The result is a rapid, broad-based reversal of carry positions.",
 "Sudden volatility spikes amplify the damage. As realised and implied volatility rise, margin requirements increase, stop-losses are triggered, and risk-parity or volatility-targeted portfolios de-lever. Because many carry strategies are themselves volatility-sensitive, the de-leveraging feeds on itself, producing outsized losses in a short window.",
 "Historical episodes (1998, 2008, 2013 taper tantrum, March 2020, and various FX carry crashes) illustrate the pattern: months or years of steady positive returns are followed by a sharp, correlated drawdown that is difficult to hedge in real time. The failure is not that carry occasionally loses money, but that the losses arrive in concentrated, systemic bursts.",
 ],
 keyPoint:
 "Carry fails when the market’s willingness to provide the very funding and risk-bearing that the strategy relies upon suddenly disappears.",
 },
 {
 era: "Implementation",
 icon: "🛠️",
 title: "Practical Implementation Considerations",
 desc: "Cross-asset construction, funding management, and explicit recognition of crash risk in portfolio design",
 badge: { label: "Practice", style: "slate" },
 tags: [
 ["cross-asset", "teal"],
 ["funding", "amber"],
 ["crash hedge", ""],
 ["vol targeting", "slate"],
 ],
 data: [
 {
 label: "Construction",
 value: "Rank and weight by expected carry",
 color: "teal",
 },
 {
 label: "Funding",
 value: "Manage rolling and financing carefully",
 color: "amber",
 },
 {
 label: "Risk overlay",
 value: "Volatility targeting · crash buffers",
 color: "slate",
 },
 ],
 body: [
 "Modern carry portfolios are usually constructed on a cross-asset basis: FX, equity, commodity, and sometimes rates or crypto carry are combined inside a single risk framework. Assets are ranked by expected carry (often standardised by volatility), and positions are sized so that each contributes roughly equal risk. The resulting portfolio harvests a diversified carry premium while retaining the characteristic negative skew.",
 "Funding and roll management are operationally critical. In FX the strategy must continuously roll short-term deposits or forwards; in commodities it must manage the calendar roll; in crypto it must monitor and capture funding payments. Errors or delays in these mechanical steps can convert theoretical carry into realised losses.",
 "Because crash risk is structural, many implementations add explicit overlays: volatility targeting that reduces exposure when markets become turbulent, time-series momentum filters that exit carry when trends turn against the position, or modest allocations to assets that tend to rally in risk-off environments. These overlays do not eliminate the left tail, but they can materially improve the long-run risk-adjusted return of the strategy.",
 ],
 keyPoint:
 "Successful carry investing treats the income stream as compensation for a known, skewed risk and designs the portfolio and risk process accordingly.",
 },
 ];
 function render() {
 document.getElementById("entries-root").innerHTML = entries
 .map(
 (e, i) =>
 `<article class="entry ${i === 0 ? "open" : ""}"><div class="entry-card"><div class="entry-header" onclick="toggleEntry(this.parentElement.parentElement)"><div class="entry-era">${e.era}</div><div class="entry-icon">${e.icon}</div><div class="entry-title-block"><div class="entry-title">${e.title}</div><div class="entry-desc">${e.desc}</div></div><div class="entry-badge badge-${e.badge.style}">${e.badge.label}</div><div class="entry-toggle">›</div></div><div class="entry-body">${e.body.map((p) => `<p>${p}</p>`).join("")}<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div><div class="data-strip">${e.data.map((d) => `<div class="data-cell"><div class="data-cell-label">${d.label}</div><div class="data-cell-value ${d.color}">${d.value}</div></div>`).join("")}</div><div class="tags">${e.tags.map((t) => `<span class="tag ${t[1] || ""}">${t[0]}</span>`).join("")}</div></div></div></article>`,
 )
 .join("");
 }
 function toggleEntry(entry) {
 entry.classList.toggle("open");
 }
 function toggleAll(open) {
 document
 .querySelectorAll(".entry")
 .forEach((entry) => entry.classList.toggle("open", open));
 }
 render();
 </script>
