  .note-box {

    border-left: 3px solid var(--slate);

  .note-box .note-label {
    font-family: 'Space Mono', monospace;

<script>
const entries = [
  {
    era: "Formula",
    icon: "📐",
    title: "The Classic Kelly Formula",
    desc: "f* = (bp − q) / b — the fraction of bankroll that maximises the expected logarithmic growth rate of wealth",
    badge: { label: "Foundation", style: "slate" },
    tags: [["kelly formula","slate"], ["edge","teal"], ["odds","amber"], ["log-utility","teal"]],
    data: [
      { label: "b", value: "Net odds (win amount / loss amount)", color: "amber" },
      { label: "p", value: "Probability of winning", color: "teal" },
      { label: "q", value: "1 − p  (probability of losing)", color: "red" },
    ],
    body: [
      `In a simple binary bet that pays net odds <em>b</em> to 1 (i.e., you risk 1 unit to win <em>b</em> units), the Kelly fraction is given by f* = (bp − q) / b, where p is the true probability of winning and q = 1 − p. When the edge is zero (bp = q), the formula correctly returns zero; when the edge is negative it returns a negative number, signalling a bet on the opposite side or no bet at all.`,
      `The derivation maximises the expected value of the logarithm of wealth after one period. Under repeated independent bets this criterion asymptotically maximises the median terminal wealth and the geometric growth rate. It is therefore the unique “growth-optimal” policy for an infinitely patient investor who cares only about long-run wealth.`,
      `Practical computation requires accurate estimates of both the edge (bp − q) and the odds. Mis-estimation of either quantity is the most common source of Kelly-related disasters. The formula assumes the entire loss is the stake; in markets with continuous prices or variable payoff ratios the discrete form must be adapted or replaced by its continuous counterpart.`
    ],
    keyPoint: "Kelly is not a heuristic; it is the exact solution to the log-utility maximisation problem for a repeated binary game. Everything that follows—fractional Kelly, continuous approximations, multi-asset extensions—is a practical or theoretical refinement of this single expression."
  },
  {
    era: "Continuous",
    icon: "∞",
    title: "Continuous Kelly: f = μ / σ²",
    desc: "The growth-optimal fraction for a continuously rebalanced asset whose excess return is approximately normal with mean μ and variance σ²",
    badge: { label: "Core", style: "amber" },
    tags: [["continuous kelly","amber"], ["μ/σ²","teal"], ["geometric growth","slate"], ["leverage","red"]],
    data: [
      { label: "Approximation", value: "Valid when returns are small & continuous", color: "amber" },
      { label: "Full Kelly", value: "f* = μ / σ²  (often > 1)", color: "red" },
      { label: "Growth rate", value: "g = μf − ½σ²f²", color: "teal" },
    ],
    body: [
      `When returns are continuous (or when the discrete period is short and the edge per period is modest), the discrete Kelly formula converges to the simple expression f* = μ / σ², where μ is the expected excess return and σ² is the variance of that return. The associated asymptotic growth rate is g* = μ² / (2σ²).`,
      `This continuous form is the workhorse of quantitative portfolio construction. It immediately shows why high-Sharpe strategies can be leveraged aggressively while low-Sharpe strategies cannot: the optimal leverage is proportional to the Sharpe ratio squared. It also reveals that any estimation error in μ or σ is magnified by the reciprocal of variance.`,
      `Because real markets are neither continuous nor perfectly normal, the continuous Kelly fraction is almost always treated as an upper bound rather than a prescription. Transaction costs, discrete rebalancing, fat tails and parameter uncertainty all argue for a strictly smaller allocation.`
    ],
    keyPoint: "The continuous Kelly fraction f = μ / σ² is the cleanest expression of the growth-optimal principle, but it is also the most dangerous when applied naïvely: full Kelly frequently implies leverage well above 1 and is therefore almost never used in its pure form."
  },
  {
    era: "Practice",
    icon: "½",
    title: "Half-Kelly and Fractional Kelly",
    desc: "The almost universal practical compromise: bet a fixed fraction of the theoretical Kelly stake to reduce volatility and estimation-error risk",
    badge: { label: "Standard", style: "teal" },
    tags: [["half-kelly","teal"], ["fractional","amber"], ["drawdown control","slate"], ["estimation error","red"]],
    data: [
      { label: "Typical range", value: "¼-Kelly to ½-Kelly", color: "teal" },
      { label: "Growth cost", value: "Half-Kelly retains ~75 % of full growth", color: "amber" },
      { label: "Volatility cut", value: "Roughly halves the path volatility", color: "slate" },
    ],
    body: [
      `Full Kelly maximises the median of terminal wealth but produces extremely volatile paths and large intermediate drawdowns. Because investors care about the entire path—and because edge and odds are never known with certainty—practitioners almost invariably use a fractional Kelly policy: f = κ · f*, where κ ∈ (0,1] is a fixed “fraction of Kelly”.`,
      `Half-Kelly (κ = ½) is the most cited rule of thumb. It retains approximately three-quarters of the asymptotic growth rate of full Kelly while cutting path volatility roughly in half and dramatically reducing the probability of large drawdowns. Quarter-Kelly and even smaller fractions are common when parameter uncertainty is high or when the investor has other constraints (leverage limits, margin requirements, psychological tolerance).`,
      `Fractional Kelly can also be derived as the exact optimum under more realistic utility functions (e.g., power utility with relative risk aversion greater than 1) or under Bayesian uncertainty about the true edge. In that sense the “fraction” is not an arbitrary safety factor but an implicit expression of risk aversion or model doubt.`
    ],
    keyPoint: "In live trading the question is rarely “full Kelly or not?”; it is “what fraction of the theoretical Kelly stake is consistent with my risk tolerance, estimation confidence and institutional constraints?” Half-Kelly is the default answer for good reason."
  },
  {
    era: "Multi-Asset",
    icon: "🔗",
    title: "Kelly for Correlated Positions",
    desc: "The vector generalisation that allocates capital across multiple assets while correctly accounting for the full covariance structure",
    badge: { label: "Advanced", style: "slate" },
    tags: [["multi-asset kelly","slate"], ["covariance","amber"], ["portfolio growth","teal"], ["simultaneous bets","red"]],
    data: [
      { label: "Vector form", value: "f* = Σ⁻¹ μ", color: "teal" },
      { label: "Key input", value: "Full covariance matrix Σ", color: "amber" },
      { label: "Risk", value: "Ignoring correlation over-allocates", color: "red" },
    ],
    body: [
      `When several bets or assets can be held simultaneously, the scalar Kelly formula is replaced by its multivariate counterpart. Under continuous (or approximate) returns the growth-optimal vector of fractions is f* = Σ⁻¹ μ, where μ is the vector of expected excess returns and Σ is the covariance matrix of those returns. This is precisely the mean-variance tangency portfolio scaled by risk aversion of 1 (log utility).`,
      `Correlations matter critically. Positive correlation between two positive-edge bets reduces the optimal size of each; negative correlation increases it. Ignoring the off-diagonal terms is equivalent to treating the bets as independent and systematically over-allocates capital, raising the probability of joint losses.`,
      `In discrete settings with finite outcomes the exact multi-asset Kelly problem becomes a constrained numerical optimisation of the expected log wealth. The continuous approximation remains the practical starting point, after which transaction costs, position limits and estimation error are layered on top.`
    ],
    keyPoint: "Multi-asset Kelly is not “run scalar Kelly on each position and sum.” It is a joint optimisation whose solution depends on the entire covariance structure; treating correlated edges as independent is one of the fastest ways to over-bet."
  },
  {
    era: "Trade-off",
    icon: "⚖️",
    title: "Growth-Optimal vs. Risk-Adjusted Objectives",
    desc: "Why pure growth maximisation is rarely the investor’s true objective and how alternative criteria alter the optimal fraction",
    badge: { label: "Theory", style: "amber" },
    tags: [["log utility","amber"], ["power utility","teal"], ["sharpe","slate"], ["path dependence","red"]],
    data: [
      { label: "Kelly goal", value: "Max E[log W]  →  asymptotic growth", color: "teal" },
      { label: "Investor goal", value: "Usually lower volatility / drawdowns", color: "amber" },
      { label: "Bridge", value: "Fractional Kelly ≈ higher risk aversion", color: "slate" },
    ],
    body: [
      `Kelly maximises the expected logarithm of terminal wealth and therefore the long-run geometric growth rate. Many investors, however, care about intermediate wealth, maximum drawdown, probability of ruin, or a finite-horizon utility that is more risk-averse than log. Under power utility with relative risk aversion γ > 1 the optimal fraction is exactly the Kelly fraction divided by γ—i.e., fractional Kelly emerges endogenously.`,
      `Even investors who ultimately care only about terminal wealth often prefer a lower growth rate if it comes with substantially smoother paths. This preference can be formalised via stochastic-dominance arguments, prospect-theory value functions, or simple constraints on maximum acceptable drawdown. In all such cases the pure Kelly solution is only an upper bound.`,
      `Consequently the practical literature treats full Kelly as a theoretical benchmark rather than an implementable policy. The real decision is where to locate oneself on the continuum between full Kelly (maximum growth, maximum path risk) and zero (no risk, no growth).`
    ],
    keyPoint: "Growth-optimal and risk-adjusted are not rivals; they are different points on the same continuum. Fractional Kelly is the natural language that lets an investor dial the trade-off explicitly."
  },
  {
    era: "Risk",
    icon: "⚠️",
    title: "Overbetting Risks",
    desc: "The severe and often irreversible consequences of staking more than the Kelly fraction—especially when the edge is overestimated",
    badge: { label: "Critical", style: "red" },
    tags: [["overbetting","red"], ["drawdown","amber"], ["ruin","red"], ["estimation error","slate"]],
    data: [
      { label: "Beyond Kelly", value: "Growth rate declines; volatility rises", color: "red" },
      { label: "At 2× Kelly", value: "Growth rate falls to zero", color: "amber" },
      { label: "Worst case", value: "Rapid path to near-ruin", color: "red" },
    ],
    body: [
      `The growth-rate function g(f) = μf − ½σ²f² is a downward-opening parabola that peaks at f* = μ/σ². Betting any larger fraction reduces the asymptotic growth rate while simultaneously increasing volatility. At twice Kelly the theoretical growth rate falls exactly to zero; beyond that point the strategy has negative long-run growth and positive probability of eventual ruin.`,
      `In discrete settings the same phenomenon appears: overbetting increases the chance of a long losing streak that permanently impairs the bankroll. Because the log function is unbounded below, a single large loss can erase years of compounding. Estimation error compounds the danger—if the true edge is only half of what was assumed, a “full Kelly” bet is already a 2× overbet.`,
      `Empirical literature and trading-desk experience confirm that the most common failure mode of Kelly-inspired systems is not under-betting but over-betting driven by optimistic edge estimates, ignored correlations, or the psychological temptation to “put more on a sure thing.” The remedy is conservative fractional Kelly together with rigorous uncertainty quantification.`
    ],
    keyPoint: "Exceeding the Kelly fraction is the single most dangerous mistake in position sizing. The penalty is not linear: modest overbetting already destroys a large fraction of the attainable growth rate and can produce catastrophic drawdowns when edge is overstated."
  }
];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
</body>
</html>
