<script>
const entries = [
  {
    era: "Foundations",
    icon: "📐",
    title: "Black-Scholes Assumptions",
    desc: "Lognormal asset prices, frictionless trading, constant parameters, and no arbitrage",
    badge: { label: "Core", style: "slate" },
    tags: [["lognormal","teal"], ["no dividends","amber"], ["constant vol","slate"], ["no arbitrage","red"]],
    data: [
      { label: "Underlying", value: "Geometric Brownian motion", color: "teal" },
      { label: "Volatility", value: "Constant σ, known and stable", color: "amber" },
      { label: "Drift", value: "Risk-neutral drift = r", color: "slate" },
    ],
    body: [
      `The Black-Scholes model is built on a very specific market architecture. The underlying asset price is assumed to follow geometric Brownian motion, so log returns are normally distributed and prices remain strictly positive. This is the mathematical expression of the familiar idea that asset prices are multiplicative and cannot become negative, which is crucial for option pricing because equity values do not move linearly in the way a bank account might.`,
      `A second core assumption is that the market is frictionless: there are no transaction costs, no taxes, no bid–ask spreads, and continuous trading is possible. Traders can buy and sell the underlying at any time without cost, which gives rise to continuous hedging. This makes it possible to construct a self-financing portfolio that exactly offsets the option payoff and therefore eliminates risk.`,
      `The model also assumes the risk-free rate r is constant and known, dividend yield is zero unless explicitly modeled, and volatility σ is constant over the life of the option. The no-arbitrage principle then forces the option’s price to equal the discounted expected payoff under a risk-neutral measure. In other words, the option is priced as if investors are indifferent to risk, not because risk preferences disappear, but because the hedging portfolio removes them.`,
      `These assumptions are elegant and powerful, but they are also restrictive. Real markets violate them constantly: dividends exist, volatilities vary by strike and maturity, jumps occur in crisis periods, and interest rates are not fixed. The Black-Scholes formula is therefore best understood as a benchmark model rather than a literal description of all market dynamics.`
    ],
    keyPoint: "Black-Scholes is not merely a formula; it is a complete arbitrage-based pricing framework built on carefully specified assumptions about price dynamics and market completeness."
  },
  {
    era: "Dynamics",
    icon: "⚙️",
    title: "Underlying Price Process",
    desc: "The diffusion process that underpins option valuation and hedging",
    badge: { label: "Math", style: "teal" },
    tags: [["GBM","teal"], ["risk-neutral","slate"], ["martingale","amber"], ["lognormal","red"]],
    data: [
      { label: "Process", value: "dS = μS dt + σS dW", color: "teal" },
      { label: "Log-return", value: "ln(S_T/S_0) ~ N((μ−σ²/2)T, σ²T)", color: "amber" },
      { label: "No-arbitrage", value: "μ replaced by r under Q", color: "slate" },
    ],
    body: [
      `Under the physical measure, the stock price follows the stochastic differential equation dS = μS dt + σS dW. The drift μ captures the expected return in the real world, while the diffusion term σS dW captures random price fluctuations. Because the volatility multiplies the price, shocks are proportional to the level of the asset, which produces the familiar multiplicative structure of equity prices.`,
      `The key modeling step is to move from the physical measure to the risk-neutral measure Q. Under Q, the expected growth rate of the traded asset becomes the risk-free rate, so the stock follows dS = rS dt + σS dW^Q. This is the measure under which discounted asset prices are martingales. The option value is then the discounted expected payoff under Q, which is the precise place where the no-arbitrage principle enters the model.`,
      `This transformation is not a trick. It is a consequence of the ability to replicate the option with a dynamic portfolio of stock and cash. Because the option can be exactly hedged, its price must equal the present value of the expected payoff under the unique risk-neutral distribution. The result is a powerful pricing formula that drastically simplifies valuation under the benchmark assumptions.`
    ],
    keyPoint: "The Black-Scholes model is a no-arbitrage model in disguise: the real-world drift is irrelevant for pricing because the derivative is priced under the risk-neutral measure that eliminates risk premia from the asset’s growth rate."
  },
  {
    era: "Pricing",
    icon: "🧮",
    title: "Call and Put Pricing Formula",
    desc: "Closed-form solutions for European call and put options under Black-Scholes",
    badge: { label: "Formula", style: "red" },
    tags: [["European option","red"], ["call","amber"], ["put","teal"], ["terminal payoff","slate"]],
    data: [
      { label: "Call price", value: "C = S₀N(d₁) − Ke^(−rT)N(d₂)", color: "red" },
      { label: "Put price", value: "P = Ke^(−rT)N(−d₂) − S₀N(−d₁)", color: "teal" },
      { label: "Key terms", value: "d₁, d₂, N(·), K, r, T, S₀", color: "amber" },
    ],
    body: [
      `For a European call, the Black-Scholes price is:
      <div class="formula">C = S₀N(d₁) − Ke^(−rT)N(d₂)</div>
      with
      <div class="formula">d₁ = [ln(S₀/K) + (r + σ²/2)T] / (σ√T) <br>d₂ = d₁ − σ√T</div>
      where S₀ is the current spot price, K is the strike, r is the continuously compounded risk-free rate, T is maturity, σ is volatility, and N(·) is the cumulative standard normal distribution.`,
      `The interpretation is straightforward. The term S₀N(d₁) represents the present value of being in the money at expiry, weighted by the probability that the option finishes positively; the term Ke^(−rT)N(d₂) is the discounted strike cost that is paid only if the option ends up in the money. The call is therefore the asset-like exposure minus the discounted strike-like obligation.`,
      `For the put, the symmetric expression is:
      <div class="formula">P = Ke^(−rT)N(−d₂) − S₀N(−d₁)</div>
      This is equivalent to using put-call parity and is often numerically convenient when the call price is already known. The structure is the same: the put is the discounted value of delivery at strike less the present value of receiving the stock if the option expires deep in the money.`,
      `The function N(d) is the normal CDF, which transforms the lognormal distribution of terminal stock prices into the probability of exercise. The premium is therefore a probability-weighted expected payoff under risk neutrality. This is one reason Black-Scholes is viewed as so elegant: complex option values reduce to a few measurable inputs and a normal CDF. `
    ],
    keyPoint: "The premium is not a mystical object: it is the discounted risk-neutral expected payoff, with the stock component and strike component weighted by exercise probabilities."
  },
  {
    era: "Parity",
    icon: "🔄",
    title: "Put-Call Parity",
    desc: "The identity linking European call and put prices when no arbitrage is enforced",
    badge: { label: "Identity", style: "amber" },
    tags: [["parity","amber"], ["no arbitrage","red"], ["synthetic","slate"], ["forward","teal"]],
    data: [
      { label: "Parity", value: "C − P = S − Ke^(−rT)", color: "amber" },
      { label: "Synthetic call", value: "Long stock + short bond + long put", color: "teal" },
      { label: "Synthetic put", value: "Long call + short stock + long bond", color: "slate" },
    ],
    body: [
      `Put-call parity states that for European options on the same underlying, strike, and maturity:
      <div class="formula">C − P = S − Ke^(−rT)</div>
      This identity is one of the most important relationships in option theory because it ensures that the pricing framework is internally consistent. If the parity relation is violated, traders can construct a riskless arbitrage by combining calls, puts, stock, and cash.`,
      `The intuition behind the parity relation is simple. A long call plus a short put is equivalent to a long forward position in the stock, with strike K, because the call gives upside above K while the short put creates the opposite obligation below K. Adding the stock and subtracting the present value of K reproduces the same payoff structure. In other words, a call and a put are two ways to express the same exposure when combined with the underlying and bond.`,
      `This parity relation is not merely a mathematical curiosity. It is a computational and validation tool. If you price a call using Black-Scholes and the put price should satisfy parity, then deviations reveal either an input error, an assumption violation, or a fundamentally different instrument design. It is also an excellent check when building pricing engines and calibration systems in practice.`
    ],
    keyPoint: "Put-call parity is the market’s consistency check: if the world remains arbitrage-free, call and put pricing cannot drift apart in a way that admits an easy riskless trade."
  },
  {
    era: "Greeks",
    icon: "📈",
    title: "Delta: First Sensitivity to Spot",
    desc: "The rate of change of the option value with respect to the underlying price",
    badge: { label: "Delta", style: "red" },
    tags: [["delta","red"], ["hedging","teal"], ["spot sensitivity","amber"], ["option exposure","slate"]],
    data: [
      { label: "Call delta", value: "Δ_call = N(d₁)", color: "red" },
      { label: "Put delta", value: "Δ_put = N(d₁) − 1 = −N(−d₁)", color: "teal" },

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
