<script>
const entries = [
  {
    era: "Definition",
    icon: "📌",
    title: "Definition of Implied Volatility",
    desc: "The volatility value that makes the Black-Scholes model fit the traded option price",
    badge: { label: "Core", style: "slate" },
    tags: [["BS inversion","teal"], ["market price","amber"], ["single-number vol","slate"], ["option quote","red"]],
    data: [
      { label: "Definition", value: "Solve C_mkt = C_BS(S, K, T, r, σ_iv)", color: "teal" },
      { label: "Inputs", value: "Spot, strike, maturity, rate, price", color: "amber" },
      { label: "Output", value: "σ_iv for that option", color: "slate" },
    ],
    body: [
      `Implied volatility is the volatility parameter that makes the Black-Scholes formula exactly match the observed market option price. In other words, if a call option is quoted at C_mkt, we solve the equation C_BS(S₀, K, T, r, σ_iv) = C_mkt for σ_iv. This is not an estimate of realized variance in the past; it is the market’s current “pricing volatility” for that option, embedded in the option premium.`,
      `The inversion is done from the Black-Scholes model because the option price is a monotonic function of volatility. For a European call, larger volatility raises the value of the option by increasing the chance of very favorable outcomes. So for any given observed premium, there is a unique volatility level that rationalizes that premium under the model, assuming the option is otherwise well-specified and the rest of the inputs are known.`,
      `Implied volatility is therefore one of the most important market variables in derivatives. It is the language in which option prices are often quoted, and it reveals how the market is pricing uncertainty. A change in option price does not necessarily mean a change in the underlying; it may instead reflect a change in the market’s view of volatility, skew, or tail risk.`,
      `This is why the volatility surface is central: each strike and maturity embeds a different implied-vol level, and these levels jointly represent the market’s distributional view of future returns. The Black-Scholes formula is then not “the truth,” but a convenient mapping from option prices to a volatility number.`
    ],
    keyPoint: "Implied volatility is the market’s price of uncertainty for a specific option contract: it is the volatility input that makes the observed option premium consistent with the Black-Scholes model."
  },
  {
    era: "Shape",
    icon: "📉",
    title: "IV Smile, Skew, and Surface",
    desc: "The cross-section of implied volatilities across strikes and maturities reveals structured market pricing of risk",
    badge: { label: "Surface", style: "amber" },
    tags: [["smile","amber"], ["skew","red"], ["surface","slate"], ["strike dependence","teal"]],
    data: [
      { label: "Smile", value: "High IV in deep OTM + ITM wings", color: "amber" },
      { label: "Skew", value: "IV rises for OTM downside or upside depending on market", color: "red" },
      { label: "Surface", value: "Function of K and T", color: "slate" },
    ],
    body: [
      `In a perfect Black-Scholes world, implied volatility would be the same across all strikes and maturities. In real markets it is not. The implied-volatility curve across strike is usually not flat. When it is U-shaped, it is called a volatility smile; when it tilts upward or downward with strike, it is called a skew. The smile and skew are evidence that the market is not pricing returns as a single lognormal distribution with constant variance across all outcomes.`,
      `For equity options, the market often exhibits a volatility skew: out-of-the-money downside puts can trade with higher implied vol than ATM options, reflecting demand for downside protection and a willingness to pay more for hedging against crashes. For index options, the smile is often more symmetric but still shifts with risk regimes. In FX, vol smiles can reflect tail asymmetry or risk premia associated with currency moves.`,
      `The full object of interest is the volatility surface: σ_iv(K, T). This is a two-dimensional surface over strike and maturity. The shape of the volatility surface contains rich information about the market’s pricing of uncertainty over time. It differs from a scalar “implied vol” because option price depends on both strike and maturity, and these dimensions are jointly informative about the distribution of future returns.`,
      `The fact that IV varies by strike and maturity is one of the key practical reasons Black-Scholes is not used as a literal market model. A single constant σ is simply too restrictive. Traders and quants calibrate to the full surface rather than a single volatility level.`
    ],
    keyPoint: "The implied-volatility smile and skew are the market’s evidence that the distribution of returns is not a flat lognormal distribution: they encode the pricing of tails, asymmetry, and hedging demand."
  },
  {
    era: "Term",
    icon: "⏳",
    title: "Term Structure of Implied Volatility",
    desc: "How implied volatility varies with option maturity and what it says about market expectations and risk regimes",
    badge: { label: "Term", style: "teal" },
    tags: [["term structure","teal"], ["maturity effect","amber"], ["risk regime","slate"], ["smile by tenor","red"]],
    data: [
      { label: "Pattern", value: "Short-dated IV can be elevated during stress", color: "red" },
      { label: "Shape", value: "Often upward-sloping or hump-shaped", color: "teal" },
      { label: "Interpretation", value: "Forward uncertainty by horizon", color: "slate" },
    ],
    body: [
      `The term structure of implied volatility refers to how IV changes with the maturity of the option. In a calm regime, the skew or smile may be modest, but during periods of stress, short-dated options can suddenly display dramatically elevated IV because markets price near-term uncertainty much more aggressively. Longer-dated maturities may react more slowly.`,
      `The term structure can be upward-sloping, downward-sloping, or hump-shaped depending on the asset class and regime. For equities, IV often exhibits a “vol carry” structure, with longer-dated options retaining a baseline level while near-dated options can move sharply around expected events such as earnings, macro releases, or central-bank meetings.`,
      `This is economically important because the term structure is not just a statistical curiosity; it contains information about expected changes in uncertainty over time. A steeply upward term structure usually suggests that markets expect volatility to rise over the next several months, while a flat or inverted curve might indicate relative calm or a very different distribution of risk.`,
      `This is why vol surfaces are often discussed as two-dimensional objects: strike dependence and maturity dependence are both required to understand the market’s view of uncertainty. A single ATM IV number misses both the shape and the time pattern of risk pricing.`
    ],
    keyPoint: "The term structure of IV tells us how the market prices uncertainty across multiple horizons; it is a forward-looking map of expected turbulence rather than a single, static volatility estimate."
  },
  {
    era: "Spread",
    icon: "📊",
    title: "IV vs. Realized Volatility Spread",
    desc: "The difference between the market-implied uncertainty and the volatility actually realized over the same period",
    badge: { label: "Risk Premium", style: "red" },
    tags: [["vol premium","red"], ["realized vol","amber"], ["variance swap","slate"], ["pricing of uncertainty","teal"]],
    data: [
      { label: "Spread", value: "IV − RV", color: "red" },
      { label: "Interpretation", value: "Risk premium / option demand", color: "amber" },
      { label: "Typical", value: "Positive in many equity markets", color: "teal" },
    ],
    body: [
      `The realized volatility (RV) of the underlying over a given period is the actual historical standard deviation of returns. Implied volatility is the market’s expectation embedded in option prices. The spread IV − RV is one of the most widely watched risk measures in derivatives. When IV exceeds realized volatility, the market is effectively demanding a premium for bearing uncertainty or for protection.`,
      `This spread is often interpreted as a volatility risk premium because option sellers receive compensation for taking on risk that may not materialize, while option buyers pay for insurance. In equity markets this premium is often positive on average, especially for broad indexes and downside protection. In other words, the market frequently prices downside and uncertainty more richly than history alone would suggest.`,
      `However, the interpretation is subtle. The difference between IV and historical volatility can reflect not only risk premia but also the distributional shape of the market (skew, jumps, tail risk), estimation error, and changes in expected volatility regime. So the spread is not a pure arbitrage-free premium; it is a rich statistical signal that must be interpreted carefully.`,
      `A persistent IV-RV spread can be a sign of structural demand for hedging, but it is also a reminder that options are not priced only by backward-looking measures. They are priced by the market’s view of what may happen next, which is often more demanding than what has happened historically.`
    ],
    keyPoint: "The IV-realized-vol spread is a central concept in volatility trading: it captures the market’s willingness to pay for insurance and the risk premium associated with bearing uncertainty."
  },
  {
    era: "Index",
    icon: "📈",
    title: "IV Index: VIX",
    desc: "The widely followed 30-day implied-volatility index for the S&P 500",
    badge: { label: "Index", style: "slate" },
    tags: [["VIX","slate"], ["SPX","amber"], ["30-day vol","red"], ["fear gauge","teal"]],
    data: [
      { label: "Definition", value: "30-day annualized IV of SPX options", color: "slate" },
      { label: "Use", value: "Risk sentiment / hedging demand", color: "amber" },
      { label: "Interpretation", value: "Higher VIX = more stress / uncertainty", color: "red" },
    ],
    body: [
      `The VIX is the market’s benchmark implied-volatility index. It is designed to measure the market’s expectation of 30-day volatility in the S&P 500, based on a weighted portfolio of near- and next-term SPX options. The index is often described as the market’s “fear gauge,” because elevated VIX levels usually accompany heightened uncertainty, sharp downturns, and strong demand for hedging.`,

      `The VIX plays a vital role in derivative markets because it is tradable via futures, options, and exchange-traded products. It also serves as a benchmark for volatility trading strategies, such as long-volatility, short-volatility, and variance-carry strategies. In this sense, VIX is both an indicator and a tradable asset class.`,
      `Its power lies in the fact that it captures the market’s forward-looking uncertainty rather than the past. A model or risk team that ignores VIX misses a core object for understanding stress, hedging demand, and market sentiment.`

      `Because the implied vol surface is not flat, practice often requires parametric models to smooth and interpolate across strikes and maturities. The Stochastic Volatility Inspired (SVI) model is a popular way to fit the volatility smile in strike space. It offers a flexible family of shapes that can reproduce upward and downward skew, steep wings, and a smooth minimum in the ATM region.`,
      `The SABR model is another widely used parametric form, especially in interest-rate and FX derivatives. It models the forward rate and its stochastic volatility with parameters β, ρ, and ν. The model is particularly effective at capturing the volatility skew observed in many markets, especially around the at-the-money region.`,

      `The sticky-delta convention instead assumes that the option’s delta remains the primary anchor. As spot moves, the surface is reinterpreted by keeping the same delta bucket fixed, which often better reflects how the option market quotes risks in practical trading. Under sticky-delta, the implied volatility of an option at a given delta is more stable than the implied volatility at a fixed absolute strike.`,
      `These conventions matter because they affect hedging, P&L attribution, and volatility trading forecasts. Different desks and different asset classes tend to prefer different conventions. For equity index options, sticky-delta is often used because option market makers think in terms of delta buckets; in other markets, sticky-strike may be more natural.`,
      `The difference between the two assumptions is not merely semantic; it changes how you model the path of the volatility surface. In actual markets, vol surfaces are neither perfectly sticky-strike nor perfectly sticky-delta, and the correct convention often depends on the instrument, the trading context, and the regime.`

      `This is conceptually powerful because it moves from a flat-vol assumption to a volatility field that depends on both the level of the underlying and time. Local volatility is not the same as instantaneous implied volatility; it is the state-dependent diffusion coefficient required to reproduce a given option surface.`,

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
