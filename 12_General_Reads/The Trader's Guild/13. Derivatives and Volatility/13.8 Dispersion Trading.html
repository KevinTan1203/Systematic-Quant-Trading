<script>
const entries = [
	{
		era: "Setup",

		body: [
			`A dispersion trade starts from a very simple observation: when the implied volatility of the index is materially above the average implied volatility of the stocks in that index, the market is implying a relatively high degree of co-movement. In a normal regime, this usually means that the index is pricing a stronger common-factor move than the cross-section of constituent stocks would suggest on their own.`,
			`This is not necessarily a contradiction. Stocks do not move independently all the time. In stress periods, or even in ordinary market conditions, index volatility can exceed the average individual-stock volatility because of shared macro and sector risk. The index contains a systematic component that is stronger than the average idiosyncratic component.`,
			`From a pricing perspective, if the index vol is elevated relative to the basket of constituent vols, the implied correlation embedded in the option surface is often higher than “normal.” That is the backdrop behind a dispersion trade: the market may be rewarding the index more than the constituent names, creating a relative value disconnect.`,
			`The trade is therefore based on the idea that index volatility and stock volatility are not independent. A mismatch between them often reflects a correlation assumption embedded in the market. The dispersion trader then tries to express a view on whether that correlation is too high or too low.`
		],
		keyPoint: "When index volatility is higher than the average stock volatility, the market is typically embedding a strong common-factor move, which is the normal environment in which dispersion trades are evaluated."

	{
		era: "Opportunity",
		icon: "⚠️",
		title: "Correlation Breakdown Creates a Dispersion Trade",
		desc: "If correlation drops while stock vol remains elevated, the trade becomes attractive",

		tags: [["correlation breakdown","amber"], ["dispersion","slate"], ["relative value","teal"], ["divergence","red"]],
		data: [
			{ label: "Trigger", value: "Index vol falls, stock vols remain elevated", color: "amber" },
			{ label: "Signal", value: "Implied correlation looks too rich", color: "red" },
			{ label: "Trade setup", value: "Short index vol, long stock vols", color: "teal" },
		],
		body: [
			`The dispersion trade is most attractive when the market is priced as if stocks are all moving together, but in reality the underlying correlation structure begins to break down. That is a classic “correlation breakdown” trade: stock-specific risks become more important and index moves are less synchronized than the option market is assuming.`,
			`In plain language, the market may be overpricing the common move and underpricing the idiosyncratic dispersion. When dispersion is expected to rise, the basket of single-name options can become relatively more attractive than index options. That is the core arbitrage idea behind the trade.`,
			`If realized correlation is lower than implied correlation, then index volatility can look expensive relative to the cross-section of names. The levered structure of the trade is meant to capture that spread: index vol is sold because it is assumed to be rich; single-stock volatility is bought because the components are expected to diverge.`,
			`This is why dispersion trading is often viewed as a correlation trade disguised as a volatility trade. The exposure is to the difference between the index’s common factor volatility and the aggregate component volatility. The trader is not simply long or short volatility in the abstract; the trader is expressing a view on correlation structure.`
		],
		keyPoint: "A correlation breakdown is the moment when the market’s implied co-movement is too aggressive relative to the actual behavior of the individual names, creating a relative-value opportunity in dispersion."
	},
	{

			`The canonical dispersion trade is: short index volatility and long single-stock volatility. The short leg is the index because the index is viewed as overpricing the common move. The long leg is the stock basket because the component vols are seen as relatively attractive when individual security risk is expected to dominate.`,
			`This can be implemented using options on the index versus options on the underlying constituents, or through variance swaps if the market provides them. The intuition is straightforward: if correlation collapses and stocks start to move more independently, the stock basket will realize more variance than the index, so the long basket exposure should outperform the short index exposure.`,
			`This structure is especially natural when the index is a broad market benchmark and the constituents differ by sector, style, and idiosyncratic volatility. The dispersion trade captures the idea that stock volatility is not always “too high” in an absolute sense; it is higher relative to the index because of the dispersion of returns across names.`,
			`The trade is not a pure bet on volatility direction. It is a bet on the spread between the aggregate variance of the constituents and the variance of the index. In other words, the trader is expressing a view that the index’s common-factor volatility is too expensive relative to the stock basket’s underlying dispersion.`
		],
		keyPoint: "The classical dispersion trade sells the index’s common volatility and buys the constituents’ idiosyncratic volatility, betting that stock dispersion will rise relative to the index."

			`The same dispersion view can be implemented in multiple ways, and the choice matters. A vega-weighted implementation tries to equalize the volatility sensitivity of the long and short legs by scaling each position according to its vega. This is often the cleanest method when the objective is to isolate a volatility-correlation view rather than a balance-sheet or notional-targeting view.`,

		tags: [["implied correlation","red"], ["realized correlation","teal"], ["variance decomposition","slate"], ["dispersion signal","amber"]],
		data: [
			{ label: "Implied", value: "From option prices / index vs basket", color: "red" },
			{ label: "Realized", value: "From observed stock returns", color: "teal" },
			{ label: "Edge", value: "If implied > realized, short correlation / long dispersion", color: "amber" },
		],
		body: [
			`A dispersion trader is constantly comparing implied correlation, which is inferred from option prices, with realized correlation, which is measured from actual stock return movements. The difference between the two is the central signal. If the market is implying a correlation level that is too high relative to what the underlying names actually deliver, the dispersion trade becomes attractive.`,
			`That logic is intuitive: when correlation is too high, the index option seems expensive because the market is pricing a stronger common move than is materializing. In that case, selling index volatility and buying constituent vol is a natural position.`,
			`Conversely, if realized correlation is running above implied correlation, the index may be relatively underpriced. In that case the trade might reverse. The real art of dispersion trading is not simply to pick a direction, but to decide whether the market is mispricing the average co-movement of the basket relative to the index.`
		],
		keyPoint: "The dispersion trade is fundamentally a comparison between the correlation the options market is pricing and the correlation the actual stock returns are delivering."
	},
	{
		era: "Alternative",
		icon: "🔁",
		title: "Correlation Swaps Offer a Direct Alternative",
		desc: "Rather than trading options directly, one can trade correlation exposure in a more linear way",
		badge: { label: "Swap", style: "amber" },
		tags: [["correlation swap","amber"], ["variance swap","slate"], ["direct correlation","teal"], ["index basket","red"]],
		data: [
			{ label: "Direct exposure", value: "Correlation not just vols", color: "amber" },
			{ label: "Structure", value: "Pay fixed correlation / receive realized correlation", color: "slate" },
			{ label: "Use", value: "Cleaner expression of the same view", color: "teal" },
		],
		body: [
			`A correlation swap provides a more direct way to trade the idea behind dispersion. Instead of building a complex options spread, the trader can express exposure to the correlation between constituents and the index, often in a more linear and instrument-specific way.`,
			`The appeal is that a correlation swap allows the investor to isolate the correlation component rather than dealing with the entire options surface and its skew effects. That can be cleaner from a risk perspective, particularly when there is a strong view on the market’s correlation assumption.`,
			`However, the trade has its own complications: liquidity, pricing, basis risk, and counterparty considerations can matter. It is not automatically “better” than a dispersion trade. Instead, it is simply a different expression of the same fundamental view: the market may be mispricing how much stocks move together.`
		],
		keyPoint: "A correlation swap is a more direct route to expressing the same market view as a dispersion trade, but with a different liquidity and risk profile."
	},
	{
		era: "Risk",
		icon: "💥",
		title: "Correlation Spike in Crisis Is the Main Drawback",
		desc: "The trade can lose money sharply when all stocks move together under stress",
		badge: { label: "Risk", style: "red" },
		tags: [["crisis risk","red"], ["correlation spike","amber"], ["panic regime","slate"], ["short correlation","teal"]],
		data: [
			{ label: "Stress event", value: "Stocks move together violently", color: "red" },
			{ label: "Problem", value: "Short index vol / long stock vols can lose sharply", color: "amber" },
			{ label: "Reality", value: "Crash regimes are not normal dispersion regimes", color: "slate" },
		],
		body: [
			`The key danger in a dispersion trade is exactly what the strategy is designed to avoid: in a severe market crisis, correlation can spike sharply and all the constituent names may move together. In that environment, the assumptions behind the trade break down. The very thing that was thought to be mispriced—low correlation relative to the index—can reverse suddenly.`,
			`This is a principal risk of dispersion. Under stress, the market is no longer dominated by idiosyncratic dispersion; it becomes a single-factor crash. The index and the basket can both rise in volatility, but the relative spread that the trader is betting on can move against them. The position can lose money quickly even if it was conceptually sound before the shock.`,
			`That is why dispersion is often described as a strategy with attractive expected payoffs but meaningful left-tail risk. The trade performs well in normal markets where correlation is moderate and stock names differ, but it can suffer badly when contagion drives everything together. In crisis conditions, correlation is not a stable assumption—it can become extreme and destructive.`
		],
		keyPoint: "The main risk in dispersion trading is the crisis regime itself: when correlation spikes, the stock basket and the index become highly synchronized and the trade can lose money sharply."
	}
];

let counter = 0;

function renderAll() {
	const root = document.getElementById('entries-root');
	entries.forEach((e, i) => {
		const idx = counter++;
		const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

		const dataHtml = e.data ? `
			<div class="data-strip">
				${e.data.map(d => `
					<div class="data-cell">
						<div class="data-cell-label">${d.label}</div>
						<div class="data-cell-value ${d.color}">${d.value || '—'}</div>
					</div>
				`).join('')}
			</div>` : '';

		const compareHtml = e.compare ? `
			<div class="compare-grid">
				<div class="compare-box left">
					<div class="compare-label">${e.compare.left.label}</div>
					<p>${e.compare.left.text}</p>
				</div>
				<div class="compare-box right">
					<div class="compare-label">${e.compare.right.label}</div>
					<p>${e.compare.right.text}</p>
				</div>
			</div>` : '';

		const noteHtml = e.note ? `
			<div class="note-box">
				<div class="note-label">${e.note.label}</div>
				<p>${e.note.text}</p>
			</div>` : '';

		const bodyHtml =
			e.body.map(p => `<p>${p}</p>`).join('') +
			compareHtml +
			dataHtml +
			noteHtml +
			`<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
			`<div class="tags">${tagHtml}</div>`;

		const div = document.createElement('div');
		div.className = 'entry';
		div.id = `e-${idx}`;
		div.innerHTML = `
			<div class="entry-card">
				<div class="entry-header" onclick="toggle(${idx})">
					<div class="entry-era">${e.era}</div>
					<div class="entry-icon">${e.icon}</div>
					<div class="entry-title-block">
						<div class="entry-title">${e.title}</div>
						<div class="entry-desc">${e.desc}</div>
					</div>
					<span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
					<span class="entry-toggle">▶</span>
				</div>
				<div class="entry-body">${bodyHtml}</div>
			</div>
		`;
		root.appendChild(div);
	});
}

function toggle(i) {
	document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
	for (let i = 0; i < counter; i++) {
		const el = document.getElementById(`e-${i}`);
		if (el) open ? el.classList.add('open') : el.classList.remove('open');
	}
}

renderAll();
</script>
