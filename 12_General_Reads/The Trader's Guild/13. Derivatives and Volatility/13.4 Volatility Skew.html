<script>
const entries = [

      `The magnitude is conventionally measured by the 25-delta risk reversal (25Δ put IV minus 25Δ call IV) or by the slope of IV versus log-moneyness. For the S&P 500 a 25Δ risk reversal of −2 to −3 volatility points is typical in calm regimes; in stress it can exceed −6 or −8 points. Single-stock smiles inherit the index skew but are usually milder and more symmetric, reflecting idiosyncratic jump risk in both directions.`,

    body: [
      `Because a put’s price is monotonically increasing in its implied volatility, the skew directly quotes the cost of crash protection. A steeper (more negative) skew means that transferring left-tail risk is more expensive; a flatter skew means protection is relatively cheap. Portfolio managers therefore monitor skew levels both in absolute terms and relative to their own realised-tail experience or to cross-sectional peers.`,

    icon: "🌍",
    title: "Volatility Smile in FX and Rates",
    desc: "How the shape of the implied-volatility smile differs across asset classes—symmetric in FX, often reverse or humped in rates—and what those shapes reveal",
    badge: { label: "Cross-Asset", style: "teal" },
    tags: [["FX smile","teal"], ["rates smile","amber"], ["risk reversal","slate"], ["butterfly","red"]],
    data: [
      { label: "FX typical", value: "Symmetric smile (RR + BF)", color: "teal" },
      { label: "Rates typical", value: "Reverse skew or hump", color: "amber" },
      { label: "Equity typical", value: "Strong negative skew", color: "red" },
    ],
    body: [
      `FX markets exhibit a more symmetric smile. Both wings are elevated, producing a classic “U” shape that is conveniently parameterised by the 25-delta risk reversal (skew) and the 25-delta butterfly (curvature). The risk reversal can change sign with the macroeconomic regime: a currency under devaluation pressure develops a put skew (higher IV on the downside for that currency), while a high-yielding currency often shows a call skew. The butterfly remains positive, reflecting demand for volatility in both directions.`,
      `Interest-rate markets historically displayed a reverse skew (higher IV on higher rates) because rates were bounded below by zero and the principal risk was a sharp rise in yields. After the global financial crisis and the advent of negative rates, many curves developed a more symmetric or even equity-like skew. Swaption smiles are further complicated by the choice of annuity measure and by the presence of a discrete set of liquid expiries and tenors.`,
      `These cross-asset differences are not cosmetic. They dictate the natural hedging instruments (risk reversals in FX, curve caps/floors in rates, put spreads in equities) and the modelling choices (stochastic-volatility plus jumps for equities, SABR or LMM-SABR for rates, vanna-volga or stochastic-local-vol for FX). A trader who imports equity intuition unchanged into FX or rates will systematically misprice the wings.`
    ],
    keyPoint: "The smile is the risk-neutral distribution’s signature. Equity’s left-tail fear, FX’s two-sided jump risk, and rates’ historical upward bias each leave a distinct geometric imprint that any serious cross-asset volatility framework must respect."
  },
  {
    era: "Trade",
 dual: "⚔️",
    title: "Skew Trading: Risk Reversals",
    desc: "The primary liquid instrument for expressing a pure view on skew—long or short a call versus a put of equal delta, delta-hedged",
    badge: { label: "Trading", style: "amber" },
    tags: [["risk reversal","amber"], ["25Δ RR","teal"], ["skew view","slate"], ["delta-hedged","red"]],
    data: [
      { label: "Long RR", value: "Long call / short put (same Δ)", color: "teal" },
      { label: "Short RR", value: "Short call / long put", color: "red" },
      { label: "P&L driver", value: "Change in skew + sticky rule", color: "amber" },
    ],
    body: [
      `A risk reversal (RR) is the simultaneous purchase of a call and sale of a put (or vice versa) of equal absolute delta—most commonly 25-delta. When delta-hedged, the position is approximately neutral to the underlying and to ATM volatility; its dominant exposure is to the slope of the smile. A long risk-reversal (long call, short put) profits when skew flattens or turns positive; a short risk-reversal profits when skew steepens.`,
      `Because the two options have different vega, volga and vanna profiles, the residual risks are not zero. The short-put leg of a short RR carries significant left-tail exposure; the position therefore embeds a short-crash view in addition to a pure skew view. In FX the risk reversal is quoted directly by market makers and is one of the three pillars of the smile (alongside ATM and butterfly). In equities it is usually synthesised from listed or OTC options.`,
      `Execution and risk management require continuous delta re-hedging, careful monitoring of the sticky-strike versus sticky-delta behaviour, and an explicit view on whether the anticipated skew change will be accompanied by an ATM volatility move. Risk reversals remain the most liquid and transparent vehicle for transferring skew risk between counterparties.`
    ],
    keyPoint: "The risk reversal is skew made tradable. It converts an abstract slope on a chart into a concrete, delta-hedgeable position whose P&L is driven primarily by the evolution of the smile’s asymmetry."

    badge: { label: "Relative Value", style: "slate" },
    tags: [["flattener","teal"], ["steepener","red"], ["calendar skew","amber"], ["wing vs body","slate"]],
    data: [
      { label: "Flattener", value: "Sell steep wing / buy flatter wing", color: "teal" },
      { label: "Steepener", value: "Buy steep wing / sell flatter wing", color: "red" },
      { label: "Horizon", value: "Maturity or strike dimension", color: "amber" },
    ],
    body: [
      `Beyond the outright risk reversal, traders construct more nuanced skew-change trades. A skew flattener sells the expensive (steep) part of the smile and buys the cheaper (flatter) part, either across strikes on the same expiry or across the term structure. A skew steepener does the opposite. Typical constructions include long a 25Δ risk reversal versus short a 10Δ risk reversal (wing-versus-body), or long a short-dated RR versus short a longer-dated RR (calendar skew).`,
      `These trades isolate the curvature or the term-structure slope of skew rather than its absolute level. They are popular when the front-end skew appears excessively steep relative to longer-dated skew after a scare, or when a particular wing looks mis-priced relative to a calibrated stochastic-volatility or rough-volatility model. Because both legs are themselves skew-sensitive, the net vega, vanna and volga exposures must be carefully balanced and re-hedged.`,
      `Success depends on a clear thesis about the source of the anticipated change—mean reversion of jump risk, supply of structured products, central-bank intervention, or a shift in the sticky regime—and on disciplined risk limits around the residual crash exposure that every skew trade ultimately carries.`
    ],
    keyPoint: "Flatteners and steepeners are the relative-value expression of skew. They do not bet that skew exists; they bet that its current shape is temporary and will evolve in a predictable direction—precisely the domain where models and market intuition most often diverge."

];

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
