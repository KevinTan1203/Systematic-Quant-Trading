      `Market maker gamma exposure is a way of measuring how dealers are positioned across options and how they must hedge as spot moves. Since dealers are typically short gamma in many option books, their hedging decisions become a mechanical source of flow: when spot rises, they buy or sell the underlying to remain delta neutral, and that trading activity can push the market further in the same direction or damp it depending on the sign of the net gamma.`,
      `This is the central intuition behind gamma exposure analysis. If dealers are net short gamma, they must hedge by selling after rallies and buying after dips. That behavior tends to amplify moves and can create momentum-like feedback. If dealers are net long gamma, they instead buy dips and sell rallies, which dampens volatility and creates stabilizing flow.`,
      `The key quantity is not only the option gamma itself, but the aggregate gamma exposure across the live options market. This is why “GEX” is so useful: it compresses a large options book into a market-level measure of how much hedging flow the dealer community would need to supply at different spot levels.`,

      `This is the classic “buy the dip, sell the rip” logic. Positive gamma does not mean the market necessarily rallies or declines—rather, it means the dealer hedging flow acts in a way that dampens the move and reduces the amplitude of short-term fluctuations. The options market is acting as a shock absorber.`,

      `A practical measure of dealer gamma pressure is the Gamma Exposure, or GEX, where at each strike and maturity we compute the product of option gamma, open interest, and a scaling factor:

      The point is to aggregate the net option positioning into a single map of dealer hedging pressure across the option surface.`,

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
