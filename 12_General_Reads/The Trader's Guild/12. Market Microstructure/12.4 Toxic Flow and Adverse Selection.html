<script>
const entries = [
  {
    era: "Core",
    icon: "☠️",
    title: "Adverse Selection: Trading Against Informed Parties",
    desc: "The systematic loss incurred by uninformed or liquidity-providing counterparties when they trade with agents who possess superior information about future price moves",
    badge: { label: "Foundation", style: "red" },
    tags: [["adverse selection","red"], ["informed flow","amber"], ["pick-off risk","teal"], ["toxicity",""]],
    data: [
      { label: "Mechanism", value: "Informed side knows more about value", color: "red" },
      { label: "Victim", value: "Market makers & uninformed flow", color: "amber" },
      { label: "Result", value: "Losses concentrated on the uninformed", color: "teal" },
    ],
    body: [
      `Adverse selection arises whenever one side of a trade has better information about the fundamental or short-term value of the asset. The informed party buys when the price is too low and sells when it is too high; the uninformed or liquidity-providing party systematically ends up on the wrong side. Over repeated interactions those losses become a primary cost of providing liquidity.`,
      `In electronic markets the informed side may be a fundamental investor reacting to news, a statistical-arbitrageur exploiting a fleeting signal, or a latency-sensitive trader who simply arrives first. The uninformed side is typically a market maker, a passive institutional algorithm, or retail flow. The economic consequence is that quoted and effective spreads must embed compensation for expected adverse-selection losses.`,
      `Measuring and managing adverse selection is therefore central both to market-making profitability and to the design of execution algorithms that try to avoid becoming the uninformed counterparty.`
    ],
    keyPoint: "Adverse selection is the informational tax on liquidity provision. Every market maker’s P&L is, to a first approximation, the spread earned minus the losses to informed flow."
  },
  {
    era: "Measure",
    icon: "📐",
    title: "PIN (Probability of Informed Trading)",
    desc: "A structural estimate of the fraction of trades that originate from informed agents, derived from a sequential trade model of the order flow",
    badge: { label: "Classic", style: "slate" },
    tags: [["PIN","slate"], ["Easley et al.","teal"], ["informed probability","amber"], ["MLE",""]],
    data: [
      { label: "Origin", value: "Easley, Kiefer, O’Hara, Paperman", color: "slate" },
      { label: "Output", value: "Daily / period probability of informed trade", color: "teal" },
      { label: "Method", value: "Maximum likelihood on buy/sell counts", color: "amber" },
    ],
    body: [
      `The Probability of Informed Trading (PIN) model treats each trading day (or interval) as the outcome of a sequential process: with some probability an information event occurs; if it does, informed traders arrive according to a Poisson process and trade in the direction of the news; uninformed traders arrive symmetrically. The observable data are the counts of buyer- and seller-initiated trades. Maximum-likelihood estimation recovers the structural parameters and, from them, the unconditional probability that a given trade is informed.`,
      `PIN has been widely used as a cross-sectional and time-series measure of information asymmetry. Higher PIN is associated with wider spreads, higher required returns, and greater price impact. The original daily formulation has been extended to intraday windows and to richer arrival processes.`,
      `Limitations include sensitivity to trade classification, the assumption of a single daily information event, and computational cost. Nevertheless PIN remains the conceptual benchmark for structural measures of informed trading.`
    ],
    keyPoint: "PIN converts the abstract notion of informed flow into an estimable probability. It is the foundational quantitative link between order-flow imbalance and information asymmetry."
  },
  {
    era: "High-Freq",
    icon: "⚡",
    title: "VPIN (Volume-Synchronized PIN)",
    desc: "A high-frequency, volume-clock adaptation of the PIN idea that estimates flow toxicity from the imbalance of volume classified into buy and sell buckets",
    badge: { label: "Modern", style: "amber" },
    tags: [["VPIN","amber"], ["volume clock","teal"], ["toxicity","red"], ["Easley et al.",""]],
    data: [
      { label: "Clock", value: "Volume buckets, not calendar time", color: "amber" },
      { label: "Signal", value: "Buy/sell volume imbalance per bucket", color: "teal" },
      { label: "Use", value: "Real-time toxicity & crash warning", color: "red" },
    ],
    body: [
      `VPIN (Volume-Synchronized Probability of Informed Trading) re-expresses the PIN intuition in volume time. Trades are accumulated into equal-volume buckets; within each bucket volume is classified as buy or sell (typically by a tick rule or bulk-volume classification); the absolute imbalance is normalised to produce a toxicity metric that updates after every bucket. Because the clock is volume rather than calendar time, the measure naturally accelerates in active markets.`,
      `VPIN was designed for real-time monitoring and has been examined as a possible early-warning indicator of liquidity crises and flash events. High VPIN readings indicate that recent volume has been heavily one-sided, consistent with informed or momentum flow that market makers find toxic.`,
      `Practical implementations must choose bucket size, classification method and smoothing. The metric is complementary to, rather than a replacement for, traditional PIN and for direct mark-out measures of adverse selection.`
    ],
    keyPoint: "VPIN brings the PIN concept into the high-frequency, volume-clock domain. It supplies a continuously updating gauge of order-flow toxicity that market makers and risk systems can act upon in real time."
  },
  {
    era: "Practice",
    icon: "🛡️",
    title: "Toxic Flow Detection by Market Makers",
    desc: "Operational techniques used by liquidity providers to identify, in real time, order flow that is likely to be adversely selected and to adjust quotes or inventory accordingly",
    badge: { label: "Operational", style: "red" },
    tags: [["toxicity detection","red"], ["mark-outs","teal"], ["quote adaptation","amber"], ["inventory",""]],
    data: [
      { label: "Signals", value: "Mark-outs, VPIN, imbalance, velocity", color: "red" },
      { label: "Response", value: "Widen, pull, skew, or reduce size", color: "amber" },
      { label: "Horizon", value: "Milliseconds to minutes", color: "teal" },
    ],
    body: [
      `Market makers continuously evaluate whether the flow they are filling is “toxic”—i.e., predictive of subsequent price moves against their residual inventory. Short-horizon mark-outs (the mid-price change a few hundred milliseconds to several minutes after a fill), local order-book imbalance, trade-sign autocorrelation, VPIN-style metrics and simple velocity of the mid are all used as real-time toxicity indicators.`,
      `When toxicity rises, the maker’s rational responses include widening the quoted spread, reducing displayed size, skewing quotes away from the inferred informed direction, or temporarily withdrawing. The speed and accuracy of this detection loop are among the principal determinants of market-making profitability in competitive electronic markets.`,
      `Detection is inherently statistical and error-prone; overly aggressive withdrawal can lose valuable uninformed flow, while under-reaction produces rapid inventory and P&L damage. The quality of the toxicity signal is therefore a core research and engineering focus.`
    ],
    keyPoint: "Toxic-flow detection is the market maker’s immune system. The ability to recognise and respond to adverse selection in real time separates durable liquidity provision from rapid capital erosion."
  },
  {
    era: "Pricing",
    icon: "📏",
    title: "Flow Toxicity as Spread Driver",
    desc: "The economic channel through which the risk of adverse selection is compensated by wider quoted and effective spreads",
    badge: { label: "Economics", style: "amber" },
    tags: [["spread components","amber"], ["adverse-selection component","red"], ["inventory + order processing","teal"], ["compensation",""]],
    data: [
      { label: "Decomposition", value: "AS + inventory + order-processing", color: "amber" },
      { label: "AS share", value: "Often the dominant component", color: "red" },
      { label: "Implication", value: "Toxicity ↑ → equilibrium spread ↑", color: "teal" },
    ],
    body: [
      `Microstructure theory decomposes the bid–ask spread into at least three parts: an order-processing cost, an inventory-risk premium, and an adverse-selection premium. The last of these is the market maker’s required compensation for the expected loss to informed traders. When the probability or severity of toxic flow rises, the adverse-selection component—and therefore the equilibrium spread—widens.`,
      `Empirically, periods of elevated PIN, VPIN or realised mark-out losses are associated with wider spreads and thinner depth. Cross-sectionally, securities with greater information asymmetry (e.g., around earnings, or among smaller, less-covered names) exhibit larger adverse-selection components.`,
      `For execution algorithms the same logic implies that the cost of taking liquidity is partly a payment for the information risk the maker bears; understanding that channel helps in choosing when to cross the spread versus when to post passively.`
    ],
    keyPoint: "Spreads are not merely operational costs; they are in large part insurance premiums against toxic flow. Flow toxicity is therefore a first-order fundamental of liquidity pricing."
  },
  {
    era: "Model",
    icon: "📘",
    title: "Glosten–Milgrom Model",
    desc: "The canonical sequential-trade model in which a competitive market maker sets bid and ask prices to break even in the presence of informed and uninformed traders",
    badge: { label: "Theory", style: "slate" },
    tags: [["Glosten-Milgrom","slate"], ["sequential trade","teal"], ["break-even quotes","amber"], ["Bayesian update",""]],
    data: [
      { label: "Setting", value: "Informed + uninformed, competitive MM", color: "slate" },
      { label: "Result", value: "Spread = adverse-selection compensation", color: "teal" },
      { label: "Dynamics", value: "Quotes update with each trade", color: "amber" },
    ],
    body: [
      `Glosten & Milgrom (1985) model a market in which a risk-neutral, competitive market maker posts bid and ask prices. Traders arrive sequentially; some are informed and trade only when they have an edge, others are uninformed and trade for liquidity reasons. The market maker does not know the type of the next trader but updates beliefs after each trade via Bayes’ rule and sets the next quotes so that the expected profit on the next trade is zero.`,
      `The model delivers a positive spread even in the absence of order-processing costs or inventory risk: the spread is exactly the compensation for adverse selection. It also produces the intuitive result that trades cause permanent price impacts in the direction of the trade, because each trade revises the market maker’s belief about true value.`,
      `Glosten–Milgrom remains the conceptual foundation for almost all subsequent adverse-selection and information-based microstructure models.`
    ],
    keyPoint: "Glosten–Milgrom shows that adverse selection alone is sufficient to generate a bid–ask spread. It is the theoretical origin of the idea that spreads price the risk of informed flow."
  },
  {
    era: "Impact",
    icon: "λ",
    title: "Kyle’s Lambda (Price Impact Parameter)",
    desc: "The coefficient that maps signed order flow into permanent price change in Kyle’s strategic model of informed trading with a competitive market maker",
    badge: { label: "Theory", style: "teal" },
    tags: [["Kyle lambda","teal"], ["price impact","amber"], ["informed trading","slate"], ["depth",""]],
    data: [
      { label: "Definition", value: "ΔP ≈ λ · signed volume", color: "teal" },
      { label: "Interpretation", value: "Inverse depth / impact coefficient", color: "amber" },
      { label: "Origin", value: "Kyle (1985) batch-auction model", color: "slate" },
    ],
    body: [
      `In Kyle’s (1985) model an informed trader and noise traders submit market orders to a competitive market maker who sets a single price that is linear in the net order flow. The slope of that pricing rule is Kyle’s lambda (λ). A larger λ means that a given signed volume moves the price more—i.e., the market is less deep and adverse selection is more severe.`,
      `Lambda is therefore both a measure of illiquidity and a summary of the market maker’s optimal response to the risk of informed trading. Empirically it is estimated by regressing price changes on signed volume (or on innovations in signed volume) over chosen horizons; the resulting coefficient is widely used as a continuous measure of price impact and information asymmetry.`,
      `Because λ is determined in equilibrium by the intensity of informed trading, the volatility of noise trading and the residual uncertainty about value, it links the theoretical adverse-selection literature directly to observable impact statistics.`
    ],
    keyPoint: "Kyle’s lambda is the structural price of signed order flow. It compresses the adverse-selection problem into a single, estimable impact coefficient that remains central to both theory and empirical work."
  },
  {
    era: "Empirical",
    icon: "📉",
    title: "Amihud Illiquidity Measure",
    desc: "A simple daily ratio of absolute return to trading volume that serves as a widely used empirical proxy for price impact and illiquidity",
    badge: { label: "Proxy", style: "amber" },
    tags: [["Amihud","amber"], ["illiquidity","teal"], ["|r| / volume","slate"], ["low-frequency",""]],
    data: [
      { label: "Formula", value: "Average of |r_t| / Volume_t", color: "amber" },
      { label: "Horizon", value: "Typically daily, averaged monthly", color: "teal" },
      { label: "Interpretation", value: "Return per unit volume ≈ impact", color: "slate" },
    ],
    body: [
      `Amihud (2002) proposed the average daily ratio of absolute return to dollar (or share) volume as a practical measure of illiquidity. On days when a given volume produces a large price move, the ratio is high and the stock is deemed less liquid. The measure requires only daily data, making it computable over long histories and across many markets.`,
      `Although it does not separately identify adverse selection from other sources of impact, the Amihud ratio correlates strongly with microstructure-based measures of price impact and with the adverse-selection component of the spread. It has become a standard control and sorting variable in asset-pricing studies of liquidity risk.`,
      `Refinements include square-root versions, robust averaging, and adjustments for zero-volume days. Its simplicity remains its greatest advantage for large-scale empirical work.`
    ],
    keyPoint: "The Amihud measure is the low-frequency workhorse of empirical illiquidity. It translates the idea of price impact into a statistic that can be computed wherever daily returns and volumes exist."
  },
  {
    era: "Spread",
    icon: "📏",
    title: "Roll Measure of Effective Spread",
    desc: "An estimator of the effective bid–ask spread derived solely from the serial covariance of returns, under the assumption that the efficient price follows a random walk and the only friction is a constant spread",
    badge: { label: "Classic", style: "slate" },
    tags: [["Roll","slate"], ["effective spread","teal"], ["serial covariance","amber"], ["implicit spread",""]],
    data: [
      { label: "Formula", value: "2 √(−Cov(Δp_t, Δp_{t−1}))", color: "slate" },
      { label: "Assumption", value: "Random-walk efficient price + constant spread", color: "teal" },
      { label: "Use", value: "Spread when quotes are unavailable", color: "amber" },
    ],
    body: [
      `Roll (1984) observed that if the only deviation from a random-walk efficient price is a constant bid–ask bounce, then successive price changes are negatively serially correlated and the magnitude of that covariance identifies the spread. The resulting estimator—twice the square root of the negative first-order autocovariance of returns—requires no quote data and can be computed from transaction prices alone.`,
      `The measure is an estimate of the effective spread under strong assumptions. In practice those assumptions are violated by time-varying spreads, inventory effects, and genuine return autocorrelation, so the Roll estimator is often biased downward or undefined (when the sample covariance is positive). Robust variants and Bayesian adjustments are commonly applied.`,
      `Despite its limitations, the Roll measure remains a foundational tool for historical or data-poor settings and a useful benchmark against which quote-based effective-spread calculations can be compared.`
    ],
    keyPoint: "The Roll measure extracts an implied spread from the bounce of transaction prices. It is the classic demonstration that adverse-selection and order-processing costs leave a detectable statistical footprint even without an observable order book."

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const noteHtml = e.note ? `
      <div class="note-box">
        <div class="note-label">${e.note.label}</div>
        <p>${e.note.text}</p>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      noteHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
