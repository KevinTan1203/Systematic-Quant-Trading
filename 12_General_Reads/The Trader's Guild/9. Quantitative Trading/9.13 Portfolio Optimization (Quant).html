  .timeline::before {
    content: '';

    bottom: 8px;

  .entry {

  .entry::before {
    content: '';
    position: absolute;

  .entry-header {
    display: grid;

  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }

    margin-bottom: 0 !important;

  .data-strip {

  .data-cell {

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }

  .foot-rule {
    border: none;

  .footer-note {

  @media (max-width: 640px) {

    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }

    .compare-grid { grid-template-columns: 1fr; }

<script>
const entries = [
  {
    era: "Foundation",
    icon: "📐",
    title: "Markowitz Mean-Variance Optimization",
    desc: "The classic quadratic program that maximises expected return for a given variance (or minimises variance for a given return)",
    badge: { label: "Core", style: "teal" },
    tags: [["Markowitz","teal"], ["quadratic","amber"], ["mean-variance",""], ["quadratic programming","slate"]],
    data: [
      { label: "Objective", value: "max μ′w − (λ/2) w′Σw", color: "teal" },
      { label: "Inputs", value: "Expected returns μ, covariance Σ", color: "" },
      { label: "Key issue", value: "Estimation error sensitivity", color: "red" },
    ],
    body: [
      `Harry Markowitz’s 1952 framework remains the conceptual foundation of quantitative portfolio construction. The investor chooses weights w that maximise expected portfolio return μ′w subject to a variance constraint w′Σw ≤ σ² (or the dual problem of minimising variance for a target return). With a risk-aversion parameter λ the problem becomes the unconstrained quadratic program max μ′w − (λ/2) w′Σw.`,
      `In practice the optimisation is solved subject to budget (1′w = 1), long-only (w ≥ 0), and often additional linear constraints. The solution is analytically available in the unconstrained case and numerically via quadratic programming solvers when constraints are present.`,
      `The framework is elegant and theoretically coherent, yet its practical performance is limited by the extreme sensitivity of the optimal weights to small errors in the estimated means and covariances. This estimation-error problem is the central motivation for virtually every subsequent improvement in the field.`
    ],
    keyPoint: "Mean-variance optimisation is the correct mathematical statement of the diversification problem, but its naïve implementation is so estimation-error sensitive that it is rarely used without substantial regularisation or robustification."
  },
  {
    era: "Geometry",
    icon: "📈",
    title: "Efficient Frontier",
    desc: "The set of portfolios that offer the highest expected return for each level of risk (or lowest risk for each level of return)",
    badge: { label: "Concept", style: "amber" },
    tags: [["frontier","amber"], ["Pareto","teal"], ["two-fund","slate"], ["capital market line",""]],
    data: [
      { label: "Shape", value: "Hyperbola in (σ, μ) space", color: "teal" },
      { label: "Key portfolios", value: "Min-var & tangency", color: "" },
      { label: "Implication", value: "Only frontier portfolios are rational", color: "amber" },
    ],
    body: [
      `When the mean-variance problem is solved for every possible target return (or risk aversion), the resulting locus of optimal portfolios traces the efficient frontier — a hyperbola in mean–standard-deviation space. Every rational mean-variance investor will hold a portfolio somewhere on this frontier; any interior portfolio is dominated.`,
      `Two special points are especially important: the global minimum-variance portfolio (leftmost point) and the maximum-Sharpe (tangency) portfolio that maximises the slope from the risk-free rate. In the presence of a risk-free asset the efficient set collapses to the Capital Market Line connecting the risk-free rate to the tangency portfolio.`,
      `In practice the estimated frontier is highly unstable: small changes in inputs produce large shifts in the curve and in the composition of the “optimal” portfolios. Visualising the frontier remains useful for understanding the risk–return trade-off, but the exact location of any point on the estimated frontier should be treated with caution.`
    ],
    keyPoint: "The efficient frontier is the geometric embodiment of diversification. It tells you the best achievable trade-off, but the estimated frontier is only as reliable as the estimated inputs that generate it."
  },
  {
    era: "Special Case",
    icon: "🛡️",
    title: "Minimum Variance Portfolio",
    desc: "The fully invested portfolio with the lowest possible variance; ignores expected returns entirely",
    badge: { label: "Robust", style: "teal" },
    tags: [["min-var","teal"], ["no μ","amber"], ["defensive",""], ["low-vol anomaly","slate"]],
    data: [
      { label: "Objective", value: "min w′Σw  s.t. 1′w = 1", color: "teal" },
      { label: "Advantage", value: "Avoids return estimation error", color: "" },
      { label: "Behaviour", value: "Concentrates in low-vol assets", color: "amber" },
    ],
    body: [
      `The global minimum-variance (GMV) portfolio is obtained by solving the pure variance-minimisation problem subject only to the budget constraint (and any other linear constraints). Because expected returns do not appear in the objective, the GMV portfolio is far less sensitive to the notoriously noisy estimates of μ.`,
      `Empirically, minimum-variance portfolios have delivered competitive risk-adjusted returns and often lower drawdowns than capitalisation-weighted or mean-variance optimised portfolios. This is partly explained by the low-volatility anomaly and by the fact that variance estimates are more stable than return estimates.`,
      `The main practical drawback is that the GMV solution tends to concentrate heavily in the lowest-volatility names or sectors, producing implicit factor bets and potential liquidity or capacity issues. Regularisation, turnover constraints or explicit diversification penalties are commonly added to mitigate this concentration.`
    ],
    keyPoint: "By discarding expected-return forecasts entirely, the minimum-variance portfolio sidesteps the largest source of estimation error and often produces more stable, lower-risk outcomes than full mean-variance optimisation."
  },
  {
    era: "Special Case",
    icon: "⚡",
    title: "Maximum Sharpe Ratio Portfolio",
    desc: "The tangency portfolio that maximises (μ − r_f) / σ; the optimal risky portfolio when a risk-free asset exists",
    badge: { label: "Tangency", style: "amber" },
    tags: [["Sharpe","amber"], ["tangency","teal"], ["CML",""], ["mean-variance","slate"]],
    data: [
      { label: "Objective", value: "max (μ′w − r_f) / √(w′Σw)", color: "amber" },
      { label: "Also called", value: "Tangency / max-Sharpe portfolio", color: "" },
      { label: "Sensitivity", value: "High to μ estimation error", color: "red" },
    ],
    body: [
      `When a risk-free asset is available, every mean-variance investor holds a combination of the risk-free asset and a single risky portfolio — the one that maximises the Sharpe ratio. This tangency portfolio is the point where a line drawn from the risk-free rate touches the efficient frontier.`,
      `In the absence of a risk-free rate one can still maximise the Sharpe ratio relative to a chosen benchmark or zero. The resulting portfolio is attractive in theory but inherits the full estimation-error problems of mean-variance optimisation, because both the numerator (expected excess return) and the denominator (volatility) depend on noisy inputs.`,
      `In practice the maximum-Sharpe portfolio is often regularised, constrained, or replaced by more robust alternatives (risk parity, minimum variance, Black-Litterman) precisely because small changes in expected-return forecasts can swing the weights dramatically.`
    ],
    keyPoint: "The maximum-Sharpe portfolio is the theoretically optimal risky portfolio under mean-variance preferences and a risk-free asset, yet it is among the most estimation-error fragile of all classical solutions."
  },
  {
    era: "Risk-Based",
    icon: "⚖️",
    title: "Risk Parity Portfolio",
    desc: "Equalising the risk contribution of each asset (or risk factor) rather than equalising capital weights",
    badge: { label: "Popular", style: "teal" },
    tags: [["risk parity","teal"], ["ERC","amber"], ["risk contribution",""], ["leverage","slate"]],
    data: [
      { label: "Target", value: "Equal risk contribution (ERC)", color: "teal" },
      { label: "Inputs", value: "Primarily Σ (no μ required)", color: "" },
      { label: "Typical use", value: "Multi-asset / risk-balanced", color: "amber" },
    ],
    body: [
      `Risk parity (or equal-risk-contribution) portfolios allocate so that each asset (or each risk factor) contributes the same amount of portfolio volatility. Formally one solves for weights such that w_i · (Σw)_i is identical for all i. Because the solution depends only on the covariance matrix, it avoids expected-return estimation entirely.`,
      `The approach naturally over-weights lower-volatility assets and under-weights higher-volatility assets, producing a more balanced risk profile than capitalisation weighting. In multi-asset contexts it is frequently combined with leverage to bring the overall volatility up to a target level.`,
      `Critics note that pure risk parity can still embed large implicit factor exposures and that the equal-risk target is somewhat arbitrary. Extensions include risk-factor parity, volatility targeting overlays, and hierarchical variants that respect correlation structure.`
    ],
    keyPoint: "Risk parity replaces the fragile return forecast with the more stable notion of equal risk contribution, producing portfolios that are typically more diversified in risk space than either equal-weight or mean-variance solutions."
  },
  {
    era: "Benchmark",
    icon: "📏",
    title: "Equal Weight Portfolio",
    desc: "The naïve 1/N allocation that serves as a surprisingly strong benchmark and robustness check",
    badge: { label: "Benchmark", style: "slate" },
    tags: [["1/N","slate"], ["naïve","amber"], ["diversification",""], ["DeMiguel","teal"]],
    data: [
      { label: "Rule", value: "w_i = 1/N for all i", color: "slate" },
      { label: "Advantage", value: "Zero estimation, maximum simplicity", color: "" },
      { label: "Empirical", value: "Often hard to beat out-of-sample", color: "teal" },
    ],
    body: [
      `The equal-weight (1/N) portfolio assigns identical capital to every asset. It requires no forecasts, no covariance matrix, and no optimisation. Despite its extreme simplicity, a large academic literature (notably DeMiguel, Garlappi & Uppal) has shown that many sophisticated optimisers fail to outperform 1/N on a consistent out-of-sample basis once transaction costs and estimation error are taken into account.`,
      `Equal weighting automatically rebalances toward losers and away from winners, embedding a mild contrarian / value effect. It also guarantees maximum nominal diversification in terms of the number of names, although risk contributions can still be highly unequal if volatilities differ.`,
      `In quant practice the equal-weight portfolio is an indispensable benchmark: any proposed optimiser must demonstrably beat 1/N after costs and on a realistic out-of-sample basis before it is considered an improvement.`
    ],
    keyPoint: "Equal weight is the ultimate robustness check. If a complex optimiser cannot reliably outperform the naïve 1/N rule after costs, the added complexity is not justified."
  },
  {
    era: "Bayesian",
    icon: "🔮",
    title: "Black-Litterman Model",
    desc: "Combining market-equilibrium returns with investor views via Bayesian updating to produce more stable expected returns",
    badge: { label: "Views", style: "amber" },
    tags: [["Black-Litterman","amber"], ["Bayesian","teal"], ["views","slate"], ["equilibrium",""]],
    data: [
      { label: "Prior", value: "Reverse-optimised equilibrium μ", color: "teal" },
      { label: "Likelihood", value: "Investor views + confidence", color: "" },

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
