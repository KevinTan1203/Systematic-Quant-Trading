<title>Technical Analysis — 7.3 Support & Resistance</title>

  body {

  }

  .book-title em {
    font-style: italic;

  }

  .header-right {
    text-align: right;

  }

  .header-stat {
    font-family: 'Space Mono', monospace;
    font-size: 10px;

    line-height: 1.8;

  }

  .header-stat strong {
    display: block;
    font-size: 28px;
    color: var(--ink);
    font-family: 'DM Serif Display', serif;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 2px;
  }

  .timeline {
    position: relative;
    padding-left: 36px;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 11px;
    top: 8px;
    bottom: 8px;
    width: 2px;
    background: repeating-linear-gradient(
      to bottom,
      var(--border2) 0px,
      var(--border2) 6px,
      transparent 6px,
      transparent 12px
    );
  }

  .entry {
    position: relative;
    margin-bottom: 6px;
  }

  .entry::before {
    content: '';
    position: absolute;
    left: -29px;
    top: 20px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--bg2);
    border: 2px solid var(--border2);
    transition: border-color 0.2s, background 0.2s;
    z-index: 2;
  }

  .entry.open::before {
    background: var(--accent);
    border-color: var(--accent);
  }

  .entry-card {
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .entry.open .entry-card {
    border-color: var(--border2);
    box-shadow: 3px 3px 0 var(--bg2);
  }

  .entry-header {
    display: grid;
    grid-template-columns: 68px auto 1fr auto auto;
    align-items: center;
    gap: 0;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
    min-height: 54px;
  }

  .entry-header:hover { background: var(--surface2); }

  .entry-era {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 0 0 16px;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
    line-height: 1.3;
  }

  .entry-icon {
    font-size: 16px;
    padding: 0 14px;
    opacity: 0.8;
    border-right: 1px solid var(--border);
    align-self: stretch;
    display: flex;
    align-items: center;
  }

  .entry-title-block {
    padding: 12px 16px;
  }

  .entry-title {
    font-family: 'DM Serif Display', serif;
    font-size: 16.5px;
    color: var(--ink);
    line-height: 1.25;
  }

  .entry-desc {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.04em;
    font-weight: 400;
  }

  .entry-badge {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 9px;
    margin-right: 14px;
    white-space: nowrap;
    align-self: center;
    border: 1px solid;
  }

  .badge-red    { color: var(--red);   border-color: var(--red-border);   background: var(--red-bg); }
  .badge-teal   { color: var(--teal);  border-color: var(--teal-border);  background: var(--teal-bg); }
  .badge-amber  { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }
  .badge-slate  { color: var(--slate); border-color: var(--slate-border); background: var(--slate-bg); }
  .badge-ink    { color: var(--ink);   border-color: var(--border2);      background: var(--bg2); }

  .entry-toggle {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--faint);
    transition: transform 0.25s, color 0.15s;
    padding: 0 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .entry.open .entry-toggle {
    transform: rotate(90deg);
    color: var(--accent);
  }

  .entry-body {
    display: none;
    border-top: 1px solid var(--border);
    background: var(--surface2);
    padding: 22px 24px 24px 24px;
    animation: bodyIn 0.2s ease;
  }

  .entry.open .entry-body { display: block; }

  @keyframes bodyIn {
    from { opacity: 0; transform: translateY(-5px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .entry-body p {
    font-size: 13.5px;
    line-height: 1.84;
    color: var(--ink2);
    margin-bottom: 13px;
    font-family: 'Source Serif 4', serif;
    font-weight: 300;

  .entry-body p:last-of-type { margin-bottom: 0; }

  .entry-body p em { font-style: italic; color: var(--ink); font-weight: 400; }
  .entry-body p strong { font-weight: 600; color: var(--ink); }

  .key-insight {
    margin-top: 18px;
    display: grid;
    grid-template-columns: 3px 1fr;
    gap: 14px;

  .key-insight-bar {
    background: var(--accent);
    border-radius: 2px;

    font-family: 'DM Serif Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.6;
    padding: 2px 0;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .compare-box {
    padding: 13px 15px;
    border: 1px solid var(--border);
  }

  .compare-box.right { background: var(--teal-bg); border-color: var(--teal-border); }

  .compare-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 7px;
  }

  .compare-box.left .compare-label  { color: var(--red); }
  .compare-box.right .compare-label { color: var(--teal); }

  .compare-box p {
    font-size: 12.5px !important;
    margin-bottom: 0 !important;
    line-height: 1.6 !important;
  }

  .data-strip {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .data-cell {
    padding: 9px 14px;
    border-right: 1px solid var(--border);
    flex: 1;
    min-width: 140px;
  }

  .data-cell:last-child { border-right: none; }

  .data-cell-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;

  .data-cell-value {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--ink);
  }

  .data-cell-value.red   { color: var(--red); }
  .data-cell-value.teal  { color: var(--teal); }
  .data-cell-value.amber { color: var(--amber); }
  .data-cell-value.slate { color: var(--slate); }

  .tags {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .tag {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--muted);

  .tag.accent { background: var(--red-bg); border-color: var(--red-border); color: var(--accent); }
  .tag.teal   { background: var(--teal-bg); border-color: var(--teal-border); color: var(--teal); }
  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .ctrl-btn {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 7px 16px;
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
  }

  .ctrl-btn:hover {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .ctrl-right {
    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);
    letter-spacing: 0.08em;
  }

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

<script>
const entries = [
  {
    era: "Core",
    icon: "➖",
    title: "Horizontal S/R Levels",
    desc: "Price levels where buying or selling interest has repeatedly appeared",

    body: [
      `Horizontal support and resistance are the most basic and often the most powerful form of S/R. Support is a price level or zone where demand has previously been strong enough to halt or reverse a decline. Resistance is a level where supply has previously been strong enough to halt or reverse an advance.`,
      `These levels are identified by locating prior swing highs and lows, consolidation boundaries, and areas where price has repeatedly stalled or reversed. The more times a level has been tested and held, the more significant it becomes in the eyes of market participants.`,
      `Horizontal levels are timeframe-dependent. A daily support level may be invisible on a 5-minute chart, and a minor intraday resistance may be irrelevant on the weekly chart. Always state the timeframe when discussing a level.`
    ],
    keyPoint: "Horizontal S/R exists because traders remember prices. The more memorable and frequently tested the level, the more likely it is to influence future behaviour — until it is decisively broken."

  {

    title: "Dynamic S/R (Moving Averages)",
    desc: "Sloping levels created by widely watched moving averages",
    badge: { label: "Adaptive", style: "teal" },
    tags: [["dynamic","teal"], ["MA support",""], ["MA resistance","red"], ["20 / 50 / 200",""]],
    data: [
      { label: "Common MAs", value: "20, 50, 100, 200", color: "" },
      { label: "Rising MA", value: "Dynamic support", color: "teal" },
      { label: "Falling MA", value: "Dynamic resistance", color: "red" },
    ],
    body: [
      `Unlike static horizontal levels, dynamic support and resistance move with price. The most widely used sources are moving averages — particularly the 20, 50, 100 and 200-period averages on daily and weekly charts. In an uptrend a rising moving average often acts as support; in a downtrend a falling moving average often acts as resistance.`,
      `The power of dynamic S/R comes from collective attention. Because so many participants watch the same averages, orders tend to cluster around them, creating self-fulfilling reactions. A rising 50-day MA that has been respected multiple times becomes a credible dynamic support zone.`,
      `Dynamic levels are most reliable when they align with horizontal levels or other confluence factors. A moving average that is rising into a prior horizontal resistance creates a higher-probability decision zone than either factor alone.`
    ],
    keyPoint: "Dynamic S/R adapts to the current trend. Its effectiveness depends less on the mathematical formula and more on how many participants are watching and reacting to the same line."

    title: "Psychological Levels (Round Numbers)",

    body: [
      `Psychological levels are prices that end in zeros or other round figures (10, 50, 100, 1 000, etc.). Humans preferentially use round numbers when setting targets, stops and limit orders, so these levels naturally attract a disproportionate amount of resting liquidity.`,
      `As a result, round numbers often act as both magnets (price is drawn toward them) and barriers (price struggles to move cleanly through them). A break of a major round number frequently triggers cascading stops and accelerated movement; a rejection often produces a sharp reversal.`,
      `The psychological effect is strongest at major whole numbers on higher timeframes and at “big figure” levels in forex and indices. Minor round numbers on lower timeframes still matter but carry less weight.`
    ],
    keyPoint: "Round numbers matter because traders are human. The clustering of orders around them turns an otherwise arbitrary price into a self-reinforcing support or resistance zone."
  },
  {
    era: "Core",
    icon: "🔝",
    title: "Previous Highs / Lows",
    desc: "Prior swing extremes that become natural reference points",
    badge: { label: "Structural", style: "teal" },
    tags: [["prior high","red"], ["prior low","teal"], ["swing points",""], ["memory",""]],
    data: [
      { label: "Prior high", value: "Potential resistance", color: "red" },

    body: [
      `Every significant swing high and swing low leaves a memory in the market. A prior high marks a price at which sellers previously overwhelmed buyers; a prior low marks a price at which buyers previously overwhelmed sellers. These extremes become natural candidates for future resistance and support.`,
      `The more significant the original swing (measured by the size of the move that followed, the volume at the extreme, and the time spent near the level), the more important the level becomes. Major weekly or monthly highs and lows routinely influence price months or years later.`,
      `Price often reacts at prior extremes even when no other technical factor is present. This is why marking key swing highs and lows on the chart remains one of the highest-value habits in discretionary analysis.`
    ],
    keyPoint: "Previous highs and lows are the market’s own historical record of where supply and demand previously won. Until proven otherwise, treat them as live levels."
  },
  {
    era: "Principle",

    title: "S/R Role Reversal",

    badge: { label: "Key Concept", style: "red" },

    data: [

    body: [
      `One of the most reliable principles in technical analysis is polarity: once a support level is decisively broken, it often becomes resistance on any subsequent retest. Conversely, once a resistance level is decisively broken, it often becomes support.`,
      `The logic is behavioural. Traders who bought at former support and are now underwater may sell into any rally back to that level in order to exit near break-even. Short sellers who covered on a breakout may re-short a retest of former resistance. Both groups reinforce the new role of the level.`,

    ],
    keyPoint: "A broken level does not disappear — it changes teams. The old support becomes the new resistance, and the old resistance becomes the new support. The retest is often the highest-quality entry."

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
