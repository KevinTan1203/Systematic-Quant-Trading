    top: 8px;
    bottom: 8px;
    width: 2px;

  .entry {

    margin-right: 14px;

    border-left: 1px solid var(--border);

    background: var(--surface2);
    padding: 22px 24px 24px 24px;

    margin-bottom: 0 !important;

    display: flex;

    border: 1px solid var(--border);

    border-right: 1px solid var(--border);

    font-size: 9px;

  .tag.amber  { background: var(--amber-bg); border-color: var(--amber-border); color: var(--amber); }
  .tag.slate  { background: var(--slate-bg); border-color: var(--slate-border); color: var(--slate); }

  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;

    letter-spacing: 0.12em;
    text-transform: uppercase;

    margin-left: auto;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--faint);

  .foot-rule {
    border: none;
    height: 2px;
    background: var(--ink);
    margin: 64px 0 20px;
  }

  .footer-note {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;

  @media (max-width: 640px) {
    .page { padding: 32px 20px 60px; }
    .timeline { padding-left: 24px; }
    .book-header { grid-template-columns: 1fr; }
    .header-right { text-align: left; }
    .entry-header { grid-template-columns: 52px 36px 1fr auto; }
    .entry-badge { display: none; }
    .compare-grid { grid-template-columns: 1fr; }
    .entry-era { font-size: 8.5px; padding-left: 10px; }
  }
</style>

      `These events typically appear in Phase D and serve as confirmation that the range is ending and the trending phase (markup or markdown) is starting. They are often followed by a final pullback (LPS or LPSY) that offers a last lower-risk entry.`
    ],
    keyPoint: "SOS and SOW are the market’s public declaration of which side has won the range battle. Volume expansion and decisive price progress are required for the signal to be valid."
  },
  {
    era: "Phase D",
    icon: "📍",
    title: "Last Point of Support (LPS) & Last Point of Supply (LPSY)",
    desc: "The final pullback before the sustained markup or markdown begins",
    badge: { label: "Entry Zone", style: "teal" },
    tags: [["LPS","teal"], ["LPSY","red"], ["last pullback",""], ["low-risk entry",""]],
    data: [
      { label: "LPS", value: "Higher low after SOS", color: "teal" },
      { label: "LPSY", value: "Lower high after SOW", color: "red" },
      { label: "Ideal volume", value: "Light on the pullback", color: "amber" },
    ],
    body: [
      `After a Sign of Strength, price often pulls back one last time before the sustained markup. This pullback is the Last Point of Support (LPS). It ideally occurs on lighter volume, holds above the prior support or Spring low, and sets a higher low. The LPS is classically regarded as one of the highest-probability, lowest-risk long entries in the Wyckoff framework.`,
      `In distribution the corresponding event is the Last Point of Supply (LPSY): a final rally after a Sign of Weakness that fails at a lower high, preferably on reduced volume, offering a last favourable short entry before markdown.`,
      `Both LPS and LPSY represent the final opportunity for the Composite Man to acquire or distribute remaining inventory at favourable prices before the trend phase accelerates away from the range.`
    ],
    keyPoint: "The LPS / LPSY is the last polite invitation to join the emerging trend. Once it is complete, price usually leaves the range with increasing momentum."
  },
  {
    era: "Laws",
    icon: "⚖️",
    title: "Wyckoff Laws: Supply/Demand, Cause/Effect, Effort/Result",
    desc: "The three governing principles that underpin all Wyckoff analysis",
    badge: { label: "Foundation", style: "slate" },

    data: [
      { label: "Supply & Demand", value: "Price rises/falls with imbalance", color: "teal" },
      { label: "Cause & Effect", value: "Range size ↔ trend extent", color: "amber" },
      { label: "Effort & Result", value: "Volume vs. price progress", color: "red" },
    ],
    body: [
      `Wyckoff distilled market behaviour into three laws. The Law of Supply and Demand states that price rises when demand exceeds supply and falls when supply exceeds demand. All analysis ultimately seeks to determine which side is dominant.`,
      `The Law of Cause and Effect states that the effect (the subsequent trend) is proportional to the cause (the time and intensity of accumulation or distribution). A long, well-defined trading range implies a more substantial markup or markdown than a brief one. Point-and-figure charting was originally used to measure the cause and project the effect.`,
      `The Law of Effort versus Result compares volume (effort) with price progress (result). Large effort that produces little price progress suggests absorption or exhaustion; small effort that produces large progress suggests a lack of opposition. Divergences between effort and result are early warnings of a change in behaviour.`
    ],
    keyPoint: "The three laws are not optional overlays — they are the logic engine of the entire method. Every schematic, every event, and every volume interpretation is an application of one or more of these laws."
  },
  {
    era: "Technique",

    ],
    body: [
      `Wyckoff analysis is fundamentally bar-by-bar (or wave-by-wave) interpretation of price spread (the distance from high to low) in the context of volume. A wide-spread bar on high volume shows strong commitment by one side. A wide-spread bar on low volume suggests the move met little opposition. A narrow-spread bar on high volume indicates absorption or intense two-way conflict.`,
      `Contextual comparison is essential. Rising prices on declining volume can signal weakening demand. Falling prices on declining volume can signal exhaustion of supply. Climactic volume at extremes often marks the end of a move; drying-up volume on tests confirms that the opposing side is spent.`,
      `This relative analysis is applied continuously inside the schematics: comparing the volume of the Selling Climax with the Secondary Test, the Spring with the subsequent recovery, the SOS with prior rallies, and so on. Mastery of volume-and-spread reading is what turns the schematic from a static picture into a living diagnosis.`

let counter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  entries.forEach((e, i) => {
    const idx = counter++;
    const tagHtml = e.tags.map(([l, s]) => `<span class="tag ${s}">${l}</span>`).join('');

    const dataHtml = e.data ? `
      <div class="data-strip">
        ${e.data.map(d => `
          <div class="data-cell">
            <div class="data-cell-label">${d.label}</div>
            <div class="data-cell-value ${d.color}">${d.value || '—'}</div>
          </div>
        `).join('')}
      </div>` : '';

    const compareHtml = e.compare ? `
      <div class="compare-grid">
        <div class="compare-box left">
          <div class="compare-label">${e.compare.left.label}</div>
          <p>${e.compare.left.text}</p>
        </div>
        <div class="compare-box right">
          <div class="compare-label">${e.compare.right.label}</div>
          <p>${e.compare.right.text}</p>
        </div>
      </div>` : '';

    const bodyHtml =
      e.body.map(p => `<p>${p}</p>`).join('') +
      compareHtml +
      dataHtml +
      `<div class="key-insight"><div class="key-insight-bar"></div><div class="key-insight-text">${e.keyPoint}</div></div>` +
      `<div class="tags">${tagHtml}</div>`;

    const div = document.createElement('div');
    div.className = 'entry';
    div.id = `e-${idx}`;
    div.innerHTML = `
      <div class="entry-card">
        <div class="entry-header" onclick="toggle(${idx})">
          <div class="entry-era">${e.era}</div>
          <div class="entry-icon">${e.icon}</div>
          <div class="entry-title-block">
            <div class="entry-title">${e.title}</div>
            <div class="entry-desc">${e.desc}</div>
          </div>
          <span class="entry-badge badge-${e.badge.style}">${e.badge.label}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      </div>
    `;
    root.appendChild(div);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < counter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
</script>
