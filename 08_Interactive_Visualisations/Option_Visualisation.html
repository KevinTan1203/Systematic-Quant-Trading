<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Options Strategy Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg-deep: #070b14;
    --card: rgba(22, 30, 46, 0.82);
    --card-border: rgba(99, 130, 180, 0.18);
    --accent: #38bdf8;
    --accent-glow: rgba(56, 189, 248, 0.3);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg-deep);
    color: var(--text);
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -20%, rgba(56, 189, 248, 0.1), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(167, 139, 250, 0.08), transparent);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.2rem 1.5rem;
    min-height: 100vh;
  }

  header {
    text-align: center;
    margin-bottom: 0.9rem;
    flex-shrink: 0;
  }

  h1 {
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.03em;
    background: linear-gradient(120deg, #38bdf8 0%, #a78bfa 50%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.25;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.95rem;
    margin-top: 0.25rem;
  }

  .container {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 1.25rem;
    width: 100%;
    max-width: 1480px;              /* much wider */
  }

  @media (max-width: 1100px) {
    body { justify-content: flex-start; padding: 1rem; }
    .container { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 1.2rem 1.3rem;
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.8rem;
  }

  /* ===== LEFT PANEL ===== */
  .controls {
    font-size: 0.95rem;
  }

  label {
    display: block;
    font-size: 0.84rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.28rem;
    margin-top: 0.75rem;
  }
  label:first-of-type { margin-top: 0; }

  select, input {
    width: 100%;
    padding: 0.55rem 0.8rem;
    border-radius: 9px;
    border: 1px solid rgba(99, 130, 180, 0.25);
    background: rgba(7, 11, 20, 0.7);
    color: var(--text);
    font-size: 0.95rem;
    font-family: 'Inter', sans-serif;
  }

  select:focus, input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.55rem;
  }

  button {
    width: 100%;
    margin-top: 1rem;
    padding: 0.65rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #0ea5e9, #8b5cf6);
    color: white;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.12s, box-shadow 0.15s;
  }
  button:hover {
    transform: translateY(-1px);
    box-shadow: 0 5px 18px rgba(56, 189, 248, 0.35);
  }

  .stats {
    margin-top: 1rem;
    padding-top: 0.85rem;
    border-top: 1px solid rgba(99, 130, 180, 0.15);
  }

  .stat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.4rem;
    font-size: 0.95rem;
  }
  .stat span:first-child { color: var(--muted); }
  .stat span:last-child {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    font-size: 0.95rem;
  }

  .positive { color: var(--green); }
  .negative { color: var(--red); }
  .neutral  { color: var(--yellow); }

  .note {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.7rem;
    line-height: 1.4;
    opacity: 0.85;
  }

  /* ===== RIGHT SIDE – much larger chart ===== */
  .chart-wrap {
    height: 520px;                 /* significantly larger */
    position: relative;
  }

  .chart-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .desc-box {
    margin-top: 0.85rem;
    padding: 0.8rem 1rem;
    background: rgba(7, 11, 20, 0.55);
    border: 1px solid rgba(99, 130, 180, 0.18);
    border-radius: 11px;
    font-size: 0.9rem;
    line-height: 1.45;
    color: #cbd5e1;
  }
  .desc-box strong {
    color: var(--accent);
    font-weight: 600;
  }
  .desc-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-top: 0.5rem;
  }
  .tag {
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.22rem 0.6rem;
    border-radius: 999px;
  }
  .tag-bull     { background: rgba(52, 211, 153, 0.15); color: var(--green); }
  .tag-bear     { background: rgba(248, 113, 113, 0.15); color: var(--red); }
  .tag-neutral  { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
  .tag-risk-low { background: rgba(52, 211, 153, 0.12); color: #6ee7b7; }
  .tag-risk-med { background: rgba(251, 191, 36, 0.12); color: #fcd34d; }
  .tag-risk-high{ background: rgba(248, 113, 113, 0.12); color: #fca5a5; }
  .tag-defined  { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; }
  .tag-unlimited{ background: rgba(167, 139, 250, 0.15); color: #c4b5fd; }
</style>
</head>
<body>
  <header>
    <h1>Options Strategy Visualizer</h1>
    <p class="subtitle">Payoff at expiration · Live strikes & premiums</p>
  </header>

  <div class="container">
    <!-- LEFT: Controls -->
    <div class="panel controls">
      <div class="panel-header">Strategy & Parameters</div>

      <label>Strategy</label>
      <select id="strategy" onchange="updateInputs(); calculate()">
        <option value="longCall">Long Call</option>
        <option value="longPut">Long Put</option>
        <option value="shortCall">Short Call</option>
        <option value="shortPut">Short Put</option>
        <option value="bullCall">Bull Call Spread</option>
        <option value="bullPut">Bull Put Spread</option>
        <option value="bearCall">Bear Call Spread</option>
        <option value="bearPut">Bear Put Spread</option>
        <option value="longStraddle">Long Straddle</option>
        <option value="shortStraddle">Short Straddle</option>
        <option value="longStrangle">Long Strangle</option>
        <option value="shortStrangle">Short Strangle</option>
        <option value="butterfly">Butterfly Spread (Calls)</option>
        <option value="ironButterfly">Iron Butterfly</option>
        <option value="ironCondor">Iron Condor</option>
        <option value="coveredCall">Covered Call</option>
        <option value="cashSecuredPut">Cash-Secured Put</option>
        <option value="marriedPut">Married Put</option>
        <option value="protectiveCollar">Protective Collar</option>
        <option value="calendar">Calendar Spread (approx.)</option>
        <option value="diagonal">Diagonal Spread (approx.)</option>
      </select>

      <div id="inputs"></div>

      <label>Underlying Price Range</label>
      <div class="row">
        <input type="number" id="minPrice" value="50" step="1" oninput="calculate()">
        <input type="number" id="maxPrice" value="150" step="1" oninput="calculate()">
      </div>

      <button onclick="calculate()">Update Chart</button>

      <div class="stats" id="stats"></div>

      <p class="note">
        Theoretical P/L at expiration. No commissions, dividends or early assignment.
        Calendar / Diagonal use residual-value approximation.
      </p>
    </div>

    <!-- RIGHT: Chart + Description -->
    <div class="panel chart-panel">
      <div class="panel-header">Payoff Diagram</div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>

      <div class="desc-box" id="description"></div>
    </div>
  </div>

<script>
const strategies = {
  longCall: {
    fields: [
      {id:"K", label:"Strike", value:100},

      risk: "Limited (premium paid)",
      reward: "Unlimited"
    }
  },
  longPut: {
    fields: [
      {id:"K", label:"Strike", value:100},
      {id:"premium", label:"Premium paid", value:5}
    ],
    desc: {
      title: "Long Put",
      text: "Buy a put. Right to sell at the strike. Profit increases as the underlying falls below strike − premium.",
      construction: "Buy 1 Put",

      {id:"premium", label:"Premium received", value:5}

    }

    fields: [
      {id:"K", label:"Strike", value:100},

      risk: "Substantial (to zero)",
      reward: "Limited (premium)"
    }
  },
  bullCall: {
    fields: [
      {id:"K1", label:"Long Call Strike", value:95},
      {id:"P1", label:"Long Premium", value:7},
      {id:"K2", label:"Short Call Strike", value:110},

    desc: {

  },
  bearCall: {
    fields: [
      {id:"K1", label:"Short Call Strike", value:100},
      {id:"P1", label:"Short Premium", value:5},

      {id:"P2", label:"Long Premium", value:2}
    ],
    desc: {
      title: "Bear Call Spread",
      text: "Sell lower-strike call + buy higher-strike call. Credit spread that profits if price stays below the short strike.",
      construction: "Sell lower Call + Buy higher Call",

      risk: "Limited",

    }
  },
  bearPut: {
    fields: [
      {id:"K1", label:"Long Put Strike", value:110},
      {id:"P1", label:"Long Premium", value:7},

    ],
    desc: {
      title: "Bear Put Spread",
      text: "Buy higher-strike put + sell lower-strike put. Debit spread for a moderate decline. Defined risk & reward.",
      construction: "Buy higher Put + Sell lower Put",

  },
  longStraddle: {
    fields: [

      {id:"K", label:"Strike (ATM)", value:100},
      {id:"callP", label:"Call Premium", value:5},

    ],
    desc: {
      title: "Short Straddle",
      text: "Sell call + put same strike. High premium; profits if price stays near the strike. Large risk on big moves.",
      construction: "Sell 1 Call + Sell 1 Put (same strike)",

      risk: "Unlimited",
      reward: "Limited (total premiums)"

  },

      {id:"Kput", label:"Put Strike", value:90},
      {id:"Pput", label:"Put Premium", value:3},

      title: "Long Strangle",
      text: "Buy OTM put + OTM call. Cheaper than straddle; needs a larger move to profit. Unlimited upside.",
      construction: "Buy OTM Put + Buy OTM Call",
      bias: "Volatile",
      risk: "Limited (total premiums)",
      reward: "Unlimited"
    }
  },
  shortStrangle: {
    fields: [
      {id:"Kput", label:"Put Strike", value:90},
      {id:"Pput", label:"Put Premium", value:3},
      {id:"Kcall", label:"Call Strike", value:110},
      {id:"Pcall", label:"Call Premium", value:3}
    ],
    desc: {
      title: "Short Strangle",
      text: "Sell OTM put + OTM call. Collects premium; profits inside the strikes. High risk outside the range.",
      construction: "Sell OTM Put + Sell OTM Call",
      bias: "Low volatility",
      risk: "Unlimited",
      reward: "Limited (total premiums)"
    }
  },
  butterfly: {
    fields: [
      {id:"K1", label:"Lower Strike (buy 1)", value:90},
      {id:"P1", label:"Lower Premium", value:12},
      {id:"K2", label:"Middle Strike (sell 2)", value:100},
      {id:"P2", label:"Middle Premium", value:6},
      {id:"K3", label:"Upper Strike (buy 1)", value:110},

    ],

      text: "Sell ATM straddle + buy protective OTM wings. Credit strategy that profits near the short strikes. Defined risk.",
      construction: "Sell ATM straddle + Buy OTM wings",

      reward: "Limited (net credit)"
    }

    fields: [
      {id:"KputL", label:"Long Put Strike", value:85},
      {id:"PputL", label:"Long Put Premium", value:1},
      {id:"KputS", label:"Short Put Strike", value:95},
      {id:"PputS", label:"Short Put Premium", value:3},
      {id:"KcallS", label:"Short Call Strike", value:105},
      {id:"PcallS", label:"Short Call Premium", value:3},
      {id:"KcallL", label:"Long Call Strike", value:115},
      {id:"PcallL", label:"Long Call Premium", value:1}
    ],
    desc: {
      title: "Iron Condor",
      text: "Sell OTM put spread + sell OTM call spread. Credit strategy that profits between the short strikes. Defined risk both sides.",
      construction: "Sell put spread + Sell call spread",
      bias: "Neutral",
      risk: "Limited",
      reward: "Limited (net credit)"
    }
  },
  coveredCall: {
    fields: [
      {id:"stock", label:"Stock Purchase Price", value:100},
      {id:"K", label:"Call Strike", value:105},
      {id:"premium", label:"Call Premium received", value:3}
    ],
    desc: {
      title: "Covered Call",
      text: "Own 100 shares + sell a call against them. Generates income; upside capped at the strike. Reduces cost basis by the premium.",
      construction: "Long 100 shares + Sell 1 Call",
      bias: "Mildly bullish / Neutral",
      risk: "Substantial (stock can fall)",

    }
  },

    fields: [
      {id:"K", label:"Put Strike", value:100},
      {id:"premium", label:"Premium received", value:4}
    ],

    }
  },

    fields: [
      {id:"stock", label:"Stock Purchase Price", value:100},
      {id:"Kput", label:"Put Strike (buy)", value:95},

    ],

      title: "Calendar Spread (approx.)",
      text: "Sell near-term option + buy longer-term option (same strike). Profits from faster decay of the short option when price stays near strike. Residual value is approximated.",

    }

    fields: [
      {id:"Kshort", label:"Short (near) Strike", value:105},
      {id:"Pshort", label:"Short Premium received", value:2.5},

      text: "Like a calendar but different strikes. Usually sell near-term OTM + buy longer-term option. Combines decay with a directional lean. Residual approximated.",

let chart = null;

function updateInputs() {
  const strat = document.getElementById('strategy').value;
  const cfg = strategies[strat];
  let html = '';
  cfg.fields.forEach(f => {
    html += `<label>${f.label}</label>
             <input type="number" id="${f.id}" value="${f.value}" step="0.5" oninput="calculate()">`;
  });
  document.getElementById('inputs').innerHTML = html;

  const d = cfg.desc;
  const biasClass = d.bias.toLowerCase().includes('bull') ? 'tag-bull' :
                    d.bias.toLowerCase().includes('bear') ? 'tag-bear' : 'tag-neutral';
  const riskClass = d.risk.toLowerCase().includes('unlimited') || d.risk.toLowerCase().includes('substantial') ? 'tag-risk-high' :
                    d.risk.toLowerCase().includes('limited') ? 'tag-risk-low' : 'tag-risk-med';
  const rewardClass = d.reward.toLowerCase().includes('unlimited') ? 'tag-unlimited' : 'tag-defined';

  document.getElementById('description').innerHTML = `
    <strong>${d.title}</strong> — ${d.text}
    <br><strong>Construction:</strong> ${d.construction}
    <div class="desc-tags">
      <span class="tag ${biasClass}">${d.bias}</span>
      <span class="tag ${riskClass}">Risk: ${d.risk}</span>
      <span class="tag ${rewardClass}">Reward: ${d.reward}</span>
    </div>
  `;
}

function getVal(id) {
  return parseFloat(document.getElementById(id)?.value) || 0;
}

function payoff(S, strat) {
  switch(strat) {
    case 'longCall': {
      const K = getVal('K'), p = getVal('premium');
      return Math.max(S - K, 0) - p;
    }
    case 'longPut': {
      const K = getVal('K'), p = getVal('premium');
      return Math.max(K - S, 0) - p;
    }
    case 'shortCall': {
      const K = getVal('K'), p = getVal('premium');
      return p - Math.max(S - K, 0);
    }
    case 'shortPut': {
      const K = getVal('K'), p = getVal('premium');
      return p - Math.max(K - S, 0);
    }
    case 'bullCall': {
      const K1 = getVal('K1'), P1 = getVal('P1');
      const K2 = getVal('K2'), P2 = getVal('P2');
      return (Math.max(S - K1, 0) - P1) + (P2 - Math.max(S - K2, 0));
    }
    case 'bullPut': {
      const K1 = getVal('K1'), P1 = getVal('P1');
      const K2 = getVal('K2'), P2 = getVal('P2');
      return (P1 - Math.max(K1 - S, 0)) + (Math.max(K2 - S, 0) - P2);
    }
    case 'bearCall': {
      const K1 = getVal('K1'), P1 = getVal('P1');
      const K2 = getVal('K2'), P2 = getVal('P2');
      return (P1 - Math.max(S - K1, 0)) + (Math.max(S - K2, 0) - P2);
    }
    case 'bearPut': {
      const K1 = getVal('K1'), P1 = getVal('P1');
      const K2 = getVal('K2'), P2 = getVal('P2');
      return (Math.max(K1 - S, 0) - P1) + (P2 - Math.max(K2 - S, 0));
    }
    case 'longStraddle': {
      const K = getVal('K'), cp = getVal('callP'), pp = getVal('putP');
      return Math.max(S - K, 0) - cp + Math.max(K - S, 0) - pp;
    }
    case 'shortStraddle': {
      const K = getVal('K'), cp = getVal('callP'), pp = getVal('putP');
      return cp + pp - Math.max(S - K, 0) - Math.max(K - S, 0);
    }
    case 'longStrangle': {
      const Kp = getVal('Kput'), Pp = getVal('Pput');
      const Kc = getVal('Kcall'), Pc = getVal('Pcall');
      return Math.max(Kp - S, 0) - Pp + Math.max(S - Kc, 0) - Pc;
    }
    case 'shortStrangle': {
      const Kp = getVal('Kput'), Pp = getVal('Pput');
      const Kc = getVal('Kcall'), Pc = getVal('Pcall');
      return Pp + Pc - Math.max(Kp - S, 0) - Math.max(S - Kc, 0);
    }
    case 'butterfly': {
      const K1 = getVal('K1'), P1 = getVal('P1');
      const K2 = getVal('K2'), P2 = getVal('P2');
      const K3 = getVal('K3'), P3 = getVal('P3');
      return (Math.max(S-K1,0)-P1) + 2*(P2 - Math.max(S-K2,0)) + (Math.max(S-K3,0)-P3);
    }
    case 'ironButterfly': {
      const Kpl = getVal('KputL'), Ppl = getVal('PputL');
      const Kbody = getVal('Kbody');
      const Pps = getVal('PputS'), Pcs = getVal('PcallS');
      const Kcl = getVal('KcallL'), Pcl = getVal('PcallL');
      return (Math.max(Kpl - S, 0) - Ppl)
           + (Pps - Math.max(Kbody - S, 0))
           + (Pcs - Math.max(S - Kbody, 0))
           + (Math.max(S - Kcl, 0) - Pcl);
    }
    case 'ironCondor': {
      const Kpl = getVal('KputL'), Ppl = getVal('PputL');
      const Kps = getVal('KputS'), Pps = getVal('PputS');
      const Kcs = getVal('KcallS'), Pcs = getVal('PcallS');
      const Kcl = getVal('KcallL'), Pcl = getVal('PcallL');
      return (Math.max(Kpl-S,0)-Ppl) + (Pps - Math.max(Kps-S,0))
           + (Pcs - Math.max(S-Kcs,0)) + (Math.max(S-Kcl,0)-Pcl);
    }
    case 'coveredCall': {
      const stock = getVal('stock');
      const K = getVal('K'), p = getVal('premium');
      return (S - stock) + (p - Math.max(S - K, 0));
    }
    case 'cashSecuredPut': {
      const K = getVal('K'), p = getVal('premium');
      return p - Math.max(K - S, 0);
    }
    case 'marriedPut': {
      const stock = getVal('stock');
      const K = getVal('K'), p = getVal('premium');
      return (S - stock) + (Math.max(K - S, 0) - p);
    }
    case 'protectiveCollar': {
      const stock = getVal('stock');
      const Kp = getVal('Kput'), Pp = getVal('Pput');
      const Kc = getVal('Kcall'), Pc = getVal('Pcall');
      return (S - stock) + (Math.max(Kp - S, 0) - Pp) + (Pc - Math.max(S - Kc, 0));
    }
    case 'calendar': {
      const K = getVal('K');
      const shortP = getVal('shortP');
      const longP = getVal('longP');
      const residual = getVal('residual');
      const shortIntrinsic = Math.max(S - K, 0);
      return (shortP - shortIntrinsic) + (residual - longP);
    }
    case 'diagonal': {
      const Ks = getVal('Kshort');
      const Ps = getVal('Pshort');
      const residual = getVal('residual');
      const Pl = getVal('Plong');
      const shortIntrinsic = Math.max(S - Ks, 0);
      return (Ps - shortIntrinsic) + (residual - Pl);
    }
  }
  return 0;
}

function calculate() {
  const strat = document.getElementById('strategy').value;
  const minP = getVal('minPrice');
  const maxP = getVal('maxPrice');
  const steps = 260;
  const labels = [];
  const data = [];
  let maxProfit = -Infinity, maxLoss = Infinity;
  const zeros = [];

  for (let i = 0; i <= steps; i++) {
    const S = minP + (maxP - minP) * i / steps;
    const pl = payoff(S, strat);
    labels.push(+S.toFixed(2));
    data.push(+pl.toFixed(4));
    if (pl > maxProfit) maxProfit = pl;
    if (pl < maxLoss) maxLoss = pl;
  }

  for (let i = 1; i < data.length; i++) {
    if ((data[i-1] <= 0 && data[i] >= 0) || (data[i-1] >= 0 && data[i] <= 0)) {
      const S1 = labels[i-1];
      const S2 = labels[i];
      const ratio = Math.abs(data[i-1]) / (Math.abs(data[i-1]) + Math.abs(data[i]) || 1);
      zeros.push((S1 + ratio * (S2 - S1)).toFixed(2));
    }
  }

  const uniqueZeros = [...new Set(zeros.map(z => parseFloat(z).toFixed(1)))];

  const fmt = v => {
    if (!isFinite(v)) return v > 0 ? '∞' : '-∞';
    return v.toFixed(2);
  };

  let dispMax = maxProfit > 1e6 ? Infinity : maxProfit;
  let dispMin = maxLoss < -1e6 ? -Infinity : maxLoss;

  document.getElementById('stats').innerHTML = `
    <div class="stat">
      <span>Max Profit</span>
      <span class="${dispMax >= 0 ? 'positive' : 'negative'}">${fmt(dispMax)}</span>
    </div>
    <div class="stat">
      <span>Max Loss</span>
      <span class="${dispMin >= 0 ? 'positive' : 'negative'}">${fmt(dispMin)}</span>
    </div>
    <div class="stat">
      <span>Breakeven(s)</span>
      <span class="neutral">${uniqueZeros.length ? uniqueZeros.join(' · ') : '—'}</span>
    </div>
  `;

  const ctx = document.getElementById('chart').getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 480);
  gradient.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
  gradient.addColorStop(0.55, 'rgba(56, 189, 248, 0.08)');
  gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'P/L',
          data: data,
          borderColor: '#38bdf8',
          backgroundColor: gradient,
          borderWidth: 2.8,
          pointRadius: 0,
          pointHoverRadius: 5,
          pointHoverBackgroundColor: '#38bdf8',
          pointHoverBorderColor: '#fff',
          pointHoverBorderWidth: 2,
          fill: true,
          tension: 0.13
        },
        {
          label: 'Zero',
          data: labels.map(() => 0),
          borderColor: 'rgba(148, 163, 184, 0.42)',
          borderWidth: 1.4,
          borderDash: [6, 5],
          pointRadius: 0,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(15, 23, 42, 0.95)',
          titleColor: '#e2e8f0',
          bodyColor: '#38bdf8',
          borderColor: 'rgba(56, 189, 248, 0.3)',
          borderWidth: 1,
          padding: 11,
          cornerRadius: 9,
          displayColors: false,
          callbacks: {
            title: items => `Price  ${items[0].label}`,
            label: item => `P/L  ${item.raw.toFixed(2)}`
          }
        }
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Underlying Price at Expiration',
            color: '#94a3b8',
            font: { size: 13, weight: '500' },
            padding: { top: 8 }
          },
          ticks: {
            color: '#64748b',
            maxTicksLimit: 11,
            font: { family: 'JetBrains Mono', size: 12 }
          },
          grid: { color: 'rgba(51, 65, 85, 0.35)', drawBorder: false }
        },
        y: {
          title: {
            display: true,
            text: 'Profit / Loss',
            color: '#94a3b8',
            font: { size: 13, weight: '500' }
          },
          ticks: {
            color: '#64748b',
            font: { family: 'JetBrains Mono', size: 12 },
            callback: v => v.toFixed(0)
          },
          grid: { color: 'rgba(51, 65, 85, 0.4)', drawBorder: false }
        }
      }
    }
  });
}

// Initialize
updateInputs();
calculate();

window.addEventListener('resize', () => {
  if (chart) chart.resize();
});
</script>
