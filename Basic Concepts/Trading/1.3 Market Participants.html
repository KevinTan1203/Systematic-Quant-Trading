    border: 1px solid var(--rule);

    color: var(--muted);

<script>
const categories = [
  {
    id: "buy-side",
    icon: "📈",
    name: "Buy-Side — Capital Deployers",
    desc: "Entities that invest money; they are the demand side of financial markets.",
    participants: [
      {
        id: "retail",
        icon: "👤",
        title: "Retail Traders",
        meta: "Individual investors",
        tags: [["equities",""], ["options","outline"], ["crypto",""]],
        stats: [
          { label: "~50% of US equity volume (2021 peak)", style: "gold" },
          { label: "Margin of influence: growing", style: "green" },
        ],
        body: [
          `Retail traders are individual, non-professional investors — anyone managing their own money rather than a pool of other people's capital. For most of exchange history, retail participation was limited: high commissions, minimum account sizes, and information asymmetry kept markets the exclusive province of institutions and the wealthy. The 1990s internet boom opened things up, but the true democratisation arrived with commission-free trading (Robinhood, launched 2013), fractional shares, and mobile-first interfaces.`,
          `Retail traders are a diverse group. At one end: passive investors who buy index ETFs and hold them for decades. At the other: day traders making dozens of leveraged trades daily, options gamblers chasing 0DTE (zero days to expiry) contracts, and crypto enthusiasts active at 3 AM. The GameStop/WallStreetBets phenomenon of 2021 dramatically illustrated that collectively, retail can be a market-moving force — not just noise around institutional price-setting.`,
          `Retail order flow is commercially valuable. Broker-dealers like Robinhood sell it to market makers (a practice called Payment for Order Flow, or PFOF) who profit from executing retail trades at slightly unfavourable prices. Critics argue this creates a structural conflict of interest; proponents say retail still gets better prices than they would on exchanges. This debate is ongoing and actively contested by regulators in the US and EU.`
        ],
        keyPoint: "Retail traders provide liquidity and price pressure but often face structural disadvantages: slower execution, information gaps, and behavioural biases that institutional counterparts actively exploit. Their collective power is greatest in concentrated, heavily-shorted situations."
      },
      {
        id: "mutual",
        icon: "🏦",
        title: "Institutional Investors — Mutual Funds & Pension Funds",
        meta: "Long-only, large-scale",
        tags: [["long-only","green"], ["equities",""], ["bonds",""], ["passive & active","outline"]],
        stats: [
          { label: "US pension assets: ~$35 trillion", style: "gold" },
          { label: "Global mutual fund AUM: ~$60 trillion", style: "blue" },
        ],
        body: [
          `Mutual funds pool money from many small investors and deploy it according to a stated mandate — growth equity, investment-grade bonds, international stocks, etc. Pension funds do the same but with a specific liability: they must pay future retirement benefits. Both are fiduciaries, legally obligated to act in their beneficiaries' interest. This shapes everything: they tend to be long-only (they rarely short), broadly diversified, and focused on risk-adjusted returns over long horizons.`,
          `The defining trend of the past two decades is the shift from active to passive management. Active funds try to beat an index by selecting securities; passive funds (index funds, ETFs) simply replicate an index. Active funds charge higher fees (typically 0.5%–1.5% annually) and, overwhelmingly, fail to beat their benchmarks after costs over the long run. This empirical failure has driven trillions of dollars from active into passive, reshaping markets. Vanguard, BlackRock, and State Street now collectively own ~20–25% of the average S&P 500 company — an astonishing concentration.`,
          `Pension funds operate under unique constraints. They have known future liabilities (promised retirement payments) that must be matched with assets. This drives liability-driven investing (LDI): holding long-duration bonds to match the duration of liabilities. The UK's 2022 LDI crisis — where rising yields triggered margin calls on pension funds' leveraged gilt positions — illustrated how this strategy can become dangerously fragile in volatile rate environments.`
        ],
        keyPoint: "Pension funds and mutual funds are the 'patient capital' of markets. Their long horizons, massive scale, and passive trend make them price-setters by default — whoever controls an index inclusion controls capital flows into that asset."
      },
      {
        id: "hedge",
        icon: "⚔️",
        title: "Hedge Funds — Multi-Strategy, Macro, Quant",
        meta: "Absolute return, sophisticated",
        tags: [["long/short","gold"], ["leverage","rust"], ["alternatives",""], ["alpha-seeking",""]],
        stats: [
          { label: "Global AUM: ~$4–5 trillion", style: "gold" },
          { label: "Typical fee: '2 and 20'", style: "rust" },
        ],
        body: [
          `Hedge funds are private investment partnerships — typically limited to wealthy individuals and institutions — that pursue absolute returns (positive returns in any market environment) using a wide toolkit unavailable to conventional funds: short selling, leverage, derivatives, illiquid assets, and concentrated positions. The name "hedge" is historical; most modern hedge funds are not simply hedged — they take active, often aggressive, directional risk.`,
          `The landscape is vast. Global macro funds (Bridgewater, Brevan Howard) take views on currencies, interest rates, and economies using derivatives and FX. Long/short equity funds buy undervalued stocks and short overvalued ones. Event-driven funds profit from corporate events: mergers, bankruptcies, spin-offs. Quantitative hedge funds (Renaissance Technologies, Two Sigma, D.E. Shaw) use statistical models and machine learning to identify patterns. Multi-strategy funds (Citadel, Millennium) combine multiple approaches under one roof, allocating dynamically.`,
          `The classic fee structure is "2 and 20": 2% of assets under management annually plus 20% of profits above a hurdle rate. High-water mark provisions ensure managers only collect performance fees on new profits (not recouping previous losses). Despite this, average hedge fund performance has disappointed relative to simple index strategies since the 2008 crisis — leading institutional investors to demand lower fees and better terms. The industry has responded by creating more complex structures and increasingly specialised strategies.`
        ],
        keyPoint: "Hedge funds are price discovery engines at the margin. Where other investors can't or won't go — illiquid securities, complex derivatives, overseas markets — hedge funds often fill the gap, incorporating information into prices faster than anyone else."
      },
      {
        id: "endowments",
        icon: "🎓",
        title: "Endowments & Foundations",
        meta: "Perpetual capital, illiquid-tolerant",
        tags: [["alternatives",""], ["long-horizon","green"], ["illiquid","outline"], ["non-profit",""]],
        stats: [
          { label: "Harvard endowment: ~$50bn", style: "gold" },
          { label: "Yale endowment model: ~40–50% alternatives", style: "green" },
        ],
        body: [
          `University endowments and charitable foundations manage permanent pools of capital, distributing a portion each year (typically 4–5%) to fund operations, scholarships, or grants while preserving the principal in perpetuity. Their defining characteristic is the ability — and necessity — to hold illiquid investments that offer higher expected returns in exchange for locking up capital for years.`,
          `The "Yale Model" (pioneered by David Swensen at Yale) became enormously influential: dramatically overweight alternative assets (private equity, venture capital, real assets, hedge funds) and underweight public equities and bonds. The rationale: as a perpetual institution with no short-term liquidity needs, an endowment can harvest the "illiquidity premium" — extra return available to investors patient enough to lock up capital. Yale's endowment returned ~13% annually for decades under Swensen, inspiring widespread imitation.`,
          `Not all endowments have successfully replicated the Yale model — it requires access to top-tier, capacity-constrained funds (Sequoia, KKR's best vehicles) that are unavailable to smaller institutions. The 2008 crisis also exposed the danger: even endowments needed liquidity for capital calls from private funds at the worst possible moment. Foundations (Gates, Ford, Wellcome Trust) operate similarly but with explicit philanthropic mandates that sometimes constrain investment choices (e.g. ESG exclusions).`
        ],
        keyPoint: "Endowments revealed that the biggest structural advantage in investing is time horizon. Those who genuinely don't need liquidity can access risk premia — the illiquidity premium, the venture premium — that are invisible to shorter-horizon investors."
      },
      {
        id: "family",
        icon: "🏛️",
        title: "Family Offices",
        meta: "Ultra-high-net-worth private capital",
        tags: [["private",""], ["multi-asset",""], ["bespoke","outline"], ["unregulated","rust"]],
        stats: [
          { label: "Entry threshold: typically >$100M AUM", style: "gold" },
          { label: "Global AUM: ~$6 trillion", style: "blue" },
        ],
        body: [
          `Family offices are private wealth management firms established by ultra-high-net-worth families to manage and preserve their fortune across generations. A "single-family office" serves one family exclusively; "multi-family offices" aggregate several families to share costs. They typically emerge when a family has $100M+ in investable assets — at that scale, it's cheaper to hire a professional investment team directly than to pay external managers.`,
          `Family offices are among the most flexible and private participants in financial markets. Unlike pension funds, they have no external beneficiaries to report to. Unlike hedge funds, they face minimal regulation. They can move nimbly across asset classes — from public equities to direct private equity deals to real estate to art — without committee approval delays or compliance constraints. Many have become significant co-investors in private markets, partnering with PE funds on individual deals.`,
          `The collapse of Archegos Capital Management in 2021 — technically structured as a family office — illustrated the systemic risk this opacity can create. Archegos had built enormous leveraged positions in media stocks via total return swaps, a structure that kept its exposure invisible to regulators and even to individual prime brokers who each saw only their slice. When the positions unwound, banks including Credit Suisse and Nomura suffered billions in losses. It prompted calls for greater reporting requirements for large family offices.`
        ],
        keyPoint: "Family offices combine the capital scale of institutions with the flexibility of individuals. Their opacity is a double-edged sword: a competitive advantage in private deals, but a systemic opacity risk when leverage is involved."
      }
    ]
  },
  {
    id: "sophisticated",
    icon: "⚡",
    name: "Active Traders & Systematic Strategies",
    desc: "Participants whose edge comes from speed, information, or quantitative models.",
    participants: [
      {
        id: "prop",
        icon: "🎯",
        title: "Proprietary Trading Firms",
        meta: "Trading firm's own capital",
        tags: [["equities",""], ["futures",""], ["options","outline"], ["short-term","gold"]],
        stats: [
          { label: "Horizon: milliseconds to days", style: "gold" },
          { label: "No external clients", style: "outline" },
        ],
        body: [
          `Proprietary trading ("prop trading") firms trade exclusively with their own capital, for their own profit — no client funds, no advisory relationships. They make money from market-making spreads, arbitrage, short-term statistical patterns, or directional views. Because they risk only their own money, they face far lighter regulation than banks or asset managers and can take concentrated, fast-moving positions that fiduciaries cannot.`,
          `The post-2008 Volcker Rule (part of Dodd-Frank) prohibited banks from prop trading — pushing this activity into standalone prop firms. Major players include Jane Street, Susquehanna International Group (SIG), DRW, Virtu Financial, and Jump Trading. These firms invest heavily in technology (co-location, microwave networks, custom hardware) and talent (physicists, mathematicians, competitive programmers). Jane Street alone reportedly generates billions in annual profit from options market-making, primarily on ETFs.`,
          `Prop firms sit at the intersection of trading and technology. Their edge is operational: faster execution, better models, more sophisticated hedging, or superior understanding of market microstructure. They don't need superior fundamental information — they need superior process. Many of the most talented finance graduates now prefer prop firms over investment banks, attracted by higher pay, meritocratic culture, and the intellectual challenge.`
        ],
        keyPoint: "Prop firms are capitalism at its most distilled: they survive only if their strategies generate profit. No AUM fees, no advisory retainers — pure performance. They are among the most sophisticated market participants, operating largely below public awareness."
      },
      {
        id: "hft",
        icon: "⚡",
        title: "High-Frequency Traders (HFTs)",

        tags: [["latency arbitrage","gold"], ["market making",""], ["equities",""], ["futures",""]],
        stats: [
          { label: "~50% of US equity volume", style: "gold" },
          { label: "Hold time: microseconds to seconds", style: "rust" },
        ],
        body: [
          `High-frequency trading is a subset of algorithmic trading defined by extraordinarily high order submission rates, very short holding periods (often microseconds to seconds), and the use of co-location (placing servers physically inside exchange data centres to minimise signal travel time). HFT firms don't seek large returns on each trade — they seek tiny, near-certain profits on enormous volumes. A one-tenth-of-a-cent edge on a million shares per day is a very good business.`,
          `HFT encompasses several distinct strategies. Electronic market making: continuously posting bid and ask quotes, earning the spread between them while managing inventory risk. Latency arbitrage: detecting a stale price on one venue and trading against it on another before it updates. Statistical arbitrage: exploiting tiny, predictable correlations between related instruments. News-based trading: parsing economic releases or corporate filings in microseconds to trade before slower participants react.`,
          `The HFT debate is genuinely complex. Proponents argue HFTs tighten bid-ask spreads, increase liquidity, and improve price discovery — empirically supported in normal market conditions. Critics (most notably Michael Lewis in "Flash Boys") argue HFTs systematically front-run slower investors, that their liquidity evaporates exactly when markets need it most (Flash Crash), and that the arms race in latency imposes enormous social costs with little corresponding benefit. The truth is somewhere between: HFTs are beneficial on average but potentially destabilising at the tail.`

          `Sub-types include: Commodity Trading Advisors (CTAs), which are trend-following funds that buy assets in uptrends and short those in downtrends across futures markets; statistical arbitrage funds, which exploit mean-reverting relationships between related securities; factor-based funds, which systematically buy stocks with certain characteristics (value, momentum, quality, low volatility) that have historically generated excess returns; and "alternative data" funds, which mine non-traditional data sources for informational edges.`,
          `Renaissance Technologies' Medallion Fund is the most famous: reportedly compounding at ~66% gross annually since 1988 — the greatest investment track record in history. Renaissance was founded by mathematician Jim Simons and staffed largely by scientists, not traditional financiers. Its success proves that purely systematic approaches can dramatically outperform discretionary investing — but the edge is fiercely protected (Medallion is closed to outside investors) and the precise methods remain unknown.`

let entryCounter = 0;

function renderAll() {
  const root = document.getElementById('entries-root');
  categories.forEach(cat => {
    const block = document.createElement('div');
    block.className = 'category-block';

    block.innerHTML = `
      <div class="category-header">
        <span style="font-size:18px">${cat.icon}</span>
        <div style="flex:1">
          <div class="category-label-mono">${cat.desc}</div>
          <div class="category-name">${cat.name}</div>
        </div>
        <span class="cat-count">${cat.participants.length} participants</span>
      </div>
    `;

    cat.participants.forEach(p => {
      const idx = entryCounter++;
      const tagHtml = p.tags.map(([label, style]) =>
        `<span class="tag ${style}">${label}</span>`
      ).join('');
      const statHtml = (p.stats || []).map(s =>
        `<span class="stat-pill ${s.style}">${s.label}</span>`
      ).join('');
      const bodyHtml = p.body.map(para => `<p>${para}</p>`).join('') +
        (p.keyPoint ? `<div class="key-point">⚑ ${p.keyPoint}</div>` : '') +
        (statHtml ? `<div class="stat-row">${statHtml}</div>` : '') +
        `<div class="tags">${tagHtml}</div>`;

      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.id = `e-${idx}`;
      entry.innerHTML = `
        <div class="entry-header" onclick="toggle(${idx})">
          <span class="participant-icon">${p.icon}</span>
          <span class="entry-title">${p.title}</span>
          <span class="entry-meta">${p.meta}</span>
          <span class="entry-toggle">▶</span>
        </div>
        <div class="entry-body">${bodyHtml}</div>
      `;
      block.appendChild(entry);
    });

    root.appendChild(block);
  });
}

function toggle(i) {
  document.getElementById(`e-${i}`).classList.toggle('open');
}

function toggleAll(open) {
  for (let i = 0; i < entryCounter; i++) {
    const el = document.getElementById(`e-${i}`);
    if (el) open ? el.classList.add('open') : el.classList.remove('open');
  }
}

renderAll();
