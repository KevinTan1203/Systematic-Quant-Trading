<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorting Algorithms Visualizer + Code</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --text: #e2e8f0;
        --accent: #38bdf8;
        --bar: #64748b;
        --compare: #facc15;
        --swap: #f87171;
        --sorted: #4ade80;
        --pivot: #c084fc;
        --code-bg: #0d1117;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
      }

      h1 {
        font-size: 1.8rem;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #38bdf8, #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .subtitle {
        color: #94a3b8;
        margin-bottom: 24px;
        font-size: 0.95rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 20px;
        max-width: 950px;
      }

      button,
      select {
        background: var(--panel);
        color: var(--text);
        border: 1px solid #334155;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 0.9rem;
        transition: all 0.15s;
      }

      button:hover:not(:disabled) {
        background: #334155;
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .slider-group {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--panel);
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid #334155;
      }

      input[type="range"] {
        width: 100px;
        accent-color: var(--accent);
      }

      .viz-container {
        width: 100%;
        max-width: 1000px;
        height: 380px;
        background: var(--panel);
        border-radius: 12px;
        padding: 20px 12px 12px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 2px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      .bar {
        flex: 1;
        max-width: 28px;
        background: var(--bar);
        border-radius: 4px 4px 0 0;
        transition:
          height 0.08s ease,
          background 0.1s;
      }

      .bar.compare {
        background: var(--compare);
      }
      .bar.swap {
        background: var(--swap);
      }
      .bar.sorted {
        background: var(--sorted);
      }
      .bar.pivot {
        background: var(--pivot);
      }

      .info {
        margin-top: 16px;
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        justify-content: center;
        font-size: 0.9rem;
        color: #94a3b8;
      }

      .legend {
        display: flex;
        gap: 16px;
        margin-top: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85rem;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
      }

      .desc {
        max-width: 750px;
        text-align: center;
        margin-top: 16px;
        color: #94a3b8;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      /* Code Panel */
      .code-section {
        width: 100%;
        max-width: 1000px;
        margin-top: 32px;
      }

      .code-header {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
      }

      .code-header h2 {
        font-size: 1.2rem;
        margin-right: auto;
      }

      .lang-btn {
        padding: 7px 14px;
        font-size: 0.85rem;
      }
      .lang-btn.active {
        background: #0369a1;
        border-color: #38bdf8;
      }

      .code-container {
        background: var(--code-bg);
        border-radius: 12px;
        border: 1px solid #30363d;
        overflow: hidden;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      }

      .code-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background: #161b22;
        border-bottom: 1px solid #30363d;
        font-size: 0.85rem;
        color: #8b949e;
      }

      pre {
        margin: 0;
        padding: 20px;
        overflow-x: auto;
        font-family:
          "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
        font-size: 0.88rem;
        line-height: 1.55;
        color: #e6edf3;
      }

      .kw {
        color: #ff7b72;
      }
      .fn {
        color: #d2a8ff;
      }
      .cm {
        color: #8b949e;
        font-style: italic;
      }
      .num {
        color: #79c0ff;
      }
      .type {
        color: #ffa657;
      }
    </style>
  </head>
  <body>
    <h1>Sorting Algorithms Visualizer</h1>
    <p class="subtitle">Visual + Code implementations</p>

    <div class="controls">
      <button onclick="generateArray()" id="btn-new">New Array</button>

      <div class="slider-group">
        <label>Size</label>
        <input
          type="range"
          id="size"
          min="10"
          max="80"
          value="40"
          oninput="generateArray()"
        />
      </div>

      <div class="slider-group">
        <label>Speed</label>
        <input type="range" id="speed" min="1" max="100" value="60" />
      </div>

      <select id="algo" onchange="onAlgoChange()">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="insertion">Insertion Sort</option>
        <option value="cocktail">Cocktail Sort</option>
        <option value="merge">Merge Sort</option>
        <option value="quick">Quick Sort</option>
        <option value="heap">Heap Sort</option>
      </select>

      <button
        onclick="startSort()"
        id="btn-start"
        style="background: #0369a1; border-color: #38bdf8"
      >
        Start
      </button>
      <button onclick="stopSort()" id="btn-stop" disabled>Stop</button>
    </div>

    <div class="viz-container" id="container"></div>

    <div class="info">
      <span>Comparisons: <strong id="comps">0</strong></span>
      <span>Swaps: <strong id="swaps">0</strong></span>
      <span>Time: <strong id="time">0</strong> ms</span>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="dot" style="background: var(--bar)"></div>
        Unsorted
      </div>
      <div class="legend-item">
        <div class="dot" style="background: var(--compare)"></div>
        Comparing
      </div>
      <div class="legend-item">
        <div class="dot" style="background: var(--swap)"></div>
        Swapping
      </div>
      <div class="legend-item">
        <div class="dot" style="background: var(--pivot)"></div>
        Pivot
      </div>
      <div class="legend-item">
        <div class="dot" style="background: var(--sorted)"></div>
        Sorted
      </div>
    </div>

    <p class="desc" id="description"></p>

    <!-- CODE SECTION -->
    <div class="code-section">
      <div class="code-header">
        <h2>Algorithm Code</h2>
        <button
          class="lang-btn active"
          data-lang="python"
          onclick="setLang('python')"
        >
          Python
        </button>
        <button class="lang-btn" data-lang="java" onclick="setLang('java')">
          Java
        </button>
        <button class="lang-btn" data-lang="cpp" onclick="setLang('cpp')">
          C++
        </button>
        <button
          class="lang-btn"
          data-lang="javascript"
          onclick="setLang('javascript')"
        >
          JavaScript
        </button>
      </div>

      <div class="code-container">
        <div class="code-toolbar">
          <span id="code-title">Bubble Sort — Python</span>
          <button
            onclick="copyCode()"
            style="padding: 4px 10px; font-size: 0.8rem"
          >
            Copy
          </button>
        </div>
        <pre><code id="code-block"></code></pre>
      </div>
    </div>

    <script>
      /* ========== VISUALIZER ========== */
      const container = document.getElementById("container");
      const sizeInput = document.getElementById("size");
      const speedInput = document.getElementById("speed");
      const algoSelect = document.getElementById("algo");
      const compsEl = document.getElementById("comps");
      const swapsEl = document.getElementById("swaps");
      const timeEl = document.getElementById("time");
      const descEl = document.getElementById("description");

      let array = [],
        bars = [],
        running = false,
        stopFlag = false;
      let comparisons = 0,
        swaps = 0;

      const descriptions = {
        bubble:
          "Bubble Sort repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order. Average: O(n²)",
        selection:
          "Selection Sort finds the minimum element and places it at the beginning, then repeats for the remaining array. Average: O(n²)",
        insertion:
          "Insertion Sort builds a sorted portion one element at a time by inserting each new element into its correct position. Average: O(n²)",
        cocktail:
          "Cocktail Sort (bidirectional bubble) sorts in both directions. Average: O(n²)",
        merge:
          "Merge Sort divides the array into halves, sorts them recursively, then merges. Average: O(n log n)",
        quick:
          "Quick Sort picks a pivot, partitions around it, then recursively sorts. Average: O(n log n)",
        heap: "Heap Sort builds a max-heap and repeatedly extracts the maximum. Average: O(n log n)",
      };

      function generateArray() {
        if (running) return;
        const n = +sizeInput.value;
        array = Array.from(
          { length: n },
          () => Math.floor(Math.random() * 90) + 10,
        );
        renderBars();
        resetStats();
      }

      function renderBars() {
        container.innerHTML = "";
        bars = [];
        const max = Math.max(...array);
        array.forEach((val) => {
          const bar = document.createElement("div");
          bar.className = "bar";
          bar.style.height = `${(val / max) * 100}%`;
          container.appendChild(bar);
          bars.push(bar);
        });
      }

      function resetStats() {
        comparisons = 0;
        swaps = 0;
        compsEl.textContent = 0;
        swapsEl.textContent = 0;
        timeEl.textContent = 0;
      }

      function delay() {
        return new Promise((r) =>
          setTimeout(r, Math.max(1, 101 - +speedInput.value)),
        );
      }

      async function mark(indices, cls) {
        indices.forEach((i) => bars[i]?.classList.add(cls));
        await delay();
      }
      function clearMarks(indices, cls) {
        indices.forEach((i) => bars[i]?.classList.remove(cls));
      }
      function setSorted(from, to) {
        for (let i = from; i <= to; i++) {
          if (bars[i]) {
            bars[i].classList.remove("compare", "swap", "pivot");
            bars[i].classList.add("sorted");
          }
        }
      }

      async function swap(i, j) {
        swaps++;
        swapsEl.textContent = swaps;
        [array[i], array[j]] = [array[j], array[i]];
        const h = bars[i].style.height;
        bars[i].style.height = bars[j].style.height;
        bars[j].style.height = h;
        await mark([i, j], "swap");
        clearMarks([i, j], "swap");
      }

      function updateBar(i) {
        const max = Math.max(...array);
        bars[i].style.height = `${(array[i] / max) * 100}%`;
      }

      /* Algorithms */
      async function bubbleSort() {
        const n = array.length;
        for (let i = 0; i < n - 1; i++) {
          for (let j = 0; j < n - i - 1; j++) {
            if (stopFlag) return;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([j, j + 1], "compare");
            if (array[j] > array[j + 1]) await swap(j, j + 1);
            clearMarks([j, j + 1], "compare");
          }
          setSorted(n - i - 1, n - 1);
        }
        setSorted(0, n - 1);
      }

      async function selectionSort() {
        const n = array.length;
        for (let i = 0; i < n - 1; i++) {
          let minIdx = i;
          for (let j = i + 1; j < n; j++) {
            if (stopFlag) return;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([minIdx, j], "compare");
            if (array[j] < array[minIdx]) {
              clearMarks([minIdx], "compare");
              minIdx = j;
            }
            clearMarks([j], "compare");
          }
          if (minIdx !== i) await swap(i, minIdx);
          setSorted(i, i);
        }
        setSorted(0, n - 1);
      }

      async function insertionSort() {
        const n = array.length;
        setSorted(0, 0);
        for (let i = 1; i < n; i++) {
          let key = array[i],
            j = i - 1;
          bars[i].classList.add("compare");
          while (j >= 0 && array[j] > key) {
            if (stopFlag) return;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([j], "compare");
            array[j + 1] = array[j];
            updateBar(j + 1);
            swaps++;
            swapsEl.textContent = swaps;
            clearMarks([j], "compare");
            j--;
            await delay();
          }
          array[j + 1] = key;
          updateBar(j + 1);
          clearMarks([i], "compare");
          setSorted(0, i);
        }
      }

      async function cocktailSort() {
        let start = 0,
          end = array.length - 1,
          swapped = true;
        while (swapped) {
          swapped = false;
          for (let i = start; i < end; i++) {
            if (stopFlag) return;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([i, i + 1], "compare");
            if (array[i] > array[i + 1]) {
              await swap(i, i + 1);
              swapped = true;
            }
            clearMarks([i, i + 1], "compare");
          }
          setSorted(end, end);
          end--;
          if (!swapped) break;
          swapped = false;
          for (let i = end - 1; i >= start; i--) {
            if (stopFlag) return;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([i, i + 1], "compare");
            if (array[i] > array[i + 1]) {
              await swap(i, i + 1);
              swapped = true;
            }
            clearMarks([i, i + 1], "compare");
          }
          setSorted(start, start);
          start++;
        }
        setSorted(0, array.length - 1);
      }

      async function mergeSort() {
        async function merge(l, m, r) {
          const left = array.slice(l, m + 1),
            right = array.slice(m + 1, r + 1);
          let i = 0,
            j = 0,
            k = l;
          while (i < left.length && j < right.length) {
            if (stopFlag) return;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([k], "compare");
            if (left[i] <= right[j]) array[k] = left[i++];
            else array[k] = right[j++];
            updateBar(k);
            swaps++;
            swapsEl.textContent = swaps;
            clearMarks([k], "compare");
            k++;
            await delay();
          }
          while (i < left.length) {
            array[k] = left[i++];
            updateBar(k++);
            await delay();
          }
          while (j < right.length) {
            array[k] = right[j++];
            updateBar(k++);
            await delay();
          }
        }
        async function sort(l, r) {
          if (l >= r || stopFlag) return;
          const m = Math.floor((l + r) / 2);
          await sort(l, m);
          await sort(m + 1, r);
          await merge(l, m, r);
        }
        await sort(0, array.length - 1);
        if (!stopFlag) setSorted(0, array.length - 1);
      }

      async function quickSort() {
        async function partition(low, high) {
          const pivot = array[high];
          bars[high].classList.add("pivot");
          let i = low - 1;
          for (let j = low; j < high; j++) {
            if (stopFlag) return i;
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([j], "compare");
            if (array[j] < pivot) {
              i++;
              if (i !== j) await swap(i, j);
            }
            clearMarks([j], "compare");
          }
          await swap(i + 1, high);
          bars[high].classList.remove("pivot");
          return i + 1;
        }
        async function sort(low, high) {
          if (low < high && !stopFlag) {
            const pi = await partition(low, high);
            if (stopFlag) return;
            setSorted(pi, pi);
            await sort(low, pi - 1);
            await sort(pi + 1, high);
          } else if (low === high) setSorted(low, low);
        }
        await sort(0, array.length - 1);
        if (!stopFlag) setSorted(0, array.length - 1);
      }

      async function heapSort() {
        const n = array.length;
        async function heapify(size, i) {
          let largest = i;
          const left = 2 * i + 1,
            right = 2 * i + 2;
          if (left < size) {
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([left, largest], "compare");
            if (array[left] > array[largest]) largest = left;
            clearMarks([left], "compare");
          }
          if (right < size) {
            comparisons++;
            compsEl.textContent = comparisons;
            await mark([right, largest], "compare");
            if (array[right] > array[largest]) largest = right;
            clearMarks([right], "compare");
          }
          if (largest !== i) {
            await swap(i, largest);
            await heapify(size, largest);
          }
        }
        for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
          if (stopFlag) return;
          await heapify(n, i);
        }
        for (let i = n - 1; i > 0; i--) {
          if (stopFlag) return;
          await swap(0, i);
          setSorted(i, i);
          await heapify(i, 0);
        }
        setSorted(0, 0);
      }

      async function startSort() {
        if (running) return;
        running = true;
        stopFlag = false;
        resetStats();
        document.getElementById("btn-start").disabled = true;
        document.getElementById("btn-new").disabled = true;
        document.getElementById("btn-stop").disabled = false;
        sizeInput.disabled = true;
        algoSelect.disabled = true;
        bars.forEach((b) => (b.className = "bar"));
        const t0 = performance.now();
        switch (algoSelect.value) {
          case "bubble":
            await bubbleSort();
            break;
          case "selection":
            await selectionSort();
            break;
          case "insertion":
            await insertionSort();
            break;
          case "cocktail":
            await cocktailSort();
            break;
          case "merge":
            await mergeSort();
            break;
          case "quick":
            await quickSort();
            break;
          case "heap":
            await heapSort();
            break;
        }
        timeEl.textContent = Math.round(performance.now() - t0);
        running = false;
        document.getElementById("btn-start").disabled = false;
        document.getElementById("btn-new").disabled = false;
        document.getElementById("btn-stop").disabled = true;
        sizeInput.disabled = false;
        algoSelect.disabled = false;
      }

      function stopSort() {
        stopFlag = true;
      }

      /* ========== CODE SNIPPETS ========== */
      const codeSnippets = {
        bubble: {
          python: `<span class="cm"># Bubble Sort - Python</span>
<span class="kw">def</span> <span class="fn">bubble_sort</span>(arr):
 n = <span class="fn">len</span>(arr)
 <span class="kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(n - <span class="num">1</span>):
 <span class="kw">for</span> j <span class="kw">in</span> <span class="fn">range</span>(n - i - <span class="num">1</span>):
 <span class="kw">if</span> arr[j] > arr[j + <span class="num">1</span>]:
 arr[j], arr[j + <span class="num">1</span>] = arr[j + <span class="num">1</span>], arr[j]
 <span class="kw">return</span> arr`,

          java: `<span class="cm">// Bubble Sort - Java</span>
<span class="kw">public static void</span> <span class="fn">bubbleSort</span>(<span class="type">int</span>[] arr) {
 <span class="type">int</span> n = arr.length;
 <span class="kw">for</span> (<span class="type">int</span> i = <span class="num">0</span>; i < n - <span class="num">1</span>; i++) {
 <span class="kw">for</span> (<span class="type">int</span> j = <span class="num">0</span>; j < n - i - <span class="num">1</span>; j++) {
 <span class="kw">if</span> (arr[j] > arr[j + <span class="num">1</span>]) {
 <span class="type">int</span> temp = arr[j];
 arr[j] = arr[j + <span class="num">1</span>];
 arr[j + <span class="num">1</span>] = temp;
 }
 }
 }
}`,

          cpp: `<span class="cm">// Bubble Sort - C++</span>
<span class="kw">void</span> <span class="fn">bubbleSort</span>(<span class="type">vector</span>&lt;<span class="type">int</span>&gt;& arr) {
 <span class="type">int</span> n = arr.size();
 <span class="kw">for</span> (<span class="type">int</span> i = <span class="num">0</span>; i < n - <span class="num">1</span>; i++) {
 <span class="kw">for</span> (<span class="type">int</span> j = <span class="num">0</span>; j < n - i - <span class="num">1</span>; j++) {
 <span class="kw">if</span> (arr[j] > arr[j + <span class="num">1</span>])
 <span class="fn">swap</span>(arr[j], arr[j + <span class="num">1</span>]);
 }
 }
}`,

          javascript: `<span class="cm">// Bubble Sort - JavaScript</span>
<span class="kw">function</span> <span class="fn">bubbleSort</span>(arr) {
 <span class="kw">const</span> n = arr.length;
 <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < n - <span class="num">1</span>; i++) {
 <span class="kw">for</span> (<span class="kw">let</span> j = <span class="num">0</span>; j < n - i - <span class="num">1</span>; j++) {
 <span class="kw">if</span> (arr[j] > arr[j + <span class="num">1</span>]) {
 [arr[j], arr[j + <span class="num">1</span>]] = [arr[j + <span class="num">1</span>], arr[j]];
 }
 }
 }
 <span class="kw">return</span> arr;
}`,
        },

        selection: {
          python: `<span class="cm"># Selection Sort - Python</span>
<span class="kw">def</span> <span class="fn">selection_sort</span>(arr):
 n = <span class="fn">len</span>(arr)
 <span class=" kw">for</span> i <span class="kw">in</span> <span class="fn">range</span>(n - <span class="num">1</span>):

      /* ========== CODE PANEL LOGIC ========== */
      let currentLang = "python";

      function setLang(lang) {
        currentLang = lang;
        document.querySelectorAll(".lang-btn").forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.lang === lang);
        });
        updateCode();
      }

      function onAlgoChange() {
        descEl.textContent = descriptions[algoSelect.value];
        updateCode();
      }

      function updateCode() {
        const algo = algoSelect.value;
        const name = algoSelect.options[algoSelect.selectedIndex].text;
        const langNames = {
          python: "Python",
          java: "Java",
          cpp: "C++",
          javascript: "JavaScript",
        };
        document.getElementById("code-title").textContent =
          `${name} — ${langNames[currentLang]}`;
        document.getElementById("code-block").innerHTML =
          codeSnippets[algo][currentLang];
      }

      function copyCode() {
        const text = document.getElementById("code-block").innerText;
        navigator.clipboard.writeText(text).then(() => {
          const btn = event.target;
          btn.textContent = "Copied!";
          setTimeout(() => (btn.textContent = "Copy"), 1500);
        });
      }

      /* Init */
      generateArray();
      onAlgoChange();
    </script>
